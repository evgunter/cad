# Standalone crate, deliberately OUTSIDE the kernel workspace (like demos/):
# the empty [workspace] table below opts out of the root workspace without
# touching the kernel's Cargo.toml. This crate is the in-house rigorous
# interval transcendentals unit (DESIGN.md "Tabled (far future)"), built as
# side-chain evidence; the kernel does NOT depend on it (adoption is a later
# ratified decision).
[workspace]

[package]
name = "interval-transcendentals"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
description = "Rigorous interval transcendentals over libm with proven error pads (C-free, MIT/Apache)"
publish = false

[dependencies]
# The only runtime dependency: pure-Rust libm (matches the kernel's D9
# choice; 0.2.16 is the workspace-pinned version).
libm = "=0.2.16"

[dev-dependencies]
# Certification oracle ONLY (dev-dependency: never ships, so the LGPL-3.0+
# transitive deps of inari/gmp (gmp-mpfr-sys, rug) impose no obligation on
# consumers of this crate). Requires AVX+FMA on x86-64; the repo-root
# .cargo/config.toml's x86-64-v3 floor applies to builds rooted here via
# cargo's hierarchical config discovery.
inari = { version = "=2.0.0", features = ["gmp"] }

[dependencies.computable]
# Second, independent dev-oracle: Evan's computable-reals library
# (state + bounds + refinement formalism, dyadic bounds). OPTIONAL and
# feature-gated (dev-dependencies cannot be optional) because it is a local
# path dep that only exists on machines with ~/projects/computable checked
# out; enable with `--features oracle-computable` to run the second-oracle
# tests. Never enabled by default; never ships.
path = "/home/evan/projects/computable"
optional = true

[features]
oracle-computable = ["dep:computable"]

[profile.release]
debug = false
