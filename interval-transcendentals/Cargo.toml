# Its own workspace root (the empty [workspace] table below), deliberately
# OUTSIDE the kernel workspace — the same posture as tools/ and demos/: this
# crate stays buildable, testable, and certifiable on its own, and its
# gmp-backed inari DEV-oracle can never reach a kernel build.
#
# Since M5 PR 1 the kernel DOES depend on it: geom-core's `interval` feature
# takes a path dependency on this crate, which is the sole backend of the
# `Interval` scalar. A path dependency does not make it a workspace member;
# only its one non-dev dependency (libm — already a kernel dependency)
# enters kernel builds.
[workspace]

[package]
name = "interval-transcendentals"
version = "0.1.0"
edition = "2024"
rust-version = "1.87.0"
license = "MIT OR Apache-2.0"
description = "Rigorous interval transcendentals over libm with proven error pads (C-free, MIT/Apache)"
publish = false

[dependencies]
# The only runtime dependency: pure-Rust libm (matches the kernel's D9
# choice; 0.2.16 is the workspace-pinned version).
libm = "=0.2.16"

[dependencies.inari]
# CERTIFICATION ORACLE ONLY — never used by `src/`, only by
# `tests/certify.rs`. It is an OPTIONAL regular dependency rather than a
# dev-dependency because cargo does not allow dev-dependencies to be
# optional, and unconditional dev-dependencies are built for EVERY test
# target: a plain dev-dep would mean `cargo test` here always compiles
# inari's bundled GMP+MPFR from C source. Gating it behind a feature is
# what lets the kernel's CI run this crate's pad tripwire (unit tests +
# edges + the division fuzz) without that C build, on the same pipeline
# that gates the kernel — see README "Certification".
#
# The `interval` feature of geom-core never enables `oracle-inari`, so no
# kernel build in any configuration pulls inari, gmp-mpfr-sys or rug, and
# their LGPL-3.0+ obligations reach neither this crate's consumers nor the
# kernel's. inari itself requires AVX+FMA on x86-64, so the ORACLE lane
# needs a machine that has them; the repo sets no target-cpu floor
# (.cargo/config.toml) and this crate's own code needs none.
version = "=2.0.0"
features = ["gmp"]
optional = true

[features]
# Enables tests/certify.rs (the differential lane against inari+MPFR).
# Test-only: `src/` must never reference `inari` or this feature.
oracle-inari = ["dep:inari"]

# The benchmark compares our timings against inari's, so it needs the
# oracle too. `required-features` keeps it out of the default (oracle-less)
# `cargo test` / `cargo build --examples` graph rather than failing them.
[[example]]
name = "bench"
required-features = ["oracle-inari"]

# `cfg(kani)` and the two mutation cfgs are set only by the Kani driver
# (src/verify.rs, docs/verification.md); teach cargo about them so ordinary
# builds do not warn about an unexpected cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(kani)',
    'cfg(kani_mutation_is_normal)',
    'cfg(kani_mutation_no_pad)',
    'cfg(kani_tool_control)',
] }
