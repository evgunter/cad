# Its own workspace root (the empty [workspace] table below), deliberately
# OUTSIDE the kernel workspace — the same posture as tools/ and demos/: this
# crate stays buildable, testable, and certifiable on its own, and its
# gmp-backed inari DEV-oracle can never reach a kernel build.
#
# Since M5 PR 1 the kernel DOES depend on it: geom-core's `interval` feature
# takes a path dependency on this crate, which is the sole backend of the
# `Interval` scalar. A path dependency does not make it a workspace member;
# only its one non-dev dependency (libm — already a kernel dependency)
# enters kernel builds.
[workspace]

[package]
name = "interval-transcendentals"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
description = "Rigorous interval transcendentals over libm with proven error pads (C-free, MIT/Apache)"
publish = false

[dependencies]
# The only runtime dependency: pure-Rust libm (matches the kernel's D9
# choice; 0.2.16 is the workspace-pinned version).
libm = "=0.2.16"

[dev-dependencies]
# Certification oracle ONLY (dev-dependency: never ships, so the LGPL-3.0+
# transitive deps of inari/gmp (gmp-mpfr-sys, rug) impose no obligation on
# consumers of this crate — and, since M5 PR 1, none on the kernel either:
# dev-dependencies of a path dependency are not part of the dependent's
# graph). Requires AVX+FMA on x86-64; the repo-root .cargo/config.toml's
# x86-64-v3 floor applies to builds rooted here via cargo's hierarchical
# config discovery.
inari = { version = "=2.0.0", features = ["gmp"] }

# The second, independent dev-oracle (Evan's computable-reals library) is
# NOT declared here: it is a local path dependency, and cargo resolves the
# manifests of path dependencies even when they are optional and disabled,
# so an entry here would break every kernel build on every machine without
# that checkout. The lane lives in its own sibling crate instead —
# `oracle-computable/`, run by hand with `cargo test` from that directory.
