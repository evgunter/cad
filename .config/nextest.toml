# nextest profiles. `ci` is the per-PR gate: the suite minus the SLOW SET
# below (work/ciw/latency-cut.md has the first measurement and verdicts). The
# slow set runs every night, at every eps row, under this profile with
# `--ignore-default-filter`. Per PR, a slow test runs only when the diff's
# added lines spell it (scripts/slow_set.py's `is_new`: the PR that adds or
# edits it); a renamed one is spelled too. scripts/slow_set.py is the one
# reader of this list. A renamed test drops out of it and runs per-PR, never
# silently nowhere; scripts/check-slow-set-names.py fails the test job on the
# dead name.
#
# Put a test here when it costs >= 0.5 s a run, whatever it has caught: a
# slow test that catches something still catches it the next night. A
# cheaper test goes here too when it costs more than a fraction of a second
# averaged over every PR run and has never gone red on a PR after the one
# that added it, unless a test the gate kept went red with it
# (work/ciw/demote-unearned-tests.md). The per-PR default-eps step enforces
# two bars on the runner's own times (scripts/check-fast-set-times.py): a
# fast-set test the diff adds fails it at >= 0.5 s, and every other fast-set
# test at >= 1 s.

[profile.ci]
fail-fast = false
# A failing test's output is printed again at the end of the run, and its
# name, panic and seed land in junit.xml, which scripts/nextest-failures.py
# turns into annotations and a step summary: a session reads the job log only
# through its last 5000 lines, and one run prints ~14 000 PASS lines.
failure-output = "immediate-final"
# Limb 2 at a parameter-family scalar, where the box's spread keeps its
# first reading from clearing and its rounds decide
