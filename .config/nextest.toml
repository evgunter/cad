# nextest profiles. `ci` is the per-PR gate: the suite minus the SLOW SET
# below — the tests that took >= 1 s on a 4-vCPU runner and are not deleted
# (work/ciw/latency-cut.md has the measurement and the verdicts). The slow set
# runs every night, at every eps row, under the default profile, which filters
# nothing. A renamed test drops out of this list and runs per-PR, never
# silently nowhere. Put a test here when it costs >= 1 s and has no record of
# catching a bug the fast set would miss; take it out when it earns one.

[profile.ci]
fail-fast = false
