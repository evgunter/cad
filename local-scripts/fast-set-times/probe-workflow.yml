# The throwaway probe: push it as .github/workflows/<name>.yml on a branch it
# triggers on, with .github/u10-probe/probe-<shard>.{expr,pkgs} beside it
# (analyze.py's cand.tsv cut at a threshold). Run 45050967584, two attempts.
name: u10 probe (throwaway; never merged)
on:
  push:
    branches: [green/u10-probe]
jobs:
  probe:
    name: probe (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [kernel, app]
    env:
      NEXTEST_VERSION: "0.9.140"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_LTO: "off"
      CARGO_PROFILE_TEST_LTO: "off"
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-default
          save-if: false
      - run: |
          {
            echo "RUSTC_WORKSPACE_WRAPPER=$GITHUB_WORKSPACE/scripts/rustc-test-crates-opt0.sh"
            echo "CAD_OPT0_LOG=$RUNNER_TEMP/opt0.log"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/install-nextest
        with:
          version: ${{ env.NEXTEST_VERSION }}
      - name: runner
        run: lscpu | grep -E 'Model name|^CPU\(s\)'
      - name: build
        run: cargo nextest run --no-run --profile ci $(cat .github/u10-probe/probe-${{ matrix.shard }}.pkgs)
      - name: candidates at -j1, pass 1
        run: cargo nextest run --profile ci $(cat .github/u10-probe/probe-${{ matrix.shard }}.pkgs) -E "$(cat .github/u10-probe/probe-${{ matrix.shard }}.expr)" --test-threads 1 --no-fail-fast || true
      - name: candidates at -j1, pass 2
        run: cargo nextest run --profile ci $(cat .github/u10-probe/probe-${{ matrix.shard }}.pkgs) -E "$(cat .github/u10-probe/probe-${{ matrix.shard }}.expr)" --test-threads 1 --no-fail-fast || true
      - name: candidates at default parallelism, same runner
        run: cargo nextest run --profile ci $(cat .github/u10-probe/probe-${{ matrix.shard }}.pkgs) -E "$(cat .github/u10-probe/probe-${{ matrix.shard }}.expr)" --no-fail-fast || true
