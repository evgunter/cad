[package]
name = "geom-brep"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Forwards geom-core's certified interval scalar so the certification
# and classification layer runs at `Interval` — exercised by the
# feature-gated test modules in CI's interval lane.
interval = ["geom-core/interval"]

[dependencies]
geom-core = { path = "../geom-core" }
geom-curves = { path = "../geom-curves" }
geom-surfaces = { path = "../geom-surfaces" }
# The geometry-arena key types live here (typed slotmap keys): the
# intensional descriptions reference surfaces *by arena key* (D2), and
# `topo`'s Body re-exports these same types for its geometry arenas.
slotmap = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

# ONE test binary for the whole suite (see tests/all.rs). Each extra test
# target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
[[test]]
name = "all"
path = "tests/all.rs"
