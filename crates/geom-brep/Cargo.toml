[package]
name = "geom-brep"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Test-only reach for other crates' rows, enabled through `topo`'s
# `test-support` alone. Two kinds: rosters (a companion discriminant
# enum, `strum::EnumDiscriminants`, on the enums a
# `topo::ValidationError` renders through, behind
# `topo::test_support_samples`, so a variant added here is a gap in
# that row by construction; `strum::EnumIter` where a roster row walks
# an enum), and constructors and oracles no production path takes. The
# gated items are `grep -rn 'feature = "test-support"' src`.
test-support = ["dep:strum", "geom/test-support", "geom-core/test-support"]
# Forwards geom-core's K-telemetry recording scalar so the
# workspace-wide `--features probe` lane builds uniformly. See geom-core's manifest
# for why Probe is opt-in (it is a `Real` instantiation, so it
# monomorphizes every generic-over-`Real` body, and only the K
# experiment consumes it).
probe = ["geom-core/probe"]

[dependencies]
# Optional: `test-support` above.
strum = { version = "0.28", features = ["derive"], optional = true }
geom-core = { path = "../geom-core" }
geom = { path = "../geom" }
bvh = { path = "../bvh" }
# The geometry-arena key types live here (typed slotmap keys): the
# intensional descriptions reference surfaces *by arena key* (D2), and
# `topo`'s Body re-exports these same types for its geometry arenas.
slotmap = { workspace = true }

[dev-dependencies]
# `PatchBoundError`'s roster in its own unit tests (`EnumIter`).
strum = { version = "0.28", features = ["derive"] }
# Shared fuzz harness for this crate's randomized sweeps (one RNG, the
# per-run seed, the CAD_FUZZ_EFFORT dial). A dependency-free leaf crate
# named by [dev-dependencies] only, here and everywhere else — which is
# what keeps it off every shipped build path.
test-utils = { path = "../test-utils" }
proptest = { workspace = true }
# Exact dyadic arithmetic for the oracle rows of the running bounds.
num-bigint = { workspace = true }
# `test-support` ON for `geom_core::test_support`, the suites' reading
# of a reporting margin's upper end; the symbolic tier's re-valuation
# instrument (`geom_core::sym::revalue`) for the rows that pin a computed
# value entering as an unknown rather than a constant.
geom-core = { path = "../geom-core", features = ["test-support", "sym-revalue-testing"] }
# `geom::test_support::held_arc`, the NURBS weights-in-`T` pin's arc.
geom = { path = "../geom", features = ["test-support"] }

# ONE test binary for the whole suite (see tests/all.rs). Each extra test
# target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
[[test]]
name = "all"
path = "tests/all.rs"
