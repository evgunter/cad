[package]
name = "bvh"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The tree sits BELOW the geometry crates on purpose (M5 PR 8): it is a
# pure box structure over `geom_core::Bounds` brackets, so the curved
# crates (and PR 7's SSI subdivision duty inside them) can consume it
# without an upward dependency. Entity-specific box CONSTRUCTORS live
# next to their invariants in `geom`.
geom-core = { path = "../geom-core" }

[dev-dependencies]
proptest = { workspace = true }

# ONE test binary for the whole suite (see tests/all.rs). Each extra test
# target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
[[test]]
name = "all"
path = "tests/all.rs"
