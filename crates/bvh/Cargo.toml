[package]
name = "bvh"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The tree sits BELOW the geometry crates on purpose (M5 PR 8): it is a
# pure box structure over `geom_core::Bounds` brackets, so the curved
# crates (and PR 7's SSI subdivision duty inside them) can consume it
# without an upward dependency. Entity-specific box CONSTRUCTORS live
# next to their invariants in `geom`.
geom-core = { path = "../geom-core" }

[features]
# Test fixtures (`src/test_support.rs`): the array spellings of a box and
# a ray, shared by this crate's suites and by `editor-core`'s and
# `viewer`'s pick suites. A test-only feature, on only through
# dev-dependency edges (`scripts/gates/test-features-dev-only.sh`).
test-support = []

[dev-dependencies]
proptest = { workspace = true }
# The ray sweep's varying seed + effort dial (memories/test-suite-cost):
# a leaf crate, dev-only, same as every other sweep's harness row.
test-utils = { path = "../test-utils" }
# Self dev-dependency: turns `test-support` on for THIS crate's own
# integration tests. A dev-dependency is in no consumer's build graph.
bvh = { path = ".", features = ["test-support"] }

# ONE test binary for the whole suite (see tests/all.rs). Each extra test
# target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
[[test]]
name = "all"
path = "tests/all.rs"
