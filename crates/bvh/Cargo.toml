[package]
name = "bvh"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The tree sits BELOW the geometry crates on purpose (M5 PR 8): it is a
# pure box structure over `geom_core::Bounds` brackets, so the curved
# crates (and PR 7's SSI subdivision duty inside them) can consume it
# without an upward dependency. Entity-specific box CONSTRUCTORS live
# next to their invariants in `geom-curves`/`geom-surfaces`.
geom-core = { path = "../geom-core" }

[dev-dependencies]
proptest = { workspace = true }
