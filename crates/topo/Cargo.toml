[package]
name = "topo"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
dbg-join = []
# The differential suite's doors (M5 PR 8 fix pass): `sweep_traces`,
# `PlantedDegradation`, and the pad-override knob are FAILURE-INJECTION /
# instrumentation surface — test builds only. Enabled through the
# self-dev-dependency below (and consumers' dev-dependencies), so no
# production dependent can reach an injector.
sweep-testing = []
# Forwards geom-core's certified interval scalar so `Body<Interval>` is
# instantiable — exercised by `tests/interval_body.rs` in CI's interval
# lane (Q1's pure-replay model: same topology keys, interval geometry).
interval = ["geom-core/interval", "geom-brep/interval"]

[dependencies]
# The boolean sweep's candidate generation (M5 PR 8): the tree prunes,
# predicates decide — see boolean/reduce.rs module docs.
bvh = { path = "../bvh" }
geom-brep = { path = "../geom-brep" }
geom-core = { path = "../geom-core" }
geom-curves = { path = "../geom-curves" }
geom-surfaces = { path = "../geom-surfaces" }
slotmap = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Self dev-dependency: turns `sweep-testing` on for THIS crate's own
# integration tests without exposing it to production dependents.
topo = { path = ".", features = ["sweep-testing"] }
# Downstream export/tessellation consumers, dev-only (M5 S1): the
# glued-union acceptance rows pin watertight STL + STEP export of the
# REST-zip results (dev-dependency cycles are cargo-legal and never
# reach production dependents).
mesh = { path = "../mesh" }
stl = { path = "../stl" }
step-export = { path = "../step-export" }
