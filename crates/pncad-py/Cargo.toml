# LIB-U9S: the Python bindings scaffold. Wraps the `pncad` curated
# document surface (LIBRARY-DESIGN §L3: Python speaks
# Doc/DocEdit/evaluate/persist, never an arena key) and mirrors
# `quantity`'s Length/Angle/Count at the boundary (§L4).
#
# GATING (LIB-U9S fence): `pyo3` is an OPTIONAL dependency behind the
# non-default `python` feature. A plain `cargo build/test/clippy
# --workspace` therefore compiles this crate with ZERO Python
# involvement — no interpreter probe, no build-config step — so hosted
# CI stays green without a Python toolchain STRUCTURALLY rather than by
# relying on an interpreter that happens to be on the runner image.
# (The build job's runner is `vars.BUILD_RUNNER || ubuntu-latest`, i.e.
# swappable for a self-hosted box, which is exactly the fragility this
# avoids.) The Python-independent half of the crate — unit conversion,
# the error taxonomy, the payload projection — compiles and is TESTED
# on the default path, so CI still covers it; only the `#[pyclass]`
# wrappers are gated out.
[package]
name = "pncad-py"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# NOTE: the workspace `[lints]` table is deliberately NOT inherited.
# It sets `unsafe_code = "forbid"`, and `forbid` cannot be relaxed by an
# inner `allow` — but PyO3's `#[pyclass]`/`#[pymodule]` macros expand to
# `unsafe impl` blocks, so inheriting it makes the `python` feature
# uncompilable. This crate is the workspace's single unsafe-bearing
# member and the unsafe is entirely macro-generated FFI glue.
#
# The tables below therefore restate the workspace set EXACTLY, minus
# that one lint. Restating by hand is a drift hazard — an earlier
# revision of this file silently dropped four of them — so the
# equality is not a promise, it is a TEST:
# `tests::crate_lints_match_the_workspace_minus_unsafe_code` parses
# both manifests and fails if they diverge. Adding a lint to
# `[workspace.lints]` therefore breaks THIS crate's build until it is
# mirrored here, on the default (no-Python) path that hosted CI takes.
[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
# LOAD-BEARING — DO NOT REMOVE, and keep byte-identical with the workspace
# root's copy. See the long note in the root `Cargo.toml`: without this
# `check-cfg` declaration a demoted test's
# `#[cfg_attr(not(nightly_suite), ignore = ...)]` marker is an
# `unexpected 'cfg' condition name` ERROR under `-D warnings`, and this crate
# does not inherit the workspace table, so it needs its own copy.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly_suite)'] }

[lints.clippy]
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[features]
default = []
# Compiles the PyO3 surface. Off by default — see the GATING note above.
python = ["dep:pyo3"]
# What maturin builds with: the `python` surface plus PyO3's
# `extension-module`, which drops the libpython link so the abi3 wheel
# loads into any CPython >= 3.8.
extension-module = ["python", "pyo3/extension-module"]
# Forwards the certified interval scalar exactly as `pncad` does ("so
# CI's interval lane builds the façade uniformly" — its manifest's own
# words). MEASURED necessity (LIB-PYSEL): CI's build-interval job runs
# `cargo ... ${cargo_scope} --features interval`, and a diff whose
# ci-filter closure is pncad-py ALONE — this crate has no dependents —
# scoped that command to a package without the feature, which cargo
# refuses. Every earlier bindings unit happened to touch a second
# crate, so this unit is the first pncad-py-only closure to hit the
# wall.
interval = ["pncad/interval"]
# Forwards geom-core's K-telemetry recording scalar so the
# workspace-wide `--features probe` lane builds uniformly. Same shape
# and same reason as the `interval` row above; see geom-core's manifest
# for why Probe is opt-in (it is a `Real` instantiation, so it
# monomorphizes every generic-over-`Real` body, and only the K
# experiment consumes it).
probe = ["pncad/probe"]

[dependencies]
pncad = { path = "../pncad" }
quantity = { path = "../quantity" }
# LIB-PYBUNDLE: a `StableName` crosses to Python as TEXT, and that text
# is the name's OWN serde encoding — the same one `save` writes into a
# document file. Reusing it is what keeps a fillet selection ONE
# vocabulary; inventing a second spelling is what this line avoids.
# Workspace pin, already in the tree through `editor-core`.
serde_json = { workspace = true }
# PyO3 0.29.0, released 2026-06-11 — past the ~2-week dependency-age
# policy (memories/review-and-dependency-policy.md). 0.29.1 (2026-08-02)
# and 0.29.2 (2026-08-05) are BOTH inside the two-week window as of
# 2026-08-09, so Cargo.lock pins 0.29.0 exactly. MIT OR Apache-2.0.
# `abi3-py38` builds one wheel valid for CPython 3.8+ (§L5 U9: abi3).
pyo3 = { version = "0.29.0", features = ["abi3-py38"], optional = true }

[lib]
# `cdylib` is the Python extension module; `rlib` keeps the crate
# usable as an ordinary workspace member (and is what `cargo test`
# links against).
crate-type = ["cdylib", "rlib"]
