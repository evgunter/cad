[package]
name = "profile"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Forwards geom-core's certified interval scalar so validation runs at
# `Interval` — exercised by the feature-gated test modules in CI's
# interval lane.
interval = ["geom-core/interval"]

[dependencies]
geom-core = { path = "../geom-core" }

[dev-dependencies]
proptest = { workspace = true }
