[package]
name = "geom"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Forwards geom-core's certified interval scalar so every evaluator
# instantiates at `Interval` — exercised by the feature-gated test
# modules in CI's interval lane.
interval = ["geom-core/interval"]
# Forwards geom-core's K-telemetry recording scalar so the
# workspace-wide `--features probe` lane builds uniformly. Same shape
# and same reason as the `interval` row above; see geom-core's manifest
# for why Probe is opt-in (it is a `Real` instantiation, so it
# monomorphizes every generic-over-`Real` body, and only the K
# experiment consumes it).
probe = ["geom-core/probe"]

[dependencies]
# Certified-conservative box constructors (the two `boxes` modules):
# the bvh crate sits BELOW the geometry crate by design (its docs).
bvh = { path = "../bvh" }
geom-core = { path = "../geom-core" }

[dev-dependencies]
# Shared fuzz harness for this crate's randomized sweeps (one RNG, the
# per-run seed, the CAD_FUZZ_EFFORT dial). A dependency-free leaf crate
# named by [dev-dependencies] only, here and everywhere else — which is
# what keeps it off every shipped build path.
test-utils = { path = "../test-utils" }
proptest = { workspace = true }
# DEV-ONLY interpolation oracle per docs/CURVO-AUDIT.md (Q5 verdict:
# reference + test oracle; no curvo code enters the kernel). Pinned to
# the audited commit; tolerant comparison only; NOT an oracle for
# approximation/bounds (its knot-removal gate measures a different
# quantity than our bound — audit §"As a test oracle").
curvo = { git = "https://github.com/mattatz/curvo", rev = "47d19d560bf301108804dc43f933cb80381e76dd" }
# nalgebra pinned to curvo's own major (its point types are curvo's API
# surface); dev-only, rides in with the oracle above.
nalgebra = "0.35"

# ONE test binary for the whole suite (see tests/all.rs). Each extra test
# target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
[[test]]
name = "all"
path = "tests/all.rs"
