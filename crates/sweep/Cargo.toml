[package]
name = "sweep"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Forwards geom-core's certified interval scalar so the sweep operations
# run at `Interval` — exercised by the feature-gated test files in CI's
# interval lane.
interval = [
    "geom-core/interval",
    "geom-brep/interval",
    "profile/interval",
    "topo/interval",
]

[dependencies]
geom-brep = { path = "../geom-brep" }
geom-core = { path = "../geom-core" }
geom-curves = { path = "../geom-curves" }
geom-surfaces = { path = "../geom-surfaces" }
profile = { path = "../profile" }
topo = { path = "../topo" }

[dev-dependencies]
# The banished raw builder (PROFILES-V2 §V6, #377): these suites'
# fixtures predate the PATHS lattice and are pinned bit-for-bit, so they
# keep spelling them with `LoopBuilder` — which lives behind `profile`'s
# test-support feature and is reachable ONLY from a dev-dependency like
# this one. Nothing in any `src/` sees it.
profile = { path = "../profile", features = ["test-support"] }
# Watertightness backstop for the fillet acceptance row (M5 PR 12): the
# rounded die is tessellated and `mesh::validate::check_mesh`ed. `mesh`
# dev-depends on `sweep` in turn; cargo permits cycles that run through
# dev-dependencies (neither ever enters the other's build graph).
mesh = { path = "../mesh" }
proptest = { workspace = true }

# ONE test binary for the whole suite (see tests/all.rs). Each extra test
# target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
[[test]]
name = "all"
path = "tests/all.rs"
