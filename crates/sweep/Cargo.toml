[package]
name = "sweep"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Makes `test_support` — the fixtures this crate's tests build on —
# nameable from this crate's `tests/` binaries. A `tests/` file is a
# SEPARATE crate, so it can name neither a `#[cfg(test)]` item nor a
# `pub(crate)` one; without this feature every suite mints its own copy
# of the fixture and the copies drift (S52). Off by default and enabled
# only through the self-dev-dependency below, so it is on exactly for
# this crate's own tests and off for every normal build.
test-support = []
# Forwards geom-core's certified interval scalar so the sweep operations
# run at `Interval` — exercised by the feature-gated test files in CI's
# interval lane.
interval = [
    "geom-core/interval",
    "geom-brep/interval",
    "profile/interval",
    "topo/interval",
]
# Forwards geom-core's K-telemetry recording scalar so the
# workspace-wide `--features probe` lane builds uniformly. Same shape
# and same reason as the `interval` row above; see geom-core's manifest
# for why Probe is opt-in (it is a `Real` instantiation, so it
# monomorphizes every generic-over-`Real` body, and only the K
# experiment consumes it).
probe = [
    "geom-core/probe",
    "geom-brep/probe",
    "profile/probe",
    "topo/probe",
]

[dependencies]
geom-brep = { path = "../geom-brep" }
geom-core = { path = "../geom-core" }
geom = { path = "../geom" }
profile = { path = "../profile" }
# PLAIN edge — no features. This entry carried `features =
# ["sweep-testing"]` until S52 measured what that did: cargo unifies
# features across a build graph, so the featured edge turned topo's
# FAILURE-INJECTION doors on for every production dependent of `sweep`,
# and a downstream crate compiled `--release` naming
# `topo::PlantedDegradation`. The comment here claimed the opposite at
# the time. `scripts/gates/test-features-dev-only.sh` now enforces it.
topo = { path = "../topo" }

[dev-dependencies]
# Self dev-dependency: turns `test-support` on for THIS crate's own
# integration tests without exposing it to production dependents. A
# dev-dependency is in no consumer's build graph, and a flagless
# `cargo build [--release]` does not build test targets, so this is the
# only edge that ever enables the feature. (`cargo build --all-targets`
# DOES build them, and cargo then unifies the feature into the lib
# artifact of that same invocation — an explicit test-inclusive build,
# not a production one.)
sweep = { path = ".", features = ["test-support"] }
# `step-export` for one row: the standing `CurvedShellClassification`
# gate, recorded on a curved two-shell body that only the shell verb
# can now produce. Dev-only — no consumer's build graph sees it.
step-export = { path = "../step-export" }
# `sweep-testing` for the same reason editor-core's dev-dependency
# carries it: several suites here run the §4.4 differential pair and
# name `SweepStrategy::Idealized`, which is reference surface gated out
# of production builds. Dev-dependencies are the only place it is on —
# gated, not asserted.
topo = { path = "../topo", features = ["sweep-testing"] }
# Watertightness backstop for the fillet acceptance row (M5 PR 12): the
# rounded die is tessellated and `mesh::validate::check_mesh`ed. `mesh`
# dev-depends on `sweep` in turn; cargo permits cycles that run through
# dev-dependencies (neither ever enters the other's build graph).
mesh = { path = "../mesh" }
proptest = { workspace = true }
# The one home for a randomized sweep's seed and effort dial
# (`CAD_FUZZ_SEED` / `CAD_FUZZ_EFFORT`). `test-utils` is a dev-only
# leaf no shipped build reaches, which is why the ambient-environment
# gate allowlists its `fuzz.rs` by REACHABILITY — a suite here that
# rolled its own env dial would be a second channel with no such
# argument behind it.
test-utils = { path = "../test-utils" }

# ONE test binary for the whole suite (see tests/all.rs). Each extra test
# target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
[[test]]
name = "all"
path = "tests/all.rs"


[[test]]
name = "r2probes"
path = "tests/verbs_f7_r2_probes.rs"
