[package]
name = "geom-surfaces"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Forwards geom-core's certified interval scalar so every evaluator
# instantiates at `Interval` — exercised by the feature-gated test
# modules in CI's interval lane.
interval = ["geom-core/interval"]

[dependencies]
# Certified-conservative box constructors (`boxes` module, M5 PR 8):
# the bvh crate sits BELOW the geometry crates by design (its docs).
bvh = { path = "../bvh" }
geom-core = { path = "../geom-core" }

[dev-dependencies]
# Shared fuzz harness for this crate's randomized sweeps (one RNG, the
# per-run seed, the CAD_FUZZ_EFFORT dial). DEV-ONLY: `fuzz-support` is
# requested here and nowhere else, so nothing on a shipped build path can
# reach it — the same posture geom-core documents for its own self
# dev-dependency.
geom-core = { path = "../geom-core", features = ["fuzz-support"] }
proptest = { workspace = true }
# The promoted M2 PR 1 reviewer suite (tests/review_m2_pr1*.rs) is a
# cross-crate consumer program exercising curves and surfaces together;
# geom-curves is acyclic here (it does not depend on geom-surfaces).
geom-curves = { path = "../geom-curves" }

# ONE test binary for the whole suite (see tests/all.rs). Each extra test
# target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
[[test]]
name = "all"
path = "tests/all.rs"
