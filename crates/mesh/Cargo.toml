[package]
name = "mesh"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Forwards geom-core's certified interval scalar so the workspace-wide
# `--features interval` lane builds uniformly. Tessellation itself is
# f64-only by ratified judgment call (display/export operation — see the
# crate docs); the feature only propagates to dependencies.
interval = [
    "geom-core/interval",
    "geom-brep/interval",
    "topo/interval",
]
# Forwards geom-core's K-telemetry recording scalar so the
# workspace-wide `--features probe` lane builds uniformly. Same shape
# and same reason as the `interval` row above; see geom-core's manifest
# for why Probe is opt-in (it is a `Real` instantiation, so it
# monomorphizes every generic-over-`Real` body, and only the K
# experiment consumes it).
#
# NAME CAUTION (issue #558 friction 1): this is a SCALAR-forwarding
# feature and has nothing to do with `probe-stats` below. Read the
# suffix — `probe` propagates a `Real` instantiation to dependencies
# and adds no `mesh` code; `probe-stats` adds a `mesh` module and no
# dependency features. A rename was weighed and declined: `probe` is
# the workspace-wide name for the recording scalar in six manifests,
# `demos/tour`, `scripts/k_probe_sweep.sh` and
# `local-scripts/bt-add-probe-feature.py`, so renaming it would be a
# tree-wide churn to relabel the feature that was here first.
probe = [
    "geom-core/probe",
    "geom-brep/probe",
    "topo/probe",
]

# The tessellation budget meter (issue #320): the per-face telemetry
# `mesh::budget` records and `tools/tess-lint` consumes. OPT-IN, gated
# at the module boundary — with the feature off, `budget::armed()` is a
# constant `false` and every recording branch in the tessellation lane
# folds away, so a shipped build carries no telemetry state at all. The
# lane itself has no `#[cfg]` in it: the call sites are shared and only
# the module behind them changes, which is what keeps the two
# configurations from drifting. `demo-tour tess-budget` is the consumer
# (via pncad's forward of the same name).
budget = []

# The per-triangle certificate falsifier (issue #558): the review probe
# `mesh::probe_stats` accumulates and `tests/probe_review.rs`'s
# `z1_per_triangle_certificate_falsification` drives. OPT-IN, gated at
# the module boundary exactly like `budget` — with the feature off,
# `probe_stats::armed()` is a `const fn` answering `false`, so the
# trimmed lane's 12-samples-per-edge resampling block AND the `assert!`
# inside it are deleted from the build, and the module is not `pub`, so
# no caller outside this crate can arm what is not there.
#
# NAMED FOR ITS MODULE, the `budget` precedent: `--features probe-stats`
# ⇔ `mesh::probe_stats`, a mechanical mapping. NOT folded into `budget`:
# the meter has a release consumer (`scripts/tess_budget_sweep.sh` runs
# the demo tour at `--features budget`), so sharing one feature would
# put the falsifier's resampling and its assertion back into a release
# artifact — the exposure #558 exists to close.
#
# Its own CI row (`mesh certificate falsifier`, ci.yml + ci-local.sh)
# runs clippy and the suite here, because the default rows exercise the
# INERT half.
probe-stats = []

[dependencies]
geom-brep = { path = "../geom-brep" }
geom-core = { path = "../geom-core" }
geom-curves = { path = "../geom-curves" }
geom-surfaces = { path = "../geom-surfaces" }
topo = { path = "../topo" }
# Constrained Delaunay triangulation (ratified crate table; version,
# license, and release-age vetting in the workspace dependency table).
spade = { workspace = true }

[dev-dependencies]
# Shared fuzz harness for this crate's randomized sweeps (one RNG, the
# per-run seed, the CAD_FUZZ_EFFORT dial). A dependency-free leaf crate
# named by [dev-dependencies] only, here and everywhere else — which is
# what keeps it off every shipped build path.
test-utils = { path = "../test-utils" }
profile = { path = "../profile" }
sweep = { path = "../sweep" }

# ONE test binary for the whole suite (see tests/all.rs). Each extra test
# target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
[[test]]
name = "all"
path = "tests/all.rs"
