[package]
name = "geom-core"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Interval scalar over inari (M0 PR 4, issue #4): pulls the LGPL
# `gmp-mpfr-sys` C build via `inari/gmp` (required for transcendentals), so
# it is opt-in — the default build stays MIT/Apache and C-free. On x86-64
# this feature additionally requires AVX+FMA at runtime; the repo-wide
# `-C target-cpu=x86-64-v3` floor in `.cargo/config.toml` guarantees it.
interval = ["dep:inari", "inari/gmp"]

[dependencies]
libm = { workspace = true }
inari = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
# DEV-ONLY differential oracle for the M5 PR 2 interval ring (M5-PR2-SPEC
# family 2): the in-house rigorous interval unit, itself libm-only, so it
# drags nothing into geom-core's dependency graph (its own inari/gmp oracle
# is a dev-dependency of *that* crate and is never resolved from here). The
# kernel's runtime dependency set is unchanged: libm, plus inari behind the
# `interval` feature.
interval-transcendentals = { workspace = true }
# Derivative oracle for Dual<f64> tests only — never a runtime dependency
# (see the deviation note in src/dual.rs module docs).
num-dual = { workspace = true }
