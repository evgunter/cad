[package]
name = "geom-core"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Interval scalar (M0 PR 4, issue #4), opt-in: an enclosure is a different
# cost regime from `f64`, so it never rides along in a default build. The
# backend is the in-repo `interval-transcendentals` crate since M5 PR 1 —
# pure Rust over the same `libm` the kernel already depends on. The feature
# therefore no longer drags a C toolchain or the LGPL `gmp-mpfr-sys` build
# (it did while the backend was `inari/gmp`), and no longer needs an
# AVX+FMA floor of its own on x86-64.
interval = ["dep:interval-transcendentals"]
# K-telemetry recording scalar (`k_stats::Probe`), opt-in. Probe is a
# `Real` instantiation like `Interval`, so every generic-over-`Real` body
# monomorphizes at it — measured 2026-08-12 at 20.0% of geom-brep's LLVM
# IR, 15.6% of topo's, and 5.0% of the workspace's test-binary symbols.
# They come from `docs/GENERICS-BUILD-COST.md` §7 ("Gating `Probe`"), a
# dated writeup and not a re-measuring register: nothing in CI re-takes an
# IR share, so no guard can go red when they drift. They do not need one —
# the gate rests on Probe being an instantiation shipped to consumers who
# never run it, which is true at any share.
# It exists only to collect margin distributions for the K experiment
# (docs/K-REPORT.md, scripts/k_probe_sweep.sh), so before this gate the
# python wheel, both demos and the release renders all shipped a
# diagnostics scalar they never run. Same opt-in shape as `interval`.
#
# The funnel itself (`k_stats::decide`) is NOT gated: it is the path every
# shipped decision takes, and it must be byte-identical with the feature
# on and off (D9). Only `Probe`, the sample sink and their impls move.
#
# NOTE `docs/DESIGN.md` Q1 ratifies the instantiation set as `f64`,
# `Interval`, `Dual<f64>`, `Dual<Interval>` — Probe is not in it, so this
# gate reopens no ratified decision.
probe = []

[dependencies]
libm = { workspace = true }
interval-transcendentals = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
# Shared fuzz harness for this crate's randomized sweeps (one RNG, the
# per-run seed, the CAD_FUZZ_EFFORT dial). A dependency-free leaf crate
# named by [dev-dependencies] only, here and everywhere else — which is
# what keeps it off every shipped build path.
test-utils = { path = "../test-utils" }
# DEV-ONLY differential oracle for the M5 PR 2 interval ring (M5-PR2-SPEC
# family 2). Since M5 PR 1 this crate is ALSO the `interval` feature's
# backend (the optional dependency above) — the dev-entry is what makes it
# available on the DEFAULT, featureless build path, where the ring lives
# and where its differential lane must run. It is libm-only, so it drags
# nothing new into geom-core's graph; its own inari/gmp certification
# oracle is a dev-dependency of *that* crate and is never resolved from
# here. The kernel's runtime dependency set is unchanged: `libm`.
interval-transcendentals = { workspace = true }
# Derivative oracle for Dual<f64> tests only — never a runtime dependency
# (see the deviation note in src/dual.rs module docs).
num-dual = { workspace = true }

# ONE test binary for the whole suite (see tests/all.rs). Each extra test
# target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
[[test]]
name = "all"
path = "tests/all.rs"
