[package]
name = "geom-core"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The variant rosters behind `topo`'s sample-coverage row
# (`topo::test_support_samples`): with this on, the enums a
# `topo::ValidationError` renders through derive a companion
# discriminant enum (`strum::EnumDiscriminants`), so a variant added
# here is a gap in that row by construction, not by a hand-kept list.
# Test-only: enabled through `topo`'s `test-support` alone.
test-support = ["dep:strum"]
# K-telemetry recording scalar (`k_stats::Probe`), opt-in. Probe is a
# `Real` instantiation like `Interval`, so every generic-over-`Real` body
# monomorphizes at it — measured 2026-08-12 at 20.0% of geom-brep's LLVM
# IR, 15.6% of topo's, and 5.0% of the workspace's test-binary symbols.
# They come from `docs/GENERICS-BUILD-COST.md` §7 ("Gating `Probe`"), a
# dated writeup and not a re-measuring register: nothing in CI re-takes an
# IR share, so no guard can go red when they drift. They do not need one —
# the gate rests on Probe being an instantiation shipped to consumers who
# never run it, which is true at any share.
# It exists only to collect margin distributions for the K experiment
# (docs/K-REPORT.md, scripts/k_probe_sweep.sh), so before this gate the
# python wheel, both demos and the release renders all shipped a
# diagnostics scalar they never run.
#
# The funnel itself (`k_stats::decide`) is NOT gated: it is the path every
# shipped decision takes, and it must be byte-identical with the feature
# on and off (D9). Only `Probe`, the sample sink and their impls move.
#
# NOTE `docs/DESIGN.md` Q1 ratifies the instantiation set as `f64`,
# `Interval`, `Dual<f64>`, `Dual<Interval>` — Probe is not in it, so this
# gate reopens no ratified decision.
probe = []
# **A TEST-ONLY FUNNEL DIAL, and the one door in this crate that lets an
# INDETERMINATE answer pass as `Zero`** (`k_stats::identity_pass_*`).
#
# It exists to answer one question no other instrument can: what would
# bound a document if a named identity residual WERE discharged — the
# staged ceiling walk M10-9's reviews used to show that the two-hole
# plate is four identity residuals from a macroscopic box
# (`work/sym/plate-ceiling-is-now-the-scaffold-pushforward`). Measuring
# that needs the funnel to pass one predicate at a time, which is
# exactly what the funnel must never do in a run that decides anything.
#
# So it is a CARGO FEATURE, not an env var and not a runtime flag: with
# the feature off — every build that is not an evidence run — the code
# path does not exist. The NAME ends in `-testing` deliberately: that is
# the spelling `scripts/gates/test-features-dev-only.sh` recognises, so
# the gate proves no non-dev dependency edge and no ordinary feature can
# turn it on. Same shape, same name shape and same reason as `topo`'s
# `sweep-testing` failure-injection doors.
identity-pass-testing = []
# **THE SYMBOLIC TIER'S COST PROFILE** (`sym::profile`): structural
# counters over the normal-form walks — forms built per op with their
# sizes, every freeze with the CAUSE the ring or the budget refused for,
# the coefficient ring's promotions off the `i128` inline path, and the
# wall time of each walk. It is the instrument behind the tier's cost
# record (`sym.rs`, `# Cost`) and exists so a later change to the normal
# form has a before/after that is a count rather than a stopwatch.
#
# A CARGO FEATURE, not a runtime flag, for the reason the dial above is
# one: with the feature off — every build outside a dev-dependency edge,
# so every shipped one — no counter, no clock and no branch is compiled,
# and the shipped tier is bit for bit what it was. With it on — every
# `editor-core` test build carries it, evidence run or not — and the
# profile not installed (`sym::profile::start_profile`), every hook is
# one thread-local flag read. The NAME ends in `-testing` so `test-features-dev-only.sh`
# proves it reachable through dev-dependency edges only.
sym-profile-testing = []

[dependencies]
# Optional: `test-support` above.
strum = { version = "0.28", features = ["derive"], optional = true }
libm = { workspace = true }
# The symbolic tier's exact coefficient ring (`sym::Rat`, M10-8): see
# the workspace table for why an `i128` was not enough.
num-bigint = { workspace = true }
num-integer = { workspace = true }
num-traits = { workspace = true }
# The `Interval` scalar's backend (`src/interval.rs`): proven per-function
# libm error pads, pure Rust over the same `libm` this crate already
# carries, and a separate workspace root so its own gmp-backed
# certification oracle never enters this graph. A NORMAL dependency. It
# is also the differential oracle the
# ring's default-lane tests read (`tests/ring_interval_differential.rs`).
interval-transcendentals = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Shared fuzz harness for this crate's randomized sweeps (one RNG, the
# per-run seed, the CAD_FUZZ_EFFORT dial). A dependency-free leaf crate
# named by [dev-dependencies] only, here and everywhere else — which is
# what keeps it off every shipped build path.
test-utils = { path = "../test-utils" }
# Derivative oracle for Dual<f64> tests only — never a runtime dependency
# (see the deviation note in src/dual.rs module docs).
num-dual = { workspace = true }

# ONE test binary for the whole suite (see tests/all.rs). Each extra test
# target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
[[test]]
name = "all"
path = "tests/all.rs"
