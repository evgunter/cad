[package]
name = "viewer"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The authoring façade is the ONLY door this crate uses to reach the
# kernel: the scene is an evaluated document's product, tessellated at a
# display tolerance, exactly as an outside consumer would write it.
pncad = { path = "../pncad" }
# The box type the camera frames against, and `Aabb::from_points`. A
# direct edge on the owning crate rather than a new re-export added to
# `pncad`'s root — the ruling `pncad`'s own crate docs state for a type
# the façade does not carry.
bvh = { path = "../bvh" }

# `Rgba8` — the exact 8-bit sRGB colour `crates/viewer/src/theme.rs`
# states a palette in, and the same type a document's own
# `Attr::Color` persists. One type on both sides is the point: a
# document colour overriding a theme's default body colour is then a
# substitution within one colour space rather than a conversion
# between two.
#
# A DIRECT edge rather than a new re-export on the facade's root —
# the ruling `pncad`'s own crate docs state for a type the facade does
# not carry, and the same one the `bvh` stanza above cites. It costs
# the build nothing: `pncad` already depends on `editor-core`, so the
# crate is in this graph either way, and no `--workspace` job compiles
# anything now that it did not compile before.
editor-core = { path = "../editor-core" }

# --- the `app` feature's toolkit graph (GQ6: egui; OQ-b: egui_tiles) ---
#
# Every entry here is optional and reached only through `app`. The
# feature is NOT default, and that is a CI-cost decision rather than a
# taste one: `viewer` sits downstream of every kernel crate, so with the
# toolkit graph on by default the change filter's dependent closure would
# compile eframe + wgpu + naga in each of the four `--workspace` jobs of
# every kernel PR. Off by default, the toolkit is compiled once per run,
# by the one step that names it.
#
# Versions carry their release dates against the ~2-week dependency-age
# policy (memories/review-and-dependency-policy.md), taken from the
# crates.io API on 2026-08-27.
#
# egui/eframe/egui-wgpu 0.36.1 (2026-08-07, 20 days): MIT OR Apache-2.0,
# MSRV 1.95 — under the pinned 1.97.0 toolchain.
egui = { version = "0.36.1", optional = true }
# `wgpu` is eframe's renderer here, not glow: the viewport is a custom
# wgpu pass and the toolkit's pin IS our wgpu version (GQ6-RESURVEY §1).
# Default features are off because the default set carries glow.
# `wayland` and `x11` are the LINUX WINDOWING backends and name no
# door this crate calls; they live in the `cfg(not(wasm32))` block
# below, because on wasm32 eframe's windowing is the browser and
# those features gate winit code that target does not build. What
# stays here is the portable pair: the fonts and the renderer.
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "wgpu",
], optional = true }
# The paint-callback door plus the `wgpu` re-export the viewport draws
# through. Depending on `wgpu` directly would let cargo unify a SECOND
# major version into the graph; going through this re-export makes the
# toolkit's pin structurally ours.
egui-wgpu = { version = "0.36.1", optional = true }
# OQ-b, decided here: egui_tiles over egui_dock. Licensing is the first
# reason — MIT OR Apache-2.0 keeps both branches of this project's dual
# license alive, where egui_dock is MIT-only. The second is shape: the
# layout is a `Tree<Pane>` VALUE the app owns and a `Behavior` impl
# renders, which is the same "state is a value, rendering is a view of
# it" discipline G1 puts on everything else here.
# 0.17.0 (2026-08-05, 22 days) is what Cargo.lock pins: 0.17.1
# (2026-08-18) is 9 days old and inside the age window.
egui_tiles = { version = "0.17.0", optional = true }
# Vertex/uniform bytes for the wgpu buffers. Zlib OR Apache-2.0 OR MIT;
# 1.25.2 released 2026-07-19.
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }

# --- the two toolkit edges that exist only OFF the browser ---
#
# Neither names a door the browser has. `winit` is the native event
# loop, and eframe's windowing on wasm32 IS the browser — the crate is
# not in that graph at all. `rfd`'s wasm backend exists but exposes
# only the ASYNC dialog, so the blocking `FileDialog` the open/save
# path calls is `cfg`-ed out there; the browser build reaches the same
# refusal through `frame::chooser_backend`, which reports `Absent` on
# wasm32 and disables the two controls exactly as it does on a Linux
# box with no portal and no zenity (#1125).
#
# Both stay `optional` and both stay reached only through `app`; this
# block narrows WHERE they apply, not WHETHER the feature owns them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The linux windowing backends, split out of the portable eframe
# stanza above — see the note there.
eframe = { version = "0.36.1", default-features = false, features = [
    "wayland",
    "x11",
], optional = true }
# A DIRECT edge to the winit eframe already pins (0.30.13 in the
# lockfile — no new crate, no new version, so the dependency-age rule
# is untouched), because eframe does not re-export the crate and the
# WSLg fix needs one trait from it: `EventLoopBuilderExtX11`, to
# PREFER the X11 backend when WSL is detected (see `app::run` — WSLg's
# Wayland RAIL shell breaks horizontal resize; X11 verified working,
# issue #1097). Default features off: the x11/wayland backends are
# already chosen by the eframe stanza above, and this edge must never
# be the one that widens them.
winit = { version = "0.30.13", default-features = false, optional = true }
# The native file dialog — the ONE thing in the open/save path that
# escapes headless testing. `viewer::docio::{open, save_path}` are
# ordinary typed functions over a `Path`; this crate chooses the path
# and does nothing else.
#
# 0.17.2 (2026-01-12), MIT — far past the ~2-week age rule
# (memories/review-and-dependency-policy.md). MIT-only is a narrower
# licence than this project's MIT OR Apache-2.0 and is compatible with
# both branches of it; the egui_dock comparison that went the other way
# in GUI-0 was a choice between two crates of equal fitness, which this
# is not — the alternatives here are a GTK C dependency
# (`native-dialog`'s Linux path) or writing a chooser.
#
# WHAT THE PIN DOES AND DOES NOT AVOID, stated exactly, because the
# first version of this comment overstated it. `xdg-portal` + `wayland`
# IS rfd 0.17.2's own default set, and `gtk3` was never in it — so
# `default-features = false` avoids nothing today. What it buys is that
# a future release cannot widen the default set into this build without
# an edit here: the C-toolchain dependency `gtk3` would introduce is a
# thing to opt into deliberately, never to inherit. The resolved Linux
# subtree is `libc, log, percent-encoding, pollster, raw-window-handle,
# wayland-{backend,client,protocols}` — no gtk/glib/gobject-sys, no
# zbus/ashpd/tokio, no C.
#
# TWO THINGS TO KNOW, neither a blocker. (1) The `xdg-portal` backend
# talks to the desktop portal and FALLS BACK TO SPAWNING `zenity` when
# there is none, so Open…/Save… has a runtime dependency on a portal or
# that binary — a property of the dialog, which is this unit's one
# excused surface. (2) `pollster` enters the lock at 0.4.0 beside the
# 1.0.1 already there, so the graph carries two majors of it. The
# `egui-wgpu` stanza above argues against exactly that shape for a
# DIRECT edge; this one is a dependency-of-a-dependency we do not pick,
# and it is recorded here rather than left for a reader to find.
rfd = { version = "0.17.2", default-features = false, features = [
    "wayland",
    "xdg-portal",
], optional = true }

# --- the browser build's own edges ---
#
# `getrandom` is NOT a new dependency: it is already in the graph, as
# the façade's OS-randomness for interactively-authored document ids
# (ASM-1 spec D-1). On wasm32 that crate refuses to build until a
# backend is named, and naming one takes BOTH halves — this feature
# and `RUSTFLAGS='--cfg getrandom_backend="wasm_js"'`. Setting only
# the flag is the error `docs/GQ6-RESURVEY.md` §4 records; this stanza
# is the other half, so the flag is all a builder has to remember.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
# `WebRunner::start` is async and `main` is not, so the entry point
# hands the future to the browser's own event loop rather than
# blocking — which on the main thread is not merely slow but illegal.
# No direct `wasm-bindgen` edge: eframe re-exports both it and
# `web_sys`, and going through the re-export makes the toolkit's pin
# structurally ours, the same argument the `egui-wgpu` stanza above
# makes for the wgpu pin.
#
# 0.4.76 is ALREADY IN THE LOCKFILE — eframe's own wasm graph pins it
# — so this is a direct edge to a crate and version the build already
# had, and the ~2-week dependency-age rule is untouched. Exactly the
# `winit` stanza's argument above, for exactly the same reason: the
# door needed is one eframe does not re-export. MIT OR Apache-2.0.
wasm-bindgen-futures = { version = "0.4.76", optional = true }

[dev-dependencies]
# The workspace's shared fuzz harness (seed/effort dial,
# memories/test-suite-cost.md) — used by the R2 review consumer suite.
test-utils = { path = "../test-utils" }

# --- the colourblind check's oracle (tests/theme.rs) ---
#
# DEV-only, and that is what makes a 0.1.0 acceptable here. Neither
# crate ships in anything: they are the simulation a test measures a
# palette through, and the suite pins their answers against published
# reference values before trusting them — so a wrong model fails
# loudly on the oracle rows rather than silently passing every theme.
#
# Both are 0.1.0 (2026-03-17), MIT OR Apache-2.0 — dual, so both
# branches of this project's licence stay alive — MSRV 1.85 under the
# pinned 1.97.0, 12 kB and 20 kB, and `perceive-color` has NO
# dependencies of its own. Far past the ~2-week dependency-age policy
# (memories/review-and-dependency-policy.md).
#
# WHY THESE AND NOT THE ALTERNATIVES, since the graph is the whole
# argument: `colorverse` pulls `image` + `nalgebra` + `argh`,
# `sensus-core` pulls `image`, and `colorblind` is a 0.0.1 last
# touched in 2020. `palette` is mature and dual-licensed but carries
# no CVD simulation at all, so it would remove neither edge.
#
# `perceive-color` also carries the two things the check needs beside
# the simulation — OKLCH for the perceptual distance, and a `Color`
# that IS linear RGB with an explicit sRGB transfer pair, which is the
# same boundary `viewer::theme` crosses. One edge, three jobs.
perceive-cvd = "=0.1.0"
perceive-color = "=0.1.0"


[features]
# The eframe application: windowing, the docked chrome, and the wgpu
# viewport. Everything else in this crate — camera state, the typed
# camera operations, the input mapping, and the scene extraction — is
# renderer-free and compiles without it (G1: layer 3 is
# headless-testable).
app = [
    "dep:bytemuck",
    "dep:eframe",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui_tiles",
    "dep:rfd",
    "dep:wasm-bindgen-futures",
    "dep:winit",
]
# Forwards the interval feature so the workspace-wide `--features
# interval` lane builds uniformly (the viewer itself is f64-only; the
# feature only propagates to the façade). Every other workspace crate
# already carries this forward; a `-p viewer`-scoped CI run that draws
# the interval lane fails at `cargo`'s door without it.
interval = ["pncad/interval"]

[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"
required-features = ["app"]

# ONE test binary for the whole suite (see tests/all.rs).
[[test]]
name = "all"
path = "tests/all.rs"
