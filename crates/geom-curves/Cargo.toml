[package]
name = "geom-curves"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Forwards geom-core's certified interval scalar so every evaluator
# instantiates at `Interval` — exercised by the feature-gated test
# modules in CI's interval lane.
interval = ["geom-core/interval"]

[dependencies]
# Certified-conservative box constructors (`boxes` module, M5 PR 8):
# the bvh crate sits BELOW the geometry crates by design (its docs).
bvh = { path = "../bvh" }
geom-core = { path = "../geom-core" }

[dev-dependencies]
proptest = { workspace = true }
