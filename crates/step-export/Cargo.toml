# In-house STEP AP214 analytic-subset EXPORT writer (M4 PR 7; the F6
# decision, 2026-07-23 — adopted nothing at runtime).
# Export layer like `stl`: f64-only, not scalar-generic. Import is M7
# and deliberately absent here.
[package]
name = "step-export"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Forwards geom-core's K-telemetry recording scalar so the
# workspace-wide `--features probe` lane builds uniformly. See geom-core's manifest
# for why Probe is opt-in (it is a `Real` instantiation, so it
# monomorphizes every generic-over-`Real` body, and only the K
# experiment consumes it).
probe = ["topo/probe"]

[dependencies]
# The writer consumes finished kernel bodies: topology walk over `topo`,
# certified carriers/surfaces from the geometry crates, the ambient
# tolerance (STEP uncertainty) from geom-core.
geom-core = { path = "../geom-core" }
geom = { path = "../geom" }
topo = { path = "../topo" }

[dev-dependencies]
# The shared Rust reader for this crate's source-text guards.
test-utils = { path = "../test-utils" }
# Building acceptance bodies end-to-end (cube, the M3 pocketed die,
# boolean-result assemblies) through the public profile/sweep APIs.
# `test-support` ON for the `profile::RawLoop` fixture door (that
# trait's docs carry the argument); dev-only, so no shipped build of
# this crate reaches it.
profile = { path = "../profile", features = ["test-support"] }
# `test-support` ON: the corpus swept elbow and the acceptance boxes
# this crate exports are `sweep::test_support`'s rather than a per-crate
# rebuild of the same constants (S52). That reaches `examples/` too,
# which builds the committed corpus from the same `tests/common`
# module it always has -- so an edit to one of those fixtures
# re-authors the committed `.step` bytes. It is not silent:
# `committed_fixtures_are_byte_golden` runs on every PR over the SAME
# builders, so the edit that would move the bytes is the PR that goes
# red. Dev-only by construction, so the feature reaches no shipped
# build of this crate (that module's docs).
sweep = { path = "../sweep", features = ["test-support"] }
# `test-support` ON: this crate's suites census a body through
# `topo::test_support::arena_counts`, the kernel's ONE producer of
# arena lengths, rather than re-walking the arenas beside it. Dev-only,
# so no shipped build reaches the facade.
topo = { path = "../topo", features = ["test-support"] }
# Float-printer round-trip property tests.
proptest = { workspace = true }
# Parse-back oracles (F6 decision: dev-dependencies ONLY — the writer
# itself adopts nothing). ruststep: syntactic Part 21 parse-back (its
# AP203 semantic layer is broken upstream and unused here).
# truck-stepio: independent semantic reconstruction — `in::Table` +
# `to_compressed_shell` rebuilds topology from our output and the tests
# compare entity counts against the source body.
ruststep = { workspace = true }
truck-stepio = { workspace = true }

# ONE test binary for the whole suite (see tests/all.rs). Each extra test
# target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
[[test]]
name = "all"
path = "tests/all.rs"
