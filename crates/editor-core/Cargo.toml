[package]
name = "editor-core"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Makes the RAW pick mints nameable from outside this crate's own
# sources: `MeshPick::build`, the hand-built triangle index, and
# `PickTarget::new`, the target that DECLARES which document, node and
# body its mesh is of. Under this feature both are `pub`; under its
# negation neither exists at all, so a build that does not ask for it
# has no route to either, `NodePick` is the only mint of a
# `PickTarget`, and "the document half is checked" is true of every
# target a consumer can hold rather than of one path through the door
# (`src/resolve/pick.rs`'s `PickTarget`, `ASSEMBLY.md` A2a).
#
# Off by default and enabled only through the self dev-dependency
# below, so it is on for this crate's own test targets and off for
# every normal build. It adds no public TYPE — the types stay public in
# both arms and only the constructors move — so nothing behind it is
# part of the surface pncad's facade completeness guard watches.
#
# FORWARDS `profile/test-support`, by the convention
# `crates/profile/tests/raw_door_census.rs`'s
# `every_crate_that_names_the_door_reaches_it` holds: a crate whose
# `src/` names profile's raw door and declares a `test-support` feature
# of its own forwards profile's from it, so the feature compiles from
# the crate that NAMES the door rather than only where some sibling's
# dev-dependency happens to unify it in. This crate's `src/` does name
# it — the `ProfileLoop::polygon` fixtures in the `#[cfg(test)]`
# modules of `resolve/pick.rs`, `names/emit*.rs`, `eval/wire.rs` and
# `verbs/shell.rs` — and that census row is what reds without the
# forward. `crates/sweep/Cargo.toml` carries it for the same reason. It
# is the census row and not a compile: the `profile` dev-dependency
# below already carries `test-support`, so this crate's own test
# targets build either way.
test-support = ["profile/test-support"]
# Forwards geom-core's K-telemetry recording scalar so the
# workspace-wide `--features probe` lane builds uniformly. See geom-core's manifest
# for why Probe is opt-in (it is a `Real` instantiation, so it
# monomorphizes every generic-over-`Real` body, and only the K
# experiment consumes it).
probe = [
    "geom-core/probe",
    "geom-brep/probe",
    "geom/probe",
    "mesh/probe",
    "profile/probe",
    "sweep/probe",
    "topo/probe",
    "verbs/probe",
]

[dependencies]
# M4 PR 2 D1: editor-core sits ABOVE the kernel (G1 layering) — the
# evaluation service depends on the op crates it wires. The kernel
# crates gain NO editor-core dependency (the workspace dep direction
# enforces it).
geom-core = { path = "../geom-core" }
# GUI-1: the hit-test service (`resolve::pick`) traverses `Bvh::ray`
# over a tree per face patch under a tree over the patches' boxes, and
# reads the mesh back-references
# (`FacePatch::face`) it inverts through `resolve::hit`. Both sit
# below editor-core (bvh under geom-core only; mesh is the kernel's
# tessellation crate) — the G1 direction is untouched.
bvh = { path = "../bvh" }
# Promoted from dev-dependencies by GUI-1; the dev-side need it served
# there still stands and is now covered by this row (M5 PR 11: the
# corpus curved documents' tessellation/props columns in tests/).
mesh = { path = "../mesh" }
# LIB-SEL1: the geometric selector's EXACT atoms read the surface tag,
# and `geom_brep::SurfaceKind` is the workspace's ONE fieldless mirror
# of `Surface` (D3: closed, compiler-enumerated). Reused rather than
# re-minted — a second mirror is a second thing to keep in step — and
# `topo` deliberately does not re-export it (the "zero kernel edits"
# ruling, `crates/pncad/src/lib.rs` contract clause 1), so the honest
# reach is a direct edge on a crate editor-core already builds against
# through `sweep`.
geom-brep = { path = "../geom-brep" }
# M4 PR 3: the naming layer reads face carrier PLANES (side-of
# discriminators against cutting carriers, N2) from the result body.
geom = { path = "../geom" }
# D9: the analysis lane's normal-quantile bisection and tail-mass
# accounting read `erf` from the workspace's ONE transcendental source
# (a system libm differs across platforms in the last ulp).
libm = { workspace = true }
profile = { path = "../profile" }
# LIB-U8a: the expression TEXT parser's unit-suffix vocabulary is the
# quantity crate's closed unit table (a leaf crate — no dependency
# cycle: quantity sits below the whole workspace).
quantity = { path = "../quantity" }
sweep = { path = "../sweep" }
topo = { path = "../topo" }
# The kernel's verb vocabulary. This crate is its only consumer — the
# enum names ops that live in `sweep` and `topo`, so it sits above both
# and below this one, and the kernel crates gain no edge to it.
verbs = { path = "../verbs" }
# D6: rayon idiom-1 parallelism over independent DAG nodes (the D9
# addendum's sanctioned idiom) — a runtime switch, so the determinism
# cross-check can compare both schedules in one test run.
rayon = { workspace = true }
# M4 PR 6 (spec D1): the schema-v1 persistence layer. serde derives live
# on the document types themselves (the recipe IS the save, D3); the
# JSON writer/reader and the migration chain live in `persist`.
serde = { workspace = true }
serde_json = { workspace = true }
# ASM-1 spec D-2: SHA-256 for content pins (`ContentPin`) — the
# collision-resistant version identity of ASSEMBLY-DESIGN A4.
sha2 = { workspace = true }

[dev-dependencies]
# Self dev-dependency: turns `test-support` on for THIS crate's own
# test targets without exposing the raw pick mints to production
# dependents. Same shape and same argument as `profile`'s and `topo`'s:
# a dev-dependency is in no consumer's build graph, and a flagless
# `cargo build [--release]` does not build test targets, so this is the
# only edge that ever enables the feature. (`cargo build --all-targets`
# DOES build them, and cargo then unifies the feature into the lib
# artifact of that same invocation — an explicit test-inclusive build,
# not a production one. The builds that compile this crate with the
# feature OFF are the single-package ones: `-p viewer` and the wheel.)
# A `--workspace` TEST run unifies it the same way, so a test file
# anywhere in the workspace can name a gated mint: what this feature
# decides is what a CONSUMER's build graph carries, not what every
# invocation can reach.
editor-core = { path = ".", features = ["test-support"] }
# Review lane pick3-r2's exact-rational probe of the t interval.
num-bigint = { workspace = true }
# `profile` again, with `test-support` ON. The crate is an ordinary
# dependency above; naming it a second time here adds the feature for
# TEST builds only — cargo unions the two entries for this package's
# test targets and for nothing else. It turns on the
# `profile::RawLoop` fixture door (that trait's docs carry the
# argument); a shipped build of this crate still cannot mint a table.
profile = { path = "../profile", features = ["test-support"] }
proptest = { workspace = true }
# The GUI-1 randomized sweeps' varying seed + effort dial
# (memories/test-suite-cost): a dependency-free leaf crate, dev-only,
# the same harness row every other randomized sweep in the tree takes.
test-utils = { path = "../test-utils" }
# The M5 PR 8 differential suite's doors (failure injection + traces)
# are test-only surface in topo; dev-dependencies are the only place
# the feature turns on.
topo = { path = "../topo", features = ["sweep-testing"] }
# `sweep` again, with `test-support` ON, for the same reason `profile`
# is named twice above: the corpus `loft_prism` document and the perf12
# BVH differential author the SAME two section polygons the kernel's
# own loft fixture is built from, and a second spelling of them here is
# a divergence waiting to happen. Test builds only.
sweep = { path = "../sweep", features = ["test-support"] }
# M10-9's staged-ceiling evidence needs geom-core's test-only funnel
# dial (`identity-pass-testing`), which lets one named identity
# residual's indeterminate answer pass so a ceiling can be measured "as
# if" it were discharged. Dev-dependencies are the only place it turns
# on; the ordinary `geom-core` edge above does not carry it.
# `sym-profile-testing` rides the same edge for the same reason: the
# symbolic tier's cost profile (`geom_core::sym::profile`) is read by
# evidence rows under `tests/m10_*` and by nothing shipped.
geom-core = { path = "../geom-core", features = [
    "identity-pass-testing",
    "sym-profile-testing",
] }

# ONE test binary for the whole suite (see tests/all.rs). Each extra test
# target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
[[test]]
name = "all"
path = "tests/all.rs"
