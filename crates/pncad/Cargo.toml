# The authoring façade (LIB-U1): ONE crate to depend on. It owns no
# geometry — it re-exports the kernel crates as modules, curates a
# prelude, and pays the `f64` -> `T: Real` conversion once at the
# seam so authoring code never writes `T::from_f64` or a turbofish.
# `pncad` is the Q9 placeholder name; `publish = false` holds
# workspace-wide until the project has its real one.
[package]
name = "pncad"
autotests = false  # tests/all.rs aggregates every suite; see its header
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Forwards geom-core's certified interval scalar to every re-exported
# crate that has the feature, so CI's interval lane builds the façade
# uniformly with the rest of the workspace. `bvh` has no such feature
# and is not re-exported here (see lib.rs).
interval = [
    "editor-core/interval",
    "geom-brep/interval",
    "geom-core/interval",
    "geom/interval",
    "mesh/interval",
    "profile/interval",
    "step-export/interval",
    "step-import/interval",
    "stl/interval",
    "sweep/interval",
    "topo/interval",
]
# Forwards `mesh`'s tessellation-budget meter (issue #320) so
# demos/tour can drive its `tess-budget` sweep. Only `mesh` has the
# feature — it is per-face telemetry, not a scalar — so this row has
# exactly one entry and stays that shape.
budget = ["mesh/budget"]
# Forwards geom-core's K-telemetry recording scalar so the
# workspace-wide `--features probe` lane builds uniformly. Same shape
# and same reason as the `interval` row above; see geom-core's manifest
# for why Probe is opt-in (it is a `Real` instantiation, so it
# monomorphizes every generic-over-`Real` body, and only the K
# experiment consumes it).
probe = [
    "editor-core/probe",
    "geom-brep/probe",
    "geom-core/probe",
    "geom/probe",
    "mesh/probe",
    "profile/probe",
    "step-export/probe",
    "step-import/probe",
    "stl/probe",
    "sweep/probe",
    "topo/probe",
]

# Every authoring-surface crate. The façade's whole job is that a
# consumer names none of these itself.
[dependencies]
editor-core = { path = "../editor-core" }
geom-brep = { path = "../geom-brep" }
geom-core = { path = "../geom-core" }
geom = { path = "../geom" }
mesh = { path = "../mesh" }
profile = { path = "../profile" }
quantity = { path = "../quantity" }
step-export = { path = "../step-export" }
step-import = { path = "../step-import" }
stl = { path = "../stl" }
sweep = { path = "../sweep" }
topo = { path = "../topo" }
# ASM-1 spec D-1: OS randomness for `random_document_id` — interactive
# authoring mints ids HERE, never inside the deterministic kernel.
getrandom = { workspace = true }

# ONE test binary for the whole suite (see tests/all.rs). Each extra
# test target cost ~1.9 s of codegen+link on the 2-vCPU CI runner.
#
# The one dev-dependency is the shared Rust reader the suite's
# source-scanning guards read through, and it is not a hole in the
# closure property — an empty dev-dependency list never enforced that
# and an earlier comment here was wrong to say it did. Cargo passes
# `--extern` for the ordinary [dependencies] above to test targets
# too, so all twelve are in scope in tests/all.rs regardless. What
# enforces the closure property is the self-scanning guard test in
# that file, which admits `test_utils` as a `use` root and no kernel
# crate.
[dev-dependencies]
test-utils = { path = "../test-utils" }

[[test]]
name = "all"
path = "tests/all.rs"
