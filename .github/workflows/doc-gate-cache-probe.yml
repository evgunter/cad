# TEMPORARY MEASUREMENT RIG — delete before this branch merges.
#
# The question: the rustdoc gate documents SEVEN cargo roots, and the
# `fmt` job's `Swatinem/rust-cache@v2` is told about exactly one of them
# (`./target`, its default). The other six — demos/tour, demos/wild,
# tools/k-lint, tools/tess-lint, tools/tess-meter,
# interval-transcendentals — each build into their OWN target directory,
# which no cache carries, so every hosted run rebuilds them from nothing.
#
# Two jobs, identical except for that one input, each with its own cache
# key. Push once to seed both caches, push again (with a kernel source
# touched, the way a real PR touches one) to read them warm.
#
# `push` on this branch only: ci.yml is pull_request + push:main, so a
# branch push triggers no other workflow and this rig costs its own two
# jobs and nothing else.
name: doc-gate cache probe (temporary)

on:
  push:
    branches: ['claude/rustdoc-gate-caching-frg3k5']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: probe — rust-cache as ci.yml has it today
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc-gate-probe-baseline
      - name: runner and restored state
        run: |
          nproc
          du -sh target 2>/dev/null || echo 'target: absent'
          for d in demos/tour demos/wild tools/k-lint tools/tess-lint \
                   tools/tess-meter interval-transcendentals; do
            du -sh "$d/target" 2>/dev/null || echo "$d/target: absent"
          done
      - name: selftest (timed)
        run: |
          s=$(date +%s.%N); scripts/doc-gate.sh --selftest; e=$(date +%s.%N)
          printf 'MEASURED selftest %.1f s\n' "$(echo "$e - $s" | bc)"
      - name: gate (timed)
        run: |
          s=$(date +%s.%N); scripts/doc-gate.sh; e=$(date +%s.%N)
          printf 'MEASURED gate %.1f s\n' "$(echo "$e - $s" | bc)"
      - name: target sizes after the gate
        if: '!cancelled()'
        run: |
          du -sh target
          for d in demos/tour demos/wild tools/k-lint tools/tess-lint \
                   tools/tess-meter interval-transcendentals; do
            du -sh "$d/target" 2>/dev/null || echo "$d/target: absent"
          done

  candidate:
    name: probe — rust-cache told about all seven cargo roots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc-gate-probe-candidate
          workspaces: |
            .
            demos/tour
            demos/wild
            tools/k-lint
            tools/tess-lint
            tools/tess-meter
            interval-transcendentals
      - name: runner and restored state
        run: |
          nproc
          du -sh target 2>/dev/null || echo 'target: absent'
          for d in demos/tour demos/wild tools/k-lint tools/tess-lint \
                   tools/tess-meter interval-transcendentals; do
            du -sh "$d/target" 2>/dev/null || echo "$d/target: absent"
          done
      - name: selftest (timed)
        run: |
          s=$(date +%s.%N); scripts/doc-gate.sh --selftest; e=$(date +%s.%N)
          printf 'MEASURED selftest %.1f s\n' "$(echo "$e - $s" | bc)"
      - name: gate (timed)
        run: |
          s=$(date +%s.%N); scripts/doc-gate.sh; e=$(date +%s.%N)
          printf 'MEASURED gate %.1f s\n' "$(echo "$e - $s" | bc)"
      - name: target sizes after the gate
        if: '!cancelled()'
        run: |
          du -sh target
          for d in demos/tour demos/wild tools/k-lint tools/tess-lint \
                   tools/tess-meter interval-transcendentals; do
            du -sh "$d/target" 2>/dev/null || echo "$d/target: absent"
          done
