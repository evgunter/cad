# Hosted FreeCAD/OCC render lane — ON DEMAND, ARTIFACT-ONLY.
#
# WHY THIS EXISTS. `demos/render.sh --freecad` is the heaviest thing the
# repo asks of a developer box: ~20 scenes, one fresh `freecadcmd`
# process each, and on a loaded host a single scene has been measured at
# 106 s (render.sh's budget note). It is also the lane this host is
# worst at — `memories/freecad-render-lane.md` records freecadcmd
# stalling AFTER writing a frame, at a random scene, which is what
# wedges a pass. A runner is a cold, unloaded box that gets thrown away
# afterwards, so it is a good place to send this.
#
# NOT A GATE, AND NOT THE COMMITTED LANE'S PRODUCER. What comes back is
# an ARTIFACT to look at, downloadable from the run page or with
#   gh run download <run-id> -n renders-freecad
# The pixels here are NOT expected to be byte-identical to
# `demos/renders-freecad/` as committed: those were drawn against this
# host's GL stack, these are drawn by llvmpipe under Xvfb, and the
# runner image's mesa drifts month to month. So this workflow never
# commits, never pushes, and never fails the build over a pixel diff —
# it just REPORTS the diff against the committed tree in the run summary
# (see the last step), which is the honest statement of what a hosted
# pass can certify today. Promoting this lane to the canonical producer
# means pinning the whole GL stack in a container image and re-baselining
# the committed cells in one commit — a design call for Evan, not a
# side effect of this file.
#
# THE FREECAD LANE ONLY, deliberately. `render.sh`'s kernel lane has a
# matplotlib fallback that exits 0 and writes the gitignored preview
# tree, so a hosted kernel run could "pass" having rendered nothing with
# FreeCAD at all. The `--freecad` lane has no fallback by design (its
# whole point is the OCC reference render), so a missing or broken
# freecadcmd is a loud non-zero exit — which is exactly what a hosted
# run needs to be trustworthy.
name: render (freecad lane)

on:
  workflow_dispatch:
    inputs:
      scene_timeout:
        description: "Per-scene wall-clock budget in seconds (FREECAD_SCENE_TIMEOUT)"
        required: false
        default: "300"
      ref:
        description: "Branch/tag/SHA to render (default: this workflow's ref)"
        required: false
        default: ""

concurrency:
  group: render-freecad-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: freecad/OCC montage
    runs-on: ubuntu-latest
    # A wedged pass is bounded by render.sh's own per-scene budget (two
    # attempts x the budget, per scene); this is the outer stop so a
    # pathological run cannot bill an hour of nothing.
    timeout-minutes: 90
    env:
      FREECAD_SCENE_TIMEOUT: ${{ github.event.inputs.scene_timeout || '300' }}
      # No GPU on a hosted runner: force the software rasterizer rather
      # than letting Coin pick up whatever partial GL the image ships.
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # ---- the scene inputs (tour) ---------------------------------
      # render.sh reads demos/out/scenes.json plus each body's STEP
      # export, so the tour has to run first. Release, like every other
      # invocation of it in this repo.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: render-freecad
          workspaces: |
            .
            demos/tour
      - name: demo tour (STL + STEP + scenes.json)
        run: cd demos/tour && cargo run --release -- ../out

      # ---- the renderer --------------------------------------------
      # AppImage 1.1.2, checksum-verified, cached extracted — byte for
      # byte the provisioning of ci.yml's `step-import` job, down to the
      # cache KEY and path, so the two rows share one cache entry: a
      # hosted render on main normally restores what a step-import run
      # already populated and downloads nothing. It is also the exact
      # version of the local oracle (memories/freecad-render-lane.md).
      # Bumping the version means bumping it in three places (there,
      # here, and the local install) — the key encodes it so a stale
      # entry can never be silently reused.
      - name: cache freecad
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: ~/freecad-appimage
          key: freecad-1.1.2-appimage-extracted
      - name: install freecad (AppImage 1.1.2, checksum-verified)
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/freecad-appimage && cd ~/freecad-appimage
          curl -sLO https://github.com/FreeCAD/FreeCAD/releases/download/1.1.2/FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
          curl -sLO https://github.com/FreeCAD/FreeCAD/releases/download/1.1.2/FreeCAD_1.1.2-Linux-x86_64-py311.AppImage-SHA256.txt
          sha256sum -c FreeCAD_1.1.2-Linux-x86_64-py311.AppImage-SHA256.txt
          chmod +x FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
          ./FreeCAD_1.1.2-Linux-x86_64-py311.AppImage --appimage-extract > /dev/null
          rm FreeCAD_1.1.2-Linux-x86_64-py311.AppImage

      # `step-import` needs none of this: it imports geometry and never
      # draws. Drawing is the difference — Coin's offscreen renderer
      # wants a GL context and a display, so this lane adds the software
      # GL stack and Xvfb. QT_QPA_PLATFORM=offscreen (set per scene by
      # render.sh) keeps Qt itself headless regardless; the display is
      # there for Coin, not for Qt.
      - name: renderer system deps (software GL + Xvfb + venv)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libglu1-mesa \
            libxrender1 libxcursor1 libxinerama1 libxft2 libfontconfig1 \
            python3-venv

      # ---- the pass -------------------------------------------------
      # render.sh builds its own pinned venv (numpy/matplotlib) on first
      # run, stages every scene, publishes only a whole pass, strips the
      # wall-clock chunks and runs the provenance guard before composing.
      # None of that is re-implemented here: this step is the same
      # command a developer runs, which is the point — a hosted pass and
      # a local one differ in the box, not in the pipeline.
      - name: render (demos/render.sh --freecad)
        run: |
          FREECADCMD="$HOME/freecad-appimage/squashfs-root/usr/bin/freecadcmd" \
            xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            demos/render.sh --freecad

      - name: upload montage + cells
        uses: actions/upload-artifact@v4
        with:
          name: renders-freecad
          path: demos/renders-freecad/**
          retention-days: 14
      # Always: a wedged or failed pass leaves the committed tree
      # untouched (render.sh's staging contract), so the logs and the
      # untracked staging tree are the only evidence of what happened.
      - name: upload logs + staging tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freecad-logs
          path: |
            demos/out/freecad-logs/**
            demos/out/stage/**
          retention-days: 14
          if-no-files-found: ignore

      # Informational, never a gate — see the header. This is the
      # measurement that says whether a hosted pass could ever BE the
      # committed lane, so it is recorded on every run rather than
      # guessed at.
      - name: pixel drift vs the committed lane (informational)
        if: always()
        run: |
          {
            echo "### FreeCAD lane — hosted vs committed"
            echo
            echo "FreeCAD 1.1.2 (AppImage) on \`${{ runner.os }}\`, llvmpipe under Xvfb."
            echo "Pixel differences against the locally-rendered committed cells are"
            echo "EXPECTED (different GL stack); this is a measurement, not a gate."
            echo
            echo '```'
            git diff --stat -- demos/renders-freecad/ || true
            echo '```'
            echo
            echo "Changed cells:"
            echo '```'
            git status --porcelain -- demos/renders-freecad/ || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
