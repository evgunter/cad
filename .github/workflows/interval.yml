name: interval lane
on:
  workflow_call:
    inputs:
      run_build:
        type: string
        required: true
      lane:
        type: string
        required: true
      cargo_scope:
        type: string
        required: true
      eps_rows:
        type: string
        required: true
      test_filter:
        type: string
        required: false
        default: ""
      run_editor_core:
        type: string
        required: true
      run_interval_backend:
        type: string
        required: true
      run_interval_oracle:
        type: string
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "probe run_build=${{ inputs.run_build }} eps=${{ inputs.eps_rows }}"
