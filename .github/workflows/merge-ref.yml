# A PR THAT CONFLICTS WITH ITS BASE GETS A RED, NOT A SILENCE. GitHub builds
# `refs/pull/N/merge` for every `pull_request` run, and while a PR conflicts
# with its base (`mergeable: false`, `mergeable_state: dirty`) there is no
# such ref, so a push creates no ci.yml run at all: no red, no `gate ok`,
# nothing to poll. A `push` run needs no merge ref, so this one job fires on
# every branch push, reads the mergeability of each open PR whose head is that
# branch, and fails the `merge ref` check on the pushed commit if any of them
# conflicts. A branch with no open PR passes at once. It is not in `gate ok`'s
# needs, and it holds a read-only token and checks nothing out.
#
# `push`, not `pull_request_target`: the latter would also fire on a PR opened
# already conflicting, but a probe of this workflow under it (PRs 7413 and
# 7417, against a scratch base holding it) produced no run at all, dirty or
# clean; GitHub's documentation says it runs only the default branch's copy.
#
# The mergeability poll is a sibling of ci.yml's `the merge this dispatch
# gates` step; a change to how either reads `mergeable` belongs in both.
name: merge ref
on:
  push:
    branches-ignore: [main]
permissions:
  pull-requests: read
  actions: read
concurrency:
  group: merge-ref-${{ github.ref }}
  cancel-in-progress: true
jobs:
  merge-ref:
    name: merge ref
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # GitHub computes mergeability lazily after a push: `mergeable` reads
      # null for a while, and can still be served from the previous head. So
      # `true` counts only once the test merge is built on this head, and
      # `false` only once it has held for 6 polls running and ci.yml has no
      # `pull_request` run for this sha (such a run means a merge ref
      # existed). Anything else after the polls, an API error included, is
      # unknown and passes: an unknown is not a conflict.
      - name: does each open PR from this branch merge with its base
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          unknown() { echo "::notice title=mergeability unknown::$1; not a conflict as far as anyone knows. If no CI run appears for this push, read the PR's mergeable_state."; }
          if ! prs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "head=$OWNER:$GITHUB_REF_NAME" --jq '.[].number')"; then
            unknown "could not list the open PRs from $GITHUB_REF_NAME"
            exit 0
          fi
          if [ -z "$prs" ]; then
            echo "no open PR has $GITHUB_REF_NAME as its head"
            exit 0
          fi
          rc=0
          for pr in $prs; do
            verdict=unknown falses=0 state=- base=-
            for _ in $(seq 15); do
              if ! info="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" \
                  --jq '[.head.sha, (.mergeable | tostring), .mergeable_state, (.merge_commit_sha // "-"), .base.ref] | join(" ")')"; then
                falses=0; sleep 5; continue
              fi
              read -r head mergeable state merge base <<<"$info"
              # The PR's head can lag the push by a moment; a later push
              # cancels this run through the concurrency group.
              if [ "$head" != "$GITHUB_SHA" ]; then
                falses=0; sleep 5; continue
              fi
              case "$mergeable" in
                true)
                  falses=0
                  if [ "$merge" != "-" ] &&
                     [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$merge" --jq '.parents[1].sha' || true)" = "$GITHUB_SHA" ]; then
                    verdict=clean; break
                  fi ;;
                false)
                  falses=$((falses + 1))
                  if [ "$falses" -ge 6 ] &&
                     runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                       -f "head_sha=$GITHUB_SHA" -f event=pull_request --jq '.total_count')"; then
                    if [ "$runs" = 0 ]; then verdict=dirty; else verdict=clean; fi
                    break
                  fi ;;
                *) falses=0 ;;
              esac
              sleep 5
            done
            case "$verdict" in
              dirty)
                echo "::error title=no merge ref: merge the PR's base branch into it::PR #$pr conflicts with its base '$base' (mergeable_state: $state), so GitHub has no merge ref for $GITHUB_SHA and CI created NO run for this push: no gate ok will appear. A push with no run is a conflict with the PR's own base, not a queue. Merge origin/$base into the branch and push."
                rc=1 ;;
              clean) echo "PR #$pr merges with '$base' at $GITHUB_SHA (mergeable_state: $state)" ;;
              *) unknown "PR #$pr's mergeability at $GITHUB_SHA was not settled after 75 s" ;;
            esac
          done
          exit "$rc"
