# A PR THAT CONFLICTS WITH ITS BASE GETS A RED, NOT A SILENCE. GitHub builds
# `refs/pull/N/merge` for every `pull_request` run, and while a PR conflicts
# with its base (`mergeable: false`, `mergeable_state: dirty`) there is no
# such ref, so a push creates no ci.yml run at all: no red, no `gate ok`,
# nothing to poll. A `push` run needs no merge ref, so this one job fires on
# every branch push, reads the mergeability of each open PR whose head is that
# branch, and fails the `merge ref` check on the pushed commit if any of them
# conflicts. A branch with no open PR passes at once. It is not in `gate ok`'s
# needs, and it holds a read-only token and checks nothing out.
#
# `push`, not `pull_request_target`: the latter would also fire on a PR that
# is opened already conflicting, but GitHub blocks it by default in public
# repositories from 2026-12-02 and runs it only from the default branch.
name: merge ref
on:
  push:
    branches-ignore: [main]
permissions:
  pull-requests: read
concurrency:
  group: merge-ref-${{ github.ref }}
  cancel-in-progress: true
jobs:
  merge-ref:
    name: merge ref
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # GitHub computes mergeability lazily after a push, so `mergeable` reads
      # null for a while. `true` counts only once the test merge is built on
      # this head; `false` is a conflict at this head. Still unknown after a
      # minute passes, since an unknown is not a conflict.
      - name: does each open PR from this branch merge with its base
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$OWNER:$GITHUB_REF_NAME" --jq '.[].number')"
          if [ -z "$prs" ]; then
            echo "no open PR has $GITHUB_REF_NAME as its head"
            exit 0
          fi
          rc=0
          for pr in $prs; do
            verdict=unknown
            for _ in $(seq 12); do
              info="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" \
                --jq '[.head.sha, (.mergeable | tostring), .mergeable_state, (.merge_commit_sha // "-"), .base.ref] | join(" ")')"
              read -r head mergeable state merge base <<<"$info"
              # The PR's head can lag the push by a moment; a later push
              # cancels this run through the concurrency group.
              if [ "$head" != "$GITHUB_SHA" ]; then
                sleep 5
                continue
              fi
              case "$mergeable" in
                false) verdict=dirty; break ;;
                true)
                  if [ "$merge" != "-" ] &&
                     [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$merge" --jq '.parents[1].sha')" = "$GITHUB_SHA" ]; then
                    verdict=clean; break
                  fi ;;
              esac
              sleep 5
            done
            case "$verdict" in
              dirty)
                echo "::error title=no merge ref: merge the PR's base branch into it::PR #$pr conflicts with its base '$base' (mergeable_state: $state), so GitHub has no merge ref for $GITHUB_SHA and CI created NO run for this push: no gate ok will appear. A push with no run is a conflict with the PR's own base, not a queue. Merge origin/$base into the branch and push."
                rc=1 ;;
              clean) echo "PR #$pr merges cleanly with '$base' at $GITHUB_SHA (mergeable_state: $state)" ;;
              *) echo "::notice title=mergeability unknown::GitHub had not computed PR #$pr's mergeability at $GITHUB_SHA after a minute; not a conflict as far as anyone knows. If no CI run appears for this push, read mergeable_state." ;;
            esac
          done
          exit "$rc"
