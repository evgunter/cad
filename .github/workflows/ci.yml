name: CI

on:
  # `ready_for_review` IS LOAD-BEARING and is not in the default set —
  # which is `[opened, synchronize, reopened]`, so naming any type at all
  # means naming those three back. The draft skip (see the `filter` job)
  # zeroes the RUN_* flags while a PR is a draft, and undrafting a PR
  # pushes no commit: without this type a draft marked ready would carry
  # the skipped run as its only run, and every gate would report green
  # having executed nothing. With it, undrafting triggers a full run on
  # the same head. A draft skip WITHOUT this line is not a saving, it is
  # a hole.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # RUNNING THE GATE AT A CONFIGURATION YOU CHOOSE (2026-08-28, Evan's ask).
  #
  # The `filter` job draws ONE point of {lane} x {eps} x {k-lint row} per run
  # and lets repetition cover the rest — scripts/ci-filter.py's CONFIGURATION
  # SAMPLING note is the argument, and billed minutes are what it buys. The
  # draw is a DEFAULT, not a lock, and this is the entry point that says so:
  # pick the lane, the tolerance row, the k-lint row, or leave any of them on
  # `sample` and let the SHA decide as usual.
  #
  # THE OTHER SPELLING IS A COMMIT TRAILER — `CI-Config: eps=1e-12` in the
  # head commit's message — and it is read on ORDINARY pull_request runs by
  # the same `filter` job. The two are not redundant. A dispatch's checks
  # belong to the run and never appear on a pull request's head commit, so it
  # cannot be the thing a reviewer looks at before merging; and a trailer
  # cannot re-gate a commit already written, which is the whole of "that
  # landed, now run it at 1e-12" in a repository that does not rewrite
  # history. ci-filter.py's REQUESTING A POINT section carries the full
  # argument and the precedence rule (invocation > trailer > draw, per
  # dimension).
  #
  # THE TRAILER IS READ OFF THE HEAD COMMIT AND ONLY THAT ONE, so a request
  # lasts exactly one push: the next commit — a merge of main into the branch
  # included — is sampled again unless it carries the trailer too. That is
  # the deliberate reading. A request that persisted over a branch would gate
  # commits nobody wrote it for, and the run that did so would look like any
  # other; asking again is one line, and the step below prints which of the
  # three dimensions was asked for on every run.
  #
  # WHAT IT COSTS, said plainly because nothing else here rate-limits it: a
  # dispatch bills what a code-tier PR run bills (~40 minutes on
  # docs/CI-MINUTES-2026-08.md's arithmetic) and buys a SECOND gate over a
  # tree, since the ordinary run already happened. Naming `lane: both` or
  # `klint: all` puts back rows the sampling removed and costs
  # correspondingly more. The render lanes are the one thing a dispatch does
  # NOT run — they read no sampled dimension, they re-baseline against a
  # branch, and render.yml has its own dispatch for when new frames are what
  # you want.
  workflow_dispatch:
    inputs:
      lane:
        description: "Compile mode to gate (`sample` draws it from the SHA, as an ordinary run does)"
        required: false
        type: choice
        default: sample
        options: [sample, default, interval, both]
      # NO `all` ROW, deliberately: `EPS=all` is the LOCAL half's word for
      # "loop the rows", while the hosted rows put the value straight into
      # CAD_TOLERANCE_EPS, where `all` is a parse error by design. ci-filter.py
      # refuses it for the same reason and names the legal values when it does.
      eps:
        description: "Tolerance row to gate (CAD_TOLERANCE_EPS; `default` leaves it unset)"
        required: false
        type: choice
        default: sample
        options: [sample, default, "1e-6", "1e-12"]
      klint:
        description: "Which `k-lint (gate)` feature unification to gate (`all` runs all five)"
        required: false
        type: choice
        default: sample
        options: [sample, dev-default, release-default, release-budget, dev-budget, dev-probe, all]
      # `changed` is the ordinary case and reproduces what the PR run saw: a
      # dispatch has no merge ref, so it diffs against the default branch,
      # which is the same three-dot base a pull_request run would have used.
      #
      # `all` is for the dispatch aimed at the default branch itself — the
      # tree that landed, whose diff against that branch is empty. It takes NO
      # diff, so the path-keyed signals have nothing to read and fail CLOSED:
      # the oracle tier runs, and `lane: sample` reads as `interval` because
      # nothing can prove the interval sources held still. Name a lane if you
      # want the other one.
      #
      # SPELLED OUT BECAUSE IT SURPRISES PEOPLE: `scope: all` with `lane:
      # sample` does NOT draw a lane. It takes no diff, so `_forces_interval`
      # hits its fail-closed empty-file-list arm and PINS `LANE=interval`
      # ahead of the seed — the run reports `lane:pinned` and says so, but a
      # dispatch aimed at "run everything" and left on `sample` gates the
      # interval lane every time, not one drawn point. Name `lane: default`
      # if that is what you wanted.
      scope:
        description: "Classify the change set against the default branch, or run everything unscoped (with lane: sample this pins the interval lane — see the note in the file)"
        required: false
        type: choice
        default: changed
        options: [changed, all]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# THE PUSH RUN CARRIES ONLY WHAT IS UNIQUE TO IT (2026-08-20, Evan's
# authorisation; measured in docs/CI-MINUTES-2026-08.md, finding F3).
#
# A merge ran the whole gate a SECOND time: ~87 billed minutes on the
# pull_request, then ~87 again on the push to main. The PR run tests
# the MERGE-REF — main plus the branch — so with this repo's merge-only
# rule the tree the push run re-tested was, in the ordinary case, the
# tree the PR run had already tested.
#
# Auditing what a push run alone could do turned up exactly TWO things,
# and both are WRITE SIDE-EFFECTS rather than gates:
#
#   * `rebuild-latency`'s "commit measurement to the timing history
#     (main only)" step, appending to docs/perf-data/rebuild-latency/;
#   * `renders`' `push_to`, which re-baselines the render cells.
#
# Neither can move onto the PR side, and the PUSH_TO note on the
# `renders` job records the measurement that says why: a GITHUB_TOKEN
# bot commit onto a PR branch becomes that PR's head, triggers no run
# of its own, and strands every green check on the parent commit.
#
# So every OTHER job is gated below, and a push to main now runs
# `filter` + `rebuild-latency` + `renders`.
# `cleanup-archives` is deliberately NOT gated: its `needs` (test,
# test-interval) skip on a push, which skips it too — one mechanism
# rather than two saying the same thing.
#
# THE CONDITION IS SPELLED `!= 'push'`, NOT `== 'pull_request'` (2026-08-28,
# with the configuration dispatch at the top of this file). What this rule is
# about is the SECOND run of a tree the PR run already tested; every other
# event is a person asking for the gate, and under `== 'pull_request'` that
# ask would have been answered by a run of `filter` and nothing else — a
# page of skipped jobs under a green tick, which is the reading this file's
# RUN_VIEWER_TOOLKIT note calls the failure mode to avoid. Written this way, a trigger added
# here runs the gate by default and has to be excluded deliberately, which is
# the direction that fails safe. `renders` is the one such exclusion and
# carries its reason at its own key.
#
# WHAT THIS GIVES UP, AND WHY NOTHING PAIRS WITH IT. The commit that
# actually lands on main is now never itself built or tested. When main
# moves between a PR's last run and its merge — frequent here — that
# exact combination went untested, and a semantic conflict between two
# independently-green PRs surfaces at the NEXT PR's merge-ref rather
# than at the merge that caused it.
#
# A scheduled full run on main was the obvious pairing and Evan DECLINED
# it (2026-08-22): the next PR's merge-ref is main plus that branch, so
# it tests the landed tree anyway — a scheduled run buys a second
# discovery of the same fact, at the price of a full gate per period
# whether or not anything landed.
#
# THE COST THAT REMAINS, stated rather than mitigated: the conflict
# surfaces on an INNOCENT PR. Whoever opens the next PR gets the red,
# and the tree they broke is not the tree they wrote — so read a
# failure that has nothing to do with your diff as a landed conflict,
# and look at what merged since your branch point. Anything that must
# fail-fast on the landed tree belongs on the PR side of this line, not
# restored to the push side.

# BUILD ONCE PER COMPILE MODE (2026-08-03, Evan's ask: "compile the code
# for each mode, then shard the tests"). The eps test rows run
# BIT-IDENTICAL binaries — CAD_TOLERANCE_EPS is read at RUNTIME
# (geom-core/src/tolerance.rs), never at compile time — so compiling the
# workspace once per eps row was pure redundancy (measured ~8.5-9.5 min of
# each row's ~12 min was compile; execution is ~3 min). Only the
# `interval` feature is a different build graph. So: two BUILD jobs
# (`build`, `build-interval`), each `cargo nextest archive` + artifact
# upload, and thin RUN jobs that download the archive and only execute.
#
# cargo-nextest is the archive/run vehicle, PINNED here (single source of
# truth for the version): 0.9.140, published 2026-07-05 — ~4 weeks old at
# adoption (2026-08-03), past the 2-week dependency-age rule; a dev/CI
# tool only, never in any shipped build graph. Install is the official
# get.nexte.st prebuilt at the pinned URL — no third-party action — via
# the in-repo composite `.github/actions/install-nextest`, which caches
# the binary by version and retries the cold-path fetch. Read that
# action's header for why: ~10 jobs per run need this binary, and an
# unretried per-job fetch made one host's bad minute a whole-gate
# failure.
# Nextest semantics vs `cargo test`, audited at adoption:
#   * process-per-test — strictly safer for the tolerance OnceLock
#     (every test gets a fresh global; nothing relied on shared init);
#   * per-test output capture — only affects log layout;
#   * DOC-TESTS DO NOT RUN under nextest — the workspace has real
#     doctests (incl. compile_fail blocks only the doctest runner
#     exercises), so each build job keeps a `cargo test --doc` step.
#
# LINK/DEBUGINFO KNOBS ON THE TWO BUILD JOBS (2026-08-04, from the
# Bazel-verdict measurement; Evan approved items 2/3/4 of its ranked
# alternatives). The verdict was NO to Bazel, on this evidence from run
# 30884593286: the `rebuild latency` job compiles all 10 workspace libs
# from scratch plus ONE test binary in 20.16 s, while `build + archive`
# compiles the same libs plus 261 binaries in 8 m 34 s (514 s). So ~494 s
# (96%) of the build job is the 261 test-binary codegen+link actions,
# ~1.9 s each. Bazel caches actions; it does not make them cheaper, and
# the reverse-dep funnel (touching geom-core invalidates 249/249 test
# binaries; 6 of the last 16 crate-touching merges did exactly that)
# means the cache would miss anyway. So: attack the per-binary cost.
#
#   RUSTFLAGS=-C link-arg=-fuse-ld=mold   RETIRED 2026-08-12 — see the
#     LINKER note directly below. It was correct for 261 links and is not
#     correct for 14.
#   CARGO_PROFILE_{DEV,TEST}_DEBUG=line-tables-only   CI was emitting
#     full DWARF across 261 binaries and then throwing it away at link
#     (CARGO_PROFILE_TEST_STRIP=debuginfo, kept below for the 500 MB
#     artifact quota). Stripping already forfeited line numbers, so this
#     loses nothing CI had; function names in backtraces survive.
#
#   MEASURED, PR #174 (all timings tier `all`, same 261-binary archive;
#   PR #177 then collapsed 251 of those 263 binaries into 12 aggregators —
#   see any crates/*/tests/all.rs header for the pattern — so the
#   per-binary constant now multiplies one aggregated target per crate
#   rather than 263. The count itself is NOT restated here:
#   `scripts/gates/test-aggregation.sh` derives it from `cargo metadata`
#   on every merge and prints it, and a number copied out beside a claim
#   is a second, unchecked copy of something the tooling already knows):
#     default build compile step   514 s -> 389 s  (-24%)
#     interval build compile step  618 s -> 495 s  (-20%)
#   The runner is 2 vCPU / 7 GB (`nproc` from the provenance step below —
#   standard GitHub-hosted for a private repo; the Bazel report's "4 vCPU"
#   was wrong). That is why 261 independent link/codegen units are so
#   expensive here, and why item 1 (collapsing 249 test crates into ~12)
#   is still the big one.
#
# LINKER — mold RETIRED 2026-08-12. #174 adopted it on a -24%/-20% result
# measured across 261 static links; that is the whole basis for it, and
# the basis is gone. #179 and #387 took this workspace to ONE test target
# per crate — `scripts/gates/test-aggregation.sh` enforces that invariant
# and prints the resulting total; it does not assert a particular number,
# so no number is copied here — and the per-binary link constant mold
# attacks now multiplies that handful, not 261. Two independent readings
# say it no longer pays:
#   * LOCAL, measured 2026-08-11 at today's target count:
#     189 s baseline vs 186 s with mold — noise. That measurement is
#     written up in docs/LOCAL-BUILD-PERF.md, which reverted mold locally
#     and said in as many words: "Revisit only if the test-target count
#     grows back toward triple digits."
#   * The install is not free and sits ON the critical path: `apt-get
#     install mold` measured 9-21 s per build job over 11 runs, against a
#     link cost it can now only shave a fraction of.
# Opt-level 2 (see the OPT LEVEL note on the build job) pushes this
# further the same way: it makes compile the dominant term and shrinks
# link's share again.
# HOW TO PUT IT BACK, if the archive step regresses: restore
# `RUSTFLAGS: "-C link-arg=-fuse-ld=mold"` to both build jobs' env plus
# their `install mold` step. Do it on a measurement, not a hunch — and
# note that a single run cannot settle it, because any env change here
# rotates the rust-cache key and buys one cold rebuild.
#
#   BUILD_RUNNER   repo variable, unset today ⇒ `ubuntu-latest`. Item 4
#     of the ranked list (8-vCPU runner) is NOT LANDABLE on this repo:
#     GitHub-hosted larger runners require an ORGANIZATION on Team or
#     Enterprise Cloud, and evgunter/cad is a User-owned private repo
#     (`gh api repos/evgunter/cad --jq .owner.type` ⇒ "User"). Hard-coding
#     a larger-runner label would fail the build job with "no runner
#     matching labels" and take the whole gate — and the two build jobs
#     are the gate's critical path. The variable makes it a one-setting
#     flip if the repo ever moves under an org. Note also that larger-
#     runner minutes are billed SEPARATELY from the included-minutes
#     allowance this repo's change filter exists to protect.
#
# NOT MIRRORED into local-scripts/ci-local.sh, deliberately: these are hosted-
# runner performance knobs, not gate semantics. No job is added, removed
# or re-scoped, the same targets are compiled and the same tests run, so
# the local gate stays byte-for-byte equivalent in what it PROVES. The
# mirror convention covers the matrix, not the runner's linker.
env:
  # sccache pin for the EXPERIMENT wired into the two build jobs below.
  # LIVE — disable by setting the repo variable SCCACHE to "0". See
  # .github/actions/install-sccache and docs/CI-MINUTES-2026-08.md F4.
  # 0.16.0 is the version local-scripts/gate.sh already runs on the
  # local gate box, so the trial and the local lane agree.
  SCCACHE_VERSION: "0.16.0"
  NEXTEST_VERSION: "0.9.140"
  # maturin rides the same pattern as nextest: pinned here (single source
  # of truth), installed from the official GitHub-release prebuilt at the
  # pinned URL — no third-party action. 1.14.1 (released 2026-06-19) is
  # the exact binary the U9S/DOORS/U10 wheels were built and validated
  # with locally; ~7 weeks old at adoption (2026-08-09), well past the
  # 2-week dependency-age rule. A dev/CI tool only — it never enters any
  # shipped build graph (the wheel's compiled code is cargo's output).
  MATURIN_VERSION: "1.14.1"
  # `ty`, the static stub checker (LIB-PYG1). 0.0.39 was published
  # 2026-05-22, so it clears the >=2-week dependency age policy by
  # weeks.
  TY_VERSION: "0.0.39"
  # ruff, the Python linter (see ruff.toml and scripts/check-python-lint.py).
  # Same pattern as nextest/maturin: pinned here as the single source of
  # truth, installed from the official GitHub-release prebuilt at the
  # pinned URL — no third-party action. 0.16.1 was published 2026-07-30,
  # so it is ~3 weeks old at adoption (2026-08-22) and clears the ~2-week
  # dependency-age rule (memories/review-and-dependency-policy.md) with
  # margin; 0.16.4 (2026-08-20) would not. CI-only tooling — ruff never
  # enters any shipped build graph, which is the class that rule is
  # lenient about. THE LOCAL HALF READS THIS PIN: check-python-lint.py
  # parses this line out of this file, so a developer's ruff that differs
  # from CI's is reported rather than trusted.
  RUFF_VERSION: "0.16.1"

# The toolchain (channel + rustfmt/clippy components) comes from
# rust-toolchain.toml: the dtolnay step only bootstraps/updates rustup, and
# rustup's toolchain-file override then auto-installs the pinned 1.97.0 with
# its components on the first cargo invocation. The pinned compiler (D9 / L2)
# has a single source of truth — the toolchain file.
#
# KEEP IN SYNC with local-scripts/ci-local.sh (the local mirror of this matrix,
# the merge gate whenever hosted Actions is unavailable): a job added,
# removed, or changed here gets the same change there, and vice versa.
# There is no structural enforcement — this pair of cross-references is it.
# The one thing that is NOT mirrored by hand is the change filter: both
# files call scripts/ci-filter.py and act on its output, so the tiering and
# the dependent closure have a single implementation and cannot drift.

jobs:
  # Change filter (added 2026-07-29, Evan's ask after the Actions-budget
  # exhaustion; made dependency-aware 2026-07-28). THREE tiers, and all of
  # the logic lives in scripts/ci-filter.py — this job is a thin wrapper
  # that wires that script's KEY=value output onto the `if:` conditions and
  # cargo arguments below. local-scripts/ci-local.sh calls the SAME script with
  # the same semantics, so the hosted and local gates cannot drift and one
  # set of tests covers both.
  #
  #   docs     only *.md / memories/ — nothing builds; the `docs-only ok`
  #            marker job is the whole gate (floor convention: floors apply
  #            to CODE PRs).
  #   all      a workspace-level file moved (root Cargo.toml, Cargo.lock,
  #            rust-toolchain.toml, .cargo/, .github/, scripts/, the
  #            excluded workspaces demos/ tools/ interval-transcendentals/,
  #            docs/k-report-data/, ANY member Cargo.toml, or anything the
  #            allowlist does not recognise) — everything runs, unscoped.
  #   closure  only crate sources moved — the changed members plus every
  #            member that transitively depends on them (dev-dependencies
  #            included) are built, and the pipeline rows run iff their root
  #            package is in that closure.
  #
  # Fails CLOSED: any classification error or unrecognised path yields
  # tier `all`. No third-party action here on purpose — checkout plus the
  # runner's preinstalled rustup is the whole toolbox, so the gate that
  # decides what runs has the smallest possible supply chain.
  filter:
    name: change filter
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.classify.outputs.TIER }}
      pkgs: ${{ steps.classify.outputs.PKGS }}
      cargo_scope: ${{ steps.classify.outputs.CARGO_SCOPE }}
      run_build: ${{ steps.classify.outputs.RUN_BUILD }}
      run_editor_core: ${{ steps.classify.outputs.RUN_EDITOR_CORE }}
      run_stl: ${{ steps.classify.outputs.RUN_STL }}
      run_step_export: ${{ steps.classify.outputs.RUN_STEP_EXPORT }}
      run_pncad_py: ${{ steps.classify.outputs.RUN_PNCAD_PY }}
      run_interval_backend: ${{ steps.classify.outputs.RUN_INTERVAL_BACKEND }}
      run_interval_oracle: ${{ steps.classify.outputs.RUN_INTERVAL_ORACLE }}
      run_topo_release: ${{ steps.classify.outputs.RUN_TOPO_RELEASE }}
      run_k_lint: ${{ steps.classify.outputs.RUN_K_LINT }}
      # The sampled matrix point (scripts/ci-filter.py, CONFIGURATION
      # SAMPLING) — or the REQUESTED one: a dispatch input or a `CI-Config:`
      # trailer in the head commit replaces a drawn value here, and
      # `config_source` below says which of the three that happened to.
      # Every compile-mode job reads `lane`; the two archive-run matrices
      # read `eps`.
      lane: ${{ steps.classify.outputs.LANE }}
      eps: ${{ steps.classify.outputs.EPS }}
      # The third sampled dimension (2026-08-22): which of `k-lint (gate)`'s
      # five feature unifications this run gates. Only that job reads it.
      klint_row: ${{ steps.classify.outputs.KLINT_ROW }}
      # The members whose OWN files changed, as opposed to `pkgs` (the
      # dependent closure they generate). Published because the viewer
      # toolkit axis below is keyed on it: a reader who sees that axis
      # false can see the seed list it was decided from, in the same
      # output, without re-deriving it.
      seeds: ${{ steps.classify.outputs.SEEDS }}
      # Whether this run compiles the GUI toolkit graph (eframe + wgpu +
      # naga + winit). SEED-keyed per Evan's viewer-CI-posture ruling
      # (docs/GUI-LOG.md, 2026-08-27) — the argument is at
      # `RUN_VIEWER_TOOLKIT` in scripts/ci-filter.py.
      run_viewer_toolkit: ${{ steps.classify.outputs.RUN_VIEWER_TOOLKIT }}
      # WHERE THE THREE SAMPLED VALUES ABOVE CAME FROM — `sampled` for each
      # dimension the SHA drew, `pinned` for a lane `_forces_interval`
      # substituted ahead of the draw, `requested` for one a dispatch input
      # named, `commit-trailer` for one the head commit's `CI-Config:` line
      # named. No job reads it; it is published so that "which configuration
      # gated this run, and did anyone choose it" is answerable from the run's
      # outputs rather than from a log line, and it is printed in a step of its
      # own.
      config_source: ${{ steps.classify.outputs.CONFIG_SOURCE }}
      # WHETHER THIS RUN'S DIFF TOUCHES INTERVAL-NAMED FILES WHILE GATING THE
      # DEFAULT LANE (#1122's advisory, which replaced the basename pin). No
      # job reads it either, and it is published for the identical reason
      # `config_source` above is: the question it answers — "was this change
      # possibly about the axis this run did not gate?" — has to be answerable
      # from the run's OUTPUTS, not from a line in one job's log that a reader
      # has to know to go looking for.
      lane_advisory: ${{ steps.classify.outputs.LANE_ADVISORY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - name: classify the change set
        id: classify
        # RUSTUP_TOOLCHAIN=stable keeps this job off the pinned 1.97.0
        # download: the script only runs `cargo metadata --no-deps`, which
        # parses the workspace manifests and neither builds nor resolves the
        # registry, so the compiler version is irrelevant — and if a future
        # manifest ever did need the pinned toolchain to parse, the failure
        # path is tier `all`, not a wrong answer.
        env:
          RUSTUP_TOOLCHAIN: stable
          SEED: ${{ github.event.pull_request.head.sha || github.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          # The dispatch inputs (empty on every other event). `sample` is the
          # dispatch's own spelling of "draw it", and the empty string is what
          # a pull_request or push run sees; both mean NO request, and the
          # loop below drops them rather than passing them on. Nothing here
          # validates a value: the legal sets belong to ci-filter.py, so an
          # input this file gets wrong is a red step naming the values it
          # would have accepted, never a run that quietly samples instead.
          IN_LANE: ${{ inputs.lane }}
          IN_EPS: ${{ inputs.eps }}
          IN_KLINT: ${{ inputs.klint }}
          IN_SCOPE: ${{ inputs.scope }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Always diff against the checkout's own first parent. On
          # pull_request the checkout is the test-merge commit, so HEAD^1
          # is by construction the exact base state the merge was built
          # against; the event payload's base.sha can be newer than that
          # (base moved between payload snapshot and merge-ref
          # construction), and the skew window's commits then appear as
          # phantom changed files that defeat the docs/closure tiers.
          #
          # A DISPATCH HAS NEITHER — no merge ref, and no base in its payload.
          # Its HEAD^1 is the previous commit ON THE BRANCH, so classifying
          # against it would scope the run to the last commit and skip the
          # rest of the branch. It diffs against the default branch instead:
          # three-dot, so git takes the merge base, which is the same tree a
          # pull_request run would have been built against. On the default
          # branch itself that comes back empty, which is what `scope: all` is
          # for and why it says so at the input.
          if [ "$IN_SCOPE" = all ]; then
            FILTER=(--force-all)
            echo "base: none — scope=all takes no diff, so everything runs unscoped"
          else
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              BASE="origin/$DEFAULT_BRANCH"
              git rev-parse --verify "$BASE" >/dev/null 2>&1 || BASE="$(git rev-parse HEAD)"
            else
              BASE="$(git rev-parse HEAD^1 2>/dev/null || git rev-parse HEAD)"
            fi
            FILTER=(--base "$BASE")
            echo "base: $BASE"
            echo "changed files:"
            git diff --name-only "$BASE"...HEAD || true
          fi
          # THE CONFIGURATION REQUEST, in its two spellings. Both are optional,
          # both are per-dimension, and the invocation wins over the trailer —
          # ci-filter.py's REQUESTING A POINT section is the argument for all
          # of that. The trailer is read off the PR's HEAD commit rather than
          # off the merge ref this job is checked out at: the merge commit's
          # message is written by GitHub, and what was asked for is what the
          # author wrote.
          CONFIG=()
          for pair in "lane=$IN_LANE" "eps=$IN_EPS" "klint=$IN_KLINT"; do
            case "$pair" in *=|*=sample) continue ;; esac
            CONFIG+=(--config "$pair")
          done
          git log -1 --format=%B "$SEED" > commit-message.txt
          echo "classification:"
          # THE SAMPLING SEED IS THE PR'S HEAD SHA, not the merge-ref HEAD
          # this job is checked out at. The merge ref changes whenever main
          # moves, so seeding on it would re-draw the matrix point under a
          # branch that did not change — losing the "a re-run of the same
          # commit picks the same point" property that is the whole reason
          # the draw is seeded rather than random. `github.sha` is the
          # fallback for the push trigger, which runs no sampled job today.
          scripts/ci-filter.py "${FILTER[@]}" --seed "$SEED" \
            --config-from-message commit-message.txt "${CONFIG[@]}" \
            --notices filter-notices.txt > filter.out
          # DRAFT PRs SKIP THE GATE (2026-08-22, Evan's ask; F5 of the
          # minutes audit, which called it "the largest single lever
          # available" and left it as a policy decision).
          #
          # Expressed by zeroing the RUN_* flags rather than by an `if:` on
          # twenty jobs: every job in this workflow except `docs-only` and
          # `mirror` already gates on one of these outputs, so one rewrite
          # here reaches all of them and cannot drift as jobs are added.
          # `docs-only` deliberately still runs — it is the marker check,
          # and a draft whose only check never reports cannot be read as
          # "not yet gated" by anything looking at the PR.
          #
          # TIER and CARGO_SCOPE are deliberately NOT zeroed: they are
          # descriptive, they are printed below, and no job acts on them
          # without also gating on a RUN_* flag. THAT COMBINATION IS THE TRAP
          # (#1204): a draft run ends green with `TIER=closure`,
          # `CARGO_SCOPE=-p geom-core …` and `LANE=interval` all truthful and
          # every RUN_* flag false, so it is indistinguishable at a glance from
          # a run that gated the closure — three consecutive greens on a
          # 19-kernel-file branch gated nothing, and two experienced readers
          # misread the same run in opposite directions. Zeroing stays (drafts
          # SHOULD be cheap); the silence does not, which is what the
          # `is this run gating anything?` step below exists for.
          #
          # THE ESCAPE IS `ready_for_review`, and it is a listed trigger on this
          # workflow for exactly this reason: marking a draft ready pushes no
          # commit, so without that type the skipped run would stand as the
          # branch's only run and every gate would report green having executed
          # nothing. Undrafting therefore re-runs the full gate on the SAME
          # head — nothing has to be re-pushed to get a real verdict.
          if [ "$DRAFT" = "true" ]; then
            echo "draft PR: zeroing every RUN_* flag (the gate runs on ready-for-review)"
            sed -i 's/^\(RUN_[A-Z_]*\)=true$/\1=false/' filter.out
          fi
          # THE PIPELINE'S VERDICT IS TEE'S, AND THAT IS THE #1204 CLASS FORTY
          # LINES ABOVE ITS OWN WARNING. `cat filter.out | tee -a
          # "$GITHUB_OUTPUT"` reports tee's status: a filter.out that is missing
          # or unreadable publishes an EMPTY output set, and every RUN_* flag
          # then reads as false — a green run with every gated job skipped,
          # which is exactly the state the comment above says two experienced
          # readers misread in opposite directions. These steps run under
          # `bash -e {0}` without `pipefail`, so nothing else here would catch
          # it. `PIPESTATUS[0]` is `cat`'s own status and no shell option can
          # change it; it is read on the line after the pipeline, before
          # anything can overwrite it.
          cat filter.out | tee -a "$GITHUB_OUTPUT"
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "ERROR: filter.out could not be read — the classification was NOT published, so every RUN_* flag would be empty and every gated job would skip. This run gates nothing; failing loudly rather than reporting green."
            exit 1
          fi

      # RECORDED, NEVER SILENT — the same rule RUN_VIEWER_TOOLKIT is held to,
      # and it bites harder here. A skipped row at least leaves a skipped job
      # on the page; a run at a REQUESTED point looks identical to a run at
      # the drawn one, and the property the sampling was built on — "which
      # configuration gated this commit is recoverable from the SHA" — is
      # exactly what a request suspends. So the run says so itself, in a step
      # with no `if:`, rather than leaving it to be reconstructed from a
      # dispatch's inputs.
      - name: the configuration this run gates
        env:
          LANE: ${{ steps.classify.outputs.LANE }}
          EPS: ${{ steps.classify.outputs.EPS }}
          KLINT_ROW: ${{ steps.classify.outputs.KLINT_ROW }}
          CONFIG_SOURCE: ${{ steps.classify.outputs.CONFIG_SOURCE }}
        run: |
          printf 'lane=%s eps=%s klint_row=%s\n' "$LANE" "$EPS" "$KLINT_ROW"
          printf 'source: %s\n' "$CONFIG_SOURCE"
          case "$CONFIG_SOURCE" in
            *requested*|*commit-trailer*)
              echo "ASKED FOR, NOT DRAWN: at least one dimension above was chosen by hand" \
                   "(a workflow_dispatch input, or a CI-Config: trailer in the head commit)."
              echo "This run therefore does NOT gate the point this SHA samples; a re-run" \
                   "of the same commit without the request will pick that one instead."
              ;;
          esac
          # THE FILTER'S OWN NOTICES, WHERE A READER OF THE RUN IS ALREADY
          # LOOKING — either pin's reason (the interval lane's, or the k-lint
          # row's `tools/` pin), or the interval advisory that replaced the
          # basename pin (#1122). ci-filter.py prints them on
          # stderr inside `classify the change set`, which lands under the
          # changed-file list and is not where anyone asking "what gated this?"
          # looks; `--notices` is the same text in a file, RELAYED VERBATIM
          # here rather than restated.
          #
          # RELAYED, NOT RESTATED, because the restatement is what went wrong.
          # This step used to carry its own prose for both notices, and both
          # copies drifted from the script's: one asserted that a pin's reason
          # names a file, which the fail-closed arm cannot, and the other said
          # "DEFAULT LANE DRAWN" over a lane that a CI-Config trailer had
          # REQUESTED. The script can see those values and this step cannot, so
          # the wording belongs there and only there.
          if [ -s filter-notices.txt ]; then
            cat filter-notices.txt
          fi

      # DOES THIS RUN GATE ANYTHING AT ALL (#1204). A draft run zeroes every
      # RUN_* flag above and still ends GREEN, with TIER, CARGO_SCOPE and LANE
      # left truthful — a green that means "nothing ran" wearing the clothes of
      # a green that means "the closure passed". A reviewer approving
      # "conditional on green" against such a run is approving against nothing.
      #
      # SAME SHAPE AS THE STEP ABOVE and for the same reason: no `if:`, so the
      # line is in every run's log whichever way it went, and the reader never
      # has to know the question was worth asking.
      #
      # ONE CAUSE, DERIVED FROM THE ACTUAL PRODUCER. `RUN_BUILD=false` has
      # exactly three possible producers and they compose, so the first shape
      # of this step got them wrong in both directions: a draft PR whose head
      # carried a `CI-Config:` trailer was told its TIER classified the change
      # as non-triggering (the DRAFT zeroing had done it, and `DRAFT` sat in
      # this step's env unread), and a docs-tier run with a request printed
      # "GATE SKIPPED" and "gate active" in the same breath. So the branches
      # below are ordered the way the producers are APPLIED — draft zeroing,
      # then the tier, then the combination the filter cannot emit — and each
      # one is entered only after the ones before it are excluded. A request
      # is never a cause; it is appended as a CONSEQUENCE, below whichever
      # cause fired, because a request chooses WHICH point runs and never
      # WHETHER anything runs (#1051's second note: a dispatch naming
      # `lane: interval eps: 1e-12` at a docs-only diff hands back a green run
      # that ran no test, and `scope: all` is the input that answers it).
      - name: is this run gating anything?
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          TIER: ${{ steps.classify.outputs.TIER }}
          RUN_BUILD: ${{ steps.classify.outputs.RUN_BUILD }}
          CONFIG_SOURCE: ${{ steps.classify.outputs.CONFIG_SOURCE }}
        run: |
          requested=no
          case "$CONFIG_SOURCE" in *requested*|*commit-trailer*) requested=yes ;; esac

          if [ "$RUN_BUILD" = "true" ]; then
            echo "gate active: tier=$TIER run_build=true."
            exit 0
          fi

          # RUN_BUILD=false: nothing below this job compiles, tests or lints.
          # Name the producer, and only the producer.
          rc=0
          if [ "$DRAFT" = "true" ]; then
            echo "GATE SKIPPED: draft PR — no RUN_* flags set."
            echo "This run will report SUCCESS, and that success is about nothing: tier=$TIER" \
                 "and the lane/eps/klint above are the classification this change WOULD have" \
                 "had. The draft zeroing is what emptied the flags, not the tier."
            echo "To gate it, mark the PR ready for review — 'ready_for_review' is a listed" \
                 "trigger on this workflow, so undrafting re-runs the full gate on this same" \
                 "head with no push."
          elif [ "$TIER" = "docs" ]; then
            echo "GATE SKIPPED: tier=docs — every changed path is non-triggering (prose," \
                 "memories/, local-scripts/, .claude/), so no build, test or lint row runs."
            echo "That is the intended state for a documentation change, and the 'docs-only" \
                 "ok' marker job is this run's whole gate."
          else
            # THE TRIPWIRE, and what it is honestly worth. It is UNREACHABLE on
            # today's ci-filter.py and has never fired: `RUN_BUILD` is assigned
            # in exactly one place — `res["RUN_BUILD"] = "false" if tier ==
            # "docs" else "true"` — so `false` at a non-docs tier requires that
            # line to change, and the draft rewrite (the only other writer of
            # these flags) is excluded by the branch above. It is here for a
            # FUTURE regression in that assignment, which is the failure whose
            # symptom is an unexplained green, and it reds rather than warns
            # because a green nobody can account for is worse than a red.
            echo "GATE SKIPPED: RUN_BUILD=false on tier=$TIER, which the change filter" \
                 "cannot produce — only TIER=docs zeroes it. Treat this run's green as" \
                 "unexplained and say so before merging on it."
            rc=1
          fi

          # THE CONSEQUENCE, under whichever cause fired above.
          if [ "$requested" = yes ]; then
            echo "AND A CONFIGURATION WAS ASKED FOR (see the source line above), so the point" \
                 "someone named was NOT gated: a request chooses which point runs, never" \
                 "whether anything runs."
            echo "If you meant to gate the whole tree at that point, dispatch it again with" \
                 "scope: all, which takes no diff and runs everything unscoped."
          fi
          exit $rc

  # NO LOCAL MIRROR: a marker job with no check in it — it echoes the tier so
  # a docs-only PR has a green required status. ci-local.sh prints the same two
  # lines at its docs-tier exit and returns 0; there is nothing here to run.
  docs-only:
    name: docs-only ok
    runs-on: ubuntu-latest
    needs: filter
    if: github.event_name != 'push'
    steps:
      - run: echo "tier=${{ needs.filter.outputs.tier }} pkgs=${{ needs.filter.outputs.pkgs }}"

  # A GATE MUST BE SITED WHERE IT CAN FIRE ON ITS OWN INPUTS (Evan,
  # 2026-08-20). `discipline` below is `if: run_build == 'true'`, and a
  # change set of only .md / memories/ / local-scripts/ / .claude/ is
  # TIER=docs, so it does not run. That posture is deliberate and cheap
  # docs CI stays — but it left two guards whose inputs are EXACTLY that
  # change class unable to fire on it: the citation guard (prose in two
  # crate headers, the K-REPORT runbook and the local half) and the gate
  # roster (whose local half is local-scripts/ci-local.sh). They are
  # sited here.
  #
  # THIS JOB HAS NO `if:`, so it runs on every tier — including the
  # docs-only runs where every other job carrying one is skipped.
  # (`filter` and `docs-only` also carry no `if:`; neither runs a check.)
  # No toolchain, no cargo, no cache: greps and a stdlib python reader
  # over the two CI halves, the workflow directory, and the citing files.
  # Measured on three docs-tier runs: 8, 9 and 12 s wall clock, finishing
  # before `filter`, so the added critical-path latency on a docs PR is
  # zero and the cost is one extra billed job-minute.
  #
  # THIS JOB'S WALL CLOCK IS RE-TAKEN BY NOTHING, and this is the one
  # place it is written down — the `python-lint` step below sends its
  # billing argument here rather than restating the range. It is left
  # unguarded on the same reasoning docs/CI-MINUTES-2026-08.md gives for
  # its own figures: seconds on a hosted runner are a property of a box
  # on a day, so a pin would red on noise and a bound would pass through
  # the drift it exists to catch. What the two arguments that read this
  # figure actually need is only that the job stays FAR under a minute,
  # and the BILLED minute — the number that would change a decision — is
  # what that register tracks for the whole workflow.
  #
  # THIS IS THE ONE JOB THAT DOES NOT PRUNE local-only tooling, and the
  # exception is the reason it exists: its subject IS the agreement
  # between the hosted half and local-scripts/ci-local.sh, so it has to
  # see both. Nothing here can be moved by a developer's machine — the
  # tree is read, never sourced or executed.
  # `scripts/check-ci-mirror-parity.py` checks that this stays exactly one job.
  mirror:
    name: CI half parity + gate wiring (every tier)
    runs-on: ubuntu-latest
    # NO `if:`, AND THAT IS ENFORCED — scripts/check-ci-mirror-parity.py
    # requires this job to run on EVERY tier, and reds with S61's finding if
    # it grows a condition. The reason is the same one that makes it the
    # wrong thing to sample: its inputs are prose, documentation and
    # local-scripts/ — the exact file classes that classify TIER=docs and
    # skip every `if: run_build` job — so a condition here would stop it
    # firing on the only change class that can break it.
    #
    # It is also the wrong thing to sample on its own merits, and the
    # distinction is the rule for the sampling elsewhere in this file. The
    # lane and ε draws rest on the sampled points agreeing almost always,
    # and on a missed break PERSISTING: a test red at 1e-12 stays red in the
    # tree, so a later draw still finds it. This job detects an ABSENCE — a
    # check dropped from one half of CI, a gate sited where it cannot fire —
    # and an absence leaves no future red for a later draw to catch. Sample
    # the detector and the thing it detects merges silently, once.
    #
    # So it runs on every event, drafts and pushes to main included, for
    # about one billed minute and no toolchain, cargo or cache.
    steps:
      - uses: actions/checkout@v4
      - name: gate roster parity (both halves run every gate)
        run: |
          scripts/gates/gate-roster.sh --selftest
          scripts/gates/gate-roster.sh
      # Every check OUTSIDE scripts/gates/ is named by hand in both
      # halves, so nothing detected a lost row on either side. Two
      # separate enumerations of that population each missed a member,
      # and the second was found by another track by accident — so the
      # population is derived here rather than listed. It also checks
      # THE SITING RULE ITSELF: without that, hollowing this job and
      # moving these three steps back into `discipline` restores the
      # exact state S61 recorded with nothing firing. Python, not bash:
      # its subject is which job a step belongs to and whether that job
      # carries an `if:`, and the bash version read that with a regex
      # that could not see an uppercase job name.
      - name: CI half parity (both halves name the same checks)
        run: |
          python3 scripts/check-ci-mirror-parity.py --selftest
          python3 scripts/check-ci-mirror-parity.py
      # THE FILTER'S OWN SELF-TEST, and it is sited here for a reason of
      # its own rather than by association. `scripts/ci-filter.py` decides
      # whether every `if: run_build` job below runs at all, and its `docs`
      # branch is the one path in it that fails OPEN — a change set wrongly
      # read as documentation skips the entire gate and reports green. A PR
      # that widens that branch is a change to `scripts/ci-filter.py`, and
      # the filter that classifies that PR is the WIDENED one out of the
      # merge ref: a diff adding `scripts/` to `_is_docs` classifies itself
      # as docs and skips the job that would have caught it. Sited here, in
      # the job that carries no `if:`, the self-test runs on that PR anyway.
      # No toolchain: the fixture ships a stub `cargo`, so this row is
      # stdlib python and git — measured 2.9 s locally. UNDATED, ON A
      # DEVELOPER BOX, RE-TAKEN BY NOTHING: no register carries a gate
      # step's wall clock, and this figure exists only to say the row is
      # free enough to sit in a job with no toolchain. The siting argument
      # above turns on WHERE the check runs, not on what it costs.
      - name: change filter selftest (the docs tier fails open)
        run: python3 scripts/ci-filter.py --selftest
      # THE WORK TRACKER'S LINT (work/README.md is the contract). Its inputs
      # are `work/` and `docs/` — markdown, TIER=docs — so it is sited here for
      # the same reason as every row above. Stdlib python and git; the
      # selftest builds a scratch repo.
      - name: work tracker lint (work/ items resolve and docs/ holds no plan or log)
        run: |
          python3 scripts/work.py --selftest
          python3 scripts/work.py lint
      # TERRITORY IS ADVISORY. Every path in this PR's diff that another
      # program's globs own is printed as a warning annotation; nothing reds.
      # The diff is base-sha..HEAD on the merge ref, which is the PR's own
      # change set and needs no history — one extra depth-1 fetch.
      - name: work tracker territory (advisory)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD \
            | python3 scripts/work.py territory --files - --branch "$HEAD_REF"
      # The script that writes the tessellation-budget baseline's own
      # provenance line, and refuses to walk it forward past the rows it
      # describes. Sited HERE, in the tier-blind job, because it is git
      # and stdlib only (a scratch repo, ~1 s) and because the row that
      # exercises it for real — the budget sweep — is one of five
      # SAMPLED k-lint unifications, so a bug in it would sit undrawn.
      - name: tess-budget cut-stamp selftest (the baseline's provenance)
        run: scripts/tess_budget_cut.sh --selftest
      # The claims in the tree about what CI does to probe-gated suites.
      # Prose is this guard's input, so this is where it can fire.
      - name: probe type-check loop citations
        run: |
          scripts/gates/probe-suite-census.sh --selftest
          scripts/gates/probe-suite-census.sh --citations
      # THE PYTHON LINTER RIDES THIS JOB, and the two properties that make
      # this job what it is are exactly the two ruff needs.
      #
      #   1. NO PRUNE. `local-scripts/` holds Python files of its own
      #      (including under review-lily/), and every other checked-out
      #      job deletes that tree before it does anything. A linter sited
      #      anywhere else would silently skip every one of them while its
      #      config claimed the repo — the same defect, in the fix. The
      #      populations are NOT written down here: the row prints them
      #      ("checked all N tracked Python files"), derived from
      #      `git ls-files`, which is the point of the whole script.
      #   2. NO `if:`. A change to `local-scripts/*.py` or `review/*.py`
      #      classifies TIER=docs (scripts/ci-filter.py's `_is_docs`), on
      #      which every `if: run_build` job is skipped. Those files are
      #      this check's own inputs, so siting it under an `if:` would
      #      make it unable to fire on the change class it is about —
      #      S61's defect. `check-ci-mirror-parity.py`'s TIER_BLIND list
      #      names this invocation, so claim 7 now enforces the siting.
      #
      # BILLING: this job runs in seconds and already bills a whole
      # minute (docs/CI-MINUTES-2026-08.md: per job, rounded UP). The
      # reading itself, and why nothing re-takes it, are at this job's
      # own header — one home, so the two cannot drift apart. The
      # install is a ~10 MB prebuilt and ruff over the tree is
      # milliseconds, so the row lands inside the minute this job already
      # costs. A standalone `python-lint` job would bill a second whole
      # minute to do four seconds of work, and would also have to
      # re-argue the prune exception that claim 6 keeps to exactly one
      # job. The `python-suite` job is the other candidate and fails on
      # both counts: it prunes local-scripts/, and it is
      # `if: run_pncad_py`.
      # Its own directory, added to PATH explicitly: this job installs no
      # toolchain, so it may not assume ~/.cargo/bin exists the way the
      # nextest and maturin steps do in jobs that set one up.
      - name: install ruff (pinned, official prebuilt)
        run: |
          mkdir -p "$HOME/ruff-bin"
          curl -LsSf "https://github.com/astral-sh/ruff/releases/download/$RUFF_VERSION/ruff-x86_64-unknown-linux-gnu.tar.gz" \
            | tar zxf - -C "$HOME/ruff-bin" --strip-components=1 ruff-x86_64-unknown-linux-gnu/ruff
          echo "$HOME/ruff-bin" >> "$GITHUB_PATH"
      # REQUIRE_RUFF says out loud, where a reader of this workflow meets
      # it, that a missing or wrong-versioned binary fails this job —
      # the script's off-gate default is to skip loudly, which is right
      # for a developer's box and wrong here.
      #
      # IT IS NOT WHAT MAKES THAT TRUE, and it is not left unchecked. A
      # step-level `env:` line is four characters from gone, and a marker
      # asserting a check nobody enforces is the exact defect this row
      # closes; minting a fresh one inside the fix is not on. So: the
      # script reads GITHUB_ACTIONS — set by the runner, not by us — to
      # decide that a skip is forbidden, AND it fails if this declaration
      # is missing or not "1". Delete the line and the job reds naming
      # it; flip it to "0" and the job reds naming it; ruff runs required
      # either way. `check-python-lint.py --selftest` plants both edits.
      - name: python lint (ruff, every tracked .py and .pyi)
        run: |
          python3 scripts/check-python-lint.py --selftest
          python3 scripts/check-python-lint.py
        env:
          REQUIRE_RUFF: "1"

  discipline:
    name: discipline (evaluation-code)
    runs-on: ubuntu-latest
    needs: filter
    if: github.event_name != 'push' && needs.filter.outputs.run_build == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      # THE MIRRORED DISCIPLINE GATES live in exactly ONE home, under
      # scripts/gates/, and both halves of CI call them: this job — one
      # step per gate, keeping the step name failures are read by in the
      # Actions UI — and local-scripts/ci-local.sh's `discipline` row.
      # Each script carries its own ratified prose: the allowlist
      # justifications are an append-only ledger of rulings, and a
      # ledger kept in two places drifts (it did, in both directions).
      # scripts/gates/lib.sh says why they cannot live under
      # local-scripts/ (this job deletes that tree).
      #
      # This job is the ONLY hand-written gate roster in the repo, and
      # it is checked rather than trusted — but NOT here. The roster
      # gate reads local-scripts/ci-local.sh, which this job deletes
      # above, and its other input is a file class that classifies
      # TIER=docs, on which this job does not run at all. It is sited in
      # the `mirror` job, which runs on every tier and keeps that tree.
      - name: Bounds compound-bound allowlist (ratified 2026-07-29)
        run: |
          scripts/gates/bounds-allowlist.sh --selftest
          scripts/gates/bounds-allowlist.sh
      - name: EvalScalar allowlist (the Bounds gate, over the name)
        run: |
          scripts/gates/evalscalar-allowlist.sh --selftest
          scripts/gates/evalscalar-allowlist.sh
      - name: no ambient environment in the kernel
        run: |
          scripts/gates/no-ambient-env.sh --selftest
          scripts/gates/no-ambient-env.sh
      - name: the tolerance witness is not an ambient read
        run: |
          scripts/gates/witness-not-ambient.sh --selftest
          scripts/gates/witness-not-ambient.sh
      - name: kernel crates are serde-free
        run: |
          scripts/gates/kernel-serde-free.sh --selftest
          scripts/gates/kernel-serde-free.sh
      - name: interval-square powi(2) allowlist (ratified 2026-08-01)
        run: |
          scripts/gates/interval-square-allowlist.sh --selftest
          scripts/gates/interval-square-allowlist.sh
      - name: no extra bounds on Real
        run: |
          scripts/gates/no-extra-real-bounds.sh --selftest
          scripts/gates/no-extra-real-bounds.sh
      # Test-aggregation discipline: one [[test]] target per crate. Each
      # extra one is a full codegen+link of the ~40-rlib graph — 96% of
      # this workflow's build job, measured (bazel-verdict report).
      # THAT 96% IS THE 2026-08 BAZEL-VERDICT READING AT 261 TEST
      # BINARIES AND NOTHING RE-TAKES IT; it is the record of the event
      # that produced this gate, not a claim about today's build job,
      # which has one target per crate precisely because of it.
      # `scripts/gates/test-aggregation.sh` says the same thing at its
      # own header and is the home of the argument: what the gate
      # asserts is the INVARIANT, and it prints the current target total
      # rather than pinning a number. #179
      # collapsed 249 targets to 12 on that evidence and MISSED
      # step-import, which silently kept 26 (two thirds of every remaining
      # test target in the workspace) until the 2026-08-10 build-contention
      # investigation found it. The complementary per-crate
      # `every_suite_file_is_aggregated` test cannot fire for a crate that
      # never opted in — that is the hole this closes.
      - name: test-aggregation discipline
        run: |
          scripts/gates/test-aggregation.sh --selftest
          scripts/gates/test-aggregation.sh
      # The census half of the probe test surface. Its consumer — the
      # `compile and list every probe-gated test target` step in `k-lint` —
      # compiles exactly the crates this prints and feeds each listing
      # back to `--check-listing`, and this gate is what makes an empty or
      # shrinking answer loud rather than silent.
      # It rides here, not there, so the LOUD FAILURE IS OWNED BY A GATE
      # rather than by the order of two steps in one job: it is
      # roster-enforced like its siblings, its `--selftest` proves the
      # guards fire, and the local half reaches it through the loop that
      # runs this whole directory instead of a hand-written mirror row.
      # The CITATION half is not here: its inputs are prose, and a change
      # set of only prose classifies TIER=docs, so this job could not
      # fire on the only change class that breaks it. It runs in
      # `mirror`, as `--citations`.
      - name: probe-suite census (crates + floor)
        run: |
          scripts/gates/probe-suite-census.sh --selftest
          scripts/gates/probe-suite-census.sh
      # The run half's guards. `k_probe_sweep.sh`'s `run_dump` is the only
      # thing between "the harness ran" and "the sweep recorded nothing
      # and exited 0", and nothing else in the tree exercises it. No
      # cargo: the function is extracted from the script under test and
      # driven against a stub, so it costs milliseconds and cannot end up
      # testing a fossil.
      - name: k-probe sweep guard selftest (run_dump)
        run: scripts/rundump-guard-selftest.sh
      # The two test-cost REPORTS (issue 469) are wired into the sharded test
      # jobs, where they cannot fail anything — which is also why their parsers
      # are gated HERE. A report that gates nothing has no failing run to
      # announce a broken parser, so without this row a regex that stopped
      # matching would show up as an empty table nobody reads. The fixtures are
      # captured output from real runs (green, red including the failure recap
      # nextest prints after its `Summary` line, and a retried test), so this
      # row costs milliseconds and cannot end up testing a fossil.
      #
      # SCOPED TO WHAT THIS JOB IS, because "no failing run to announce it"
      # reads as unconditional and is not: `discipline` runs on non-push events
      # with `run_build=true`, so what this row covers is exactly the change
      # sets the test jobs themselves run on. A push, or a docs-tier change,
      # runs neither the reports nor this — which is the right pairing, and it
      # is a pairing rather than total coverage.
      #
      # THE LOOKUP'S SELFTEST RIDES THE SAME ROW. `base-test-listing.sh` is the
      # shell the two test jobs share; its guards are the ones that fired on a
      # real hosted 403, and inline in a `run:` block nothing could red them.
      - name: test cost report parsers (selftest)
        run: |
          python3 scripts/slowest-tests.py --selftest
          python3 scripts/pr-added-tests.py --selftest
          scripts/base-test-listing.sh --selftest
      # The `interval` feature must stay PURELY ADDITIVE. This is not a
      # style rule: on an interval draw the default lane does not run at
      # all, so this lane stands in for it (see `test-interval`'s header),
      # and the wasm32 guard below runs the interval leg ONLY on the same
      # premise. Both hold while enabling the feature cannot change what
      # the default build compiles.
      #
      # WHAT ACTUALLY FAILS HERE, at the scope the script walks
      # (crates/*/{src,tests}): in `src`, a gated item that is not an
      # impl/mod/use/type or test-only code, and ANY
      # `cfg(not(feature = "interval"))` at all. In `tests`, negation is
      # LEGITIMATE and in use — the loud-skip marker rows exist only
      # without the feature, on purpose — so the rule there is that an
      # interval cfg of either polarity must gate a WHOLE item, which is
      # what makes a test present in both builds identical code in both.
      # The correct response to a red is to reconsider what rests on the
      # premise, NOT to allowlist. Stdlib-only python3, so it rides this
      # cheap-tripwire job. The --selftest pass shows the guard actually
      # fires.
      - name: interval-feature additivity (gates the interval run legs)
        run: |
          python3 scripts/check-interval-cfg-additive.py --selftest
          python3 scripts/check-interval-cfg-additive.py
      - name: bit-identity consumer tripwire (retirement landed, M4 PR 5)
        run: |
          scripts/gates/bit-identity-consumer.sh --selftest
          scripts/gates/bit-identity-consumer.sh
      - name: bit-identity debug-only guard (topo/source.rs)
        run: |
          scripts/gates/bit-identity-debug-only.sh --selftest
          scripts/gates/bit-identity-debug-only.sh
      - name: bit-identity punning tripwire
        run: |
          scripts/gates/bit-identity-punning.sh --selftest
          scripts/gates/bit-identity-punning.sh
      # The importer's negative-zero flush has one home and says so in
      # its own module doc. Four copies of it landed green in one crate
      # (S18) because nothing checked the claim.
      - name: signed-zero one home (step-import)
        run: |
          scripts/gates/signed-zero-one-home.sh --selftest
          scripts/gates/signed-zero-one-home.sh
      # No MANIFEST wires a test-only cargo feature (`test-support`,
      # `*-testing`) onto a non-dev dependency edge. Manifests, not
      # invocations: a build command may enable any feature, which is
      # why the two facades carry #[doc(hidden)] (the doc job below runs
      # --all-features). topo's `sweep-testing`
      # opens failure-injection doors and its manifest said so in prose;
      # the prose was FALSE — sweep's `[dependencies]` topo edge carried
      # the feature, cargo unified it across the graph, and a downstream
      # crate compiled `--release` naming `topo::PlantedDegradation`.
      # That sat in the tree undetected while every other gate in
      # scripts/gates/ ran (S52).
      # Parses the manifests with tomllib rather than grepping, because
      # `features = [...]` says nothing about which table it is in.
      - name: test-only features are dev-dependency-only
        run: |
          scripts/gates/test-features-dev-only.sh --selftest
          scripts/gates/test-features-dev-only.sh

      # RENDER PROVENANCE (#221 follow-up). Every committed per-scene
      # PNG under demos/renders{,-freecad}/ must carry FreeCAD's
      # signature tEXt chunks; demos/renders-wild/ (the wild-corpus
      # lane, FreeCAD-free by scope) runs inverted per-lane rules —
      # matplotlib-drawn cells carrying the wild lane's own Author
      # stamp; the matplotlib-COMPOSED montage
      # sheets are the only exemption, and are asserted to be exactly
      # that. A matplotlib fallback frame in a committed path fails
      # here, naming the file. Stdlib-only python3 — it rides this job
      # because this is the cheap-tripwire job (no toolchain, no
      # cargo), and because a render change is never tier `docs`
      # (demos/** is unscopable ⇒ tier `all`), so run_build gates it
      # exactly when it can matter. Mirror: ci-local's always-run
      # "render provenance (demos)" row. The --selftest pass shows the
      # guard actually fires (synthetic PNGs, no renderer needed).
      - name: render provenance (demos)
        run: |
          python3 demos/check_render_provenance.py --selftest
          python3 demos/check_render_provenance.py

      # The UV lane's composer: no provenance question (only the kernel
      # can have drawn an SVG cell), but its selection rule DROPS faces
      # from the sheet, and a silent drop is what that lane exists to
      # prevent. Same cheap-tripwire posture, stdlib only. Mirror:
      # ci-local's "uv composer selftest (demos)" row.
      - name: uv composer selftest (demos)
        run: python3 demos/compose_uv_montage.py --selftest

      # The scene manifest has one reader, shared by both renderers,
      # the montage composer and render.sh's scene lister. What its
      # self-test pins is the part no render lane can fail on: the
      # `view.up` convention, and that the display -> world direction
      # is the derived inverse of the world -> display one rather than
      # a second hand-written map. A camera that disagrees renders a
      # plausible wrong picture. Same cheap-tripwire posture, stdlib
      # only. Mirror: ci-local's "scene manifest reader (demos)" row.
      - name: scene manifest reader selftest (demos)
        run: python3 demos/manifest.py --selftest

  # rustfmt, the rustdoc gate AND the wasm32 guard, in one job — and the
  # job NAME says all three, because a name narrower than its contents
  # is how a red run gets read as the wrong failure.
  #
  # rustfmt + rustdoc merged 2026-08-20 (minutes audit, #852): separately
  # these billed two minutes to do ~50 s of work — 33 s and 46 s measured
  # (run 32425890937), each rounded up, and most of each was the runner
  # setup they now share.
  #
  # EACH KEEPS ITS OWN STEP, with the step names unchanged, because that
  # is what a failure is read by: a red run still says `rustfmt` or
  # `rustdoc (gate)`, matching the rows of the same names in
  # local-scripts/ci-local.sh. None of the three is on the critical path,
  # which is `build + archive (interval)` at ~88% of a ~13 min run, so the
  # serialisation costs no wall-clock for the run as a whole. The measured
  # figures live at the wasm32 step.
  #
  # NOT MERGED IN, deliberately: `discipline`, whose ~30 s buys nothing
  # here and would eat the headroom this job keeps under its billing
  # boundary; and
  # `docs-only`, which carries no `if` because it is the green check a
  # docs-tier run reports when every other job skips — the opposite
  # condition to this job's.
  #
  # Merging rotates Swatinem/rust-cache's key (it hashes the job), so
  # expect exactly one cold run after any change here and warm thereafter.
  #
  # WHY THESE THREE AND NOT SOME OTHER SET. All three are UNSCOPED
  # workspace-wide ratchets: `cargo fmt --all`, doc-gate's fixed crate
  # list, and a `--workspace` cross-compile. They do not read
  # `cargo_scope`, so they behave identically in tier `all` and tier
  # `closure` — which is what makes them shareable in one job at all.
  # `clippy` is the counter-example and stays out: it IS the filter's
  # per-closure row.
  fmt:
    name: rustfmt + rustdoc (gate) + wasm32
    runs-on: ubuntu-latest
    needs: filter
    if: github.event_name != 'push' && needs.filter.outputs.run_build == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      # THE CACHE'S SCOPE IS THE RUSTDOC GATE'S OWN ROOT LIST (#921).
      #
      # `Swatinem/rust-cache` caches the target directories it is TOLD
      # about, and its default is one: `./target`. The rustdoc gate below
      # documents SEVEN cargo roots — the workspace plus the six the
      # workspace excludes — and each of those six builds into a target
      # directory of its own, under its own directory. Every one of them
      # therefore compiled from nothing on EVERY run of this job,
      # `demos/tour` and `demos/wild` rebuilding the whole kernel each
      # time, while the workspace pass ran against a warm graph.
      #
      # MEASURED, hosted, 2 vCPU, warm cache with one kernel doc comment
      # changed — the case a real PR is (run 32583370980, two jobs one
      # input apart):
      #
      #   `scripts/doc-gate.sh`   67 s -> 33 s
      #   whole job              136 s -> 99 s, i.e. 3 billed -> 2 billed
      #
      # The cache entry grows 155 MB -> 245 MB compressed, paid ONLY when
      # the key rotates: a warm run logs "Cache up-to-date" and re-saves
      # nothing. Restore costs ~4 s more. Write-up: F6 in
      # docs/CI-MINUTES-2026-08.md.
      #
      # DERIVED, NOT COPIED, and that is the whole reason this step
      # exists rather than a `workspaces:` roster written out below.
      # scripts/doc-gate.sh's header argues at length that its root list
      # must stay derived, because a root added to `workspace.exclude`
      # and forgotten in a hand-kept copy is a tree nothing covers,
      # reading as covered. A hand-kept copy HERE has the same shape one
      # currency down: the forgotten root silently leaves the cache, and
      # nothing says so. So the workflow asks the gate. `--print-roots`
      # runs the same derivation the gate runs and prints `.` plus one
      # directory per root outside the workspace.
      #
      # BEFORE rust-cache, which it has to be, since its output is that
      # action's input. That is safe: the mode reads `git ls-files` and
      # `cargo metadata --no-deps`, and `--no-deps` needs no registry
      # index (checked under an empty CARGO_HOME), so nothing here
      # depends on the `~/.cargo` this step precedes restoring.
      - name: derive the cargo roots the rustdoc gate documents
        id: doc-roots
        # CAPTURED FIRST, THEN WRITTEN. Inline inside the block, a gate
        # that died mid-list would leave an unterminated heredoc
        # delimiter in $GITHUB_OUTPUT and the failure would be read as a
        # malformed-output error rather than as the gate's own
        # diagnosis. The assignment fails under `bash -e` before
        # anything is appended.
        run: |
          roots=$(scripts/doc-gate.sh --print-roots)
          {
            echo 'roots<<DOC_GATE_ROOTS'
            printf '%s\n' "$roots"
            echo 'DOC_GATE_ROOTS'
          } >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.doc-roots.outputs.roots }}
      - name: rustfmt
        run: cargo fmt --all --check
      # `benches/` IS ITS OWN CARGO ROOT, so `--all` above does not reach it
      # (that manifest says why it is one). Formatting is the ONE check this
      # crate gets in the merge gate, and it is free — rustfmt compiles
      # nothing. Its clippy row is in the nightly's `criterion benchmarks
      # (reporting)` job instead of in `k-lint` beside demos/tour's and
      # tools/*'s: a bench crate nothing depends on cannot have broken a PR,
      # and the nightly is already checked out and cached for it.
      - name: rustfmt (benches — its own cargo root)
        if: '!cancelled()'
        working-directory: benches
        run: cargo fmt --all --check
      # RUSTDOC gate (#465): clippy is blind to rustdoc lints, so a doc
      # comment can silently stop rendering with the gate green. The
      # command and the flags live in scripts/doc-gate.sh — one
      # implementation, called from here and from
      # local-scripts/ci-local.sh, the ci-filter.py arrangement.
      # NOT scoped by the filter, deliberately: it is a tree-wide
      # ratchet over a derived root set, so scoping it to the change
      # closure would trade the ratchet's meaning for no measurable
      # time. It still respects the docs tier via this job's run_build.
      #
      # THE `--selftest` LINE IS PART OF THE GATE, not a nicety: the
      # script's `-D warnings`, its `--document-private-items`, its
      # `--bins --examples` invocation, its per-root feature choice and
      # its loop over the cargo roots outside the workspace can each be
      # dropped and leave it green over a broken tree. It is the same
      # first line every scripts/gates/ gate gets, and although this
      # script is NOT in that directory (its header says why),
      # `gate-roster.sh` checks this wiring all the same — it names the
      # path in OUTLIER_GATES, so deleting either of the two lines below
      # reds that gate in both halves.
      #
      # Runs even when rustfmt failed: formatting and doc coverage are
      # independent verdicts, and the matrix-free merge must not turn
      # two findings into one. `!cancelled()` rather than `always()` so
      # a cancelled run still stops here.
      # `--skip-viewer-toolkit` when the change filter's seeds do not buy
      # the GUI toolkit rows (Evan's viewer-CI-posture ruling,
      # docs/GUI-LOG.md 2026-08-27). It takes `viewer` out of the
      # --all-features pass and puts it back at DEFAULT features, so its
      # renderer-free modules are gated on every run and only the
      # `app`-gated ones — the ones that drag ~140 eframe/wgpu crates
      # into a rustdoc pass — are skipped. The verdict is printed by the
      # step below, never left to be inferred from a green job name.
      - name: rustdoc (gate)
        if: '!cancelled()'
        run: |
          scripts/doc-gate.sh --selftest
          if [ '${{ needs.filter.outputs.run_viewer_toolkit }}' = 'true' ]; then
            scripts/doc-gate.sh
          else
            scripts/doc-gate.sh --skip-viewer-toolkit
          fi
      # THE ONE VERDICT FOR BOTH TOOLKIT ROWS, IN AN EVERY-LANE SEAT.
      #
      # This job has no lane gate, which is why the pair lives here: the
      # seed-keyed axis has to be able to speak on every run, and in the
      # lane-gated `clippy` job it could not (see the note there). Both
      # rows the ruling names are now in one job with one verdict —
      # the rustdoc `--all-features` pass above, and the app-feature
      # clippy below.
      #
      # Mirror: local-scripts/ci-local.sh's toolkit rows.
      - name: viewer toolkit rows - the filter's verdict
        if: '!cancelled()'
        run: |
          printf 'seeds: %s\n' '${{ needs.filter.outputs.seeds }}'
          printf 'tier: %s\n' '${{ needs.filter.outputs.tier }}'
          if [ '${{ needs.filter.outputs.run_viewer_toolkit }}' = 'true' ]; then
            echo 'RUN: the seeds intersect {viewer, pncad, bvh} (or the tier is unscopable).'
            echo 'RUN: the rustdoc pass above documented viewer under --all-features.'
            echo 'RUN: the app-feature clippy row below compiles the eframe/wgpu graph.'
          else
            echo 'SKIP: no seed in {viewer, pncad, bvh} — the eframe/wgpu graph is not compiled on this run.'
            echo 'SKIP: viewer was documented at DEFAULT features and its app-feature clippy row did not run.'
            echo 'The nightly lane re-takes both ungated; viewer default-feature rows still ran in the closure.'
          fi
      # Sited here rather than in `clippy` so a lane draw cannot take it
      # away. The toolkit graph is already built in this job by the
      # rustdoc pass when the axis is true, so the marginal cost is the
      # lint itself.
      - name: clippy (viewer app feature - eframe + wgpu)
        if: '!cancelled() && needs.filter.outputs.run_viewer_toolkit == ''true'''
        run: cargo clippy -p viewer --features app --all-targets -- -D warnings

      # WASM32 GUARD (#807), THE INTERVAL BUILD ONLY.
      #
      # docs/GUI-DESIGN.md §GQ6 and docs/GQ6-RESURVEY.md §4 both state, as
      # a MEASURED fact that a ratified toolkit row rests on, that the
      # kernel plus `editor-core` compiles to wasm32-unknown-unknown,
      # `--features interval` included. Nothing re-took that reading:
      # before this step no CI row named a wasm target at all, so a
      # dependency bump could falsify the sentence with every other row
      # green — a transitive crate growing a `std::os::unix`, `getrandom`
      # or `mmap` path is enough, and the documents would still read as
      # checked fact.
      #
      # ONE LEG, and it is the interval one. Evan's ruling, 2026-08-21:
      # *"do add wasm cross compiling for the interval build only. the
      # lint for having interval be purely additive suffices."* The
      # default-features leg and a whole-workspace `wasm_js` leg were both
      # dropped to that ruling. What each one guarded, and what now
      # guards it, is written at both claim sites — a claim whose guard
      # goes away needs a written reason where the claim is, not silence.
      #
      # WHY ONE LEG COVERS THE DEFAULT BUILD, i.e. why this is subsumption
      # and not a narrowing. `--features interval` compiles a SUPERSET of
      # what default features compile, for two independent reasons:
      #
      #   1. Cargo features are purely additive for the DEPENDENCY GRAPH.
      #      Enabling a feature can add crates and features; it cannot
      #      remove them. That is cargo's design, not this repo's.
      #   2. `scripts/check-interval-cfg-additive.py` forbids any
      #      `cfg(not(feature = "interval"))` under crates/*/src, so no
      #      LIBRARY source in this repo compiles only when the feature is
      #      off — which is exactly this row's scope, because `cargo check`
      #      without `--all-targets` builds lib targets and not tests.
      #      (Under crates/*/tests that gate PERMITS negation, whole-item
      #      only; those are the loud-skip marker rows, and no target this
      #      row builds contains one.) That gate runs in `discipline`, on
      #      the same code-tier pull-request runs as this step — the
      #      premise is checked wherever it is relied on.
      #
      # THE LINT'S OWN RESIDUAL IS NOW THIS GUARD'S RESIDUAL, and its
      # header states it: the check is SYNTACTIC. It cannot see through a
      # gated `mod` whose contents are non-additive, nor a gated impl of a
      # trait with a blanket default method that an f64 path then calls.
      # It narrows the hole; it does not close it. Read it there before
      # relying on this comment.
      #
      # THE THIRD-PARTY HOLE, MEASURED 2026-08-21 — the one direction the
      # subsumption above can fail, and it is outside the lint's scope
      # because the lint reads only this repo's crates. Feature
      # unification can ENABLE a feature on a shared third-party crate,
      # and a crate carrying an internal `#[cfg(not(feature = "f"))]`
      # block then compiles LESS of itself under `interval` than under
      # default features. A wasm-hostile path living in such a block
      # would be exercised by a default-features check and skipped here.
      #
      #   $ cargo tree --workspace --exclude pncad --exclude pncad-py \
      #       --target wasm32-unknown-unknown -e features [--features interval]
      #
      #   Diffed between the two configurations: NOT ONE LINE present
      #   under default features is absent under `--features interval`.
      #   The entire delta is one duplicate-reachability marker.
      #
      # So the hole is UNOCCUPIED at this dependency set. That is a
      # property of the current graph, not a theorem — RE-TAKE IT with the
      # command above if this guard ever looks like it is missing
      # something, and do not weaken the claim without re-taking it.
      #
      # (`interval-transcendentals` is already in the DEFAULT graph: it is
      # an unconditional dependency of `geom-core`, and the feature gates
      # the code that USES it rather than the edge. So this leg is not
      # pulling in a subtree the default build lacks; it is adding this
      # repo's gated source over the same crates. `inari`, `gmp` and `rug`
      # appear in NEITHER graph — the gmp-backed oracle is a
      # dev-dependency of a path dependency and never enters either.)
      #
      # WHAT IS NOW UNGUARDED, stated because §Q6's whole subject is
      # claims nothing re-takes: the `pncad`/`pncad-py` façade under
      # `--cfg getrandom_backend="wasm_js"`. GQ6-RESURVEY §4's third table
      # row and its "verified fix" paragraph are a one-time reading again,
      # and §4 now says so at the row. Same ruling, same reason.
      #
      # SITED IN THIS JOB, not in one of its own (Evan's earlier
      # constraint: the guard must not add runner time). Actions bills PER
      # JOB, ROUNDED UP TO THE MINUTE — docs/CI-MINUTES-2026-08.md — so
      # billed minutes are the currency, not seconds.
      #
      # MEASURED, hosted (ubuntu-latest, 2 vCPU), tier `all`. TWO
      # readings, and they do not agree on the billed cost — read both:
      #
      #   run 32452728742, COLD (this job's cache key had just rotated):
      #     install 3 s + check 17 s = 20 s of guard. Job 64 s without,
      #     84 s with. Both round to 2 billed minutes, so +0.
      #   run 32452924083, WARM: install 2 s + check 11 s = 13 s of guard.
      #     Job 53 s without, 66 s with. That is 1 billed minute without
      #     and 2 with, so +1.
      #
      # SO THE BILLED COST IS 0 OR 1, NOT RELIABLY 0. This job's baseline
      # STRADDLES the 60 s boundary — `rustdoc (gate)` alone swings 22-34 s
      # between runs — so which side it lands on decides the guard's
      # billed cost, and a warm run is the common case. Do not quote a
      # flat +0 from here.
      #
      # A job of its own would pay set-up, checkout, toolchain and cache
      # restore again (26 s measured on this workflow's light jobs), i.e.
      # 39-46 s = 1 billed minute ALWAYS, plus a concurrent runner slot.
      # So the step is 0 or 1 against a job's flat 1: never worse, and
      # free on a cold run. That is the whole of the siting argument now —
      # it is narrower than it was with three legs, and honestly so.
      #
      # WORTH KNOWING, because it is counter-intuitive: cutting this guard
      # from three legs to one did NOT reduce its billed cost. With three
      # legs the job was 103-110 s against a 61-62 s baseline — both sides
      # over the boundary, so +0 on both readings. One leg is ~25 s
      # cheaper in WALL-CLOCK and can be +1 in BILLED minutes. The two
      # currencies disagree here; the ruling that chose one leg was about
      # the interval build's coverage, not about this number.
      #
      # Locally, from an empty CARGO_TARGET_DIR on a 4-vCPU container, the
      # same command is 23.5 s cold and 2.5 s warm.
      #
      # NOT on the critical path either way: the job finishes inside two
      # minutes against `build + archive (interval)`, which is ~88% of a
      # ~13 min run, so this is billed runner minutes and ZERO extra
      # wall-clock for the run as a whole.
      #
      # This job rather than `clippy` because the guard is an UNSCOPED
      # workspace-wide ratchet and so are this job's other two rows, while
      # `clippy` runs `${{ needs.filter.outputs.cargo_scope }}` and is the
      # filter's per-closure row — see this job's header.
      #
      # SITING (S61): the inputs are the kernel crates and the dependency
      # graph, so the gate has to fire on the change that would break it.
      # Cargo.toml and Cargo.lock are not `_is_docs` paths, so a dependency
      # bump classifies TIER=all and this job runs. The only change class
      # that skips it is a docs-tier one (`*.md`, `memories/`,
      # `local-scripts/`, `.claude/`), none of which can move a wasm build
      # — plus, since #852, a push to main, which runs no gate at all and
      # is a property of the workflow rather than of this step's siting.
      #
      # `check`, NOT `build`: the guarded sentence is "compiles clean".
      # This step runs no codegen and no linker, and therefore establishes
      # nothing about whether a wasm artifact links, loads or runs — see
      # the two caveats GQ6-RESURVEY §4 already flags (threads, and
      # `mul_add` lowering).
      #
      # Target install goes through `rustup target add` rather than the
      # toolchain action's `targets:` input on purpose: rust-toolchain.toml
      # pins 1.97.0, and `rustup` resolves that directory override, so the
      # std artifacts land on the toolchain cargo will actually use.
      #
      # `!cancelled()` on both, for this job's stated reason: a formatting
      # or a rustdoc failure is a different verdict from a wasm one, and
      # the matrix-free merge must not turn two findings into one.
      - name: install the wasm32 target (pinned toolchain)
        if: '!cancelled()'
        run: rustup target add wasm32-unknown-unknown
      # `viewer` is excluded for the SAME reason `pncad` is — it depends
      # on `pncad`, so a leg that excludes the façade cannot include a
      # crate sitting on top of it. GUI-5 owns the real wasm lane for
      # the GUI (docs/GUI-PLAN.md's unit list); this guard's subject is
      # the kernel plus `editor-core`, and it stays that.
      - name: wasm32 check (kernel + editor-core, --features interval)
        if: '!cancelled()'
        run: cargo check --workspace --exclude pncad --exclude pncad-py --exclude viewer --features interval --target wasm32-unknown-unknown

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: filter
    if: github.event_name != 'push' && needs.filter.outputs.run_build == 'true'
      && needs.filter.outputs.lane != 'interval'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No --all-features here: the `interval` feature is a different
      # build graph, and the `interval` job owns its clippy pass with its
      # own cache — building it here too would double this job's compile
      # time for no extra coverage, and mix two feature sets into one
      # cache entry.
      # Scoped by the filter: `--workspace` in tier `all`, an explicit
      # `-p <closure>` list in tier `closure`.
      - name: clippy (default features)
        run: cargo clippy ${{ needs.filter.outputs.cargo_scope }} --all-targets -- -D warnings
      # THE GUI TOOLKIT GRAPH — GATED, and the gate is RECORDED.
      #
      # `viewer`'s `app` feature (eframe + wgpu + naga + winit) is ~140
      # crates that no other row in this workflow needs. It is not a
      # default feature, and per Evan's viewer-CI-posture ruling
      # (docs/GUI-LOG.md, 2026-08-27) the rows that compile it run only
      # when the change filter's SEEDS intersect {viewer, pncad, bvh} —
      # seed-keyed, NOT closure-keyed, because `pncad` re-exports the
      # kernel and is therefore in nearly every change's closure while
      # being in almost none of their seeds. The full argument lives at
      # `RUN_VIEWER_TOOLKIT` in scripts/ci-filter.py; do not re-derive
      # it here.
      #
      # WHAT STAYS UNGATED: viewer's default-feature build and its
      # headless suites ride the ordinary dependent closure like any
      # other crate, so a kernel change that breaks the camera, the
      # input mapping or the scene path still reds on the offending PR.
      # This axis skips the TOOLKIT only.
      #
      # WHAT RE-TAKES THE SKIPPED COVERAGE: the `viewer app feature`
      # row in nightly.yml, ungated, once a day.
      #
      # THE VIEWER TOOLKIT ROWS ARE NOT HERE. They used to be, and that
      # was a hole in Evan's viewer-CI ruling rather than a hole in this
      # job: THIS JOB CARRIES `lane != 'interval'`, and LANE is a 50/50
      # sample, so on an interval draw the whole job — the seed-keyed
      # verdict step included — never ran, and the ruling's "never a
      # green job name over a silent skip" failed silently exactly half
      # the time. A seed-keyed axis inside a lane-sampled job is
      # lane-sampled.
      #
      # They now live in the `fmt` job, which carries no lane gate and
      # already hosted the identically-named verdict step for the
      # doc-gate half of the same ruling. See the header there.

  # BUILD job, default features (see the build-once header comment above
  # the `env:` block). Compiles the scoped test binaries exactly once and
  # publishes them as a nextest archive; the `test` matrix below only RUNS.
  #
  # Only its doc-test step has a local mirror, and that is the whole of what
  # this job checks beyond compiling: the archive is the hosted split itself —
  # compiling once and shipping binaries to thin RUN jobs is what makes a
  # matrix of runners cheap, while a local run has one machine and compiles
  # inside each test row (`nextest_check`).
  build:
    name: build + archive (default)
    # BUILD_RUNNER (repo variable) — see the LINK/DEBUGINFO note above.
    # Unset today, so this is `ubuntu-latest` and nothing changes.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    needs: filter
    if: github.event_name != 'push' && needs.filter.outputs.run_build == 'true'
      && needs.filter.outputs.lane != 'interval'
    # OPT LEVEL — reverses the #52/#53 verdict, because both of its
    # premises expired. That decision ("blanket opt 2 is net-slower on
    # core-crate PRs") was measured when this workspace had 261 test
    # binaries and compile dominated the run. #179/#387 took that to one
    # per crate (`scripts/gates/test-aggregation.sh` prints the total),
    # and test EXECUTION is now ~79% of run wall (measured 2026-08-12:
    # compile jobs ~220 s of a ~1060 s critical path). Re-measured on the
    # same box, whole workspace, `--all-targets`:
    #
    #   clean compile   opt-0 130.6 s -> opt-2 422.9 s   (3.24x WORSE)
    #   clean compile   opt-0 136.5 s -> opt-2 442.4 s   (interval, 3.24x)
    #   nextest run     opt-0 558.7 s -> opt-2 130.0 s   (4.30x BETTER,
    #                                   2791 tests, all green both ways)
    #   nextest run     opt-0 691.7 s -> opt-2 301.6 s   (interval, 2.29x,
    #                                   3001 tests, all green both ways)
    #
    # Break-even needed only 1.5x on execution. MEASURED HOSTED, warm
    # cache, run 31668174443 (these supersede the local projections above
    # — trust these):
    #
    #   archive step, default    127 s ->  432 s   (3.40x worse)
    #   archive step, interval   132 s ->  605 s   (4.58x worse)
    #   test (interval, default, 2/2)         <- the critical-path leg
    #                            828 s ->  117 s   (7.1x better)
    #   ten test legs, summed   5620 s ->  895 s
    #   critical path           1065 s ->  840 s   (-21%)
    #   billed                  ~137m  ->  ~72m    (-65 min)
    #
    # The compile penalty is WORSE hosted than locally (4.58x vs 3.24x) —
    # 2 vCPU parallelises opt-2 codegen badly — and the execution win is
    # much BETTER (7.1x vs the 2.29x measured locally, which was taken on
    # a box with an express-lane job running alongside it and is therefore
    # pessimistic). Both errors happened to point the same way; the trade
    # is still strongly positive.
    #
    # Note rust-cache does not cache workspace crates, only deps, so 605 s
    # IS the steady state: run 1 (cold deps) was 920 s, run 2 onward 704 s
    # for the whole job. Do not read a first run on a knob change as the
    # verdict.
    #
    # The gap between those two is itself a finding: at opt-0 the interval
    # lane looks only 1.24x slower than default (691.7 vs 558.7), but at
    # opt-2 it is 2.32x slower (301.6 vs 130.0). opt-0's own overhead was
    # masking the enclosure cost regime that geom-core's manifest has
    # always claimed. Anyone reading interval-vs-f64 runtime off an opt-0
    # CI leg is reading a flattered number.
    #
    # (The three lines below still describe the opt-0/opt-2 pair, which is
    # what they were measured for; see the 2026-08-25 block at the foot of
    # this note for the level this job actually sets today.)
    #
    # NOTE these supersede local-scripts/test-fast.sh's "75 s -> 4.9 s"
    # (15x, 2026-07-21, 807 tests) — the suite has since grown to 2791
    # tests and the ones added are less compute-bound, so that header is
    # stale.
    #
    # Scoped to the two ARCHIVE jobs on purpose: they feed all ten test
    # legs, which compile nothing, so one opt-2 compile here buys the
    # speedup ten times over. `k-lint` deliberately does NOT get this — it
    # regenerates the K sweep CSVs that are diffed against the committed
    # baselines in docs/k-report-data/, and that lane stays on the exact
    # configuration those baselines were produced under.
    # debug-assertions and overflow-checks are unaffected by opt-level
    # (cargo defaults them ON for dev/test), so fail-loud postconditions
    # keep their teeth — this is the same configuration
    # local-scripts/test-fast.sh has used locally since M6.
    #
    # RE-ASKED UNDER CONFIGURATION SAMPLING (2026-08-22), because the
    # verdict above rests on amortising ONE compile over TEN run legs and a
    # sampled run has one. Evan's question was the right one — "if we run at
    # one eps instead of 3 that's plausibly enough to shift the balance". It
    # shifts it and does not cross it, in either lane, and the margin is
    # wide enough that no new measurement was taken to say so.
    #
    # DERIVED FROM THE FIGURES DIRECTLY ABOVE, plus F2's default-shard
    # execution times in docs/CI-MINUTES-2026-08.md. A sampled run pays one
    # archive step and one full-suite row (two shards). Writing E for that
    # row's opt-2 execution and r for the opt-0/opt-2 execution ratio, opt-2
    # wins while E > (archive_2 - archive_0) / (r - 1):
    #
    #   default lane   r = 6.46   (the residue of "ten legs summed" once the
    #                              four interval legs are removed: 769 s of
    #                              opt-0 execution against ~119 s at opt-2)
    #                  break-even at 56 s of execution; the row is ~119 s.
    #                  One build + one row: 551 s at opt-2, 896 s at opt-0.
    #   interval lane  r = 7.08   (2 x 828 s against 2 x 117 s)
    #                  break-even at 78 s; the row is ~234 s.
    #                  One build + one row: 839 s at opt-2, 1788 s at opt-0.
    #
    # So the default lane keeps about a 2x margin and the interval lane
    # about 3x. THE INTERVAL LANE IS WHY THIS IS NOT CLOSE, and it is the
    # lane that got MORE expensive to execute under sampling, not less: it
    # now runs the whole suite rather than the interval-only difference, so
    # the term opt-2 attacks grew at the same moment the leg count fell.
    # The two changes point opposite ways and opt-2 wins both times.
    #
    # WHAT WOULD REOPEN IT: the default suite getting ~2x faster to execute,
    # or a further cut to what a run executes. Re-take it with the same
    # arithmetic, not a hunch — and note a knob change here rotates the
    # rust-cache key and buys one cold rebuild, so a single run cannot
    # settle it (the same trap this note's own header warns about).
    #
    # ============================================================
    # NOW opt-level 1, NOT 2 (Evan, 2026-08-25). EVERYTHING ABOVE THIS LINE
    # IS THE HISTORY OF A TWO-POINT COMPARISON, and the two points were the
    # wrong ones.
    #
    # The whole argument above minimises `a + E` over a knob with four
    # settings while only ever evaluating two of them, and those two sit at
    # opposite extremes of BOTH terms. Nothing in this repository — #52/#53,
    # #449, the census, this note, the calibration lane's first two samples —
    # had ever measured, proposed or rejected `opt-level = 1`. It was not a
    # considered omission; the question had not been asked. And the room was
    # visible in the lane's own numbers: in the 2026-08-25 sample the build
    # penalty opt-2 swallowed to buy its execution win (`a2 - a0` = 499 s) was
    # more than twice the margin it won by (220 s).
    #
    # A three-arm sweep, each arm a clean build plus a full-suite run in this
    # job's own environment (2026-08-25, 3489 tests, ALL THREE ARMS GREEN):
    #
    #   opt-0   build 143 s + execute 289 s = 432 s
    #   opt-1   build 307 s + execute  60 s = 367 s      <- adopted
    #   opt-2   build 427 s + execute  58 s = 485 s
    #
    # opt-1 keeps 97% of opt-2's execution speed (60 s against 58 s) for 58%
    # of its build penalty (+164 s against +284 s over opt-0), and wins
    # outright. Derived `r` = E0/E2 = 4.98, which reproduces the census's
    # 4.95/4.99 almost exactly.
    #
    # AND THE SUITE IS GREEN AT THE LEVEL THIS NOW SETS, which is the only
    # part of the above that is a correctness question rather than a cost
    # one. All three arms above were green at 3489/3489; the flip was then
    # re-checked on main as merged (3515 tests by then): 3515/3515 passed at
    # opt-1, build 313 s, execute 62 s. That is expected rather than lucky —
    # debug-assertions and overflow-checks do not move with opt-level and
    # rustc does not enable fast-math at any of them — but "expected" is not
    # evidence, so it was run.
    #
    # THE HONEST CAVEAT, AND IT IS THE SAME ONE THIS NOTE HAS MADE TWICE
    # ALREADY: that sweep was taken on a 4-core AVX-512 guest, the same class
    # as the census box and NOT this 2-vCPU runner. A ratio does not transfer
    # between machines — the figures above are themselves a demonstration
    # (3.24x local against 4.58x hosted; 2.29x local against 7.1x hosted). So
    # this flip is made on evidence from a box the calibration lane explicitly
    # distrusts, before a single opt-1 sample from the runner existed. That is
    # a deliberate choice and the reason for it is that THE FASTEST WAY TO GET
    # RUNNER DATA ON opt-1 IS TO RUN THE GATE ON opt-1: every PR now produces
    # a real opt-1 archive step and a real opt-1 test row, and
    # nightly.yml's calibration lane reads exactly those durations for free.
    # The lane's measured arms are now opt-0 and opt-2, so reverting stays
    # a measured decision rather than a guess.
    #
    # WHAT WOULD REVERSE IT: the lane reporting `opt-0` or `opt-2` on the
    # runner, with margin, across more than one sample. Read
    # docs/perf-data/opt-level/ before acting on any single one — the FIRST
    # samples after this change are the least trustworthy, because this knob
    # change rotates the rust-cache key here and the lane's opt-2 arm is
    # building against a brand-new key of its own. Both of those buy one cold
    # rebuild, which is the exact trap the paragraph directly above warns
    # about.
    #
    # UNCHANGED BY THE FLIP: debug-assertions and overflow-checks are
    # opt-level-independent, so fail-loud postconditions keep their teeth at 1
    # exactly as at 2; the D9 bit-exactness pins hold at any opt level (the
    # python-suite job's note says so — opt never moves rounding); k-lint
    # still does NOT get this env, so the committed K sweep baselines keep the
    # configuration they were produced under; and Cargo.toml's per-package
    # opt-2 overrides for spade + mesh are untouched, since they cover the
    # `cargo test`-driven jobs that do not set this env at all.
    # ============================================================
    #
    # Cargo.toml's per-package opt-2 overrides (spade + mesh) stay: they
    # cover the `cargo test`-driven jobs that do NOT set this env.
    #
    # JOB-LEVEL, not step-level, on purpose: Swatinem/rust-cache hashes
    # env vars prefixed CARGO_/RUST* into its cache key, and it runs
    # BEFORE the build step. Step-level knobs (like the CARGO_PROFILE_
    # TEST_STRIP this replaces) are invisible to it, so cargo's
    # fingerprint would disagree with the restored cache on every run and
    # rust-cache would never re-save. Job-level means exactly one cold
    # rebuild per knob change, then warm forever.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      # sccache EXPERIMENT, ON (2026-08-20). The kill switch is the
      # repo variable SCCACHE set to "0"; unset means enabled, so the
      # trial runs without a variable needing to exist.
      # cargo treats an EMPTY RUSTC_WRAPPER as "no wrapper", so the
      # unset case is a genuine no-op rather than a broken command.
      # Note this var is RUST*-prefixed, so Swatinem/rust-cache hashes
      # it: flipping SCCACHE rotates the cache key and buys exactly one
      # cold rebuild. That run is not the verdict — same trap the OPT
      # LEVEL note above warns about.
      RUSTC_WRAPPER: ${{ vars.SCCACHE != '0' && 'sccache' || '' }}
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      # NO mold here — see the LINKER note at the top of this file. It was
      # right for 261 test binaries and is not right for 14.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install sccache (experiment; disable with vars.SCCACHE = '0')
        if: vars.SCCACHE != '0'
        uses: ./.github/actions/install-sccache
        with:
          version: ${{ env.SCCACHE_VERSION }}
          lane: default
      - name: runner + linker provenance (for perf attribution)
        run: nproc && free -g | head -2 && ld --version | head -1
      - name: install cargo-nextest (pinned, official prebuilt)
        uses: ./.github/actions/install-nextest
        with:
          version: ${{ env.NEXTEST_VERSION }}
      # Scoped by the filter (`--workspace` or `-p <closure>`), same as the
      # per-row `cargo test` this replaces: the archive CONTAINS exactly
      # the closure's test binaries, so the run rows need no re-scoping.
      - name: build test binaries + archive
        run: cargo nextest archive ${{ needs.filter.outputs.cargo_scope }} --archive-file nextest-default.tar.zst
      # THE MEASUREMENT. Hit rate here is the whole question: the
      # deps are already served by rust-cache, so a run that only
      # hits on those has proved nothing. What would justify
      # adopting this is hits on the WORKSPACE crates, on a warm
      # run, against the archive step's own duration on main.
      - name: sccache stats (experiment)
        if: vars.SCCACHE != '0' && !cancelled()
        run: sccache --show-stats
      # Upload right after the archive (the run legs still wait on the
      # whole job via `needs`): if a later step fails, the archive is
      # already up, so the failure can be investigated / re-run without
      # rebuilding.
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-default
          path: nextest-default.tar.zst
          retention-days: 1
      # Doc-tests DO NOT run under nextest (upstream design): this step
      # keeps them gated. The workspace has real doctests, including
      # compile_fail blocks that only the doctest runner exercises.
      - name: doc-tests
        run: cargo test --doc ${{ needs.filter.outputs.cargo_scope }}

  test:
    name: test (eps = ${{ needs.filter.outputs.eps }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: [filter, build]
    if: github.event_name != 'push' && needs.filter.outputs.run_build == 'true'
      && needs.filter.outputs.lane != 'interval'
    # THE MINIMAL GRANT THIS JOB CAN DO ITS WORK WITH — and it WIDENS one
    # scope, which is the point of it. A `permissions:` block replaces the
    # workflow's default token scopes outright, so the delta runs both ways:
    # `actions` goes from NONE to `read`, and every other scope the default
    # carried is pinned off. Nothing in this job writes anything.
    #
    # MEASURED, NOT ASSUMED, and the measurement is what the widening rests on:
    # without `actions: read` the cost report's base-listing lookup got
    # `Resource not accessible by integration (HTTP 403)` from the artifacts
    # API on run 33343519165. The default token could read the repository and
    # not the Actions API.
    #
    # IT IS NOT WHAT `download-artifact` NEEDS. A v4 download of an artifact
    # from the SAME run goes through the runner's own runtime token and no REST
    # call, which is why every download step in this workflow has always worked
    # without it. What needs the scope is the CROSS-RUN artifacts-API lookup in
    # `scripts/base-test-listing.sh` — so the grant is on the two test jobs
    # that run it, and on nothing else in this file.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      # ONE ε ROW PER RUN, SAMPLED (2026-08-22 — scripts/ci-filter.py's
      # CONFIGURATION SAMPLING note is the argument; this is the wiring).
      # The battery is still {default, 1e-6, 1e-12} (Evan's ruling,
      # 2026-07-30): the two env rows straddle the compiled default
      # (DEFAULT_EPS = 1e-9) three orders either side, and the `default`
      # row runs with the variable genuinely UNSET (an empty
      # CAD_TOLERANCE_EPS is a parse error by design — tolerance.rs
      # multi-ε contract — so the assignment rides the run line as a shell
      # prefix, not `env:`). What changed is that a run gates ONE member
      # of that battery rather than all three; repetition covers the rest.
      # All rows execute the SAME archived binaries: eps is runtime env,
      # which is the whole point of building once, and it is also why
      # sampling ε costs nothing on the build side — the saving is exactly
      # the four run legs it stops billing.
      #
      # 2-way intra-row sharding (--partition count:*/2), adopted on
      # MEASURED numbers (#167 run 30838077811): unsharded, the
      # default-eps legs executed in ~5.9-6.1 min — over the ~5 min bar —
      # with a flat slow-test tail (worst single test 14 s of 1989), so a
      # count partition splits evenly. The two shards' union is exactly
      # the row (nextest partitions the run list deterministically); a
      # failure still names its eps row in the leg name.
      #
      # STILL TRUE after the #177 test-binary collapse, and worth stating
      # because the shape changed: nextest's count partition is applied
      # WITHIN each binary, so 263 mostly-tiny binaries became 24 larger
      # ones. The union is still exactly the row and the split is still
      # even — a 2044-test row splits more evenly across 24 binaries than
      # it did across 263, not less. Test IDs gained a module prefix
      # (`all m4_pr8_corpus::foo` where it was `m4_pr8_corpus foo`); the
      # eps rows never named a binary, so nothing here needed rewriting.
      # The rows that DID name one (persistence / corpus / rebuild-latency
      # / k-lint) now select by `--test all -- <module>::` or by a nextest
      # `test(/^<module>::/)` expression, verified to match the old
      # per-binary test counts exactly.
      # SHARDING SURVIVES THE ε CUT, and the arithmetic is the reason —
      # the August audit's F2 declined this exact merge for the default
      # legs and the ε cut does not reverse it. From the figures in
      # docs/CI-MINUTES-2026-08.md (F2): the two shards are ~10 s setup +
      # 63 s and 56 s of execution, so 2 billed minutes each; merged they
      # are ~139 s, which is 3. That is ONE billed minute saved for ~66 s
      # of added latency on a leg that, now that only one build job runs,
      # sits directly behind it on the critical path. One minute of a
      # ~60-minute run against ~9% of its wall clock is the wrong side of
      # the trade, and it is worse on the interval lane (see that job).
      matrix:
        shard: [1, 2]
    env:
      # Nothing compiles here: cargo only dispatches to cargo-nextest,
      # which runs prebuilt binaries out of the archive — keep the job
      # off the pinned-toolchain download (same trick as `filter`).
      RUSTUP_TOOLCHAIN: stable
    steps:
      # Checkout is still needed: tests read committed fixtures, and
      # --workspace-remap points nextest's per-test cwd at this tree.
      # Runner workspace paths are identical across jobs, so build-time
      # env!("CARGO_MANIFEST_DIR") paths resolve here too.
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - name: install cargo-nextest (pinned, official prebuilt)
        uses: ./.github/actions/install-nextest
        with:
          version: ${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: nextest-default
      # The eps assignment is an inline shell prefix (empty for the
      # `default` leg — see the matrix comment on why not `env:`).
      #
      # `--no-fail-fast`, AND THE RUN SAYS SO (#1128). nextest's default is
      # fail-fast — measured against the pinned 0.9.140, not inferred. The
      # measurement, reproducible as written: a six-test crate with two
      # planted failures, run `--test-threads 1`, reports
      # `Cancelling due to test failure`, `1/6 tests run: 0 passed, 1 failed`
      # and `warning: 5/6 tests were not run due to test failure` with no flag
      # and with `--fail-fast` alike, against `6 tests run: 4 passed, 2 failed`
      # and no cancellation line with this one.
      #
      # `--test-threads 1` IS PART OF THE MEASUREMENT, not decoration. At
      # default parallelism the same no-flag run prints `6 tests run: 4
      # passed, 2 failed` — a summary identical to the flagged one — because
      # both failures were already in flight when the first one landed; only
      # `Cancelling due to test failure: 1 test still running` distinguishes
      # it, and how many rows survive is a race. That is a second reason for
      # the flag rather than an argument against it: without it, how much of a
      # red shard you get to see depends on scheduling.
      #
      # So without it a red shard reports its first failure and whatever else
      # happened to be running, not its failures, and with `--partition
      # count:N/2` a red run's whole visible surface is a couple of rows out
      # of thousands. That is not a smaller number for the same problem;
      # it is a number that cannot distinguish one stale assertion from a
      # systematic family, and nothing in the output said it was truncated.
      #
      # WHAT IT COSTS: nothing on a green run, which is the common case — the
      # flag only changes what happens AFTER a failure, and a run with no
      # failures never reaches that. A fully red run does more work; a red run
      # is one nobody is merging on, and paying a shard's remaining minutes to
      # learn the size of the breakage is the trade this gate wants.
      #
      # THE ECHO IS NOT REDUNDANT with the flag being in the command. nextest
      # names the mode only when it TRUNCATES ("5/6 tests were not run due to
      # test failure"); a run that did not truncate says nothing, so silence
      # currently means either "no failures" or "failures, first one only" and
      # a reader cannot tell which. The Actions `Run …` group carries the
      # command but is collapsed and, on the eps legs, is a `${{ }}` expansion
      # the reader has to evaluate.
      #
      # SAID TWICE, AND THE SECOND ONE IS THE LOAD-BEARING ONE. The reader this
      # is for is looking at a RED run, and where they land is the bottom of
      # this step, immediately under nextest's failure summary — which is where
      # "is that all of them?" gets asked and where nextest's own truncation
      # warning prints, for the same reason. A line at the top of a
      # two-thousand-line step is not where that question is.
      #
      # THE OUTPUT IS TEE'd, AND THE VERDICT IS TAKEN FROM `PIPESTATUS`, NOT
      # FROM THE PIPELINE. The cost report below reads what this step printed;
      # capturing it must not be able to change what this step DECIDED. A
      # pipeline's status is its LAST command's, so `cargo … | tee` reports
      # tee's success and turns a red shard green — and this workflow's steps
      # run under `bash -e {0}`, which does NOT set `pipefail` (visible in any
      # run's `shell:` line), so nothing here would have caught that. Reading
      # `PIPESTATUS[0]` takes nextest's own status regardless of shell options,
      # and `set +e` guarantees no intervening command can abort the step
      # before that status is read and re-exited.
      - name: run archived tests
        run: |
          set +e
          echo "fail-fast mode: --no-fail-fast — every test in this shard runs to completion."
          mkdir -p "$RUNNER_TEMP/test-cost"
          ${{ needs.filter.outputs.eps != 'default' && format('CAD_TOLERANCE_EPS={0}', needs.filter.outputs.eps) || '' }} cargo nextest run --archive-file nextest-default.tar.zst --workspace-remap . --partition count:${{ matrix.shard }}/2 --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test-cost/archived-tests.log"
          status=${PIPESTATUS[0]}
          echo "fail-fast mode was --no-fail-fast: the summary above is this shard's whole failure SURFACE, not its first failure. (This shard is half the suite; the other shard is a job of its own.)"
          exit $status
      # WHAT THIS RUN COST, AND WHAT THIS PR ADDED TO IT (issue 469). Two
      # summaries, both REPORTS and neither a gate — the issue's own ruling,
      # restated at the bottom of each block so a future "add teeth" is a
      # decision rather than drift: a budget needs a baseline and the baseline
      # is moving. The reading that says so — the 2026-08-13 audit's, and how
      # far the suite moved in a day — is stated once, in
      # `scripts/slowest-tests.py`'s header, and not restated here: it is an
      # undated one-shot that nothing re-takes, so a second copy of it would be
      # a second thing to keep true. What this note needs from it is that the
      # baseline MOVES, which is a claim about the suite's traffic and not
      # about either endpoint.
      #
      # A REPORT MUST NOT BE ABLE TO MASK OR ALTER A TEST VERDICT, and three
      # things enforce that rather than one. The step is separate from the run
      # step (which has already exited with nextest's status by the time this
      # starts); it ends in `exit 0` under `set +e`, so no command inside it can
      # fail the step; and it carries `continue-on-error: true` for the failure
      # modes a script cannot catch (a shell parse error, an OOM kill). A
      # generation failure therefore presents as this step going yellow with a
      # missing or partial block in the summary, and the job's red/green is
      # exactly what the test step said.
      #
      # `success() || failure()` AND NOT `always()`, which differ on exactly one
      # job state: CANCELLED. The three sentences above are about a RED run and
      # still hold — `failure()` is what keeps this reporting on one — but a
      # cancelled job is a runner being torn down, and starting a `cargo nextest
      # list` on it buys a report nobody asked for out of a job someone stopped.
      #
      # ~0 BILLED MINUTES, which is the whole reason it is shaped this way: no
      # new job (the billing model rounds per JOB — docs/CI-MINUTES-2026-08.md),
      # no extra runner. The slowest-N half parses output this job already
      # produced. The listing half costs one archive extraction (~0.5 s,
      # measured in the `Extracted 37 files … in 0.50s` line every run prints)
      # plus a listing pass — seconds inside a job that already runs for
      # minutes.
      #
      # WHY THAT FIGURE HAS NO REGISTER AND NO GUARD, since this repo's
      # convention is that a measured claim gets one: it is a ONE-SHOT BOUND,
      # not a tracked quantity. What it asserts is that these seconds cannot
      # reach the granularity the billing model charges in — a whole job-minute
      # — and the honest caveat is stated rather than watched: seconds added to
      # a job already sitting within seconds of a minute boundary can round up
      # once. Nothing in it varies with the suite, so there is no series to
      # register and no threshold a guard could hold; the number that WOULD
      # need one is a per-job minute count, which docs/CI-MINUTES-2026-08.md
      # already tracks for the whole workflow.
      #
      # WHERE A BASE LISTING COMES FROM. There is no cheap way to LIST the base
      # tree — it would mean building it — so each run publishes its own
      # listing as an artifact named for the git TREE it was built from, and a
      # later run looks up the tree its base commit points at. Under this
      # repo's merge-only rule a PR run's merge-ref tree becomes main's tree at
      # the merge, so the next PR's base tree is one a previous run already
      # listed and the lookup hits. When it does not — the first runs after this
      # lands, a base tree nobody listed, an expired artifact, a token without
      # `actions: read` — the report prints a STATED SKIP naming which of those
      # it was. It never prints a number it could not derive, and never a red.
      #
      # THE LOOKUP ITSELF IS `scripts/base-test-listing.sh`, ONE COPY FOR BOTH
      # LANES, and its header carries the argument: a sampled run executes one
      # lane, so a second copy of this shell would be untested by construction,
      # and the guards that refuse `gh`'s error text as a tree SHA or a URL
      # would be exactly the code no test can red. In the script they have a
      # `--selftest` that drives them against stub `cargo`, `gh` and `curl`,
      # gated in `discipline` beside the two parsers.
      - name: test cost report (slowest tests + what this PR adds)
        if: success() || failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          JOB: test (eps = ${{ needs.filter.outputs.eps }}, ${{ matrix.shard }}/2)
        run: |
          set +e
          # BOTH DESTINATIONS, and the log is the load-bearing one. The step
          # summary is a page a reader has to go and look at; the step LOG is
          # where someone reading a job already is, and where a red run puts
          # them. `tee -a` costs nothing and makes the report visible to
          # whoever is actually looking at this job.
          COST="$RUNNER_TEMP/test-cost"
          mkdir -p "$COST"
          python3 scripts/slowest-tests.py --top 20 --job "$JOB" \
            --leg "run archived tests=$COST/archived-tests.log" | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/base-test-listing.sh --archive nextest-default.tar.zst --lane default \
            --job "$JOB" --cost-dir "$COST" \
            --leg "run archived tests=$COST/archived-tests.log" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      # Shard 1 only: both shards download the same archive and would publish
      # the same listing under the same name, and a duplicate artifact name is
      # an error. 7 days because this is a convenience for the NEXT pull
      # request's report and this repo's artifact quota is small (500 MB); a
      # base tree older than a week is one nothing is being opened against.
      #
      # `TEST_LIST_TREE` IS THE GATE, and the helper sets it only for a listing
      # that parsed — see its header on why a squatted name is worse than no
      # name at all.
      - name: publish this tree's test listing (the next PR's base)
        if: (success() || failure()) && matrix.shard == 1 && env.TEST_LIST_TREE != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-list-default-${{ env.TEST_LIST_TREE }}
          path: ${{ runner.temp }}/test-cost/test-list.json
          retention-days: 7
          if-no-files-found: ignore

  # THE RELEASE-PROFILE ROW. Three adversarial suites in `crates/topo` feed
  # tier-1-INVALID bodies to the Euler operators and are written about
  # RELEASE semantics; the archive matrix above is the dev profile at
  # opt-1 with debug-assertions ON, so it cannot be what runs them. (The
  # level moved from 2 on 2026-08-25; the point is unaffected, because what
  # disqualifies the matrix is debug-assertions, which no opt level moves.)
  # `review_m1_pr2::release_corruption` splits its expectations on
  # `cfg(debug_assertions)` outright, so no single profile covers the
  # file; `review_m1_pr4`'s section 9 ("Release-mode garbage-in") is not
  # cfg-split but had never once run in the profile it is named for.
  #
  # WHAT IT BUYS, stated against the ratified text rather than against
  # the code's current behaviour, because those have diverged:
  #
  #   * BOUNDED TRAVERSAL. DESIGN.md's D9 footnote, as amended by the D2
  #     addendum, keeps exactly one clause of the old corrupt-input
  #     disposition: "The bounded-traversal half stands: never a hang;
  #     every traversal is bounded." That is
  #     `large_torn_body_terminates_quickly`, which attacks 3000 struts
  #     here and 500 under debug-assertions (where the per-op
  #     postcondition sweep makes the construction loop quadratic). The
  #     case the gate sees is six times larger in this job, and the
  #     clause it defends is not superseded by anything.
  #   * THE ROW-4 ARMS ARE NOT INPUT-REACHABLE, which is the clause the
  #     whole D2 addendum rests on and the only one with an executable
  #     test. `review_d18`'s two hammer rows drive every operator that
  #     reaches `link_half_edges` over randomly torn bodies and over a
  #     genuinely spent graft destination, counting mutation-phase
  #     completions. They are release-only BY CONSTRUCTION, not by
  #     preference: in debug a torn body may legitimately panic at the
  #     postcondition, so telling that apart from a row-4 arm needs a
  #     process-global panic hook, which races the threaded matrix. With
  #     the postcondition compiled out, any panic IS a row-4 arm. So this
  #     job is the only lane in which those rows mean anything, and the
  #     only lane that runs them at all.
  #   * COMPILE ROT, which is a PROFILE-level hazard and independent of
  #     what any row asserts: a `#[cfg(not(debug_assertions))]` item that
  #     no CI job ever type-checks can rot into a build error with every
  #     check green, because clippy and the matrix are both debug passes.
  #     `foreign_parent_loop_garbage_in_garbage_out_release` and the
  #     `use crate::validate;` it needs are exactly that shape.
  #
  # WHAT IT DOES NOT BUY: it does not certify silent discard, and that
  # distinction is why it survived **W2c**. D9's ratified corrupt-input
  # disposition allowed "documented garbage-out in release" until the
  # **D2 addendum** (2026-08-19) superseded that half with "Silent
  # discard is never an answer"; W2c executed the addendum across
  # `euler{,_ring,_kill}.rs`, `link_half_edges` and its two unproven
  # callers included, so no write there swallows a failed lookup any
  # more. `foreign_parent_loop_garbage_in_garbage_out_release` passes
  # unchanged across that conversion because the `parent_loop` it plants
  # is LIVE BUT WRONG: no lookup fails, every write lands, and what the
  # row observes is wrong DATA, never a swallowed failure. That is the
  # residue the addendum deliberately leaves standing — corruption a
  # plan phase cannot observe still yields `Ok` plus a body the
  # validator refuses — and it is what the row records. The three greps
  # below are unchanged for the same reason: the conversion renamed and
  # retired nothing here.
  #
  # The other rows in the file are profile-independent — `pillow()` runs
  # three SUCCESSFUL operators, so they do fire the debug postcondition
  # during setup, but the operator each one asserts on fails a
  # precondition and returns before its mutation phase, so no
  # postcondition runs over the asserted call and the expectation is the
  # same in both profiles. `debug_postcondition_fires_on_corrupt_input`
  # is `#[cfg(debug_assertions)]` and belongs to the matrix above.
  #
  # SCOPED to one crate's lib unittests, deliberately, not a release
  # build of the workspace: `-p topo --lib` compiles topo's closure plus
  # its dev-dependencies and links one binary. The rows execute in
  # milliseconds — the compile IS the cost of this job (93 s hosted on a
  # cold cache, measured on this job's first run, and never since: it is a
  # one-shot reading with no register and no guard, kept because the SHAPE
  # it supports — that scoping to one crate's lib is what keeps this job
  # cheap — is what the next reader needs, and that shape does not turn on
  # the second. This job's billed minutes, which is the figure a cost
  # decision would actually read, are docs/CI-MINUTES-2026-08.md's).
  release-corruption:
    name: corrupt input (release profile)
    runs-on: ubuntu-latest
    needs: filter
    if: github.event_name != 'push' && needs.filter.outputs.run_topo_release == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL — see the full note on the `filter` job above.
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      # Its own cache key: release artifacts share no fingerprint with
      # the dev-profile jobs, so one shared entry would only thrash.
      - uses: Swatinem/rust-cache@v2
        with:
          key: topo-release
      - name: corrupt-input suites, release profile
        # DEBUG ASSERTIONS OFF, EXPLICITLY — this job's whole subject is
        # the posture that SHIPS, and the shipping posture is
        # debug-assertions off (`DESIGN.md`, "Before publishing"). The
        # root `[profile.release]` turns them ON as a development
        # measure, which would compile the three `cfg(not(debug_assertions))`
        # rows below OUT of the only lane that runs them — silently
        # deleting the coverage this job exists to provide. The count
        # guard caught exactly that. Pinned here rather than inherited,
        # so the job states which posture it tests instead of depending
        # on a profile default that has now changed once.
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "false"
        run: |
          set -o pipefail
          cargo test --release -p topo --lib -- \
            review_m1_pr2::release_corruption \
            review_m1_pr4::kill_ops_survive_torn_bodies_without_panicking \
            review_d18 \
            | tee release-corruption.log
          # A name filter that matches NOTHING exits 0 — the exact
          # silence this job exists to remove. So assert the selection is
          # non-empty AND name the rows the job is justified by: delete
          # or rename one and this reds, rather than quietly returning to
          # zero coverage.
          passed=$(sed -n 's/^test result: ok\. \([0-9]\{1,\}\) passed.*/\1/p' release-corruption.log)
          echo "release-profile rows run: ${passed:-0}"
          test "${passed:-0}" -gt 0
          grep -q 'garbage_in_garbage_out_release \.\.\. ok' release-corruption.log
          grep -q 'large_torn_body_terminates_quickly \.\.\. ok' release-corruption.log
          grep -q 'kill_ops_survive_torn_bodies_without_panicking \.\.\. ok' release-corruption.log
          # `review_d18`'s two hammer rows are `cfg(not(debug_assertions))`
          # on purpose — in debug a torn body may legitimately panic at the
          # postcondition, so classifying one needs a process-global hook
          # that races the matrix; in release the postcondition is compiled
          # out, so any panic IS a row-4 `unreachable!` and no hook is
          # needed. This job is therefore the ONLY lane that runs them.
          grep -q 'torn_bodies_never_reach_a_row_four_unreachable \.\.\. ok' release-corruption.log
          grep -q 'a_spent_graft_destination_never_reaches_a_row_four_unreachable \.\.\. ok' release-corruption.log
          # Both suite headers name this job as their mechanism. Nothing
          # else greps for that name, so renaming the job would leave two
          # doc comments quietly false; this is what makes it loud.
          grep -q 'corrupt input (release profile)' crates/topo/src/review_m1_pr2/release_corruption.rs
          grep -q 'corrupt input (release profile)' crates/topo/src/review_m1_pr4.rs

  # BUILD job, interval features — the ONE genuinely different build
  # graph in the matrix. Owns the interval clippy pass and the interval
  # doc-tests (both need this graph compiled anyway), then archives the
  # test binaries for the `test-interval` matrix below.
  #
  # NO LOCAL MIRROR: the archive split, the same as `build` above and for the
  # same reason — one machine locally, so nothing is archived and nothing is
  # shipped. That is the part with no local half, and it is not the whole job:
  # `list archived tests (interval)` IS reproduced locally, inside
  # ci-local.sh's `interval_selection`, which computes both operands of the set
  # difference in one function. Its marker cites `test-interval`, the job whose
  # legs consume the selection, rather than this one, so the citation names
  # where the listing is USED — which is why this job still reads as
  # unmirrored and needs this line.
  # The interval clippy and doc-test passes are not in this job; they are
  # `lint-interval`, which the local half mirrors and cites.
  build-interval:
    name: build + archive (interval)
    # Same BUILD_RUNNER variable as the default build job; unset today.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    needs: filter
    if: github.event_name != 'push' && needs.filter.outputs.run_build == 'true'
      && needs.filter.outputs.lane != 'default'
    # Same link/debuginfo/opt knobs, same job-level-not-step-level
    # reasoning, as the default build job — see the LINK/DEBUGINFO and
    # OPT LEVEL notes there. This job is the run's critical path (its
    # archive feeds the longest test leg in the run), so it is the one
    # that most wants them: the interval lane's slowest leg was 828 s of
    # pure execution, and the opt-level knob is aimed squarely at that.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      # sccache EXPERIMENT, ON (2026-08-20). The kill switch is the
      # repo variable SCCACHE set to "0"; unset means enabled, so the
      # trial runs without a variable needing to exist.
      # cargo treats an EMPTY RUSTC_WRAPPER as "no wrapper", so the
      # unset case is a genuine no-op rather than a broken command.
      # Note this var is RUST*-prefixed, so Swatinem/rust-cache hashes
      # it: flipping SCCACHE rotates the cache key and buys exactly one
      # cold rebuild. That run is not the verdict — same trap the OPT
      # LEVEL note above warns about.
      RUSTC_WRAPPER: ${{ vars.SCCACHE != '0' && 'sccache' || '' }}
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      # The `interval` feature's backend is the in-repo
      # `interval-transcendentals` crate — pure Rust over libm — so this
      # job needs no system packages at all now that mold is gone (see the
      # LINKER note at the top of this file).
      - uses: dtolnay/rust-toolchain@stable
      # CACHE SEPARATION (verified against the action's source,
      # 2026-07-30): this job builds a DIFFERENT feature set from the
      # default-feature jobs, so it must never share their cache entry —
      # a shared entry would have the two graphs evicting each other on
      # every run. Two things guarantee the separation. (1) rust-cache@v2
      # composes its key as prefix + (shared-key OR key + job id) + os +
      # arch + env/lockfile hashes, and its `add-job-id-key` input
      # defaults to "true" — so with no `shared-key` anywhere in this
      # file, every JOB here already gets its own cache by construction
      # (matrix legs of one job share a key, which is what we want: same
      # feature set). (2) The explicit `key` below makes THIS job's
      # separation intentional rather than incidental, and survives a
      # rename. Do NOT add `shared-key` to any job here: it replaces the
      # job component outright and is exactly the thrash this prevents.
      - uses: Swatinem/rust-cache@v2
        with:
          key: interval
      - name: install sccache (experiment; disable with vars.SCCACHE = '0')
        if: vars.SCCACHE != '0'
        uses: ./.github/actions/install-sccache
        with:
          version: ${{ env.SCCACHE_VERSION }}
          lane: interval
      - name: runner + linker provenance (for perf attribution)
        run: nproc && free -g | head -2 && ld --version | head -1
      - name: install cargo-nextest (pinned, official prebuilt)
        uses: ./.github/actions/install-nextest
        with:
          version: ${{ env.NEXTEST_VERSION }}
      # Archive first, upload immediately (the legs still wait on the
      # whole job via `needs`; the early upload means a clippy/doc-test
      # failure leaves the archive available for investigation). This job
      # is the run's critical path (measured on #167): keep it lean.
      - name: build test binaries + archive (interval)
        run: cargo nextest archive ${{ needs.filter.outputs.cargo_scope }} --features interval --archive-file nextest-interval.tar.zst
      # THE MEASUREMENT. Hit rate here is the whole question: the
      # deps are already served by rust-cache, so a run that only
      # hits on those has proved nothing. What would justify
      # adopting this is hits on the WORKSPACE crates, on a warm
      # run, against the archive step's own duration on main.
      - name: sccache stats (experiment)
        if: vars.SCCACHE != '0' && !cancelled()
        run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-interval
          path: nextest-interval.tar.zst
          retention-days: 1

  # The interval feature's clippy pass (the default clippy job
  # deliberately skips --all-features) and its doc-tests.
  #
  # WHY A SEPARATE JOB (2026-08-12): these two steps used to live at the
  # end of `build-interval`, after the archive upload. That put them on
  # the RUN'S CRITICAL PATH for no reason — `test-interval` declares
  # `needs: build-interval`, and `needs` waits for the whole JOB, not for
  # the artifact it actually consumes. So the longest test leg in the run
  # sat behind a clippy pass it has no dependency on. Measured over 11
  # runs: clippy 37 s + doc-tests 7 s, i.e. ~44 s of pure critical-path
  # latency. Split out, they run concurrently with the archive instead.
  #
  # Deliberately NOT inheriting build-interval's env: this job links no
  # test binaries, so mold buys nothing and its ~12 s apt install would
  # cost more than it saves, and the archive jobs' opt level would slow the
  # compile with nothing executing at scale to pay it back. It keeps only the
  # debuginfo knobs, which are pure win. Its own rust-cache key follows
  # from the no-shared-key rule documented on build-interval.
  lint-interval:
    name: clippy + doc-tests (interval)
    runs-on: ubuntu-latest
    needs: filter
    if: github.event_name != 'push' && needs.filter.outputs.run_build == 'true'
      && needs.filter.outputs.lane != 'default'
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: interval-lint
      - name: clippy (interval)
        run: cargo clippy ${{ needs.filter.outputs.cargo_scope }} --all-targets --features interval -- -D warnings
      - name: doc-tests (interval)
        run: cargo test --doc ${{ needs.filter.outputs.cargo_scope }} --features interval

  # THIS LANE RUNS THE WHOLE SUITE, and that REVERSES the 2026-08-13
  # interval-only selection rather than tuning it. The reversal is forced by
  # the sampling above, and the reason is arithmetic, not taste.
  #
  # WHAT THE SELECTION WAS FOR. Measured on run 31665082966: of the 2995
  # tests this lane executed, 214 are `#[cfg(feature = "interval")]`-gated
  # and the other 2781 cost 4406.7 cpu-s re-running code the DEFAULT legs
  # had already run in the same run. Dropping that overlap was free because
  # the default legs were running alongside, every time.
  #
  # THEY ARE NOT RUNNING ALONGSIDE ANY MORE. A sampled run draws one lane,
  # so on an interval draw the default legs do not exist and that "already
  # covered" 93% of the suite is covered by nothing. Keeping the selection
  # would mean an interval-drawn run gated ~200 tests and called itself a
  # gate. So the overlap comes back deliberately: ~234 s of execution
  # (2 x the 117 s the pre-selection lane measured per shard at opt-2)
  # against the ~22 billed minutes of default-lane build, test and clippy
  # that the draw skipped. (That 117 s is an opt-2 reading and the tree moved
  # to opt-1 on 2026-08-25. It is left as taken: the sweep behind that flip
  # measured opt-1 execution within 3% of opt-2's, so the term this sentence
  # weighs does not move enough to change what it concludes — and a figure
  # re-stated without being re-taken is worse than a dated one.)
  #
  # `scripts/interval-only-selection.py` is NOT deleted: local-scripts/
  # ci-local.sh still runs both lanes on one tree, where the overlap is the
  # same pure waste it always was, and that is now the script's only caller.
  #
  # THE SOUNDNESS PREMISE IS UNCHANGED AND STILL GATED. The feature is
  # purely ADDITIVE — every `#[cfg(feature = "interval")]` item in
  # crates/*/src is an `impl ... for Interval`, a mod/use/type for
  # `Interval`, or test-only code; nothing under crates/*/src compiles
  # `cfg(not(feature = "interval"))` at all; and Rust has no specialization,
  # so extra impls cannot move how the f64 paths monomorphize. A test
  # present in both builds therefore executes the same machine code in both,
  # which is what makes this lane a legitimate stand-in for the default one
  # on the runs where it is drawn.
  #
  # THE STAND-IN IS NOT TOTAL, and the exception is where the same gate
  # ALLOWS negation: crates/*/tests, whole-item only. Those rows — the
  # loud-skip markers — exist only WITHOUT the feature, so a run that lands
  # on this lane, drawn or pinned (ci-filter.py's `_forces_interval`, which
  # now says so on stderr), does not execute them. Their whole population
  # is `grep -rn 'not(feature *= *"interval")' --include=*.rs crates/` —
  # today, four loud-skip rows in four files, and the grep rather than the
  # number is what to re-take. That premise is not left to prose —
  # scripts/check-interval-cfg-additive.py GATES it in the `discipline` job,
  # on every code-tier run, and fails loudly the moment it stops holding.
  test-interval:
    name: test (interval, eps = ${{ needs.filter.outputs.eps }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # `build` is GONE from `needs`, and that is the point of the rewrite
    # above: this job's only cross-lane dependency was the default build's
    # test list (the left operand of the retired set difference), and a
    # sampled run does not run the default build at all.
    needs: [filter, build-interval]
    if: github.event_name != 'push' && needs.filter.outputs.run_build == 'true'
      && needs.filter.outputs.lane != 'default'
    # `actions: read` for the cost report's cross-run base-listing lookup, and
    # everything else pinned off. The argument — what this block widens, what
    # it narrows, and why `download-artifact` is not the reason — is at the
    # default lane's copy, where the 403 was measured.
    permissions:
      contents: read
      actions: read
    # ONE ε ROW, SAMPLED, AND SHARDED AGAIN. Both halves of that reverse
    # the 2026-08-20 audit's collapse of this job, and both follow from the
    # suite this lane now runs.
    #
    # The collapse was correct for what this job was then: four legs billing
    # a minute each to execute 12-20 s of an interval-only selection. At the
    # FULL suite the numbers are the other lane's, doubled — the
    # pre-selection interval lane measured 117 s per shard at opt-2 (the OPT
    # LEVEL note on the default build job, run 31668174443), so ~234 s
    # unsharded. Unsharded that is 5 billed minutes against 6 for two
    # shards: the same 1-minute saving the default lane declines, for ~117 s
    # of added latency on the run's critical path rather than ~66. The
    # sharding's original premise — "the unsharded leg is the run's slowest"
    # — is true of this job again.
    #
    # The union of the two shards is exactly the row: nextest's count
    # partition is applied deterministically within each binary.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # Nothing compiles here (see the `test` job).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - name: install cargo-nextest (pinned, official prebuilt)
        uses: ./.github/actions/install-nextest
        with:
          version: ${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: nextest-interval
      # The whole archive, one sampled ε row, one shard — the same shape
      # the default lane's run leg has, against the interval binaries.
      # `default` means the variable genuinely UNSET (an empty
      # CAD_TOLERANCE_EPS is a parse error by design — the tolerance.rs
      # multi-ε contract), so that row is run with `env -u` rather than by
      # assigning an empty string.
      #
      # `--no-fail-fast` and its echo, for the reasons spelled out at the
      # default lane's copy of this step (#1128). This lane is where the effect
      # was measured: 22 failures locally against 1-2 here, same tree.
      # That pair is one undated observation of one red tree; nothing
      # re-takes it and nothing could — how many failures a broken tree
      # shows is a property of the breakage, not of this lane. It is here
      # as the reason the flag was reached for on THIS job first, and the
      # flag's own justification, at the default lane's copy of this step,
      # rests on nextest's documented fail-fast default rather than on it.
      #
      # TEE'd, WITH THE VERDICT TAKEN FROM `PIPESTATUS` — the full argument is
      # at the default lane's copy of this step. In one line: a pipeline's
      # status is tee's, these steps run under `bash -e {0}` without
      # `pipefail`, and a capture that could turn a red shard green would be a
      # report breaking the thing it reports on.
      - name: run archived tests
        run: |
          set +e
          echo "fail-fast mode: --no-fail-fast — every test in this shard runs to completion."
          mkdir -p "$RUNNER_TEMP/test-cost"
          ${{ needs.filter.outputs.eps != 'default' && format('CAD_TOLERANCE_EPS={0}', needs.filter.outputs.eps) || 'env -u CAD_TOLERANCE_EPS' }} cargo nextest run --archive-file nextest-interval.tar.zst --workspace-remap . --partition count:${{ matrix.shard }}/2 --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test-cost/archived-tests.log"
          status=${PIPESTATUS[0]}
          echo "fail-fast mode was --no-fail-fast: the summary above is this shard's whole failure SURFACE, not its first failure. (This shard is half the suite; the other shard is a job of its own.)"
          exit $status
      # M4 PR 6 D6.1, Interval member: the save/load/replay-identity row
      # at the certified interval scalar (already inside the full archive
      # run above; named here so the obligation is visible). One leg only
      # (default eps, shard 1), mirroring the pre-archive job, which ran
      # it once with no eps env.
      #
      # `--no-fail-fast` HERE AND ON THE ROW BELOW, unconditionally, and the
      # reason is that the alternative needs an invariant nothing enforces.
      # Each row selects one test MODULE by filterset. Today each module holds
      # exactly one `#[test]`, which makes the flag behaviourally identical to
      # its absence — so exempting these rows was defensible and was written
      # down. It was also rot: a second test added to either module silently
      # falsifies the exemption's premise, and no gate reads it. The flag is
      # free on a one-test selection and correct on a two-test one, so it goes
      # on and the premise stops mattering.
      - name: persistence save/load/replay-identity (interval)
        if: matrix.shard == 1 && needs.filter.outputs.run_editor_core == 'true'
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/test-cost"
          cargo nextest run --archive-file nextest-interval.tar.zst --workspace-remap . -E 'binary_id(editor-core::all) & test(/^m4_pr6_roundtrip_interval::/)' --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test-cost/persistence.log"
          exit ${PIPESTATUS[0]}
      # M4 PR 8a D1, Interval member: the Band 4 corpus evaluates green
      # at the certified interval scalar (also inside the archive run
      # above; named here so the obligation is visible).
      - name: band 4 corpus (interval)
        if: matrix.shard == 1 && needs.filter.outputs.run_editor_core == 'true'
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/test-cost"
          cargo nextest run --archive-file nextest-interval.tar.zst --workspace-remap . -E 'binary_id(editor-core::all) & test(/^m4_pr8_corpus_interval::/)' --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test-cost/band4-corpus.log"
          exit ${PIPESTATUS[0]}
      # THREE LEGS HERE, NOT ONE, and which of them ran is what the report's
      # header says: shard 1 of this lane runs the archive plus the two named
      # editor-core rows, shard 2 runs the archive alone, and a test that
      # appears in more than one leg costs this job the SUM. That is the whole
      # of the first measurement trap (issue 469): per-leg times are not
      # comparable, so they are summed within a job and never compared across
      # jobs. The `--leg` list below is deliberately unconditional — a leg the
      # `if:` above skipped has no log file, and the report NAMES it as absent
      # rather than quietly reporting a two-leg job as a three-leg one.
      #
      # Everything else about this step — why it cannot alter the test verdict,
      # why it is not `always()`, what it costs, where a base listing comes
      # from — is at the default lane's copy. What used to be a verbatim copy
      # of ~60 lines of lookup shell is now one call to the script both lanes
      # share, so the two differ only in the archive, the lane name and the leg
      # list, and there is no second copy for a sampled run to leave untested.
      - name: test cost report (slowest tests + what this PR adds)
        if: success() || failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          JOB: test (interval, eps = ${{ needs.filter.outputs.eps }}, ${{ matrix.shard }}/2)
        run: |
          set +e
          # BOTH DESTINATIONS, and the log is the load-bearing one. The step
          # summary is a page a reader has to go and look at; the step LOG is
          # where someone reading a job already is, and where a red run puts
          # them. `tee -a` costs nothing and makes the report visible to
          # whoever is actually looking at this job.
          COST="$RUNNER_TEMP/test-cost"
          mkdir -p "$COST"
          python3 scripts/slowest-tests.py --top 20 --job "$JOB" \
            --leg "run archived tests=$COST/archived-tests.log" \
            --leg "persistence save/load/replay-identity (interval)=$COST/persistence.log" \
            --leg "band 4 corpus (interval)=$COST/band4-corpus.log" | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/base-test-listing.sh --archive nextest-interval.tar.zst --lane interval \
            --job "$JOB" --cost-dir "$COST" \
            --leg "run archived tests=$COST/archived-tests.log" \
            --leg "persistence save/load/replay-identity (interval)=$COST/persistence.log" \
            --leg "band 4 corpus (interval)=$COST/band4-corpus.log" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: publish this tree's test listing (the next PR's base)
        if: (success() || failure()) && matrix.shard == 1 && env.TEST_LIST_TREE != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-list-interval-${{ env.TEST_LIST_TREE }}
          path: ${{ runner.temp }}/test-cost/test-list.json
          retention-days: 7
          if-no-files-found: ignore

  # The archives exist only to ferry binaries from the build jobs to the
  # run legs; on a fully green run they have no further use, and this
  # private repo's artifact quota is small (500 MB, and the Actions
  # budget has been exhausted before). retention-days: 1 already caps
  # stragglers; this deletes the happy-path bulk immediately. On a FAILED
  # run the artifacts are deliberately kept (retention window) so failed
  # legs can be re-run without rebuilding.
  # NO LOCAL MIRROR: it deletes the nextest archive artifacts this run
  # uploaded, which exist only because the hosted halves of build and test are
  # different jobs on different machines. A local run compiles and executes in
  # one process and produces no artifact to clean up.
  cleanup-archives:
    name: delete nextest archives (green run)
    runs-on: ubuntu-latest
    # A SAMPLED RUN SKIPS ONE OF THESE TWO BY CONSTRUCTION, and a skipped
    # `needs` skips the dependent job unless the condition says otherwise —
    # which would have quietly stopped the cleanup and let a ~500 MB archive
    # ride the retention window on every run. `always()` re-enables the job;
    # the explicit result tests then restore what `success()` meant, keeping
    # the archives on a FAILED run so failed legs can be re-run without
    # rebuilding. `run_build` keeps the job off docs-tier runs, where there
    # is nothing to delete and the round-up would still bill a minute.
    needs: [filter, test, test-interval]
    if: >-
      always()
      && needs.filter.outputs.run_build == 'true'
      && needs.test.result != 'failure' && needs.test.result != 'cancelled'
      && needs.test-interval.result != 'failure'
      && needs.test-interval.result != 'cancelled'
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in nextest-default nextest-interval; do
            for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                          -q ".artifacts[] | select(.name==\"$name\") | .id"); do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            done
          done

  interval-backend:
    name: interval backend crate
    runs-on: ubuntu-latest
    needs: filter
    # Tier `closure` never reaches this: interval-transcendentals/ is its
    # own workspace, so ANY change under it is tier `all`.
    if: github.event_name != 'push' && needs.filter.outputs.run_interval_backend == 'true'
    # The `interval` feature's backend lives in its own workspace
    # (interval-transcendentals/), so the kernel's workspace rows never
    # build its tests. Its pad tripwire therefore had no CI at all until
    # M5 PR 1's review asked for one — and it catches what the kernel's
    # own lane-agreement tests provably cannot, both lanes there sharing
    # the round-to-nearest chain.
    #
    # WHAT THIS ROW CATCHES, by direction, because the two are not the
    # same job. A pad WIDENED: every operation, via pad_contract.rs,
    # which bounds each endpoint's distance from the backend's own value
    # by the derived pad — no oracle needed, since the comparison is
    # against libm, not against truth. A pad DROPPED: division,
    # multiplication and sqrt only, via review_fuzz_exact.rs, which
    # computes the true value in exact u128 rational arithmetic.
    #
    # NOT `+` and `-`: their truth is exactly computable but not with a
    # u128 comparator (aligning 2^1023 with 2^-1074 needs ~2100 bits),
    # and mutating add_lo/add_hi to bare round-to-nearest leaves this
    # whole row green — only certify_arith reds. NOT the seven
    # transcendentals: their truth needs a multi-precision reference at
    # all. Both belong to oracle-certify below, which fires on changes
    # under interval-transcendentals/{src,tests}/, Cargo.toml or
    # Cargo.lock (ci-filter.py's ORACLE_PATHS — four paths, not the whole
    # directory: docs/ is NOT among them, so editing the derivation that
    # sets PAD_ULPS does not by itself re-certify). That is a trigger
    # set, not a convention.
    #
    # This row is deliberately the crate's DEFAULT feature set: without
    # `oracle-inari` there is no inari/gmp-mpfr-sys and no C toolchain in
    # the graph, so it takes seconds. See the crate README's
    # "Certification" section.
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: interval-backend
          workspaces: interval-transcendentals
      - name: fmt + clippy
        working-directory: interval-transcendentals
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - name: tests (default features — the oracle stack must stay out)
        working-directory: interval-transcendentals
        run: cargo test
      # Tripwire on the tripwire: the dev-oracle stack (inari and its
      # gmp/MPFR C build) belongs to `--features oracle-inari` only. If
      # anything ever makes it reachable from the default feature set,
      # fail loudly here rather than silently reintroducing a C build.
      - name: assert the oracle stack stays out of the default graph
        working-directory: interval-transcendentals
        run: |
          # THE PRODUCER IS TESTED BEFORE ITS OUTPUT IS. `cargo tree | grep`
          # takes grep's verdict, and grep handed no input finds no match — so
          # a resolver failure, an unbuildable manifest or a missing subcommand
          # all read as "the oracle stack is out", which is this tripwire
          # announcing a pass it never checked. Captured first, so a dead
          # producer is loud and only a real listing is searched.
          if ! TREE=$(cargo tree); then
            echo "ERROR: \`cargo tree\` failed — this tripwire has nothing to search, and an unread graph is not a clean one"
            exit 1
          fi
          if printf '%s\n' "$TREE" | grep -iE 'inari|gmp-mpfr-sys|rug'; then
            echo "ERROR: the default feature set reaches the gmp stack"
            exit 1
          fi

  # The differential certification lane: `certify.rs` against inari+MPFR as
  # oracle, asserting `oracle ⊆ ours` on millions of drawn cases. It was a
  # by-hand gate until now, for a good reason and a bad one.
  #
  # The good reason is cost: it builds GMP and MPFR from C source, measured
  # at 234s of a ~250s job on a hosted runner (#480). It is keyed on the
  # PATHS under interval-transcendentals/ rather than on the tier, because
  # that crate is its own workspace and so every change to it lands in
  # TIER=all — which is most merges. See ci-filter.py's ORACLE_PATHS.
  # Measured churn: 2 of the last 400 first-parent merges, both during the
  # crate's creation. Order of eight runner-minutes a year.
  #
  # The bad reason is that "run it by hand when the pads change" is a
  # convention with no enforcement, and it had already failed silently:
  # the tier did not BUILD at all (the README's x86-64-v3 floor was retired
  # out from under it, #480) and nobody noticed, because nothing ran it.
  oracle-certify:
    name: interval oracle (certify vs inari+MPFR)
    runs-on: ubuntu-latest
    needs: filter
    if: github.event_name != 'push' && needs.filter.outputs.run_interval_oracle == 'true'
    # inari's rounding primitives sit behind
    # cfg(all(target_feature = "avx", target_feature = "fma")) and it raises
    # a compile_error! without them. The repo sets no target-cpu floor
    # (.cargo/config.toml, deliberately), so the flag is supplied HERE, on
    # the one lane that needs it, leaving the kernel's codegen untouched.
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    steps:
      - uses: actions/checkout@v4
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: interval-oracle
          workspaces: interval-transcendentals
      # Assert the runner can execute what -C target-cpu=x86-64-v3 emits
      # BEFORE spending four minutes building GMP for it. Exactly the sort
      # of thing that holds on one runner generation and not the next.
      - name: the x86-64-v3 floor holds on this runner
        run: |
          grep -q avx2 /proc/cpuinfo || { echo "NO AVX2 — the v3 floor does not hold here"; exit 1; }
          grep -q fma /proc/cpuinfo || { echo "NO FMA"; exit 1; }
      # gmp-mpfr-sys needs a C toolchain plus m4; ubuntu-latest carries
      # build-essential but m4 is worth asserting rather than assuming.
      - name: m4 for the gmp build
        run: sudo apt-get update -qq && sudo apt-get install -y -qq m4
      # Depth is nearly free on this lane and that is the whole reason to
      # spend it. The build above is a fixed ~234s; the cases are ~7s at
      # effort 1 (measured hosted, #480) and scale linearly — 8.2x measured
      # locally from effort 1 to 8. So effort 8 buys 32M cases per firing
      # for about 52s on top of a 250s job.
      #
      # Together with the varying seed this is the point of the exercise:
      # a lane that fires twice a year with a pinned seed re-certifies one
      # fixed sample forever, however deep it is. Fresh millions each
      # firing is worth more than the same millions faster.
      - name: certify against the oracle
        working-directory: interval-transcendentals
        env:
          CAD_FUZZ_EFFORT: "8"
        run: |
          t0=$SECONDS
          cargo test --release --features oracle-inari -- --nocapture
          echo "CASES_SECONDS=$((SECONDS - t0))"

  # THE `watertight (admesh)` JOB STOOD HERE, AND HAS MOVED TO
  # .github/workflows/nightly.yml (Evan, 2026-08-22). Its evidence is its own
  # history: one solo red in 37 days of gate runs, and that one was a rustup
  # outage rather than a mesh. It is a PERSISTENCE-detector — a non-manifold
  # body stays non-manifold — so a nightly finds what this row would have
  # found, a few hours later, at 1-2 billed minutes a day instead of per PR.

  step-import:
    name: step import (freecad)
    runs-on: ubuntu-latest
    needs: filter
    # Root package `step-export`: this job builds nothing — it runs FreeCAD
    # over the committed fixtures under crates/step-export/tests/fixtures,
    # which are byte-golden against that crate's writer.
    if: github.event_name != 'push' && needs.filter.outputs.run_step_export == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      # External STEP import acceptance (M4 PR 7, the admesh pattern
      # STEP-shaped): FreeCAD/OCC imports the committed fixtures
      # (byte-golden against the writer via the cargo test suite) and
      # the script asserts validity + exact topology counts + volume.
      # No cargo build needed — the fixtures are committed.
      # apt has no freecad package on current ubuntu-latest (exit 100,
      # 2026-07-25); use the version-pinned AppImage instead — same
      # FreeCAD 1.1.2 as the local oracle, checksum-verified, cached.
      - name: cache freecad
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: ~/freecad-appimage
          key: freecad-1.1.2-appimage-extracted
      - name: install freecad (AppImage 1.1.2, checksum-verified)
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/freecad-appimage && cd ~/freecad-appimage
          curl -sLO https://github.com/FreeCAD/FreeCAD/releases/download/1.1.2/FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
          curl -sLO https://github.com/FreeCAD/FreeCAD/releases/download/1.1.2/FreeCAD_1.1.2-Linux-x86_64-py311.AppImage-SHA256.txt
          sha256sum -c FreeCAD_1.1.2-Linux-x86_64-py311.AppImage-SHA256.txt
          chmod +x FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
          ./FreeCAD_1.1.2-Linux-x86_64-py311.AppImage --appimage-extract > /dev/null
          rm FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
      - name: freecad import check (validity, counts, volume)
        run: REQUIRE_FREECAD=1 FREECADCMD="$HOME/freecad-appimage/squashfs-root/usr/bin/freecadcmd" scripts/check_step.sh

  # LIB PY-CI (residual register R4; U10 follow-up F4): the Python suite
  # as a hosted job. Builds the pncad wheel with maturin, installs it
  # into a venv, and runs the FULL crates/pncad-py unittest set by
  # DISCOVERY — the same invocation crates/pncad-py/run-python-tests.sh
  # uses — so new test modules (e.g. #318's test_guide.py /
  # test_north_star.py) are picked up the moment they merge, with no
  # edit here. DELIBERATELY OFF the Rust-only critical path: nothing
  # `needs` this job, and the Rust jobs stay green with no Python
  # present (the U9S gating property — pyo3 rides the non-default
  # `python` feature, which only maturin turns on). Its failure still
  # reds the PR — that is the point.
  #
  # Root package pncad-py (see JOB_ROOTS in scripts/ci-filter.py): the
  # wheel compiles pncad-py's whole dependency graph — the entire façade
  # stack — so `pncad-py in closure` is exactly the condition under
  # which anything this job runs can have moved; the .py tests and .pyi
  # stub live under the member directory and seed the same closure.
  # Budget: one job, one Python version, no matrix, debug-profile build
  # (release is not required to prove the suite; the D9 bit-exactness
  # pins hold at any opt level — opt never moves rounding, and the
  # suite asserting so IS this job's evidence).
  # Local mirror: ci-local.sh's "python suite (staged cdylib)" row —
  # same tests, same discovery; the install path degrades to the staged
  # cdylib (run-python-tests.sh) so the row works even on the most
  # degraded box U9S measured (no pip, no maturin).
  python-suite:
    name: python suite (wheel + guide + north-star)
    runs-on: ubuntu-latest
    needs: filter
    if: github.event_name != 'push' && needs.filter.outputs.run_pncad_py == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      # Python pinned at 3.12 — the interpreter the suite was written
      # and validated on (U9S/DOORS/U10 all ran the local 3.12). The
      # wheel is abi3-py38, so this is a determinism pin, not a
      # compatibility ceiling. actions/setup-python@v5 (GA 2023-12)
      # clears the ~2-week age policy by years — the same
      # long-aged-major-tag class as the checkout@v4 / cache@v4 /
      # upload-artifact@v4 pins this workflow already rides.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      # Separate cache key: the `python` feature graph (pyo3 + 4 more
      # crates) differs from every other job's — same CACHE SEPARATION
      # reasoning as build-interval (job-id separation is automatic;
      # the explicit key makes it intentional and survives a rename).
      - uses: Swatinem/rust-cache@v2
        with:
          key: python
      - name: install maturin (pinned, official prebuilt)
        run: curl -LsSf "https://github.com/PyO3/maturin/releases/download/v$MATURIN_VERSION/maturin-x86_64-unknown-linux-musl.tar.gz" | tar zxf - -C "$HOME/.cargo/bin" maturin
      # Debug profile on purpose (no --release): fastest honest build.
      # pyproject.toml's [tool.maturin] supplies module name + the
      # `extension-module` feature; abi3 needs no Python.h.
      - name: build the pncad wheel (abi3, debug profile)
        run: maturin build -m crates/pncad-py/Cargo.toml -o target/wheels
      # The venv lives OUTSIDE target/ deliberately: rust-cache caches
      # target/, and a cached venv skeleton restores without its bin/
      # contents (the 2026-08-10 red-main incident — the PR run passed
      # on a cold cache, main restored a mangled venv). RUNNER_TEMP is
      # never cached; --clear guards against any reuse regardless.
      - name: install the wheel into a venv
        run: |
          python -m venv --clear "$RUNNER_TEMP/py-ci-venv"
          "$RUNNER_TEMP/py-ci-venv/bin/python" -m pip install target/wheels/pncad-*.whl
      # The STATIC half of the §L4 type story (LIB-PYG1): `ty` checks
      # the .pyi lattice's SIGNATURES, which the name-for-name stub
      # check deliberately does not look at. Pinned like maturin; this
      # step is where the row is MEASURED, so a fetch failure reds the
      # job rather than passing quietly, and `tests/test_ty.py` fails
      # outright wherever no checker is present.
      - name: install ty (pinned, the static stub checker)
        run: |
          "$RUNNER_TEMP/py-ci-venv/bin/python" -m pip install "ty==$TY_VERSION"
      # Discovery from the repo checkout: guide tests read the docs/
      # Markdown relative to their own file, and the stub check is
      # layout-invariant (validated on the wheel-venv layout, #308).
      - name: run the Python suite (unittest discover)
        run: |
          "$RUNNER_TEMP/py-ci-venv/bin/python" -m unittest discover \
            --start-directory crates/pncad-py/tests \
            --top-level-directory crates/pncad-py/tests \
            --verbose
        env:
          PNCAD_TY: ${{ runner.temp }}/py-ci-venv/bin/ty

  # (The former standalone `multi-eps` job is FOLDED into the `test`
  # matrix above: its 1e-6/1e-12 rows and the old unparameterized `test`
  # job were three compilations of bit-identical binaries; they are now
  # three run-only legs over one archive. D4 ¶1's multi-ε obligation is
  # unchanged — same three eps bands, same scoped test set.)

  # THE `persistence` AND `band 4 corpus` JOBS STOOD HERE, AND ARE
  # DELETED (2026-08-22, Evan: "no need to make any special attempt to
  # keep m4_pr8_corpus visible. just make it a normal test").
  #
  # WHAT THEY WERE. Two jobs that re-ran `m4_pr6_roundtrip::`,
  # `m4_pr6_floats::`, `m4_pr6_golden::`, `m4_pr6_eps_diff::`, the D6.3
  # schema/corruption rows and `m4_pr8_corpus::` at ε = 1e-6 AND 1e-12,
  # under `cargo test -p editor-core`, so that those obligations were
  # ATTRIBUTABLE at a glance from the checks list.
  #
  # WHY THEY WENT. Every one of those modules is an ordinary `#[test]`
  # in the nextest archive and already runs in the `test` job — at the
  # ε THIS RUN DREW. These jobs ran them at two fixed ε unconditionally,
  # which is not extra coverage, it is the ε sampling defeated for those
  # modules: the whole premise of the 2026-08-22 draw is that repetition
  # covers the matrix, and a job pinning two of the three bands re-buys
  # on every run what the draw was there to spread out. The ordering is
  # the whole story — the ε-collapse landed 2026-08-20 and the sampling
  # 2026-08-22, so this was a leftover rather than a decision.
  #
  # NO REPLACEMENT MECHANISM, deliberately: no filter expression, no
  # named row, no doc pointer. "Attributability" was the only thing
  # these jobs bought, and a test that fails names itself in nextest's
  # output. `m4_pr6_eps_diff::` never needed the loop at all — it
  # re-execs itself per ε (the only way two ε values can exist in one
  # audit), so the outer 1e-6/1e-12 loop was redundant for it under any
  # sampling regime.
  #
  # −4 billed minutes per code-tier PR run. The local half's
  # `persist_*` / `corpus_eps` rows went with them; ci-local.sh runs
  # every ε of the whole suite on one tree, so nothing is lost there
  # either. The `(interval)` members of both families are NOT affected:
  # they are named steps of the `test-interval` job and stay.

  # THE `rebuild latency (reporting)` JOB STOOD HERE, AND HAS MOVED TO
  # .github/workflows/nightly.yml (2026-08-22). SPLIT, not cut:
  #
  #   * THE WALL-CLOCK TABLE went to the nightly, where a measurement lane
  #     belongs. It was billing two minutes on every code-tier PR to print a
  #     number no PR acts on — it is reporting, never a gate, and PERF-PLAN
  #     stays advisory. That job keeps the append-only history commit and its
  #     main-only guard, and gains a `workflow_dispatch` ref input so a
  #     regression can be bisected on demand rather than only forward.
  #   * THE STRUCTURAL PINS stayed on the PR side and got CHEAPER: counted
  #     reuse and the corpus manifest's nodes/cone are exact, machine-
  #     independent and ε-independent, so they are an ordinary non-`#[ignore]`d
  #     `#[test]` in editor-core now, inside the nextest archive, gating every
  #     PR at about zero marginal cost. That is MORE coverage than this job
  #     gave them: it ran on `run_editor_core` only.
  #
  # `run_editor_core` still has consumers (the two named `test-interval`
  # steps), so the filter's plumbing for it stays.

  # Spec D3: the large-K fragility lint. A GATE — a flagged margin
  # fails this row (the tool exits 2 and prints the interpretation
  # discipline; harness breakage exits 1 in its own voice). The row
  # also fails on a hygiene regression or the #99 litmus no longer
  # firing.
  #
  # READ THE FAILURE BEFORE TOUCHING GEOMETRY: a fired lint is evidence
  # that the margin DISTRIBUTION moved — possibly that a threshold or
  # the baseline is stale. Recourse is re-derivation (docs/K-REPORT.md,
  # "M7 addendum (2026-08-07): the large-K lint's floor refresh"), or a
  # recorded demotion to advisory; never a geometry nudge to get under
  # the threshold. The tool prints all of this on failure.
  #
  # The committed baseline + threshold provenance:
  # docs/k-report-data/m7-eps-*.csv.gz and tools/k-lint/src/lib.rs
  # (docs/K-REPORT.md M7 addendum has the histogram, the percentile
  # re-argument, and the ε-coupled ruling; the m4-/m5- baselines stay
  # committed as the durable record).
  k-lint:
    name: k-lint (gate)
    runs-on: ubuntu-latest
    needs: filter
    # No minimal root set, deliberately: this is the ONLY job that compiles
    # demos/tour (a path-dependent of nine members) and tools/k-lint, and
    # its probe sweep records margins from every kernel crate. So it runs
    # whenever anything builds at all.
    if: github.event_name != 'push' && needs.filter.outputs.run_k_lint == 'true'
    #
    # ONE OF FIVE FEATURE UNIFICATIONS PER RUN (2026-08-22, the same
    # configuration-sampling ruling that draws the lane and the ε; the roster
    # and the soundness argument are at `KLINT_ROWS` in scripts/ci-filter.py).
    # DRAWN, EXCEPT WHERE IT IS PINNED: a change under `tools/` substitutes the
    # row that RUNS THAT CRATE'S OWN SUITE rather than sampling one (four of
    # these five rows COMPILE tools/tess-meter, through demos/tour's plain
    # dependency on it; only `dev-default` runs its tests — Evan's ruling,
    # 2026-08-29; the mapping and its derivation are at `KLINT_PATH_ROWS`, and
    # the run says `klint:pinned` in the step above). `demos/` is deliberately
    # left to the draw, argued at the same site.
    #
    # WHY THIS JOB AND NOT A CACHE FIX. This note used to open "it bills
    # 8-10 minutes — the third largest line item in the gate", and THAT
    # FIGURE IS STALE, in the exact way this repository keeps finding.
    # docs/CI-MINUTES-2026-08.md's per-job table does carry a `k-lint (gate)`
    # row at 9.78 wall / 10 billed — but that column is a ONE-SHOT reading of
    # reference run 32425890937, taken BEFORE the unification sampling this
    # very note goes on to describe. The same document's 2026-08-22 section
    # then derives that sampling at −7 to −8 billed minutes for this job, and
    # its 2026-08-31 addendum states the rule that settles it: a billed-minute
    # figure there is maintained BY HAND and is only true as of the
    # measurement it carries the run id for. So the pre-sampling row and the
    # post-sampling derivation are both the register's, they disagree by
    # design, and the sentence that quoted the first as current was wrong. A
    # reader wanting today's cost reads this job's own duration on any recent
    # run; a reader wanting the trend reads that document's later columns, not
    # its reference table.
    #
    # WHAT SURVIVES, and it is the only thing this argument needed: running
    # FEWER UNIFICATIONS is the lever, because the cost is
    # not one slow check: the
    # steps below compile demos/tour and the kernel crates FIVE TIMES, once
    # per unification, and the five share almost nothing. `--release` and dev
    # are different profiles; `budget` and `probe` are opt-in features gated
    # at a module boundary, so every crate that sees one carries a different
    # fingerprint under it. No cache configuration collapses five distinct
    # compilations into one — only running fewer of them does.
    #
    # EACH STEP CARRIES ITS OWN `if:` naming the row it belongs to, rather
    # than a matrix: the rows are not interchangeable (two of them consume a
    # CSV the step above them wrote), and a matrix would pay this job's setup
    # and cache restore five times to run one row's worth of work.
    # `klint_row == 'all'` is the no-seed spelling and runs everything; the
    # hosted `filter` job always passes a seed, so it is the local half's
    # value and a safety net rather than a live path here.
    #
    # SAID OUT LOUD, because two ratified review outcomes read on the steps
    # below as UNCONDITIONAL and are now 1-in-5:
    #   * MIN-1's per-triangle certificate falsifier, in `dev-budget`. The
    #     step's own comment says making the row conditional "reopens a
    #     ratified review outcome and must be said out loud" — this is that
    #     sentence, and the falsifier now runs on an expected 1 run in 5
    #     rather than on every build-triggering change.
    #   * `crates/sweep/tests/k_report.rs` and docs/K-REPORT.md both say the
    #     probe harness is type-checked and run "on every building merge".
    #     With `dev-probe` sampled that is false in those four words. The
    #     census gate greps for the STEP NAME, not for how often it runs, so
    #     nothing reds — the sentences are simply owed a correction.
    # Both are PERSISTENCE-detectors (a failed falsification, a probe suite
    # that stopped compiling, stay broken until fixed), which is what makes
    # the sampling sound; frequency is the only thing given up.
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude

      - uses: dtolnay/rust-toolchain@stable
      # ONE CACHE LANE PER PROFILE, keyed on the drawn row's first token.
      # A `--release` artifact and a dev one share no fingerprint, so a
      # single entry would be overwritten by whichever profile ran last and
      # served cold to the other; two entries let each draw restore what a
      # previous run of its own profile left. The features do NOT get lanes
      # of their own: `budget` and `probe` are gated at a module boundary
      # inside WORKSPACE crates, and Swatinem/rust-cache evicts workspace
      # crates before saving, so what an entry actually holds is the
      # third-party dependency graph — which the feature selection barely
      # moves and the profile moves entirely.
      - uses: Swatinem/rust-cache@v2
        with:
          key: k-lint-${{ startsWith(needs.filter.outputs.klint_row, 'release') && 'release' || 'dev' }}
          workspaces: |
            .
            demos/tour
            demos/wild
            tools/k-lint
            tools/tess-lint
            tools/tess-meter
      # Hosted mirror of ci-local's "demos tour (fmt + clippy)" row:
      # the tour is workspace-excluded, so the fmt/clippy jobs above
      # never see it — and this is the job that builds it anyway (the
      # demo scenes are half the lint's subject matter). demos/wild
      # (the wild-corpus montage generator) rides the same row for the
      # same reason.
      - name: demos tour fmt + clippy
        if: contains(fromJSON('["dev-default", "all"]'), needs.filter.outputs.klint_row)
        run: cd demos/tour && cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - name: demos wild fmt + clippy
        if: contains(fromJSON('["dev-default", "all"]'), needs.filter.outputs.klint_row)
        run: cd demos/wild && cargo fmt --check && cargo clippy --all-targets -- -D warnings
      # THE #99 ε PIN, ARMED. `--all-targets` above type-checks the test
      # targets and runs none of them, so until this row landed nothing
      # in any gate had ever EXECUTED an assertion under `demos/`. The
      # pin spawns the tour three times (default ε, 1e-6, 1e-12).
      #
      # COST, AND IT IS NOT FREE. This row builds `demo-tour` in release
      # at DEFAULT features. The tess-budget sweep below builds the same
      # crate at `--features budget` — a different feature unification,
      # so the two share nothing and this job now pays two release
      # builds of the kernel where it paid one. The runs themselves are
      # ~7 s (measured on the lane's own box, warm cargo registry); the
      # build in front of them took 1m06 there from a cold target and
      # the sweep's own comment below prices such a build at "tens of
      # seconds" on a runner with this job's cache warm.
      #
      # THOSE TWO SECONDS FIGURES ARE A DEVELOPER BOX'S, UNDATED, AND
      # RE-TAKEN BY NOTHING — no register carries a demo-tour run time,
      # and this job's own duration is the only current reading of the
      # pair, printed on every run that draws this row. They are kept
      # because the SHAPE is what the siting argument uses: the runs are
      # cheap and the release build in front of them is not, so the
      # question is which build this row shares, not how many seconds it
      # spends. Neither number would change that answer if it moved by a
      # factor of two, and no threshold anywhere reads either. Folding the
      # pin into `--features budget` would share that build, and is
      # rejected: it would arm the per-face meter inside the run this
      # pin is about, so the tour under test would not be the tour that
      # ships.
      #
      # ARMED — no longer scoped to the integration test. This row ran
      # `--test eps_regression` alone while `--bin demo-tour`'s unit
      # tests carried red rows (#782), and the widening was owed the
      # moment #782 was decided. It is: TESS-SPLIT re-pinned
      # `finding_13_tessellation_table_reproduces` against the shipped
      # split schedule and posted the disposition, and every row of it
      # is green. So the whole `demos/tour` suite runs here.
      #
      # WHAT THE WIDENING BUYS, and it is why the obligation was
      # recorded rather than dropped: `lily.rs` keeps its frontier pins
      # in TWO spellings, and only the tour-runtime one (`wall_probes`)
      # was executable in the gate. The unit spelling includes
      # `the_spine_curl_wall_re_measured`, which pins a typed
      # `LoftError::ReversedStacking` from both sides — a frontier no
      # other row touches — plus the lily's geometric claims (taper,
      # roll, sepal tangency), `klein`'s wall-pair probes and both
      # `verbs_gate_r1_probes` modules. All of that was dead code in
      # the gate until this line.
      #
      # COST, MEASURED on the run that armed it (32973311618, this
      # row's own draw): release build 2m11, then the bin's unit tests
      # 0.21 s and the three-ε `eps_regression` tour runs 13.60 s. The
      # bin's unit tests link against the crate this row already builds
      # in release, so the widening pays a link plus ~14 s of running,
      # not a sixth feature unification. (Those same unit tests cost
      # ~412 s in the DEV profile — the finding-13 rows tessellate the
      # lily at δ = 2e-3 — which is why this row is the release one and
      # why widening the dev-default row instead would not have been
      # free.)
      - name: demos tour suite (the #99 ε pin + the tour's own probes)
        if: contains(fromJSON('["release-default", "all"]'), needs.filter.outputs.klint_row)
        run: cd demos/tour && cargo test --release
      # THE COMMITTED DIE CORPUS IS STILL THE SCENE THAT AUTHORED IT.
      # `crates/editor-core/tests/corpus/die_composed_tour.rs` registers
      # the tour's composed die by replaying committed BYTES, because
      # `demos/tour` is a detached workspace the kernel must not depend
      # on. Bytes go stale silently; this step is why these ones cannot.
      # It regenerates through the tour's own door and diffs — the same
      # closure `crates/pncad-py/tests/corpus/bench/` still lacks
      # (issue #1186), available here only because this job already
      # builds `demo-tour` in release and the diff costs one sub-second
      # run of it.
      #
      # It rides this job's sampled row, so it is not a per-run gate: a
      # PR that changes the die scene and draws another row lands with
      # the corpus unchecked, and the next sampled run is where it goes
      # red. Stated rather than papered over — the alternative is a
      # sixth kernel build in the code tier for a file that moves rarely.
      #
      # The committed bytes record the ε they were written at, so this
      # runs at the ambient default like the row above it.
      - name: the tour die corpus is regenerable byte-for-byte
        if: contains(fromJSON('["release-default", "all"]'), needs.filter.outputs.klint_row)
        run: |
          cd demos/tour && cargo run --release -- die-corpus /tmp/die_composed_tour.pncad
          diff -u ../../crates/editor-core/tests/corpus/tour/die_composed_tour.pncad /tmp/die_composed_tour.pncad
      - name: k-lint tool fmt + clippy + tests (incl. the #99 litmus)
        if: contains(fromJSON('["dev-default", "all"]'), needs.filter.outputs.klint_row)
        run: cd tools/k-lint && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
      # NO `cargo doc` STEP HERE, and that is the fix rather than an
      # omission: this crate's prose — which carries the gate's own
      # rules and its report legend — was documented by a step #709
      # hand-copied here and #738 copied again for tess-meter, one root
      # at a time, with no shared home and nothing checking the copies.
      # `scripts/doc-gate.sh` now iterates every cargo root outside the
      # workspace, this one included, from a DERIVED list. Adding a
      # third copy is never the answer to a fourth root.
      - name: tess-lint tool fmt + clippy + tests (the three exit voices)
        if: contains(fromJSON('["dev-default", "all"]'), needs.filter.outputs.klint_row)
        run: |
          cd tools/tess-lint
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      # The meter's CONSUMER half: the CSV schema, the counterfactual
      # schedules and the split optimizer, which is where they live now
      # that the kernel records measurements and derives nothing. Its
      # tests are the derivations' tests — the split optimizer's answer
      # against the certificate it claims to satisfy, and the row
      # shapes' agreement about their width.
      # No `cargo doc` step here either, for the reason given at the
      # tess-lint row above. This crate's prose — the
      # slack factors, the anisotropy caveat, the boundary rule — moved
      # out of `crates/mesh/src/budget.rs` in #709 and went from covered
      # to uncovered BY MOVING; the rustdoc gate reads them now because
      # it reads every cargo root, not because this row remembers to.
      - name: tess-meter tool fmt + clippy + tests
        if: contains(fromJSON('["dev-default", "all"]'), needs.filter.outputs.klint_row)
        run: |
          cd tools/tess-meter
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      # THE METER'S KERNEL HALF, and the per-triangle certificate
      # falsifier with it. `mesh::budget` is gated at its module
      # boundary (mesh's `budget` feature), so the workspace test rows
      # above run the INERT half — which is the right default, and
      # exactly why the live half needs a row of its own or it rots.
      # Clippy too: two configurations, two lints (the
      # `unreachable!`-under-a-feature class has bitten twice, M8-F67,
      # precisely because a feature build had no clippy lane of its own
      # and hosted clippy could not see it).
      #
      # This row also runs
      # `probe_review::z1_per_triangle_certificate_falsification`, the
      # falsifier M8-5's review adopted (MIN-1) precisely so that "the
      # hosted gate runs it unconditionally". The falsification is now
      # the meter's deviation pass reduced to one ratio per face and
      # asserted in the suite, so it rides the `budget` build rather
      # than a feature of its own. THIS ROW IS NO LONGER UNCONDITIONAL,
      # and MIN-1's intent is met in a weaker form than it was written
      # in: the `if:` below draws it 1 run in 5, so the falsifier runs
      # on an expected fifth of build-triggering changes rather than on
      # all of them. The job header carries the argument for why that is
      # admissible and is not restated here — a failed falsification
      # PERSISTS in the tree, so a later draw finds it, and frequency is
      # the only thing given up. What the `tools/` path pin does NOT do
      # is restore it: this row's subject is `crates/mesh`, which no
      # pin reaches. Dropping the row, or narrowing it past the draw,
      # goes beyond what that argument covers and must be said out loud.
      - name: mesh budget meter + certificate falsifier (feature = budget)
        if: contains(fromJSON('["dev-budget", "all"]'), needs.filter.outputs.klint_row)
        run: |
          cargo clippy -p mesh --all-targets --features budget -- -D warnings
          cargo test -p mesh --features budget
      # THE UV SHEET DRIFT GATE WAS RETIRED HERE (2026-08-17). It
      # regenerated the sheet and failed on `git diff --exit-code`; that
      # obligation now belongs to render.yml's `uv` lane, which
      # RE-BASELINES instead — it commits the regenerated sheet and
      # marks the run neutral. Both rows fired on the same condition
      # (`run_k_lint`) and both read the SAME cached tour output (they
      # shared a cache key by construction), so this was a duplicate
      # signal, not an independent one — and keeping it would have made
      # every intended sheet change report red here and neutral there.
      # One gate per obligation, as before; the obligation moved.
      #
      # The LOCAL mirror in local-scripts/ci-local.sh stays: a developer
      # box cannot re-baseline itself, so a failing check is still the
      # right shape there.
      #
      # `tour output cache` went with it. That step existed solely to
      # feed demos/out to this gate — the tess-budget and k-probe sweeps
      # below build the tour themselves and write their own outputs, and
      # neither reads demos/out. render.yml keeps its own copy of the
      # cache on the same key, so the entry stays warm.

      # The tessellation-budget gate (issue #320). It rides THIS job
      # because this job is the one that builds demos/tour, and the
      # sweep IS the tour walking its own scenes (~4 s in release — an
      # undated reading on this job's own runner, re-taken by nothing but
      # visible in this step's duration on every run that draws the row;
      # no threshold reads it and the siting argument needs only that the
      # sweep is cheap against the build in front of it).
      #
      # COST, stated: this step now ALWAYS pays the tour's release
      # build — the uv-drift step that used to pay it on a cache miss
      # is retired (note above), so there is no longer a path where
      # someone else has already built it. That is the tour binary, not
      # its dependencies: tens of seconds against this job's own
      # critical path, not the workflow's. It is
      # deliberately not a debug run (the k-probe sweep's profile), and
      # the release/debug cost ratio that decides that is stated ONCE, in
      # `scripts/tess_budget_sweep.sh`'s RELEASE paragraph, which is also
      # where the `--features budget` flag lives. Not restated here: this
      # file used to carry its own copy of that ratio, and two copies of
      # an unguarded measurement are two things to keep in step. The
      # `--features budget` that arms the meter at all lives in the sweep
      # script, once, beside the k-probe sweep's `--features probe`.
      #
      # It gates REGRESSION,
      # not absolute slack: the head's factors are large and known
      # (docs/TESS-BUDGET.md), so an absolute threshold could only be
      # set above them, and the one thing that must never happen is
      # someone coarsening a demo's delta to get a number down. What
      # this catches is ROSTERED IN `tools/tess-lint`'S MODULE DOCS AND
      # NOWHERE ELSE, this file included — no count here, and no list.
      #
      # The enumeration this replaces is why. It read THREE for as long
      # as rule 4 had existed; corrected to four, it was stale again
      # within a day, because the uncovered-scene rule landed as rule 5
      # while the correction was in flight. A roster kept beside the
      # thing it describes drifts at the rate that thing changes, and
      # this one is three copies deep (`docs/TESS-BUDGET.md` and
      # `local-scripts/ci-local.sh` say it the same way now). A pointer
      # cannot go stale.
      #
      # Baseline + how to re-cut it: docs/tess-budget-data/ and the
      # tool's own failure message, which prints the recourse.
      #
      # `--sizing-only`, deliberately: the default sweep also resamples
      # |S - Pi| on every emitted triangle to fill `worst_dev`, which is
      # ~1.15M triangles x 28 barycentric samples — tens of millions of
      # surface evaluations — and the gate reads NONE of it. That is
      # still the claim this flag rests on, and it is narrower than
      # "the gate reads the sizing columns": what `compare` COMPARES is
      # triangle counts per scene and `grid_cells / span_opt_cells` per
      # face, and what it JOINS on is `chart`, whether the row carries
      # the sizing block at all, and `u0`-`v1` / `nu` / `nv`. Every one
      # of those the lane produces for free; not one is a deviation
      # column. The deviation pass is what the WRITEUP needed
      # (docs/TESS-BUDGET.md's total-slack column, and the committed
      # baseline still carries it); re-cutting the baseline runs the
      # script without this flag.
      - name: tessellation-budget sweep (every tour scene, per face)
        if: contains(fromJSON('["release-budget", "all"]'), needs.filter.outputs.klint_row)
        run: scripts/tess_budget_sweep.sh target/tess-budget-fresh.csv --sizing-only
      - name: tessellation-budget lint (gate — a grown budget fails this row)
        if: contains(fromJSON('["release-budget", "all"]'), needs.filter.outputs.klint_row)
        run: |
          cd tools/tess-lint && cargo run -- \
            ../../target/tess-budget-fresh.csv \
            --baseline ../../docs/tess-budget-data/tess-budget-baseline.csv
      # THE PROBE TEST SURFACE. `probe` is an opt-in feature, so a
      # `tests/*.rs` behind `#![cfg(feature = "probe")]` is invisible to
      # every default row in this file: it can rot into a build error, or
      # out of existence, with the whole matrix green. Before this loop
      # the only ones ever compiled were `editor-core`'s, as a side
      # effect of the sweep below rather than by anything that meant to.
      # How many there are is not written here: the census gate derives
      # the tally every merge and prints it per crate.
      #
      # WHY HERE AND NOT IN A JOB OF ITS OWN, which is the shape
      # `release-corruption` above would suggest. That job is separate
      # because release artifacts share no fingerprint with any
      # dev-profile job, so it had to own a cache key. The opposite holds
      # here: this is already the only job that passes `--features
      # probe`, so its cache is where the probe-instantiated graph lives,
      # and its gate (`run_k_lint`, "whenever anything builds") is
      # already the right one — `probe` is a `Real` instantiation, so a
      # change in ANY kernel crate can break a probe suite's type-check,
      # and a job keyed on a hand-written root set would be the same
      # snapshot-goes-stale failure one level up.
      #
      # WHAT THAT COSTS, stated so a debugger is not surprised by it:
      # COUPLING, and about 40 s a merge. A probe type-check failure now
      # reds `k-lint`, which is otherwise the margin-distribution gate:
      # if this job is red at the step below, the margins are not the
      # subject — a probe-gated `tests/*.rs` stopped compiling, and
      # nothing about the K thresholds has moved.
      #
      # The 40 s is the number to plan against, not the ~1 s a fully warm
      # local tree shows. `rust-cache` does not cache workspace crates,
      # only deps (see this file's cache header), so the operating point
      # is a restored dep graph with every member recompiled: 37-41 s
      # measured over two runs on a 4-vCPU agent container, against
      # 43-61 s from an empty target dir. A RATIO, not a hosted number.
      #
      # The selection is DERIVED, not listed: the census gate (in the
      # `discipline` job, which owns its guards and its self-test) scans
      # the tree, and this loop checks exactly what it prints, so a crate
      # that gains its first probe suite is covered with nothing to
      # remember. THE SUBSTITUTION IS BOUND FIRST, deliberately: a
      # command substitution inside a `for` list is not subject to
      # `set -e`, so a census refusal there would print its error and
      # leave this step green over zero crates — the silence one level
      # up from the one the census exists to remove.
      # BUILD, NOT CHECK, AND THE MEASUREMENT IS WHY. `--all-targets
      # --no-run` covers everything `cargo check --all-targets` covered —
      # the lib's own `#[cfg(test)]` modules included — and then some,
      # since it links what it checked. Doing both instead pays codegen
      # twice over: measured on this job, check-then-list summed 271 s
      # with the sweep against 219 s for build-then-list, because rmeta
      # from the check buys the link nothing.
      #
      # The `--list` pass then asks the compiler which of the CENSUSED
      # suites it actually built. A gate can be spelled correctly and be
      # true under no configuration CI runs — a second feature the loop
      # does not enable, a non-feature condition false on every runner —
      # and no predicate over the gate LINE can tell that from a gate that
      # compiles. The listing is piped into the census rather than judged
      # here, so the deciding half keeps its `--root` and `--selftest`.
      #
      # None of the link is waste: `scripts/k_probe_sweep.sh` runs
      # `--test all` on the next step but one, and this primes it.
      - name: compile and list every probe-gated test target
        if: contains(fromJSON('["dev-probe", "all"]'), needs.filter.outputs.klint_row)
        run: |
          set -euo pipefail
          crates=$(scripts/gates/probe-suite-census.sh --crates)
          test -n "$crates"
          echo "probe-gated crates: $(echo "$crates" | tr '\n' ' ')"
          for c in $crates; do
            # A censused gate may CONJOIN `probe` with another opt-in
            # feature (`all(feature = "probe", feature = "interval")` —
            # the E6 driver suite; `k_probe_sweep.sh`'s `feats_for` is
            # the same fact one step later). Derive those features from
            # the gate LINES themselves — the census's own predicate
            # shape — so the compile here builds every counted suite
            # and `--check-listing` judges a real listing. Additive
            # only: extra features can never hide a probe-gated suite
            # (the census's stated blind spot, `not(feature = …)`,
            # excepted — no such gate exists and the census documents
            # it).
            extra=$(grep -hE '^#!\[cfg\(.*feature = "probe"' "crates/$c"/tests/*.rs 2>/dev/null \
              | grep -oE 'feature = "[a-z0-9_-]+"' | grep -v '"probe"' \
              | sed 's/feature = //; s/"//g' | sort -u | paste -sd, -) || true
            feats="probe${extra:+,$extra}"
            echo "building $c with --features $feats"
            cargo test -p "$c" --features "$feats" --all-targets --no-run
            cargo test -p "$c" --features "$feats" --test all -- --list \
              | scripts/gates/probe-suite-census.sh --check-listing "$c"
          done
      # Runs the M2-era harness (crates/sweep) beside the M4/M5/M7 one
      # (editor-core + tour) — see the script header for why its dump
      # rides beside the linted CSV rather than inside it. A type-check
      # would not have caught what that harness actually did: it compiled
      # perfectly and panicked, unnoticed, for 26 days.
      #
      # IT ALSO RUNS THE DEFAULT SELECTION, once per rostered suite and
      # outside the ε loop, and FLOORS WHAT IT RAN. `--ignored` runs only
      # `#[ignore]`d tests, so every plain `#[test]` in a probe suite was
      # unreachable from this job — including one inside a module the
      # sweep already named. Once and not per ε because the property
      # those tests assert (one-sided greenness at `Probe`) is already
      # swept at three ε by the dump's own `run_doc`; what the default
      # selection adds is that the bodies execute, and the count of
      # `#[ignore]`d tests they skipped.
      #
      # THE FLOOR (`probe-suite-census.sh --check-executed`, called by the
      # script) reads the runner's own passed and ignored counts, never
      # which suites a filter could have matched: a filter naming a suite
      # of plain `#[test]`s selects the module and runs none of it, so
      # reachability and execution are different questions here. The
      # skipped count is what closes the set — it must equal what the
      # `--ignored` half ran, so a suite cannot grow a test no selection
      # reaches.
      - name: K-telemetry probe sweep (corpus + M2 corpus + demo scenes, 3 eps rows)
        if: contains(fromJSON('["dev-probe", "all"]'), needs.filter.outputs.klint_row)
        run: scripts/k_probe_sweep.sh target/k-fresh
      - name: large-K lint (gate — a flagged margin fails this row)
        if: contains(fromJSON('["dev-probe", "all"]'), needs.filter.outputs.klint_row)
        run: |
          cd tools/k-lint && cargo run -- \
            ../../target/k-fresh/k-eps-1e-6.csv \
            ../../target/k-fresh/k-eps-1e-9.csv \
            ../../target/k-fresh/k-eps-1e-12.csv

  # THE RENDER GATE. The committed montages are build products of the
  # kernel that nothing checked: for a while `k-lint` gated the UV sheet
  # alone, because it was the only lane a FreeCAD-less runner could
  # reproduce, and the other three rotted silently between hand-run
  # refreshes. All four are checkable now — hosted is their canonical
  # producer (#338) and a repeat hosted render is byte-identical — so
  # this calls render.yml rather than restating how a lane renders: ONE
  # definition, checked here and dispatched on demand there. (That
  # k-lint row was retired 2026-08-17 when the uv lane started
  # re-baselining itself; see the note where it stood.)
  #
  # It is free in wall clock. The lanes finish in ~150 s against this
  # workflow's ~460 s critical path (the test shards) — and THIS FILE
  # DOES NOT AGREE WITH ITSELF ABOUT THAT SECOND FIGURE. Three other
  # places state the same quantity, in different words and at different
  # magnitudes: the `fmt` job's header, the wasm32 step, and the OPT
  # LEVEL note on the default build job. They were taken at different
  # times under different sampling and opt-level rulings and they do not
  # reconcile. THE FIGURES ARE NOT RESTATED HERE — read them where they
  # stand, because a fifth copy is the defect, not the fix.
  #
  # BUT "NOTHING RE-TAKES IT" WOULD BE FALSE, and this is the part worth
  # getting right. The critical path is one job's archive step plus one
  # test shard, and nightly.yml's `opt-level calibration` lane COMMITS A
  # DATED SAMPLE OF BOTH on every firing: it reads `build test binaries +
  # archive` and `run archived tests` off real gate runs through the jobs
  # API and appends them to docs/perf-data/opt-level/, each carrying its
  # `run_id`, `head_sha` and `created_at`. So the two TERMS have a live
  # scheduled register at the runner's own box class. What that register
  # does NOT carry is their SUM, this job's own ~150 s, or the ratio
  # between them, and the OPT LEVEL note's own pair is dated to a named
  # run rather than undated. So the honest statement is: the components
  # are registered, the composition is not, and the four spellings differ
  # because each is a composition taken on a different day.
  #
  # The claim THIS note makes survives all four, because it is an
  # inequality with a factor of three in hand at the tightest of them
  # (~150 against ~460) and more against the others — and since the
  # 2026-08-22 lane merges they do it in two jobs rather than five, so they
  # cost fewer runner minutes and nothing else, and only on the same condition
  # `k-lint` uses — a render depends on the whole kernel, so "whenever
  # anything builds at all" is the right trigger for it too.
  #
  # A DRIFTING LANE FIXES ITSELF (2026-08-17): each lane commits its
  # re-rendered cells straight back to this PR's branch and marks the
  # run NEUTRAL — "!", not "x" — so accepting an intended render change
  # is `git pull` and a glance at the images, not a download-install-
  # commit-rerun cycle. See render.yml's header and
  # .github/actions/rebaseline-lane for why neutral rather than red.
  #
  # `push_to` is the BRANCH, while the render itself runs on
  # `github.ref` — the PR's MERGE commit on a pull_request, main's tip
  # on a push. Rendering the merge preview and committing to the head
  # branch is self-consistent because this gate always compares against
  # that same merge preview, and main's own push run re-renders and
  # re-baselines again after the merge if the two ever part.
  #
  # Scene concurrency is left to render.yml's own default (2, the
  # runner's core count) rather than restated here: this job renders the
  # canonical frames, so it must not be the place a second opinion about
  # how they are produced can creep in.
  # NO LOCAL MIRROR: a caller with no steps of its own. It hands render.yml
  # its lanes, and each of THAT file's jobs says at its own key whether it has
  # a local half — `scene-inputs` does and is cited, `montage` says why it
  # cannot. One reason written here would have to be true of both, and the
  # FreeCAD one is true of `montage` alone: the local half already runs the
  # renderer-free lanes' work through `uv sheet drift (demos)`.
  renders:
    name: render lanes
    needs: filter
    # NOT ON A DISPATCH, the one exclusion from the `!= 'push'` rule at the
    # top of this file. A configuration dispatch names a lane, an ε and a
    # k-lint row; no render lane reads any of the three, so re-rendering ~55
    # cells would be the most expensive part of the run and could not differ
    # from what the same tree already rendered. The lanes also re-baseline
    # against a BRANCH, and a dispatch is the one entry point with no pull
    # request to report on. render.yml keeps its own `workflow_dispatch` for
    # when new frames are the thing being asked for.
    if: github.event_name != 'workflow_dispatch' && needs.filter.outputs.run_k_lint == 'true'
    uses: ./.github/workflows/render.yml
    # A reusable workflow gets the CALLER's token scope, and this
    # workflow declares none at the top level — so the lanes' own
    # `permissions:` blocks cannot grant what this job never had.
    permissions:
      contents: write
      checks: write
    with:
      gate: true
      lanes: all
      # PUSH_TO ONLY ON MAIN (2026-08-18). A bot commit onto a PR branch
      # becomes the PR's head, and a GITHUB_TOKEN push triggers no run
      # of its own — so the PR would show one neutral check and nothing
      # else, every green check stranded on the parent commit. Measured
      # on this workflow's own PR (#598): 30 green jobs on 048edc9, and
      # a head commit carrying a single check. The recursion guard and
      # that blank slate are the same fact, so PRs REPORT and main
      # COMMITS — the same rule the rebuild-latency history follows,
      # and now one rule rather than two answers to one question.
      push_to: ${{ github.event_name == 'push' && github.ref_name || '' }}
      # The sha the report-only drift check is posted against. On a
      # pull_request `github.sha` is the merge commit and a check there
      # never appears on the PR, so name the PR's head explicitly.
      report_sha: ${{ github.event.pull_request.head.sha || github.sha }}
