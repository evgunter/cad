name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The toolchain (channel + rustfmt/clippy components) comes from
# rust-toolchain.toml: the dtolnay step only bootstraps/updates rustup, and
# rustup's toolchain-file override then auto-installs the pinned 1.97.0 with
# its components on the first cargo invocation. The pinned compiler (D9 / L2)
# has a single source of truth — the toolchain file.

jobs:
  discipline:
    name: discipline (evaluation-code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Evaluation-code discipline tripwire (see the `real.rs` module docs):
      # a type parameter written `T: Real + PartialOrd` (or any other extra
      # bound) is the escape hatch that lets generic evaluation code smuggle
      # raw comparisons past the trait — it compiles at f64 and only dies at
      # the interval instantiation. Fail if any `Real +` bound combination
      # appears in crate sources. grep exits 1 (no match) on a clean tree —
      # that is the PASS case; a match exits 0 and we fail loudly here. When
      # a legitimate `Real +` combination first appears, refine this into an
      # allowlist as a design decision — do not silently delete the check.
      - name: no extra bounds on Real
        run: |
          if grep -rnE '\bReal\s*\+' crates/*/src; then
            echo "::error::found 'Real +' bound(s) above — evaluation-code discipline forbids extra bounds on scalar type parameters"
            exit 1
          fi

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  interval:
    name: test (interval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The `interval` feature builds inari's bundled GMP+MPFR from C
      # source (gmp-mpfr-sys), whose autotools configure needs m4.
      - name: install m4
        run: sudo apt-get update && sudo apt-get install -y m4
      - uses: dtolnay/rust-toolchain@stable
      # Distinct cache key: the GMP/MPFR C build takes minutes and its
      # artifacts live in target/, so this job must not share (and evict)
      # the default-feature jobs' caches.
      - uses: Swatinem/rust-cache@v2
        with:
          key: interval
      - run: cargo test --workspace --features interval
      # One multi-ε row at interval type (D4 ¶1): the interval band test
      # re-derives every assertion from the run's ε, so this genuinely
      # exercises a different band.
      - run: cargo test --workspace --features interval
        env:
          CAD_TOLERANCE_EPS: 1e-6

  multi-eps:
    name: test (eps = ${{ matrix.eps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eps: ["1e-6", "1e-9", "1e-12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # D4 ¶1: run the suite at several ε values to smoke out
      # tolerance-sensitive algorithms. CAD_TOLERANCE_EPS gets wired to
      # Tolerance initialization in PR 2 (L3); for now it just parameterizes
      # the same test run so the matrix and the env var name land early.
      - run: cargo test --workspace
        env:
          CAD_TOLERANCE_EPS: ${{ matrix.eps }}
