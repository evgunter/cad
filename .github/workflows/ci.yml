name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# BUILD ONCE PER COMPILE MODE (2026-08-03, Evan's ask: "compile the code
# for each mode, then shard the tests"). The eps test rows run
# BIT-IDENTICAL binaries — CAD_TOLERANCE_EPS is read at RUNTIME
# (geom-core/src/tolerance.rs), never at compile time — so compiling the
# workspace once per eps row was pure redundancy (measured ~8.5-9.5 min of
# each row's ~12 min was compile; execution is ~3 min). Only the
# `interval` feature is a different build graph. So: two BUILD jobs
# (`build`, `build-interval`), each `cargo nextest archive` + artifact
# upload, and thin RUN jobs that download the archive and only execute.
#
# cargo-nextest is the archive/run vehicle, PINNED here (single source of
# truth for the version): 0.9.140, published 2026-07-05 — ~4 weeks old at
# adoption (2026-08-03), past the 2-week dependency-age rule; a dev/CI
# tool only, never in any shipped build graph. Install is the official
# get.nexte.st prebuilt at the pinned URL — no third-party action — via
# the in-repo composite `.github/actions/install-nextest`, which caches
# the binary by version and retries the cold-path fetch. Read that
# action's header for why: ~10 jobs per run need this binary, and an
# unretried per-job fetch made one host's bad minute a whole-gate
# failure.
# Nextest semantics vs `cargo test`, audited at adoption:
#   * process-per-test — strictly safer for the tolerance OnceLock
#     (every test gets a fresh global; nothing relied on shared init);
#   * per-test output capture — only affects log layout;
#   * DOC-TESTS DO NOT RUN under nextest — the workspace has real
#     doctests (incl. compile_fail blocks only the doctest runner
#     exercises), so each build job keeps a `cargo test --doc` step.
#
# LINK/DEBUGINFO KNOBS ON THE TWO BUILD JOBS (2026-08-04, from the
# Bazel-verdict measurement; Evan approved items 2/3/4 of its ranked
# alternatives). The verdict was NO to Bazel, on this evidence from run
# 30884593286: the `rebuild latency` job compiles all 10 workspace libs
# from scratch plus ONE test binary in 20.16 s, while `build + archive`
# compiles the same libs plus 261 binaries in 8 m 34 s (514 s). So ~494 s
# (96%) of the build job is the 261 test-binary codegen+link actions,
# ~1.9 s each. Bazel caches actions; it does not make them cheaper, and
# the reverse-dep funnel (touching geom-core invalidates 249/249 test
# binaries; 6 of the last 16 crate-touching merges did exactly that)
# means the cache would miss anyway. So: attack the per-binary cost.
#
#   RUSTFLAGS=-C link-arg=-fuse-ld=mold   RETIRED 2026-08-12 — see the
#     LINKER note directly below. It was correct for 261 links and is not
#     correct for 14.
#   CARGO_PROFILE_{DEV,TEST}_DEBUG=line-tables-only   CI was emitting
#     full DWARF across 261 binaries and then throwing it away at link
#     (CARGO_PROFILE_TEST_STRIP=debuginfo, kept below for the 500 MB
#     artifact quota). Stripping already forfeited line numbers, so this
#     loses nothing CI had; function names in backtraces survive.
#
#   MEASURED, PR #174 (all timings tier `all`, same 261-binary archive;
#   PR #177 then collapsed 251 of those 263 binaries into 12 aggregators —
#   see any crates/*/tests/all.rs header for the pattern — so the
#   per-binary constant now multiplies one aggregated target per crate
#   rather than 263. The count itself is NOT restated here:
#   `scripts/gates/test-aggregation.sh` derives it from `cargo metadata`
#   on every merge and prints it, and a number copied out beside a claim
#   is a second, unchecked copy of something the tooling already knows):
#     default build compile step   514 s -> 389 s  (-24%)
#     interval build compile step  618 s -> 495 s  (-20%)
#   The runner is 2 vCPU / 7 GB (`nproc` from the provenance step below —
#   standard GitHub-hosted for a private repo; the Bazel report's "4 vCPU"
#   was wrong). That is why 261 independent link/codegen units are so
#   expensive here, and why item 1 (collapsing 249 test crates into ~12)
#   is still the big one.
#
# LINKER — mold RETIRED 2026-08-12. #174 adopted it on a -24%/-20% result
# measured across 261 static links; that is the whole basis for it, and
# the basis is gone. #179 and #387 took this workspace to ONE test target
# per crate — `scripts/gates/test-aggregation.sh` enforces that invariant
# and prints the resulting total; it does not assert a particular number,
# so no number is copied here — and the per-binary link constant mold
# attacks now multiplies that handful, not 261. Two independent readings
# say it no longer pays:
#   * LOCAL, measured 2026-08-11 at today's target count:
#     189 s baseline vs 186 s with mold — noise. That measurement is
#     written up in docs/LOCAL-BUILD-PERF.md, which reverted mold locally
#     and said in as many words: "Revisit only if the test-target count
#     grows back toward triple digits."
#   * The install is not free and sits ON the critical path: `apt-get
#     install mold` measured 9-21 s per build job over 11 runs, against a
#     link cost it can now only shave a fraction of.
# Opt-level 2 (see the OPT LEVEL note on the build job) pushes this
# further the same way: it makes compile the dominant term and shrinks
# link's share again.
# HOW TO PUT IT BACK, if the archive step regresses: restore
# `RUSTFLAGS: "-C link-arg=-fuse-ld=mold"` to both build jobs' env plus
# their `install mold` step. Do it on a measurement, not a hunch — and
# note that a single run cannot settle it, because any env change here
# rotates the rust-cache key and buys one cold rebuild.
#
#   BUILD_RUNNER   repo variable, unset today ⇒ `ubuntu-latest`. Item 4
#     of the ranked list (8-vCPU runner) is NOT LANDABLE on this repo:
#     GitHub-hosted larger runners require an ORGANIZATION on Team or
#     Enterprise Cloud, and evgunter/cad is a User-owned private repo
#     (`gh api repos/evgunter/cad --jq .owner.type` ⇒ "User"). Hard-coding
#     a larger-runner label would fail the build job with "no runner
#     matching labels" and take the whole gate — and the two build jobs
#     are the gate's critical path. The variable makes it a one-setting
#     flip if the repo ever moves under an org. Note also that larger-
#     runner minutes are billed SEPARATELY from the included-minutes
#     allowance this repo's change filter exists to protect.
#
# NOT MIRRORED into local-scripts/ci-local.sh, deliberately: these are hosted-
# runner performance knobs, not gate semantics. No job is added, removed
# or re-scoped, the same targets are compiled and the same tests run, so
# the local gate stays byte-for-byte equivalent in what it PROVES. The
# mirror convention covers the matrix, not the runner's linker.
env:
  NEXTEST_VERSION: "0.9.140"
  # maturin rides the same pattern as nextest: pinned here (single source
  # of truth), installed from the official GitHub-release prebuilt at the
  # pinned URL — no third-party action. 1.14.1 (released 2026-06-19) is
  # the exact binary the U9S/DOORS/U10 wheels were built and validated
  # with locally; ~7 weeks old at adoption (2026-08-09), well past the
  # 2-week dependency-age rule. A dev/CI tool only — it never enters any
  # shipped build graph (the wheel's compiled code is cargo's output).
  MATURIN_VERSION: "1.14.1"
  # `ty`, the static stub checker (LIB-PYG1). 0.0.39 was published
  # 2026-05-22, so it clears the >=2-week dependency age policy by
  # weeks.
  TY_VERSION: "0.0.39"

# The toolchain (channel + rustfmt/clippy components) comes from
# rust-toolchain.toml: the dtolnay step only bootstraps/updates rustup, and
# rustup's toolchain-file override then auto-installs the pinned 1.97.0 with
# its components on the first cargo invocation. The pinned compiler (D9 / L2)
# has a single source of truth — the toolchain file.
#
# KEEP IN SYNC with local-scripts/ci-local.sh (the local mirror of this matrix,
# the merge gate whenever hosted Actions is unavailable): a job added,
# removed, or changed here gets the same change there, and vice versa.
# There is no structural enforcement — this pair of cross-references is it.
# The one thing that is NOT mirrored by hand is the change filter: both
# files call scripts/ci-filter.py and act on its output, so the tiering and
# the dependent closure have a single implementation and cannot drift.

jobs:
  # Change filter (added 2026-07-29, Evan's ask after the Actions-budget
  # exhaustion; made dependency-aware 2026-07-28). THREE tiers, and all of
  # the logic lives in scripts/ci-filter.py — this job is a thin wrapper
  # that wires that script's KEY=value output onto the `if:` conditions and
  # cargo arguments below. local-scripts/ci-local.sh calls the SAME script with
  # the same semantics, so the hosted and local gates cannot drift and one
  # set of tests covers both.
  #
  #   docs     only *.md / memories/ — nothing builds; the `docs-only ok`
  #            marker job is the whole gate (floor convention: floors apply
  #            to CODE PRs).
  #   all      a workspace-level file moved (root Cargo.toml, Cargo.lock,
  #            rust-toolchain.toml, .cargo/, .github/, scripts/, the
  #            excluded workspaces demos/ tools/ interval-transcendentals/,
  #            docs/k-report-data/, ANY member Cargo.toml, or anything the
  #            allowlist does not recognise) — everything runs, unscoped.
  #   closure  only crate sources moved — the changed members plus every
  #            member that transitively depends on them (dev-dependencies
  #            included) are built, and the pipeline rows run iff their root
  #            package is in that closure.
  #
  # Fails CLOSED: any classification error or unrecognised path yields
  # tier `all`. No third-party action here on purpose — checkout plus the
  # runner's preinstalled rustup is the whole toolbox, so the gate that
  # decides what runs has the smallest possible supply chain.
  filter:
    name: change filter
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.classify.outputs.TIER }}
      pkgs: ${{ steps.classify.outputs.PKGS }}
      cargo_scope: ${{ steps.classify.outputs.CARGO_SCOPE }}
      run_build: ${{ steps.classify.outputs.RUN_BUILD }}
      run_editor_core: ${{ steps.classify.outputs.RUN_EDITOR_CORE }}
      run_stl: ${{ steps.classify.outputs.RUN_STL }}
      run_step_export: ${{ steps.classify.outputs.RUN_STEP_EXPORT }}
      run_pncad_py: ${{ steps.classify.outputs.RUN_PNCAD_PY }}
      run_interval_backend: ${{ steps.classify.outputs.RUN_INTERVAL_BACKEND }}
      run_interval_oracle: ${{ steps.classify.outputs.RUN_INTERVAL_ORACLE }}
      run_topo_release: ${{ steps.classify.outputs.RUN_TOPO_RELEASE }}
      run_k_lint: ${{ steps.classify.outputs.RUN_K_LINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - id: classify
        # RUSTUP_TOOLCHAIN=stable keeps this job off the pinned 1.97.0
        # download: the script only runs `cargo metadata --no-deps`, which
        # parses the workspace manifests and neither builds nor resolves the
        # registry, so the compiler version is irrelevant — and if a future
        # manifest ever did need the pinned toolchain to parse, the failure
        # path is tier `all`, not a wrong answer.
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          # Always diff against the checkout's own first parent. On
          # pull_request the checkout is the test-merge commit, so HEAD^1
          # is by construction the exact base state the merge was built
          # against; the event payload's base.sha can be newer than that
          # (base moved between payload snapshot and merge-ref
          # construction), and the skew window's commits then appear as
          # phantom changed files that defeat the docs/closure tiers.
          BASE="$(git rev-parse HEAD^1 2>/dev/null || git rev-parse HEAD)"
          echo "base: $BASE"
          echo "changed files:"
          git diff --name-only "$BASE"...HEAD || true
          echo "classification:"
          scripts/ci-filter.py --base "$BASE" | tee -a "$GITHUB_OUTPUT"

  docs-only:
    name: docs-only ok
    runs-on: ubuntu-latest
    needs: filter
    steps:
      - run: echo "tier=${{ needs.filter.outputs.tier }} pkgs=${{ needs.filter.outputs.pkgs }}"

  # A GATE MUST BE SITED WHERE IT CAN FIRE ON ITS OWN INPUTS (Evan,
  # 2026-08-20). `discipline` below is `if: run_build == 'true'`, and a
  # change set of only .md / memories/ / local-scripts/ / .claude/ is
  # TIER=docs, so it does not run. That posture is deliberate and cheap
  # docs CI stays — but it left two guards whose inputs are EXACTLY that
  # change class unable to fire on it: the citation guard (prose in two
  # crate headers, the K-REPORT runbook and the local half) and the gate
  # roster (whose local half is local-scripts/ci-local.sh). They are
  # sited here.
  #
  # THIS JOB HAS NO `if:`, so it runs on every tier — including the
  # docs-only runs where every other job carrying one is skipped.
  # (`filter` and `docs-only` also carry no `if:`; neither runs a check.)
  # No toolchain, no cargo, no cache: greps and a stdlib python reader
  # over the two CI halves, the workflow directory, and the citing files.
  # Measured on three docs-tier runs: 8, 9 and 12 s wall clock, finishing
  # before `filter`, so the added critical-path latency on a docs PR is
  # zero and the cost is one extra billed job-minute.
  #
  # THIS IS THE ONE JOB THAT DOES NOT PRUNE local-only tooling, and the
  # exception is the reason it exists: its subject IS the agreement
  # between the hosted half and local-scripts/ci-local.sh, so it has to
  # see both. Nothing here can be moved by a developer's machine — the
  # tree is read, never sourced or executed.
  # `ci-mirror-parity.sh` checks that this stays exactly one job.
  mirror:
    name: CI half parity + gate wiring (every tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gate roster parity (both halves run every gate)
        run: |
          scripts/gates/gate-roster.sh --selftest
          scripts/gates/gate-roster.sh
      # Every check OUTSIDE scripts/gates/ is named by hand in both
      # halves, so nothing detected a lost row on either side. Two
      # separate enumerations of that population each missed a member,
      # and the second was found by another track by accident — so the
      # population is derived here rather than listed. It also checks
      # THE SITING RULE ITSELF: without that, hollowing this job and
      # moving these three steps back into `discipline` restores the
      # exact state S61 recorded with nothing firing. Python, not bash:
      # its subject is which job a step belongs to and whether that job
      # carries an `if:`, and the bash version read that with a regex
      # that could not see an uppercase job name.
      - name: CI half parity (both halves name the same checks)
        run: |
          python3 scripts/check-ci-mirror-parity.py --selftest
          python3 scripts/check-ci-mirror-parity.py
      # The claims in the tree about what CI does to probe-gated suites.
      # Prose is this guard's input, so this is where it can fire.
      - name: probe type-check loop citations
        run: |
          scripts/gates/probe-suite-census.sh --selftest
          scripts/gates/probe-suite-census.sh --citations

  discipline:
    name: discipline (evaluation-code)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_build == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      # THE MIRRORED DISCIPLINE GATES live in exactly ONE home, under
      # scripts/gates/, and both halves of CI call them: this job — one
      # step per gate, keeping the step name failures are read by in the
      # Actions UI — and local-scripts/ci-local.sh's `discipline` row.
      # Each script carries its own ratified prose: the allowlist
      # justifications are an append-only ledger of rulings, and a
      # ledger kept in two places drifts (it did, in both directions).
      # scripts/gates/lib.sh says why they cannot live under
      # local-scripts/ (this job deletes that tree).
      #
      # This job is the ONLY hand-written gate roster in the repo, and
      # it is checked rather than trusted — but NOT here. The roster
      # gate reads local-scripts/ci-local.sh, which this job deletes
      # above, and its other input is a file class that classifies
      # TIER=docs, on which this job does not run at all. It is sited in
      # the `mirror` job, which runs on every tier and keeps that tree.
      - name: Bounds compound-bound allowlist (ratified 2026-07-29)
        run: |
          scripts/gates/bounds-allowlist.sh --selftest
          scripts/gates/bounds-allowlist.sh
      - name: EvalScalar allowlist (the Bounds gate, over the name)
        run: |
          scripts/gates/evalscalar-allowlist.sh --selftest
          scripts/gates/evalscalar-allowlist.sh
      - name: no ambient environment in the kernel
        run: |
          scripts/gates/no-ambient-env.sh --selftest
          scripts/gates/no-ambient-env.sh
      - name: kernel crates are serde-free
        run: |
          scripts/gates/kernel-serde-free.sh --selftest
          scripts/gates/kernel-serde-free.sh
      - name: interval-square powi(2) allowlist (ratified 2026-08-01)
        run: |
          scripts/gates/interval-square-allowlist.sh --selftest
          scripts/gates/interval-square-allowlist.sh
      - name: no extra bounds on Real
        run: |
          scripts/gates/no-extra-real-bounds.sh --selftest
          scripts/gates/no-extra-real-bounds.sh
      # Test-aggregation discipline: one [[test]] target per crate. Each
      # extra one is a full codegen+link of the ~40-rlib graph — 96% of
      # this workflow's build job, measured (bazel-verdict report). #179
      # collapsed 249 targets to 12 on that evidence and MISSED
      # step-import, which silently kept 26 (two thirds of every remaining
      # test target in the workspace) until the 2026-08-10 build-contention
      # investigation found it. The complementary per-crate
      # `every_suite_file_is_aggregated` test cannot fire for a crate that
      # never opted in — that is the hole this closes.
      - name: test-aggregation discipline
        run: |
          scripts/gates/test-aggregation.sh --selftest
          scripts/gates/test-aggregation.sh
      # The census half of the probe test surface. Its consumer — the
      # `compile and list every probe-gated test target` step in `k-lint` —
      # compiles exactly the crates this prints and feeds each listing
      # back to `--check-listing`, and this gate is what makes an empty or
      # shrinking answer loud rather than silent.
      # It rides here, not there, so the LOUD FAILURE IS OWNED BY A GATE
      # rather than by the order of two steps in one job: it is
      # roster-enforced like its siblings, its `--selftest` proves the
      # guards fire, and the local half reaches it through the loop that
      # runs this whole directory instead of a hand-written mirror row.
      # The CITATION half is not here: its inputs are prose, and a change
      # set of only prose classifies TIER=docs, so this job could not
      # fire on the only change class that breaks it. It runs in
      # `mirror`, as `--citations`.
      - name: probe-suite census (crates + floor)
        run: |
          scripts/gates/probe-suite-census.sh --selftest
          scripts/gates/probe-suite-census.sh
      # The run half's guards. `k_probe_sweep.sh`'s `run_dump` is the only
      # thing between "the harness ran" and "the sweep recorded nothing
      # and exited 0", and nothing else in the tree exercises it. No
      # cargo: the function is extracted from the script under test and
      # driven against a stub, so it costs milliseconds and cannot end up
      # testing a fossil.
      - name: k-probe sweep guard selftest (run_dump)
        run: scripts/rundump-guard-selftest.sh
      # The `interval` feature must stay PURELY ADDITIVE. This is not a
      # style rule: the `test-interval` legs run only the tests that
      # feature ADDS (see that job's header), which is sound only while
      # enabling it cannot change the default build. A gated item that
      # is not an impl/mod/use/type or test-only code, or any
      # `cfg(not(feature = "interval"))`, fails here — and the correct
      # response is to reconsider the run-leg selection, NOT to
      # allowlist. Stdlib-only python3, so it rides this cheap-tripwire
      # job. The --selftest pass shows the guard actually fires.
      - name: interval-feature additivity (gates the interval run legs)
        run: |
          python3 scripts/check-interval-cfg-additive.py --selftest
          python3 scripts/check-interval-cfg-additive.py
      - name: bit-identity consumer tripwire (retirement landed, M4 PR 5)
        run: |
          scripts/gates/bit-identity-consumer.sh --selftest
          scripts/gates/bit-identity-consumer.sh
      - name: bit-identity debug-only guard (topo/source.rs)
        run: |
          scripts/gates/bit-identity-debug-only.sh --selftest
          scripts/gates/bit-identity-debug-only.sh
      - name: bit-identity punning tripwire
        run: |
          scripts/gates/bit-identity-punning.sh --selftest
          scripts/gates/bit-identity-punning.sh
      # The importer's negative-zero flush has one home and says so in
      # its own module doc. Four copies of it landed green in one crate
      # (S18) because nothing checked the claim.
      - name: signed-zero one home (step-import)
        run: |
          scripts/gates/signed-zero-one-home.sh --selftest
          scripts/gates/signed-zero-one-home.sh
      # No MANIFEST wires a test-only cargo feature (`test-support`,
      # `*-testing`) onto a non-dev dependency edge. Manifests, not
      # invocations: a build command may enable any feature, which is
      # why the two facades carry #[doc(hidden)] (the doc job below runs
      # --all-features). topo's `sweep-testing`
      # opens failure-injection doors and its manifest said so in prose;
      # the prose was FALSE — sweep's `[dependencies]` topo edge carried
      # the feature, cargo unified it across the graph, and a downstream
      # crate compiled `--release` naming `topo::PlantedDegradation`.
      # That sat in the tree undetected while every other gate in
      # scripts/gates/ ran (S52).
      # Parses the manifests with tomllib rather than grepping, because
      # `features = [...]` says nothing about which table it is in.
      - name: test-only features are dev-dependency-only
        run: |
          scripts/gates/test-features-dev-only.sh --selftest
          scripts/gates/test-features-dev-only.sh

      # RENDER PROVENANCE (#221 follow-up). Every committed per-scene
      # PNG under demos/renders{,-freecad}/ must carry FreeCAD's
      # signature tEXt chunks; demos/renders-wild/ (the wild-corpus
      # lane, FreeCAD-free by scope) runs inverted per-lane rules —
      # matplotlib-drawn cells carrying the wild lane's own Author
      # stamp; the matplotlib-COMPOSED montage
      # sheets are the only exemption, and are asserted to be exactly
      # that. A matplotlib fallback frame in a committed path fails
      # here, naming the file. Stdlib-only python3 — it rides this job
      # because this is the cheap-tripwire job (no toolchain, no
      # cargo), and because a render change is never tier `docs`
      # (demos/** is unscopable ⇒ tier `all`), so run_build gates it
      # exactly when it can matter. Mirror: ci-local's always-run
      # "render provenance (demos)" row. The --selftest pass shows the
      # guard actually fires (synthetic PNGs, no renderer needed).
      - name: render provenance (demos)
        run: |
          python3 demos/check_render_provenance.py --selftest
          python3 demos/check_render_provenance.py

      # The UV lane's composer: no provenance question (only the kernel
      # can have drawn an SVG cell), but its selection rule DROPS faces
      # from the sheet, and a silent drop is what that lane exists to
      # prevent. Same cheap-tripwire posture, stdlib only. Mirror:
      # ci-local's "uv composer selftest (demos)" row.
      - name: uv composer selftest (demos)
        run: python3 demos/compose_uv_montage.py --selftest

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_build == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_build == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No --all-features here: the `interval` feature is a different
      # build graph, and the `interval` job owns its clippy pass with its
      # own cache — building it here too would double this job's compile
      # time for no extra coverage, and mix two feature sets into one
      # cache entry.
      # Scoped by the filter: `--workspace` in tier `all`, an explicit
      # `-p <closure>` list in tier `closure`.
      - run: cargo clippy ${{ needs.filter.outputs.cargo_scope }} --all-targets -- -D warnings

  # RUSTDOC gate (#465): clippy is blind to rustdoc lints, so a doc
  # comment can silently stop rendering with the gate green. The command,
  # the flags, and the shrinking exclusion list all live in
  # scripts/doc-gate.sh — one implementation, called by this job and by
  # local-scripts/ci-local.sh, the ci-filter.py arrangement.
  #
  # NOT scoped by the filter, deliberately: the gate is a workspace-wide
  # ratchet over a fixed crate set, and it runs in ~15 s cold, so scoping
  # it to the change closure would trade the ratchet's meaning for no
  # measurable time. It still respects the docs tier via run_build.
  doc:
    name: rustdoc (gate)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_build == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # see the identical step in the clippy job for the full reasoning.
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/doc-gate.sh

  # BUILD job, default features (see the build-once header comment above
  # the `env:` block). Compiles the scoped test binaries exactly once and
  # publishes them as a nextest archive; the `test` matrix below only RUNS.
  build:
    name: build + archive (default)
    # BUILD_RUNNER (repo variable) — see the LINK/DEBUGINFO note above.
    # Unset today, so this is `ubuntu-latest` and nothing changes.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    needs: filter
    if: needs.filter.outputs.run_build == 'true'
    # OPT LEVEL — reverses the #52/#53 verdict, because both of its
    # premises expired. That decision ("blanket opt 2 is net-slower on
    # core-crate PRs") was measured when this workspace had 261 test
    # binaries and compile dominated the run. #179/#387 took that to one
    # per crate (`scripts/gates/test-aggregation.sh` prints the total),
    # and test EXECUTION is now ~79% of run wall (measured 2026-08-12:
    # compile jobs ~220 s of a ~1060 s critical path). Re-measured on the
    # same box, whole workspace, `--all-targets`:
    #
    #   clean compile   opt-0 130.6 s -> opt-2 422.9 s   (3.24x WORSE)
    #   clean compile   opt-0 136.5 s -> opt-2 442.4 s   (interval, 3.24x)
    #   nextest run     opt-0 558.7 s -> opt-2 130.0 s   (4.30x BETTER,
    #                                   2791 tests, all green both ways)
    #   nextest run     opt-0 691.7 s -> opt-2 301.6 s   (interval, 2.29x,
    #                                   3001 tests, all green both ways)
    #
    # Break-even needed only 1.5x on execution. MEASURED HOSTED, warm
    # cache, run 31668174443 (these supersede the local projections above
    # — trust these):
    #
    #   archive step, default    127 s ->  432 s   (3.40x worse)
    #   archive step, interval   132 s ->  605 s   (4.58x worse)
    #   test (interval, default, 2/2)         <- the critical-path leg
    #                            828 s ->  117 s   (7.1x better)
    #   ten test legs, summed   5620 s ->  895 s
    #   critical path           1065 s ->  840 s   (-21%)
    #   billed                  ~137m  ->  ~72m    (-65 min)
    #
    # The compile penalty is WORSE hosted than locally (4.58x vs 3.24x) —
    # 2 vCPU parallelises opt-2 codegen badly — and the execution win is
    # much BETTER (7.1x vs the 2.29x measured locally, which was taken on
    # a box with an express-lane job running alongside it and is therefore
    # pessimistic). Both errors happened to point the same way; the trade
    # is still strongly positive.
    #
    # Note rust-cache does not cache workspace crates, only deps, so 605 s
    # IS the steady state: run 1 (cold deps) was 920 s, run 2 onward 704 s
    # for the whole job. Do not read a first run on a knob change as the
    # verdict.
    #
    # The gap between those two is itself a finding: at opt-0 the interval
    # lane looks only 1.24x slower than default (691.7 vs 558.7), but at
    # opt-2 it is 2.32x slower (301.6 vs 130.0). opt-0's own overhead was
    # masking the enclosure cost regime that geom-core's manifest has
    # always claimed. Anyone reading interval-vs-f64 runtime off an opt-0
    # CI leg is reading a flattered number.
    #
    # NOTE these supersede local-scripts/test-fast.sh's "75 s -> 4.9 s"
    # (15x, 2026-07-21, 807 tests) — the suite has since grown to 2791
    # tests and the ones added are less compute-bound, so that header is
    # stale.
    #
    # Scoped to the two ARCHIVE jobs on purpose: they feed all ten test
    # legs, which compile nothing, so one opt-2 compile here buys the
    # speedup ten times over. `k-lint` deliberately does NOT get this — it
    # regenerates the K sweep CSVs that are diffed against the committed
    # baselines in docs/k-report-data/, and that lane stays on the exact
    # configuration those baselines were produced under.
    # debug-assertions and overflow-checks are unaffected by opt-level
    # (cargo defaults them ON for dev/test), so fail-loud postconditions
    # keep their teeth — this is the same configuration
    # local-scripts/test-fast.sh has used locally since M6.
    #
    # Cargo.toml's per-package opt-2 overrides (spade + mesh) stay: they
    # cover the `cargo test`-driven jobs that do NOT set this env.
    #
    # JOB-LEVEL, not step-level, on purpose: Swatinem/rust-cache hashes
    # env vars prefixed CARGO_/RUST* into its cache key, and it runs
    # BEFORE the build step. Step-level knobs (like the CARGO_PROFILE_
    # TEST_STRIP this replaces) are invisible to it, so cargo's
    # fingerprint would disagree with the restored cache on every run and
    # rust-cache would never re-save. Job-level means exactly one cold
    # rebuild per knob change, then warm forever.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_PROFILE_DEV_OPT_LEVEL: "2"
      CARGO_PROFILE_TEST_OPT_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      # NO mold here — see the LINKER note at the top of this file. It was
      # right for 261 test binaries and is not right for 14.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: runner + linker provenance (for perf attribution)
        run: nproc && free -g | head -2 && ld --version | head -1
      - name: install cargo-nextest (pinned, official prebuilt)
        uses: ./.github/actions/install-nextest
        with:
          version: ${{ env.NEXTEST_VERSION }}
      # Scoped by the filter (`--workspace` or `-p <closure>`), same as the
      # per-row `cargo test` this replaces: the archive CONTAINS exactly
      # the closure's test binaries, so the run rows need no re-scoping.
      - name: build test binaries + archive
        run: cargo nextest archive ${{ needs.filter.outputs.cargo_scope }} --archive-file nextest-default.tar.zst
      # Upload right after the archive (the run legs still wait on the
      # whole job via `needs`): if a later step fails, the archive is
      # already up, so the failure can be investigated / re-run without
      # rebuilding.
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-default
          path: nextest-default.tar.zst
          retention-days: 1
      # The default build's TEST NAME LIST — the left operand of the
      # interval run legs' set difference (scripts/interval-only-
      # selection.py; see the `test-interval` job). Listed from the same
      # already-compiled targets the archive was built from, with the
      # same scope, so it IS the archive's contents; listing is a
      # metadata pass, not a build. A few KB, so it costs nothing
      # against the artifact quota the cleanup job exists to protect.
      - name: list archived tests (default features)
        run: cargo nextest list ${{ needs.filter.outputs.cargo_scope }} --message-format json > nextest-list-default.json
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-list-default
          path: nextest-list-default.json
          retention-days: 1
      # Doc-tests DO NOT run under nextest (upstream design): this step
      # keeps them gated. The workspace has real doctests, including
      # compile_fail blocks that only the doctest runner exercises.
      - name: doc-tests
        run: cargo test --doc ${{ needs.filter.outputs.cargo_scope }}

  test:
    name: test (eps = ${{ matrix.eps }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: [filter, build]
    if: needs.filter.outputs.run_build == 'true'
    strategy:
      fail-fast: false
      # THE BATTERY IS {default, 1e-6, 1e-12} (Evan's ruling, 2026-07-30):
      # the two env rows straddle the compiled default (DEFAULT_EPS =
      # 1e-9) three orders either side; the `default` row runs with the
      # variable genuinely UNSET (an empty CAD_TOLERANCE_EPS is a parse
      # error by design — tolerance.rs multi-ε contract — so the
      # assignment rides the run line as a shell prefix, not `env:`).
      # All rows execute the SAME archived binaries: eps is runtime env,
      # which is the whole point of building once.
      #
      # 2-way intra-row sharding (--partition count:*/2), adopted on
      # MEASURED numbers (#167 run 30838077811): unsharded, the
      # default-eps legs executed in ~5.9-6.1 min — over the ~5 min bar —
      # with a flat slow-test tail (worst single test 14 s of 1989), so a
      # count partition splits evenly. The two shards' union is exactly
      # the row (nextest partitions the run list deterministically); a
      # failure still names its eps row in the leg name.
      #
      # STILL TRUE after the #177 test-binary collapse, and worth stating
      # because the shape changed: nextest's count partition is applied
      # WITHIN each binary, so 263 mostly-tiny binaries became 24 larger
      # ones. The union is still exactly the row and the split is still
      # even — a 2044-test row splits more evenly across 24 binaries than
      # it did across 263, not less. Test IDs gained a module prefix
      # (`all m4_pr8_corpus::foo` where it was `m4_pr8_corpus foo`); the
      # eps rows never named a binary, so nothing here needed rewriting.
      # The rows that DID name one (persistence / corpus / rebuild-latency
      # / k-lint) now select by `--test all -- <module>::` or by a nextest
      # `test(/^<module>::/)` expression, verified to match the old
      # per-binary test counts exactly.
      matrix:
        eps: ["default", "1e-6", "1e-12"]
        shard: [1, 2]
    env:
      # Nothing compiles here: cargo only dispatches to cargo-nextest,
      # which runs prebuilt binaries out of the archive — keep the job
      # off the pinned-toolchain download (same trick as `filter`).
      RUSTUP_TOOLCHAIN: stable
    steps:
      # Checkout is still needed: tests read committed fixtures, and
      # --workspace-remap points nextest's per-test cwd at this tree.
      # Runner workspace paths are identical across jobs, so build-time
      # env!("CARGO_MANIFEST_DIR") paths resolve here too.
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - name: install cargo-nextest (pinned, official prebuilt)
        uses: ./.github/actions/install-nextest
        with:
          version: ${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: nextest-default
      # The eps assignment is an inline shell prefix (empty for the
      # `default` leg — see the matrix comment on why not `env:`).
      - name: run archived tests
        run: ${{ matrix.eps != 'default' && format('CAD_TOLERANCE_EPS={0}', matrix.eps) || '' }} cargo nextest run --archive-file nextest-default.tar.zst --workspace-remap . --partition count:${{ matrix.shard }}/2

  # THE RELEASE-PROFILE ROW. Three adversarial suites in `crates/topo` feed
  # tier-1-INVALID bodies to the Euler operators and are written about
  # RELEASE semantics; the archive matrix above is the dev profile at
  # opt-2 with debug-assertions ON, so it cannot be what runs them.
  # `review_m1_pr2::release_corruption` splits its expectations on
  # `cfg(debug_assertions)` outright, so no single profile covers the
  # file; `review_m1_pr4`'s section 9 ("Release-mode garbage-in") is not
  # cfg-split but had never once run in the profile it is named for.
  #
  # WHAT IT BUYS, stated against the ratified text rather than against
  # the code's current behaviour, because those have diverged:
  #
  #   * BOUNDED TRAVERSAL. DESIGN.md's D9 footnote, as amended by the D2
  #     addendum, keeps exactly one clause of the old corrupt-input
  #     disposition: "The bounded-traversal half stands: never a hang;
  #     every traversal is bounded." That is
  #     `large_torn_body_terminates_quickly`, which attacks 3000 struts
  #     here and 500 under debug-assertions (where the per-op
  #     postcondition sweep makes the construction loop quadratic). The
  #     case the gate sees is six times larger in this job, and the
  #     clause it defends is not superseded by anything.
  #   * THE ROW-4 ARMS ARE NOT INPUT-REACHABLE, which is the clause the
  #     whole D2 addendum rests on and the only one with an executable
  #     test. `review_d18`'s two hammer rows drive every operator that
  #     reaches `link_half_edges` over randomly torn bodies and over a
  #     genuinely spent graft destination, counting mutation-phase
  #     completions. They are release-only BY CONSTRUCTION, not by
  #     preference: in debug a torn body may legitimately panic at the
  #     postcondition, so telling that apart from a row-4 arm needs a
  #     process-global panic hook, which races the threaded matrix. With
  #     the postcondition compiled out, any panic IS a row-4 arm. So this
  #     job is the only lane in which those rows mean anything, and the
  #     only lane that runs them at all.
  #   * COMPILE ROT, which is a PROFILE-level hazard and independent of
  #     what any row asserts: a `#[cfg(not(debug_assertions))]` item that
  #     no CI job ever type-checks can rot into a build error with every
  #     check green, because clippy and the matrix are both debug passes.
  #     `foreign_parent_loop_garbage_in_garbage_out_release` and the
  #     `use crate::validate;` it needs are exactly that shape.
  #
  # WHAT IT DOES NOT BUY: it does not certify silent discard, and that
  # distinction is why it survived **W2c**. D9's ratified corrupt-input
  # disposition allowed "documented garbage-out in release" until the
  # **D2 addendum** (2026-08-19) superseded that half with "Silent
  # discard is never an answer"; W2c executed the addendum across
  # `euler{,_ring,_kill}.rs`, `link_half_edges` and its two unproven
  # callers included, so no write there swallows a failed lookup any
  # more. `foreign_parent_loop_garbage_in_garbage_out_release` passes
  # unchanged across that conversion because the `parent_loop` it plants
  # is LIVE BUT WRONG: no lookup fails, every write lands, and what the
  # row observes is wrong DATA, never a swallowed failure. That is the
  # residue the addendum deliberately leaves standing — corruption a
  # plan phase cannot observe still yields `Ok` plus a body the
  # validator refuses — and it is what the row records. The three greps
  # below are unchanged for the same reason: the conversion renamed and
  # retired nothing here.
  #
  # The other rows in the file are profile-independent — `pillow()` runs
  # three SUCCESSFUL operators, so they do fire the debug postcondition
  # during setup, but the operator each one asserts on fails a
  # precondition and returns before its mutation phase, so no
  # postcondition runs over the asserted call and the expectation is the
  # same in both profiles. `debug_postcondition_fires_on_corrupt_input`
  # is `#[cfg(debug_assertions)]` and belongs to the matrix above.
  #
  # SCOPED to one crate's lib unittests, deliberately, not a release
  # build of the workspace: `-p topo --lib` compiles topo's closure plus
  # its dev-dependencies and links one binary. The rows execute in
  # milliseconds — the compile IS the cost of this job (93 s hosted on a
  # cold cache, measured on this job's first run).
  release-corruption:
    name: corrupt input (release profile)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_topo_release == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL — see the full note on the `filter` job above.
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      # Its own cache key: release artifacts share no fingerprint with
      # the dev-profile jobs, so one shared entry would only thrash.
      - uses: Swatinem/rust-cache@v2
        with:
          key: topo-release
      - name: corrupt-input suites, release profile
        run: |
          set -o pipefail
          cargo test --release -p topo --lib -- \
            review_m1_pr2::release_corruption \
            review_m1_pr4::kill_ops_survive_torn_bodies_without_panicking \
            review_d18 \
            | tee release-corruption.log
          # A name filter that matches NOTHING exits 0 — the exact
          # silence this job exists to remove. So assert the selection is
          # non-empty AND name the rows the job is justified by: delete
          # or rename one and this reds, rather than quietly returning to
          # zero coverage.
          passed=$(sed -n 's/^test result: ok\. \([0-9]\{1,\}\) passed.*/\1/p' release-corruption.log)
          echo "release-profile rows run: ${passed:-0}"
          test "${passed:-0}" -gt 0
          grep -q 'garbage_in_garbage_out_release \.\.\. ok' release-corruption.log
          grep -q 'large_torn_body_terminates_quickly \.\.\. ok' release-corruption.log
          grep -q 'kill_ops_survive_torn_bodies_without_panicking \.\.\. ok' release-corruption.log
          # `review_d18`'s two hammer rows are `cfg(not(debug_assertions))`
          # on purpose — in debug a torn body may legitimately panic at the
          # postcondition, so classifying one needs a process-global hook
          # that races the matrix; in release the postcondition is compiled
          # out, so any panic IS a row-4 `unreachable!` and no hook is
          # needed. This job is therefore the ONLY lane that runs them.
          grep -q 'torn_bodies_never_reach_a_row_four_unreachable \.\.\. ok' release-corruption.log
          grep -q 'a_spent_graft_destination_never_reaches_a_row_four_unreachable \.\.\. ok' release-corruption.log
          # Both suite headers name this job as their mechanism. Nothing
          # else greps for that name, so renaming the job would leave two
          # doc comments quietly false; this is what makes it loud.
          grep -q 'corrupt input (release profile)' crates/topo/src/review_m1_pr2/release_corruption.rs
          grep -q 'corrupt input (release profile)' crates/topo/src/review_m1_pr4.rs

  # BUILD job, interval features — the ONE genuinely different build
  # graph in the matrix. Owns the interval clippy pass and the interval
  # doc-tests (both need this graph compiled anyway), then archives the
  # test binaries for the `test-interval` matrix below.
  build-interval:
    name: build + archive (interval)
    # Same BUILD_RUNNER variable as the default build job; unset today.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    needs: filter
    if: needs.filter.outputs.run_build == 'true'
    # Same link/debuginfo/opt knobs, same job-level-not-step-level
    # reasoning, as the default build job — see the LINK/DEBUGINFO and
    # OPT LEVEL notes there. This job is the run's critical path (its
    # archive feeds the longest test leg in the run), so it is the one
    # that most wants them: the interval lane's slowest leg was 828 s of
    # pure execution, and opt-2 is aimed squarely at that.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_PROFILE_DEV_OPT_LEVEL: "2"
      CARGO_PROFILE_TEST_OPT_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      # The `interval` feature's backend is the in-repo
      # `interval-transcendentals` crate — pure Rust over libm — so this
      # job needs no system packages at all now that mold is gone (see the
      # LINKER note at the top of this file).
      - uses: dtolnay/rust-toolchain@stable
      # CACHE SEPARATION (verified against the action's source,
      # 2026-07-30): this job builds a DIFFERENT feature set from the
      # default-feature jobs, so it must never share their cache entry —
      # a shared entry would have the two graphs evicting each other on
      # every run. Two things guarantee the separation. (1) rust-cache@v2
      # composes its key as prefix + (shared-key OR key + job id) + os +
      # arch + env/lockfile hashes, and its `add-job-id-key` input
      # defaults to "true" — so with no `shared-key` anywhere in this
      # file, every JOB here already gets its own cache by construction
      # (matrix legs of one job share a key, which is what we want: same
      # feature set). (2) The explicit `key` below makes THIS job's
      # separation intentional rather than incidental, and survives a
      # rename. Do NOT add `shared-key` to any job here: it replaces the
      # job component outright and is exactly the thrash this prevents.
      - uses: Swatinem/rust-cache@v2
        with:
          key: interval
      - name: runner + linker provenance (for perf attribution)
        run: nproc && free -g | head -2 && ld --version | head -1
      - name: install cargo-nextest (pinned, official prebuilt)
        uses: ./.github/actions/install-nextest
        with:
          version: ${{ env.NEXTEST_VERSION }}
      # Archive first, upload immediately (the legs still wait on the
      # whole job via `needs`; the early upload means a clippy/doc-test
      # failure leaves the archive available for investigation). This job
      # is the run's critical path (measured on #167): keep it lean.
      - name: build test binaries + archive (interval)
        run: cargo nextest archive ${{ needs.filter.outputs.cargo_scope }} --features interval --archive-file nextest-interval.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-interval
          path: nextest-interval.tar.zst
          retention-days: 1
      # The right operand of the run legs' set difference — see the
      # matching step in the default build job.
      - name: list archived tests (interval)
        run: cargo nextest list ${{ needs.filter.outputs.cargo_scope }} --features interval --message-format json > nextest-list-interval.json
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-list-interval
          path: nextest-list-interval.json
          retention-days: 1

  # The interval feature's clippy pass (the default clippy job
  # deliberately skips --all-features) and its doc-tests.
  #
  # WHY A SEPARATE JOB (2026-08-12): these two steps used to live at the
  # end of `build-interval`, after the archive upload. That put them on
  # the RUN'S CRITICAL PATH for no reason — `test-interval` declares
  # `needs: build-interval`, and `needs` waits for the whole JOB, not for
  # the artifact it actually consumes. So the longest test leg in the run
  # sat behind a clippy pass it has no dependency on. Measured over 11
  # runs: clippy 37 s + doc-tests 7 s, i.e. ~44 s of pure critical-path
  # latency. Split out, they run concurrently with the archive instead.
  #
  # Deliberately NOT inheriting build-interval's env: this job links no
  # test binaries, so mold buys nothing and its ~12 s apt install would
  # cost more than it saves, and opt-level 2 would slow the compile with
  # nothing executing at scale to pay it back. It keeps only the
  # debuginfo knobs, which are pure win. Its own rust-cache key follows
  # from the no-shared-key rule documented on build-interval.
  lint-interval:
    name: clippy + doc-tests (interval)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_build == 'true'
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: interval-lint
      - run: cargo clippy ${{ needs.filter.outputs.cargo_scope }} --all-targets --features interval -- -D warnings
      - name: doc-tests (interval)
        run: cargo test --doc ${{ needs.filter.outputs.cargo_scope }} --features interval

  # THESE LEGS RUN ONLY THE TESTS THE `interval` FEATURE ADDS (2026-08-13).
  # Measured on run 31665082966: of the 2995 tests these legs executed,
  # 214 are `#[cfg(feature = "interval")]`-gated — 168.7 cpu-s of coverage
  # the default legs cannot have — and the other 2781 cost 4406.7 cpu-s,
  # 42.0% of the run's whole 10482 cpu-s of test execution, re-running
  # code the default legs had already run. Seven test binaries
  # (step-import::all at 1919 cpu-s, step-export::all, mesh, mesh::all,
  # stl::all, topo, geom-brep) contain ZERO interval-gated tests and were
  # re-running in full.
  #
  # Why that is sound: the feature is purely ADDITIVE. Every
  # `#[cfg(feature = "interval")]` item in crates/*/src is an
  # `impl ... for Interval`, a mod/use/type for `Interval`, or test-only
  # code; there is no `cfg(not(feature = "interval"))` in the tree; and
  # Rust has no specialization, so extra impls cannot move how the f64
  # paths monomorphize. A test present in both builds therefore executes
  # the same machine code in both. That premise is not left to prose —
  # scripts/check-interval-cfg-additive.py GATES it in the `discipline`
  # job and fails loudly the moment it stops holding. The two changes
  # stand or fall together: if that gate ever fires, these legs go back
  # to running the full suite.
  #
  # The set is DERIVED, never declared: scripts/interval-only-selection.py
  # diffs the two builds' `cargo nextest list` outputs, so no test can
  # opt itself out, a test that stops being gated returns to the default
  # legs automatically, and a newly gated one is picked up with no edit
  # here. It fails closed — an empty difference, an unrecognised list
  # shape, or any test present in the default build but NOT the interval
  # one is an error, never a silently empty filter.
  #
  # NOT reduced: the interval BUILD job still compiles the whole graph
  # with the feature on and runs clippy and the doc-tests over it, so
  # compile-side interval coverage is untouched. Only the re-execution
  # of already-executed tests is dropped.
  test-interval:
    name: test (interval, eps = ${{ matrix.eps }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # `build` joins `needs` for its test list only (a few KB). It
    # finishes well before build-interval, which is the run's critical
    # path, so this adds no wall-clock.
    needs: [filter, build, build-interval]
    if: needs.filter.outputs.run_build == 'true'
    strategy:
      fail-fast: false
      # One multi-ε row at interval type (D4 ¶1): the interval band test
      # re-derives every assertion from the run's ε, so the 1e-6 row
      # genuinely exercises a different band. Same archive both rows —
      # eps is runtime env. `default` = env unset, and 2-way sharding —
      # see the `test` matrix comments (the unsharded interval default
      # leg measured 6.1 min of execution, the run's slowest).
      matrix:
        eps: ["default", "1e-6"]
        shard: [1, 2]
    env:
      # Nothing compiles here (see the `test` job).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - name: install cargo-nextest (pinned, official prebuilt)
        uses: ./.github/actions/install-nextest
        with:
          version: ${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: nextest-interval
      - uses: actions/download-artifact@v4
        with:
          name: nextest-list-default
      - uses: actions/download-artifact@v4
        with:
          name: nextest-list-interval
      # The set difference, computed here rather than in a job of its
      # own: both lists are a few KB, so this costs a download and a
      # millisecond. The script prints the counts it derived (and fails
      # closed — see its header), so the log always records how many
      # tests this leg selected and how many it skipped as already
      # covered by the default legs.
      - name: derive the interval-only test selection
        run: scripts/interval-only-selection.py nextest-list-default.json nextest-list-interval.json > interval-selection.txt
      # `--no-tests` is decided by the SELECTION, not passed blindly:
      # nextest exits 4 on a zero-test run, which is exactly the alarm
      # we want when a real filter matches nothing, and exactly wrong
      # for the `none()` the script emits for a scope carrying no Rust
      # tests at all (see its header — a pncad-py-only closure is the
      # first). Conditioning on the literal keeps both behaviours: any
      # other filter that selects nothing still fails this leg.
      - name: run archived tests (interval-only)
        run: |
          selection=$(cat interval-selection.txt)
          if [ "$selection" = "none()" ]; then
            echo "scoped no-op: the selection is none(), so this leg runs 0 tests"
            no_tests="--no-tests=pass"
          else
            no_tests=""
          fi
          ${{ matrix.eps != 'default' && format('CAD_TOLERANCE_EPS={0}', matrix.eps) || '' }} cargo nextest run --archive-file nextest-interval.tar.zst --workspace-remap . --partition count:${{ matrix.shard }}/2 -E "$selection" $no_tests
      # M4 PR 6 D6.1, Interval member: the save/load/replay-identity row
      # at the certified interval scalar (already inside the full archive
      # run above; named here so the obligation is visible). One leg only
      # (default eps, shard 1), mirroring the pre-archive job, which ran
      # it once with no eps env.
      - name: persistence save/load/replay-identity (interval)
        if: matrix.eps == 'default' && matrix.shard == 1 && needs.filter.outputs.run_editor_core == 'true'
        run: "cargo nextest run --archive-file nextest-interval.tar.zst --workspace-remap . -E 'binary_id(editor-core::all) & test(/^m4_pr6_roundtrip_interval::/)'"
      # M4 PR 8a D1, Interval member: the Band 4 corpus evaluates green
      # at the certified interval scalar (also inside the archive run
      # above; named here so the obligation is visible).
      - name: band 4 corpus (interval)
        if: matrix.eps == 'default' && matrix.shard == 1 && needs.filter.outputs.run_editor_core == 'true'
        run: "cargo nextest run --archive-file nextest-interval.tar.zst --workspace-remap . -E 'binary_id(editor-core::all) & test(/^m4_pr8_corpus_interval::/)'"

  # The archives exist only to ferry binaries from the build jobs to the
  # run legs; on a fully green run they have no further use, and this
  # private repo's artifact quota is small (500 MB, and the Actions
  # budget has been exhausted before). retention-days: 1 already caps
  # stragglers; this deletes the happy-path bulk immediately. On a FAILED
  # run the artifacts are deliberately kept (retention window) so failed
  # legs can be re-run without rebuilding.
  cleanup-archives:
    name: delete nextest archives (green run)
    runs-on: ubuntu-latest
    needs: [test, test-interval]
    if: success()
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in nextest-default nextest-interval; do
            for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                          -q ".artifacts[] | select(.name==\"$name\") | .id"); do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            done
          done

  interval-backend:
    name: interval backend crate
    runs-on: ubuntu-latest
    needs: filter
    # Tier `closure` never reaches this: interval-transcendentals/ is its
    # own workspace, so ANY change under it is tier `all`.
    if: needs.filter.outputs.run_interval_backend == 'true'
    # The `interval` feature's backend lives in its own workspace
    # (interval-transcendentals/), so the kernel's workspace rows never
    # build its tests. Its pad tripwire therefore had no CI at all until
    # M5 PR 1's review asked for one — and it catches what the kernel's
    # own lane-agreement tests provably cannot, both lanes there sharing
    # the round-to-nearest chain.
    #
    # WHAT THIS ROW CATCHES, by direction, because the two are not the
    # same job. A pad WIDENED: every operation, via pad_contract.rs,
    # which bounds each endpoint's distance from the backend's own value
    # by the derived pad — no oracle needed, since the comparison is
    # against libm, not against truth. A pad DROPPED: division,
    # multiplication and sqrt only, via review_fuzz_exact.rs, which
    # computes the true value in exact u128 rational arithmetic.
    #
    # NOT `+` and `-`: their truth is exactly computable but not with a
    # u128 comparator (aligning 2^1023 with 2^-1074 needs ~2100 bits),
    # and mutating add_lo/add_hi to bare round-to-nearest leaves this
    # whole row green — only certify_arith reds. NOT the seven
    # transcendentals: their truth needs a multi-precision reference at
    # all. Both belong to oracle-certify below, which fires on changes
    # under interval-transcendentals/{src,tests}/, Cargo.toml or
    # Cargo.lock (ci-filter.py's ORACLE_PATHS — four paths, not the whole
    # directory: docs/ is NOT among them, so editing the derivation that
    # sets PAD_ULPS does not by itself re-certify). That is a trigger
    # set, not a convention.
    #
    # This row is deliberately the crate's DEFAULT feature set: without
    # `oracle-inari` there is no inari/gmp-mpfr-sys and no C toolchain in
    # the graph, so it takes seconds. See the crate README's
    # "Certification" section.
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: interval-backend
          workspaces: interval-transcendentals
      - name: fmt + clippy
        working-directory: interval-transcendentals
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - name: tests (default features — the oracle stack must stay out)
        working-directory: interval-transcendentals
        run: cargo test
      # Tripwire on the tripwire: the dev-oracle stack (inari and its
      # gmp/MPFR C build) belongs to `--features oracle-inari` only. If
      # anything ever makes it reachable from the default feature set,
      # fail loudly here rather than silently reintroducing a C build.
      - name: assert the oracle stack stays out of the default graph
        working-directory: interval-transcendentals
        run: |
          if cargo tree | grep -iE 'inari|gmp-mpfr-sys|rug'; then
            echo "ERROR: the default feature set reaches the gmp stack"
            exit 1
          fi

  # The differential certification lane: `certify.rs` against inari+MPFR as
  # oracle, asserting `oracle ⊆ ours` on millions of drawn cases. It was a
  # by-hand gate until now, for a good reason and a bad one.
  #
  # The good reason is cost: it builds GMP and MPFR from C source, measured
  # at 234s of a ~250s job on a hosted runner (#480). It is keyed on the
  # PATHS under interval-transcendentals/ rather than on the tier, because
  # that crate is its own workspace and so every change to it lands in
  # TIER=all — which is most merges. See ci-filter.py's ORACLE_PATHS.
  # Measured churn: 2 of the last 400 first-parent merges, both during the
  # crate's creation. Order of eight runner-minutes a year.
  #
  # The bad reason is that "run it by hand when the pads change" is a
  # convention with no enforcement, and it had already failed silently:
  # the tier did not BUILD at all (the README's x86-64-v3 floor was retired
  # out from under it, #480) and nobody noticed, because nothing ran it.
  oracle-certify:
    name: interval oracle (certify vs inari+MPFR)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_interval_oracle == 'true'
    # inari's rounding primitives sit behind
    # cfg(all(target_feature = "avx", target_feature = "fma")) and it raises
    # a compile_error! without them. The repo sets no target-cpu floor
    # (.cargo/config.toml, deliberately), so the flag is supplied HERE, on
    # the one lane that needs it, leaving the kernel's codegen untouched.
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    steps:
      - uses: actions/checkout@v4
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: interval-oracle
          workspaces: interval-transcendentals
      # Assert the runner can execute what -C target-cpu=x86-64-v3 emits
      # BEFORE spending four minutes building GMP for it. Exactly the sort
      # of thing that holds on one runner generation and not the next.
      - name: the x86-64-v3 floor holds on this runner
        run: |
          grep -q avx2 /proc/cpuinfo || { echo "NO AVX2 — the v3 floor does not hold here"; exit 1; }
          grep -q fma /proc/cpuinfo || { echo "NO FMA"; exit 1; }
      # gmp-mpfr-sys needs a C toolchain plus m4; ubuntu-latest carries
      # build-essential but m4 is worth asserting rather than assuming.
      - name: m4 for the gmp build
        run: sudo apt-get update -qq && sudo apt-get install -y -qq m4
      # Depth is nearly free on this lane and that is the whole reason to
      # spend it. The build above is a fixed ~234s; the cases are ~7s at
      # effort 1 (measured hosted, #480) and scale linearly — 8.2x measured
      # locally from effort 1 to 8. So effort 8 buys 32M cases per firing
      # for about 52s on top of a 250s job.
      #
      # Together with the varying seed this is the point of the exercise:
      # a lane that fires twice a year with a pinned seed re-certifies one
      # fixed sample forever, however deep it is. Fresh millions each
      # firing is worth more than the same millions faster.
      - name: certify against the oracle
        working-directory: interval-transcendentals
        env:
          CAD_FUZZ_EFFORT: "8"
        run: |
          t0=$SECONDS
          cargo test --release --features oracle-inari -- --nocapture
          echo "CASES_SECONDS=$((SECONDS - t0))"

  watertight:
    name: watertight (admesh)
    runs-on: ubuntu-latest
    needs: filter
    # Root package `stl`: the acceptance example lives there and its
    # (dev-)dependency graph is the whole profile -> sweep -> topo -> mesh
    # chain this job exercises, so `stl in closure` is exactly the
    # condition under which any of it can have moved.
    if: needs.filter.outputs.run_stl == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      # External STL verification (M2 PR 7): admesh 0.98.4 is
      # apt-packaged; the check script accepts NO repair as success.
      - name: install admesh
        run: sudo apt-get update && sudo apt-get install -y admesh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The example pre-flights our own validators (tier 1–3 incl. the
      # +V invariant, check_mesh, signed_volume > 0) before writing.
      - name: export acceptance STLs
        run: cargo run -p stl --example export_acceptance -- target/stl-acceptance
      - name: admesh check (watertight/manifold, no repair accepted)
        run: scripts/check_admesh.sh target/stl-acceptance

  step-import:
    name: step import (freecad)
    runs-on: ubuntu-latest
    needs: filter
    # Root package `step-export`: this job builds nothing — it runs FreeCAD
    # over the committed fixtures under crates/step-export/tests/fixtures,
    # which are byte-golden against that crate's writer.
    if: needs.filter.outputs.run_step_export == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      # External STEP import acceptance (M4 PR 7, the admesh pattern
      # STEP-shaped): FreeCAD/OCC imports the committed fixtures
      # (byte-golden against the writer via the cargo test suite) and
      # the script asserts validity + exact topology counts + volume.
      # No cargo build needed — the fixtures are committed.
      # apt has no freecad package on current ubuntu-latest (exit 100,
      # 2026-07-25); use the version-pinned AppImage instead — same
      # FreeCAD 1.1.2 as the local oracle, checksum-verified, cached.
      - name: cache freecad
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: ~/freecad-appimage
          key: freecad-1.1.2-appimage-extracted
      - name: install freecad (AppImage 1.1.2, checksum-verified)
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/freecad-appimage && cd ~/freecad-appimage
          curl -sLO https://github.com/FreeCAD/FreeCAD/releases/download/1.1.2/FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
          curl -sLO https://github.com/FreeCAD/FreeCAD/releases/download/1.1.2/FreeCAD_1.1.2-Linux-x86_64-py311.AppImage-SHA256.txt
          sha256sum -c FreeCAD_1.1.2-Linux-x86_64-py311.AppImage-SHA256.txt
          chmod +x FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
          ./FreeCAD_1.1.2-Linux-x86_64-py311.AppImage --appimage-extract > /dev/null
          rm FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
      - name: freecad import check (validity, counts, volume)
        run: REQUIRE_FREECAD=1 FREECADCMD="$HOME/freecad-appimage/squashfs-root/usr/bin/freecadcmd" scripts/check_step.sh

  # LIB PY-CI (residual register R4; U10 follow-up F4): the Python suite
  # as a hosted job. Builds the pncad wheel with maturin, installs it
  # into a venv, and runs the FULL crates/pncad-py unittest set by
  # DISCOVERY — the same invocation crates/pncad-py/run-python-tests.sh
  # uses — so new test modules (e.g. #318's test_guide.py /
  # test_north_star.py) are picked up the moment they merge, with no
  # edit here. DELIBERATELY OFF the Rust-only critical path: nothing
  # `needs` this job, and the Rust jobs stay green with no Python
  # present (the U9S gating property — pyo3 rides the non-default
  # `python` feature, which only maturin turns on). Its failure still
  # reds the PR — that is the point.
  #
  # Root package pncad-py (see JOB_ROOTS in scripts/ci-filter.py): the
  # wheel compiles pncad-py's whole dependency graph — the entire façade
  # stack — so `pncad-py in closure` is exactly the condition under
  # which anything this job runs can have moved; the .py tests and .pyi
  # stub live under the member directory and seed the same closure.
  # Budget: one job, one Python version, no matrix, debug-profile build
  # (release is not required to prove the suite; the D9 bit-exactness
  # pins hold at any opt level — opt never moves rounding, and the
  # suite asserting so IS this job's evidence).
  # Local mirror: ci-local.sh's "python suite (staged cdylib)" row —
  # same tests, same discovery; the install path degrades to the staged
  # cdylib (run-python-tests.sh) so the row works even on the most
  # degraded box U9S measured (no pip, no maturin).
  python-suite:
    name: python suite (wheel + guide + north-star)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_pncad_py == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      # Python pinned at 3.12 — the interpreter the suite was written
      # and validated on (U9S/DOORS/U10 all ran the local 3.12). The
      # wheel is abi3-py38, so this is a determinism pin, not a
      # compatibility ceiling. actions/setup-python@v5 (GA 2023-12)
      # clears the ~2-week age policy by years — the same
      # long-aged-major-tag class as the checkout@v4 / cache@v4 /
      # upload-artifact@v4 pins this workflow already rides.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      # Separate cache key: the `python` feature graph (pyo3 + 4 more
      # crates) differs from every other job's — same CACHE SEPARATION
      # reasoning as build-interval (job-id separation is automatic;
      # the explicit key makes it intentional and survives a rename).
      - uses: Swatinem/rust-cache@v2
        with:
          key: python
      - name: install maturin (pinned, official prebuilt)
        run: curl -LsSf "https://github.com/PyO3/maturin/releases/download/v$MATURIN_VERSION/maturin-x86_64-unknown-linux-musl.tar.gz" | tar zxf - -C "$HOME/.cargo/bin" maturin
      # Debug profile on purpose (no --release): fastest honest build.
      # pyproject.toml's [tool.maturin] supplies module name + the
      # `extension-module` feature; abi3 needs no Python.h.
      - name: build the pncad wheel (abi3, debug profile)
        run: maturin build -m crates/pncad-py/Cargo.toml -o target/wheels
      # The venv lives OUTSIDE target/ deliberately: rust-cache caches
      # target/, and a cached venv skeleton restores without its bin/
      # contents (the 2026-08-10 red-main incident — the PR run passed
      # on a cold cache, main restored a mangled venv). RUNNER_TEMP is
      # never cached; --clear guards against any reuse regardless.
      - name: install the wheel into a venv
        run: |
          python -m venv --clear "$RUNNER_TEMP/py-ci-venv"
          "$RUNNER_TEMP/py-ci-venv/bin/python" -m pip install target/wheels/pncad-*.whl
      # The STATIC half of the §L4 type story (LIB-PYG1): `ty` checks
      # the .pyi lattice's SIGNATURES, which the name-for-name stub
      # check deliberately does not look at. Pinned like maturin; this
      # step is where the row is MEASURED, so a fetch failure reds the
      # job rather than passing quietly. `tests/test_ty.py` skips —
      # loudly, naming the missing binary — only where no checker
      # exists at all (the degraded local box U9S recorded).
      - name: install ty (pinned, the static stub checker)
        run: |
          "$RUNNER_TEMP/py-ci-venv/bin/python" -m pip install "ty==$TY_VERSION"
      # Discovery from the repo checkout: guide tests read the docs/
      # Markdown relative to their own file, and the stub check is
      # layout-invariant (validated on the wheel-venv layout, #308).
      - name: run the Python suite (unittest discover)
        run: |
          "$RUNNER_TEMP/py-ci-venv/bin/python" -m unittest discover \
            --start-directory crates/pncad-py/tests \
            --top-level-directory crates/pncad-py/tests \
            --verbose
        env:
          PNCAD_TY: ${{ runner.temp }}/py-ci-venv/bin/ty

  # (The former standalone `multi-eps` job is FOLDED into the `test`
  # matrix above: its 1e-6/1e-12 rows and the old unparameterized `test`
  # job were three compilations of bit-identical binaries; they are now
  # three run-only legs over one archive. D4 ¶1's multi-ε obligation is
  # unchanged — same three eps bands, same scoped test set.)

  # M4 PR 6 spec D6: the three persistence obligations as NAMED gates
  # (they also run inside the workspace rows; naming them keeps the
  # contract visible and their failures attributable at a glance).
  # ε battery {1e-6, 1e-12} per the 2026-07-30 ruling — the default-ε
  # (1e-9) pass of these same test targets is inside the `test` job's
  # workspace run, so no band is lost.
  persistence:
    name: persistence (eps = ${{ matrix.eps }})
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_editor_core == 'true'
    strategy:
      fail-fast: false
      matrix:
        eps: ["1e-6", "1e-12"]
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # D6.1 save/load/replay-identity + the D2 float property row +
      # the committed golden v1 fixture (byte-exact freeze tripwire).
      - name: save/load/replay-identity (D6.1) + float bits (D2) + golden v1
        run: "cargo test -p editor-core --test all -- m4_pr6_roundtrip:: m4_pr6_floats:: m4_pr6_golden::"
        env:
          CAD_TOLERANCE_EPS: ${{ matrix.eps }}
      # D6.2 ε-change diff (cross-process, goldened): the two probe
      # children pin their OWN ε values — the matrix ε only hosts the
      # orchestrating parent.
      - name: eps-change diff goldened (D6.2)
        run: "cargo test -p editor-core --test all -- m4_pr6_eps_diff::"
        env:
          CAD_TOLERANCE_EPS: ${{ matrix.eps }}
      # D6.3 schema-version / corrupt-file refusal + the adopted
      # adversarial probe suite (review pins) + token key-space pins.
      - name: schema + corruption refusal (D6.3) + review probes
        run: "cargo test -p editor-core --test all -- m4_pr6_refusal:: m4_pr6_review_probes:: profile_desc_key::"
        env:
          CAD_TOLERANCE_EPS: ${{ matrix.eps }}

  # M4 PR 8a spec D2 (M4-PLAN F8): rebuild-latency REPORTING. This job
  # prints a per-document table (full rebuild + incremental recompute,
  # median of 5) and diffs it against the newest entry in the timing
  # history, docs/perf-data/rebuild-latency/. It is DELIBERATELY NOT A
  # GATE on any timing number — instrumentation, not a contract;
  # PERF-PLAN stays advisory. The assertions inside are the
  # ε-independent structural ones (counted reuse, and the corpus
  # manifest's nodes/cone pins), which are arithmetic, not wall clock.
  #
  # THIS JOB IS THE CANONICAL PRODUCER of those numbers (2026-08-17).
  # It used to be a developer workstation, via a CAD_LATENCY_BASELINE_
  # REFRESH env var and a hand-committed baseline, and that arrangement
  # disqualified itself: three refreshes disagreed by 90-98% on every
  # row with contention ruled out, so docs/PERF-SCAN-2026-08.md §0 had
  # to label every absolute-millisecond claim in the repo provisional.
  # A runner is not a quiet box, but it is a REPRODUCIBLE box class,
  # which is the property the workstation numbers lacked — and every
  # entry now records its own environment block, so two entries that
  # disagree can be compared rather than argued about. Same ruling
  # render.yml carries for renders (#338: hosted is canonical).
  #
  # TWO OUTPUTS, DIFFERENT AUDIENCES:
  #   * an ARTIFACT on every run (including PRs) — the numbers for the
  #     change in front of you, downloadable without waiting for a
  #     merge;
  #   * a COMMITTED history entry on pushes to main ONLY — the durable
  #     trend. Artifacts expire at 90 days; a question like "when did
  #     die_composed get slower" outlives that, and the git history is
  #     the only place in this repo that answers it.
  #
  # WHY MAIN ONLY. On a PR branch the entry would be that PR's own
  # measurement, so the PR's `vs base` column would diff against
  # itself and report nothing — the reporting row would structurally
  # stop reporting. Writing only on main keeps every PR's diff honest
  # (vs main's last hosted measurement) at the cost of nothing.
  rebuild-latency:
    name: rebuild latency (reporting)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_editor_core == 'true'
    permissions:
      # Only for the history commit below, and only on main. Every
      # other job in this workflow runs on the default read-only token;
      # this is the one that writes, so it says so here rather than
      # widening the whole workflow.
      contents: write
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--ignored`: the test is `#[ignore]`d so the ε matrix stops
      # paying for it 5× (it is reporting, and its green-document and
      # counted-reuse assertions are a strict subset of the corpus
      # row's — see the rustdoc on `rebuild_latency_table`). THIS job is
      # the one that runs it, so the flag is what keeps the table alive.
      # Same idiom as scripts/k_probe_sweep.sh.
      #
      # CAD_LATENCY_EMIT writes the measurement OUTSIDE the working
      # tree, into RUNNER_TEMP. The test only ever writes the file it
      # is told to; naming it and deciding whether it joins the history
      # is this workflow's call, never the test's — so a local run with
      # the var set cannot touch a committed path.
      - name: per-document full-rebuild + incremental-recompute table
        run: "cargo test -p editor-core --test all -- --ignored --nocapture m4_pr8_latency::"
        env:
          CAD_LATENCY_EMIT: ${{ runner.temp }}/rebuild-latency.json
          CAD_LATENCY_COMMIT: ${{ github.sha }}
          CAD_LATENCY_RUNNER: ${{ runner.os }}/${{ runner.arch }} ubuntu-latest
      # Every run, PRs included. `if: always()` because the measurement
      # is emitted BEFORE the structural assertions run: when a pin
      # fails, this artifact is exactly what the next reader wants.
      - name: upload measurement (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-latency-${{ github.sha }}
          path: ${{ runner.temp }}/rebuild-latency.json
          if-no-files-found: warn
      # THE AUTO-COMMIT. Main pushes only; see the header.
      #
      # NO RECURSION, TWO WAYS. Pushes made with the default
      # GITHUB_TOKEN do not trigger workflow runs — that is GitHub's
      # built-in guard and is what actually stops the loop here — and
      # the commit subject carries [skip ci] as belt-and-braces in case
      # this ever moves to a different token.
      #
      # DELIBERATELY NOT ADDED TO ci-filter.py's `_is_docs`. That
      # allowlist is for paths hosted CI CANNOT read — the claim is
      # proven by the prune step that deletes them — and CI does read
      # this one (m4_pr8_latency.rs takes its `vs base` from the newest
      # entry). So a hand-committed history file classifies TIER=all,
      # which is the allowlist failing closed exactly as designed. The
      # auto-commit below never reaches the filter at all, per the
      # recursion note above.
      #
      # APPEND-ONLY, SO THE RACE IS NOT A CONFLICT. The filename
      # carries this run's commit sha, so no two runs write the same
      # path and no merge is ever needed. If main moved while we were
      # measuring, the push is rejected; the retry re-syncs to the new
      # main and re-lands the SAME new file on top. That re-commits an
      # unpushed local commit — it never rewrites published history,
      # which is what the repo's merge-only rule is about.
      - name: commit measurement to the timing history (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MEASUREMENT: ${{ runner.temp }}/rebuild-latency.json
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f "$MEASUREMENT" || { echo "no measurement emitted"; exit 1; }
          # <epoch>-<short-sha>.json — lexicographic sort == chronological.
          stamp="$(date -u +%s)"
          name="${stamp}-${SHA:0:7}.json"
          dest="docs/perf-data/rebuild-latency/${name}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            # Re-sync to main. This also restores the local-only trees
            # the prune step deleted, so the commit below can only ever
            # contain the one new file.
            # --depth=1: the checkout is shallow and this only needs
            # main's TIP to commit onto; the server holds the ancestry,
            # so the push is an ordinary fast-forward.
            git fetch --depth=1 origin main
            git reset --hard origin/main
            mkdir -p docs/perf-data/rebuild-latency
            cp "$MEASUREMENT" "$dest"
            git add "$dest"
            git commit -m "perf(ci): rebuild-latency measurement for ${SHA:0:7} [skip ci]"
            if git push origin HEAD:main; then
              echo "committed ${dest}"
              exit 0
            fi
            echo "push rejected (main moved); retry ${attempt}"
            sleep $((attempt * 4))
          done
          echo "could not land the measurement after 4 attempts" >&2
          exit 1

  # M4 PR 8a spec D1: the Band 4 corpus as a NAMED row (it also runs
  # inside the workspace rows; naming it keeps the milestone's
  # proof-of-vocabulary attributable at a glance).
  # ε battery {1e-6, 1e-12} per the 2026-07-30 ruling — the default-ε
  # (1e-9) pass of this corpus is inside the `test` job's workspace run.
  corpus:
    name: band 4 corpus (eps = ${{ matrix.eps }})
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_editor_core == 'true'
    strategy:
      fail-fast: false
      matrix:
        eps: ["1e-6", "1e-12"]
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: evaluation, exact mass pins, counted reuse, vocabulary totality
        run: "cargo test -p editor-core --test all -- --nocapture m4_pr8_corpus::"
        env:
          CAD_TOLERANCE_EPS: ${{ matrix.eps }}

  # Spec D3: the large-K fragility lint. A GATE — a flagged margin
  # fails this row (the tool exits 2 and prints the interpretation
  # discipline; harness breakage exits 1 in its own voice). The row
  # also fails on a hygiene regression or the #99 litmus no longer
  # firing.
  #
  # READ THE FAILURE BEFORE TOUCHING GEOMETRY: a fired lint is evidence
  # that the margin DISTRIBUTION moved — possibly that a threshold or
  # the baseline is stale. Recourse is re-derivation (docs/K-REPORT.md,
  # "M7 addendum (2026-08-07): the large-K lint's floor refresh"), or a
  # recorded demotion to advisory; never a geometry nudge to get under
  # the threshold. The tool prints all of this on failure.
  #
  # The committed baseline + threshold provenance:
  # docs/k-report-data/m7-eps-*.csv.gz and tools/k-lint/src/lib.rs
  # (docs/K-REPORT.md M7 addendum has the histogram, the percentile
  # re-argument, and the ε-coupled ruling; the m4-/m5- baselines stay
  # committed as the durable record).
  k-lint:
    name: k-lint (gate)
    runs-on: ubuntu-latest
    needs: filter
    # No minimal root set, deliberately: this is the ONLY job that compiles
    # demos/tour (a path-dependent of nine members) and tools/k-lint, and
    # its probe sweep records margins from every kernel crate. So it runs
    # whenever anything builds at all.
    if: needs.filter.outputs.run_k_lint == 'true'
    steps:
      - uses: actions/checkout@v4
      # STRUCTURAL: hosted CI must not depend on LOCAL-ONLY TOOLING —
      # local-scripts/ (the local half of the tooling split) and .claude/
      # (agent session config: the SessionStart hook that provisions a
      # Claude Code on the web container, and its settings). Deleting both
      # here means a workflow that grows a reference to either fails
      # loudly on the very next run instead of silently coupling the gate
      # to a developer's machine or to an agent's container.
      # This is also what lets scripts/ci-filter.py treat changes under
      # either tree as non-triggering (its _is_docs).
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: k-lint
          workspaces: |
            .
            demos/tour
            demos/wild
            tools/k-lint
            tools/tess-lint
            tools/tess-meter
      # Hosted mirror of ci-local's "demos tour (fmt + clippy)" row:
      # the tour is workspace-excluded, so the fmt/clippy jobs above
      # never see it — and this is the job that builds it anyway (the
      # demo scenes are half the lint's subject matter). demos/wild
      # (the wild-corpus montage generator) rides the same row for the
      # same reason.
      - name: demos tour fmt + clippy
        run: cd demos/tour && cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - name: demos wild fmt + clippy
        run: cd demos/wild && cargo fmt --check && cargo clippy --all-targets -- -D warnings
      # THE #99 ε PIN, ARMED. `--all-targets` above type-checks the test
      # targets and runs none of them, so until this row landed nothing
      # in any gate had ever EXECUTED an assertion under `demos/`. The
      # pin spawns the tour three times (default ε, 1e-6, 1e-12).
      #
      # COST, AND IT IS NOT FREE. This row builds `demo-tour` in release
      # at DEFAULT features. The tess-budget sweep below builds the same
      # crate at `--features budget` — a different feature unification,
      # so the two share nothing and this job now pays two release
      # builds of the kernel where it paid one. The runs themselves are
      # ~7 s (measured on the lane's own box, warm cargo registry); the
      # build in front of them took 1m06 there from a cold target and
      # the sweep's own comment below prices such a build at "tens of
      # seconds" on a runner with this job's cache warm. Folding the
      # pin into `--features budget` would share that build, and is
      # rejected: it would arm the per-face meter inside the run this
      # pin is about, so the tour under test would not be the tour that
      # ships.
      #
      # SCOPED TO THE INTEGRATION TEST, DELIBERATELY, AND NOT A
      # SILENCING. A plain `cargo test --release` here would also run
      # `--bin demo-tour`'s seven `lily::review_probes` unit tests, and
      # two rows of `finding_13_tessellation_table_reproduces` are red
      # on main today (issue #782: the two SWEPT blades tessellate to
      # 1016/854 triangles against a pinned 976/826, while all five
      # analytic rows are exact). Whether that new count is correct is a
      # `mesh` question. **What stays unrun is load-bearing**: those
      # seven include `the_spine_curl_wall_re_measured`, which pins a
      # typed `LoftError::ReversedStacking` frontier from both sides,
      # so `lily.rs` keeps its frontier pins in two spellings of which
      # only the tour-runtime one (`wall_probes`) executes. Widening
      # this row to the whole suite is owed the moment #782 is decided —
      # #782 carries that obligation and the split.
      - name: demos tour eps pin (#99)
        run: cd demos/tour && cargo test --release --test eps_regression
      - name: k-lint tool fmt + clippy + tests (incl. the #99 litmus)
        run: cd tools/k-lint && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
      # `cargo doc` here is the same stopgap #709 added to the
      # tess-meter row below, for the same reason: `scripts/doc-gate.sh`
      # covers workspace MEMBERS only, so this crate's prose — which
      # carries the gate's own rules and its report legend — is outside
      # it. The general hole (k-lint, demos/tour, demos/wild) is still
      # open and is stated at the gate itself.
      - name: tess-lint tool fmt + clippy + doc + tests (the three exit voices)
        run: |
          cd tools/tess-lint
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings -A rustdoc::private_intra_doc_links" \
            cargo doc --no-deps --document-private-items
          cargo test
      # The meter's CONSUMER half: the CSV schema, the counterfactual
      # schedules and the split optimizer, which is where they live now
      # that the kernel records measurements and derives nothing. Its
      # tests are the derivations' tests — the split optimizer's answer
      # against the certificate it claims to satisfy, and the row
      # shapes' agreement about their width.
      # `cargo doc` too, as the tess-lint row above now also does.
      # `scripts/doc-gate.sh` is `cargo doc --workspace` and the root
      # manifest excludes `tools/`, so this crate's ~1,050 lines of
      # prose — the slack factors, the anisotropy caveat, the boundary
      # rule — are outside that gate. Documenting them here is a
      # stopgap for THIS crate; the same hole still covers `k-lint`,
      # `demos/tour` and `demos/wild`, and is stated at the gate
      # itself.
      - name: tess-meter tool fmt + clippy + doc + tests
        run: |
          cd tools/tess-meter
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings -A rustdoc::private_intra_doc_links" \
            cargo doc --no-deps --document-private-items
          cargo test
      # THE METER'S KERNEL HALF, and the per-triangle certificate
      # falsifier with it. `mesh::budget` is gated at its module
      # boundary (mesh's `budget` feature), so the workspace test rows
      # above run the INERT half — which is the right default, and
      # exactly why the live half needs a row of its own or it rots.
      # Clippy too: two configurations, two lints (the
      # `unreachable!`-under-a-feature class has bitten twice, M8-F67,
      # precisely because a feature build had no clippy lane of its own
      # and hosted clippy could not see it).
      #
      # This row also runs
      # `probe_review::z1_per_triangle_certificate_falsification`, the
      # falsifier M8-5's review adopted (MIN-1) precisely so that "the
      # hosted gate runs it unconditionally". The falsification is now
      # the meter's deviation pass reduced to one ratio per face and
      # asserted in the suite, so it rides the `budget` build rather
      # than a feature of its own. THE INTENT SURVIVES ONLY WHILE THIS
      # ROW STAYS UNCONDITIONAL: k-lint runs "whenever anything builds
      # at all" (job header above), so the falsifier still runs on
      # every build-triggering change. Making this row conditional, or
      # dropping it, stops the falsifier running — that reopens a
      # ratified review outcome and must be said out loud.
      - name: mesh budget meter + certificate falsifier (feature = budget)
        run: |
          cargo clippy -p mesh --all-targets --features budget -- -D warnings
          cargo test -p mesh --features budget
      # THE UV SHEET DRIFT GATE WAS RETIRED HERE (2026-08-17). It
      # regenerated the sheet and failed on `git diff --exit-code`; that
      # obligation now belongs to render.yml's `uv` lane, which
      # RE-BASELINES instead — it commits the regenerated sheet and
      # marks the run neutral. Both rows fired on the same condition
      # (`run_k_lint`) and both read the SAME cached tour output (they
      # shared a cache key by construction), so this was a duplicate
      # signal, not an independent one — and keeping it would have made
      # every intended sheet change report red here and neutral there.
      # One gate per obligation, as before; the obligation moved.
      #
      # The LOCAL mirror in local-scripts/ci-local.sh stays: a developer
      # box cannot re-baseline itself, so a failing check is still the
      # right shape there.
      #
      # `tour output cache` went with it. That step existed solely to
      # feed demos/out to this gate — the tess-budget and k-probe sweeps
      # below build the tour themselves and write their own outputs, and
      # neither reads demos/out. render.yml keeps its own copy of the
      # cache on the same key, so the entry stays warm.

      # The tessellation-budget gate (issue #320). It rides THIS job
      # because this job is the one that builds demos/tour, and the
      # sweep IS the tour walking its own scenes (~4 s in release).
      #
      # COST, stated: this step now ALWAYS pays the tour's release
      # build — the uv-drift step that used to pay it on a cache miss
      # is retired (note above), so there is no longer a path where
      # someone else has already built it. That is the tour binary, not
      # its dependencies: tens of seconds against this job's own
      # critical path, not the workflow's. It is
      # deliberately not a debug run (the k-probe sweep's profile):
      # debug tessellates the same scenes 5-10x slower, which spends
      # more wall clock than the build it would avoid. The `--features
      # budget` that arms the meter at all lives in the sweep script,
      # once, beside the k-probe sweep's `--features probe`.
      #
      # It gates REGRESSION,
      # not absolute slack: the head's factors are large and known
      # (docs/TESS-BUDGET.md), so an absolute threshold could only be
      # set above them, and the one thing that must never happen is
      # someone coarsening a demo's delta to get a number down. What
      # this catches is a scene's mesh growing, a face's sizing getting
      # wastefuller, or a scene silently dropping out of the sweep.
      #
      # Baseline + how to re-cut it: docs/tess-budget-data/ and the
      # tool's own failure message, which prints the recourse.
      #
      # `--sizing-only`, deliberately: the default sweep also resamples
      # |S - Pi| on every emitted triangle to fill `worst_dev`, which is
      # ~1.15M triangles x 28 barycentric samples — tens of millions of
      # surface evaluations — and the gate reads NONE of it. What
      # `compare` looks at is triangle counts and `grid_cells /
      # span_opt_cells`, all of them sizing columns the lane produces
      # for free. The deviation pass is what the WRITEUP needed
      # (docs/TESS-BUDGET.md's total-slack column, and the committed
      # baseline still carries it); re-cutting the baseline runs the
      # script without this flag.
      - name: tessellation-budget sweep (every tour scene, per face)
        run: scripts/tess_budget_sweep.sh target/tess-budget-fresh.csv --sizing-only
      - name: tessellation-budget lint (gate — a grown budget fails this row)
        run: |
          cd tools/tess-lint && cargo run -- \
            ../../target/tess-budget-fresh.csv \
            --baseline ../../docs/tess-budget-data/tess-budget-baseline.csv
      # THE PROBE TEST SURFACE. `probe` is an opt-in feature, so a
      # `tests/*.rs` behind `#![cfg(feature = "probe")]` is invisible to
      # every default row in this file: it can rot into a build error, or
      # out of existence, with the whole matrix green. Before this loop
      # the only ones ever compiled were `editor-core`'s, as a side
      # effect of the sweep below rather than by anything that meant to.
      # How many there are is not written here: the census gate derives
      # the tally every merge and prints it per crate.
      #
      # WHY HERE AND NOT IN A JOB OF ITS OWN, which is the shape
      # `release-corruption` above would suggest. That job is separate
      # because release artifacts share no fingerprint with any
      # dev-profile job, so it had to own a cache key. The opposite holds
      # here: this is already the only job that passes `--features
      # probe`, so its cache is where the probe-instantiated graph lives,
      # and its gate (`run_k_lint`, "whenever anything builds") is
      # already the right one — `probe` is a `Real` instantiation, so a
      # change in ANY kernel crate can break a probe suite's type-check,
      # and a job keyed on a hand-written root set would be the same
      # snapshot-goes-stale failure one level up.
      #
      # WHAT THAT COSTS, stated so a debugger is not surprised by it:
      # COUPLING, and about 40 s a merge. A probe type-check failure now
      # reds `k-lint`, which is otherwise the margin-distribution gate:
      # if this job is red at the step below, the margins are not the
      # subject — a probe-gated `tests/*.rs` stopped compiling, and
      # nothing about the K thresholds has moved.
      #
      # The 40 s is the number to plan against, not the ~1 s a fully warm
      # local tree shows. `rust-cache` does not cache workspace crates,
      # only deps (see this file's cache header), so the operating point
      # is a restored dep graph with every member recompiled: 37-41 s
      # measured over two runs on a 4-vCPU agent container, against
      # 43-61 s from an empty target dir. A RATIO, not a hosted number.
      #
      # The selection is DERIVED, not listed: the census gate (in the
      # `discipline` job, which owns its guards and its self-test) scans
      # the tree, and this loop checks exactly what it prints, so a crate
      # that gains its first probe suite is covered with nothing to
      # remember. THE SUBSTITUTION IS BOUND FIRST, deliberately: a
      # command substitution inside a `for` list is not subject to
      # `set -e`, so a census refusal there would print its error and
      # leave this step green over zero crates — the silence one level
      # up from the one the census exists to remove.
      # BUILD, NOT CHECK, AND THE MEASUREMENT IS WHY. `--all-targets
      # --no-run` covers everything `cargo check --all-targets` covered —
      # the lib's own `#[cfg(test)]` modules included — and then some,
      # since it links what it checked. Doing both instead pays codegen
      # twice over: measured on this job, check-then-list summed 271 s
      # with the sweep against 219 s for build-then-list, because rmeta
      # from the check buys the link nothing.
      #
      # The `--list` pass then asks the compiler which of the CENSUSED
      # suites it actually built. A gate can be spelled correctly and be
      # true under no configuration CI runs — a second feature the loop
      # does not enable, a non-feature condition false on every runner —
      # and no predicate over the gate LINE can tell that from a gate that
      # compiles. The listing is piped into the census rather than judged
      # here, so the deciding half keeps its `--root` and `--selftest`.
      #
      # None of the link is waste: `scripts/k_probe_sweep.sh` runs
      # `--test all` on the next step but one, and this primes it.
      - name: compile and list every probe-gated test target
        run: |
          set -euo pipefail
          crates=$(scripts/gates/probe-suite-census.sh --crates)
          test -n "$crates"
          echo "probe-gated crates: $(echo "$crates" | tr '\n' ' ')"
          for c in $crates; do
            cargo test -p "$c" --features probe --all-targets --no-run
            cargo test -p "$c" --features probe --test all -- --list \
              | scripts/gates/probe-suite-census.sh --check-listing "$c"
          done
      # Runs the M2-era harness (crates/sweep) beside the M4/M5/M7 one
      # (editor-core + tour) — see the script header for why its dump
      # rides beside the linted CSV rather than inside it. A type-check
      # would not have caught what that harness actually did: it compiled
      # perfectly and panicked, unnoticed, for 26 days.
      #
      # IT ALSO RUNS THE PROBE LANE'S PRECONDITIONS, once and outside the
      # ε loop, and FLOORS WHAT IT RAN. The preconditions are the plain
      # `#[test]`s asserting that `Probe` is a wrapper and not a second
      # arithmetic; they sat compiled and unexecuted because the sweep's
      # only selections passed `--ignored`. The floor
      # (`probe-suite-census.sh --check-executed`, called by the script)
      # is keyed on the runner's own passed count per invocation, never
      # on which suites a filter could have matched — a filter naming a
      # suite of plain `#[test]`s selects the module and runs none of it,
      # so reachability and execution are different questions here.
      - name: K-telemetry probe sweep (corpus + M2 corpus + demo scenes, 3 eps rows)
        run: scripts/k_probe_sweep.sh target/k-fresh
      - name: large-K lint (gate — a flagged margin fails this row)
        run: |
          cd tools/k-lint && cargo run -- \
            ../../target/k-fresh/k-eps-1e-6.csv \
            ../../target/k-fresh/k-eps-1e-9.csv \
            ../../target/k-fresh/k-eps-1e-12.csv

  # THE RENDER GATE. The committed montages are build products of the
  # kernel that nothing checked: for a while `k-lint` gated the UV sheet
  # alone, because it was the only lane a FreeCAD-less runner could
  # reproduce, and the other three rotted silently between hand-run
  # refreshes. All four are checkable now — hosted is their canonical
  # producer (#338) and a repeat hosted render is byte-identical — so
  # this calls render.yml rather than restating how a lane renders: ONE
  # definition, checked here and dispatched on demand there. (That
  # k-lint row was retired 2026-08-17 when the uv lane started
  # re-baselining itself; see the note where it stood.)
  #
  # It is free in wall clock. The lanes finish in ~150 s against this
  # workflow's ~460 s critical path (the test shards), so they cost
  # runner minutes and nothing else, and only on the same condition
  # `k-lint` uses — a render depends on the whole kernel, so "whenever
  # anything builds at all" is the right trigger for it too.
  #
  # A DRIFTING LANE FIXES ITSELF (2026-08-17): each lane commits its
  # re-rendered cells straight back to this PR's branch and marks the
  # run NEUTRAL — "!", not "x" — so accepting an intended render change
  # is `git pull` and a glance at the images, not a download-install-
  # commit-rerun cycle. See render.yml's header and
  # .github/actions/rebaseline-lane for why neutral rather than red.
  #
  # `push_to` is the BRANCH, while the render itself runs on
  # `github.ref` — the PR's MERGE commit on a pull_request, main's tip
  # on a push. Rendering the merge preview and committing to the head
  # branch is self-consistent because this gate always compares against
  # that same merge preview, and main's own push run re-renders and
  # re-baselines again after the merge if the two ever part.
  #
  # Scene concurrency is left to render.yml's own default (2, the
  # runner's core count) rather than restated here: this job renders the
  # canonical frames, so it must not be the place a second opinion about
  # how they are produced can creep in.
  renders:
    name: render lanes
    needs: filter
    if: needs.filter.outputs.run_k_lint == 'true'
    uses: ./.github/workflows/render.yml
    # A reusable workflow gets the CALLER's token scope, and this
    # workflow declares none at the top level — so the lanes' own
    # `permissions:` blocks cannot grant what this job never had.
    permissions:
      contents: write
      checks: write
    with:
      gate: true
      lanes: all
      # PUSH_TO ONLY ON MAIN (2026-08-18). A bot commit onto a PR branch
      # becomes the PR's head, and a GITHUB_TOKEN push triggers no run
      # of its own — so the PR would show one neutral check and nothing
      # else, every green check stranded on the parent commit. Measured
      # on this workflow's own PR (#598): 30 green jobs on 048edc9, and
      # a head commit carrying a single check. The recursion guard and
      # that blank slate are the same fact, so PRs REPORT and main
      # COMMITS — the same rule the rebuild-latency history follows,
      # and now one rule rather than two answers to one question.
      push_to: ${{ github.event_name == 'push' && github.ref_name || '' }}
      # The sha the report-only drift check is posted against. On a
      # pull_request `github.sha` is the merge commit and a check there
      # never appears on the PR, so name the PR's head explicitly.
      report_sha: ${{ github.event.pull_request.head.sha || github.sha }}
