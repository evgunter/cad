name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# BUILD ONCE PER COMPILE MODE (2026-08-03, Evan's ask: "compile the code
# for each mode, then shard the tests"). The eps test rows run
# BIT-IDENTICAL binaries — CAD_TOLERANCE_EPS is read at RUNTIME
# (geom-core/src/tolerance.rs), never at compile time — so compiling the
# workspace once per eps row was pure redundancy (measured ~8.5-9.5 min of
# each row's ~12 min was compile; execution is ~3 min). Only the
# `interval` feature is a different build graph. So: two BUILD jobs
# (`build`, `build-interval`), each `cargo nextest archive` + artifact
# upload, and thin RUN jobs that download the archive and only execute.
#
# cargo-nextest is the archive/run vehicle, PINNED here (single source of
# truth for the version): 0.9.140, published 2026-07-05 — ~4 weeks old at
# adoption (2026-08-03), past the 2-week dependency-age rule; a dev/CI
# tool only, never in any shipped build graph. Install is the official
# get.nexte.st prebuilt at the pinned URL — no third-party action.
# Nextest semantics vs `cargo test`, audited at adoption:
#   * process-per-test — strictly safer for the tolerance OnceLock
#     (every test gets a fresh global; nothing relied on shared init);
#   * per-test output capture — only affects log layout;
#   * DOC-TESTS DO NOT RUN under nextest — the workspace has real
#     doctests (incl. compile_fail blocks only the doctest runner
#     exercises), so each build job keeps a `cargo test --doc` step.
#
# LINK/DEBUGINFO KNOBS ON THE TWO BUILD JOBS (2026-08-04, from the
# Bazel-verdict measurement; Evan approved items 2/3/4 of its ranked
# alternatives). The verdict was NO to Bazel, on this evidence from run
# 30884593286: the `rebuild latency` job compiles all 10 workspace libs
# from scratch plus ONE test binary in 20.16 s, while `build + archive`
# compiles the same libs plus 261 binaries in 8 m 34 s (514 s). So ~494 s
# (96%) of the build job is the 261 test-binary codegen+link actions,
# ~1.9 s each. Bazel caches actions; it does not make them cheaper, and
# the reverse-dep funnel (touching geom-core invalidates 249/249 test
# binaries; 6 of the last 16 crate-touching merges did exactly that)
# means the cache would miss anyway. So: attack the per-binary cost.
#
#   RUSTFLAGS=-C link-arg=-fuse-ld=mold   261 static links of a ~40-rlib
#     graph were running on GNU ld. CI-ONLY: it rides the build jobs'
#     `env:`, NOT .cargo/config.toml, so local builds keep the default
#     linker. `-fuse-ld=` is a LINK argument, not a codegen flag: it
#     cannot move rounding or instruction selection, so D9 determinism
#     and the interval backend are untouched. (scripts/gate.sh's RUSTFLAGS
#     hazard note is about codegen flags and about a warm local target/
#     re-fingerprinting; it already unsets RUSTFLAGS, so this cannot leak
#     into the local gate.)
#   CARGO_PROFILE_{DEV,TEST}_DEBUG=line-tables-only   CI was emitting
#     full DWARF across 261 binaries and then throwing it away at link
#     (CARGO_PROFILE_TEST_STRIP=debuginfo, kept below for the 500 MB
#     artifact quota). Stripping already forfeited line numbers, so this
#     loses nothing CI had; function names in backtraces survive.
#
#   MEASURED, PR #174 (all timings tier `all`, same 261-binary archive;
#   PR #177 then collapsed 251 of those 263 binaries into 12 aggregators —
#   see any crates/*/tests/all.rs header — so the per-binary constant now
#   multiplies 24 binaries, not 263):
#     default build compile step   514 s -> 389 s  (-24%)
#     interval build compile step  618 s -> 495 s  (-20%)
#   The runner is 2 vCPU / 7 GB (`nproc` from the provenance step below —
#   standard GitHub-hosted for a private repo; the Bazel report's "4 vCPU"
#   was wrong). That is why 261 independent link/codegen units are so
#   expensive here, and why item 1 (collapsing 249 test crates into ~12)
#   is still the big one.
#   BUILD_RUNNER   repo variable, unset today ⇒ `ubuntu-latest`. Item 4
#     of the ranked list (8-vCPU runner) is NOT LANDABLE on this repo:
#     GitHub-hosted larger runners require an ORGANIZATION on Team or
#     Enterprise Cloud, and evgunter/cad is a User-owned private repo
#     (`gh api repos/evgunter/cad --jq .owner.type` ⇒ "User"). Hard-coding
#     a larger-runner label would fail the build job with "no runner
#     matching labels" and take the whole gate — and the two build jobs
#     are the gate's critical path. The variable makes it a one-setting
#     flip if the repo ever moves under an org. Note also that larger-
#     runner minutes are billed SEPARATELY from the included-minutes
#     allowance this repo's change filter exists to protect.
#
# NOT MIRRORED into scripts/ci-local.sh, deliberately: these are hosted-
# runner performance knobs, not gate semantics. No job is added, removed
# or re-scoped, the same targets are compiled and the same tests run, so
# the local gate stays byte-for-byte equivalent in what it PROVES. The
# mirror convention covers the matrix, not the runner's linker.
env:
  NEXTEST_VERSION: "0.9.140"
  # maturin rides the same pattern as nextest: pinned here (single source
  # of truth), installed from the official GitHub-release prebuilt at the
  # pinned URL — no third-party action. 1.14.1 (released 2026-06-19) is
  # the exact binary the U9S/DOORS/U10 wheels were built and validated
  # with locally; ~7 weeks old at adoption (2026-08-09), well past the
  # 2-week dependency-age rule. A dev/CI tool only — it never enters any
  # shipped build graph (the wheel's compiled code is cargo's output).
  MATURIN_VERSION: "1.14.1"
  # `ty`, the static stub checker (LIB-PYG1). 0.0.39 was published
  # 2026-05-22, so it clears the >=2-week dependency age policy by
  # weeks.
  TY_VERSION: "0.0.39"

# The toolchain (channel + rustfmt/clippy components) comes from
# rust-toolchain.toml: the dtolnay step only bootstraps/updates rustup, and
# rustup's toolchain-file override then auto-installs the pinned 1.97.0 with
# its components on the first cargo invocation. The pinned compiler (D9 / L2)
# has a single source of truth — the toolchain file.
#
# KEEP IN SYNC with scripts/ci-local.sh (the local mirror of this matrix,
# the merge gate whenever hosted Actions is unavailable): a job added,
# removed, or changed here gets the same change there, and vice versa.
# There is no structural enforcement — this pair of cross-references is it.
# The one thing that is NOT mirrored by hand is the change filter: both
# files call scripts/ci-filter.py and act on its output, so the tiering and
# the dependent closure have a single implementation and cannot drift.

jobs:
  # Change filter (added 2026-07-29, Evan's ask after the Actions-budget
  # exhaustion; made dependency-aware 2026-07-28). THREE tiers, and all of
  # the logic lives in scripts/ci-filter.py — this job is a thin wrapper
  # that wires that script's KEY=value output onto the `if:` conditions and
  # cargo arguments below. scripts/ci-local.sh calls the SAME script with
  # the same semantics, so the hosted and local gates cannot drift and one
  # set of tests covers both.
  #
  #   docs     only *.md / memories/ — nothing builds; the `docs-only ok`
  #            marker job is the whole gate (floor convention: floors apply
  #            to CODE PRs).
  #   all      a workspace-level file moved (root Cargo.toml, Cargo.lock,
  #            rust-toolchain.toml, .cargo/, .github/, scripts/, the
  #            excluded workspaces demos/ tools/ interval-transcendentals/,
  #            docs/k-report-data/, ANY member Cargo.toml, or anything the
  #            allowlist does not recognise) — everything runs, unscoped.
  #   closure  only crate sources moved — the changed members plus every
  #            member that transitively depends on them (dev-dependencies
  #            included) are built, and the pipeline rows run iff their root
  #            package is in that closure.
  #
  # Fails CLOSED: any classification error or unrecognised path yields
  # tier `all`. No third-party action here on purpose — checkout plus the
  # runner's preinstalled rustup is the whole toolbox, so the gate that
  # decides what runs has the smallest possible supply chain.
  filter:
    name: change filter
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.classify.outputs.TIER }}
      pkgs: ${{ steps.classify.outputs.PKGS }}
      cargo_scope: ${{ steps.classify.outputs.CARGO_SCOPE }}
      run_build: ${{ steps.classify.outputs.RUN_BUILD }}
      run_editor_core: ${{ steps.classify.outputs.RUN_EDITOR_CORE }}
      run_stl: ${{ steps.classify.outputs.RUN_STL }}
      run_step_export: ${{ steps.classify.outputs.RUN_STEP_EXPORT }}
      run_pncad_py: ${{ steps.classify.outputs.RUN_PNCAD_PY }}
      run_interval_backend: ${{ steps.classify.outputs.RUN_INTERVAL_BACKEND }}
      run_k_lint: ${{ steps.classify.outputs.RUN_K_LINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        # RUSTUP_TOOLCHAIN=stable keeps this job off the pinned 1.97.0
        # download: the script only runs `cargo metadata --no-deps`, which
        # parses the workspace manifests and neither builds nor resolves the
        # registry, so the compiler version is irrelevant — and if a future
        # manifest ever did need the pinned toolchain to parse, the failure
        # path is tier `all`, not a wrong answer.
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          # Always diff against the checkout's own first parent. On
          # pull_request the checkout is the test-merge commit, so HEAD^1
          # is by construction the exact base state the merge was built
          # against; the event payload's base.sha can be newer than that
          # (base moved between payload snapshot and merge-ref
          # construction), and the skew window's commits then appear as
          # phantom changed files that defeat the docs/closure tiers.
          BASE="$(git rev-parse HEAD^1 2>/dev/null || git rev-parse HEAD)"
          echo "base: $BASE"
          echo "changed files:"
          git diff --name-only "$BASE"...HEAD || true
          echo "classification:"
          scripts/ci-filter.py --base "$BASE" | tee -a "$GITHUB_OUTPUT"

  docs-only:
    name: docs-only ok
    runs-on: ubuntu-latest
    needs: filter
    steps:
      - run: echo "tier=${{ needs.filter.outputs.tier }} pkgs=${{ needs.filter.outputs.pkgs }}"

  discipline:
    name: discipline (evaluation-code)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_build == 'true'
    steps:
      - uses: actions/checkout@v4
      # Compound Bounds bounds (`T: Decide + Bounds`) are legal ONLY in
      # the seams the 2026-07-29 amendment ratified (geom-core
      # `real.rs`, Bounds scope rule): the C10 boolean-sweep driver
      # lane in topo, the evaluation-service seam in editor-core,
      # profile's pre-amendment fillet gate, and topo/props.rs — the
      # M5 PR 11 certified-quadrature plumbing (Evan's lane-split
      # ruling at that PR: certification is the bracket-carrying
      # lanes' business, statically split from the dual lane through
      # `PropsQuadLane`), and — since M5 PR 12 — the fillet-battery
      # seam in sweep. That last one is an ORCHESTRATOR ruling
      # (2026-08-03) applying the PR 11 precedent, flagged for
      # retroactive Evan review per the self-merge convention: the battery's margins are certified metric quantities
      # (sup-κ curvature hulls, blend setback bounds) reported as
      # `f64` payloads, i.e. enclosure consumers of exactly the
      # quadrature's class; and no dual-scalar path can reach it —
      # `Bounds` is implemented only for `f64`, `Interval` and
      # `Probe`, never for `Dual`, and the one wiring that calls
      # fillets (editor-core's `wire_fillet`) sits under `evaluate<T>`,
      # which is itself already `Bounds`-bounded and instantiated at
      # `f64`/`Interval` only. With no dual lane to split, the
      # `PropsQuadLane` static split would have had nothing on its
      # refusing side, so the seam is ratified instead.
      # geom-brep/src/{ssi.rs,ssi/certify.rs,pcurve_cache.rs} is the
      # M6-2 SSI generic-T lift: the rung-3 certificate simultaneously
      # DECIDES (its `ssi_*` funnel margins) and reads brackets into the
      # C9 ring (its hull and tube limbs ARE ring enclosures), so
      # `Decide + Bounds` is its honest signature — the same class as
      # the quadrature seam, and unlike the fillet seam its refusing
      # side is NOT empty: `PcurveFittedLane` splits f64/Probe/Interval
      # (certified) from `Dual` (typed refusal, no bracket to offer).
      # `ssi/enclose.rs` is deliberately absent — it decides nothing, so
      # it takes the sole-bound `T: Bounds` the rule allows everywhere.
      # geom-brep/src/edge_nurbs.rs is M7-8's plane × NURBS edge lane,
      # the narrowest possible extension of that same seam: it DELEGATES
      # to the already-listed `certify_rung3` door with a declared
      # carrier instead of a marched one, inheriting the door's
      # signature rather than widening anything. Its split is written in
      # the same shape — `EdgeNurbsLane` splits f64/Probe/Interval
      # (certified) from `Dual` (typed refusal) — and it is what keeps
      # `Bounds` out of `topo`'s signatures.
      # Sole-bound `T: Bounds`
      # (certification/driver code) is untouched by this check. A NEW
      # file writing a compound Bounds bound fails here until it is
      # ratified into the real.rs rule AND this allowlist.
      # profile/src/path/arc_fillet.rs is the LIB-G2 PATHS arc-carrier
      # fillet boundary (ruling LB3, 2026-08-08): the algebra forbids
      # authoring a fillet's corner, so it DERIVES 0/1/2 corners from the
      # two carriers and the S8 choice is over (corner, candidate) pairs —
      # it decides (the carrier-meet and angular advance/reach gates) and
      # reads the selection channel in one function, which is
      # `Decide + Bounds` honestly, carrying sugar.rs's ratified
      # justification verbatim: a representation-level choice between
      # already-classified constructions, never a re-decision of geometry.
      # Confined to this one file so path.rs itself stays bracket-free;
      # fillet_select.rs is NOT listed (sole-bound `T: Bounds`).
      - name: Bounds compound-bound allowlist (ratified 2026-07-29)
        run: |
          hits=$(grep -rnE '\+\s*(geom_core::)?Bounds\b' crates/*/src \
            | grep -vE ':[0-9]+:\s*(//|///|//!)' \
            | cut -d: -f1 | sort -u \
            | grep -vE '^crates/topo/src/boolean/(boxes|mod|ops|reduce|rest)\.rs$' \
            | grep -vE '^crates/topo/src/props\.rs$' \
            | grep -vE '^crates/editor-core/src/eval/(mod|wire)\.rs$' \
            | grep -vE '^crates/profile/src/sugar\.rs$' \
            | grep -vE '^crates/profile/src/path/arc_fillet\.rs$' \
            | grep -vE '^crates/geom-brep/src/(pcurve_cache|ssi|ssi/certify|edge_nurbs)\.rs$' \
            | grep -vE '^crates/sweep/src/fillet/(battery|build|surgery)\.rs$' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::compound Bounds bound outside the ratified seams above — see geom-core/src/real.rs (Bounds scope rule); ratify before allowlisting"
            exit 1
          fi
      # Interval-square discipline tripwire (memories/
      # interval-square-poison.md — FOUR live bugs from this one class):
      # squaring via plain `x * x` treats the factors as independent, so
      # a zero-straddling enclosure gets a spurious negative lower bound
      # that poisons downstream sqrt/decoration. Comment lines are
      # stripped (same as the Bounds step). Allowlist rationale, per file:
      #  - geom-core real.rs / interval.rs / dual.rs / ring_interval.rs —
      #    the scalar implementations themselves: `x * x` is definitional
      #    (powi is BUILT from it) and their tests deliberately contrast
      #    the plain product with the tight square;
      #  - geom-core linalg/mat.rs — `rotation_about`'s evaluation order
      #    is D9-ratified and doc'd in-file ("exactly as parenthesized");
      #    tightening `t·x·x` to `t·x²` is a design change, not a cleanup
      #    (the test hits are `r * r.transpose()` matrix products);
      #  - geom-core linalg/svd.rs / lsq.rs — documented f64-only
      #    selection lanes (lsq's hits are usize buffer sizing);
      #  - geom-brep ssi/jet.rs / march.rs / system.rs — f64-only jet and
      #    marcher numerics (finite differences, step control).
      - name: interval-square powi(2) allowlist (ratified 2026-08-01)
        run: |
          hits=$(grep -rPn '\b([a-z_][a-z0-9_]*)\s*\*\s*\1\b' crates/*/src --include='*.rs' \
            | grep -vE ':[0-9]+:\s*(//|///|//!)' \
            | cut -d: -f1 | sort -u \
            | grep -vE '^crates/geom-core/src/(real|interval|dual|ring_interval)\.rs$' \
            | grep -vE '^crates/geom-core/src/linalg/(mat|svd|lsq)\.rs$' \
            | grep -vE '^crates/geom-brep/src/ssi/(jet|march|system)\.rs$' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::use powi(2): it is never wider than x*x and strictly tighter when the enclosure straddles zero; whether THIS enclosure can straddle zero is a global property of upstream callers that refactors change silently — four live bugs arrived exactly that way. Convert, or ratify this file into the allowlist."
            exit 1
          fi
      # Evaluation-code discipline tripwire (see the `real.rs` module docs):
      # a type parameter written `T: Real + PartialOrd` (or any other extra
      # bound) is the escape hatch that lets generic evaluation code smuggle
      # raw comparisons past the trait — it compiles at f64 and only dies at
      # the interval instantiation. Fail if any `Real +` bound combination
      # appears in crate sources. grep exits 1 (no match) on a clean tree —
      # that is the PASS case; a match exits 0 and we fail loudly here. When
      # a legitimate `Real +` combination first appears, refine this into an
      # allowlist as a design decision — do not silently delete the check.
      - name: no extra bounds on Real
        run: |
          if grep -rnE '\bReal\s*\+' crates/*/src; then
            echo "::error::found 'Real +' bound(s) above — evaluation-code discipline forbids extra bounds on scalar type parameters"
            exit 1
          fi
      # Test-aggregation discipline: one [[test]] target per crate. Each
      # extra one is a full codegen+link of the ~40-rlib graph — 96% of
      # this workflow's build job, measured (bazel-verdict report). #179
      # collapsed 249 targets to 12 on that evidence and MISSED
      # step-import, which silently kept 26 (two thirds of every remaining
      # test target in the workspace) until the 2026-08-10 build-contention
      # investigation found it. The complementary per-crate
      # `every_suite_file_is_aggregated` test cannot fire for a crate that
      # never opted in — that is the hole this closes.
      - name: test-aggregation discipline
        run: scripts/check-test-aggregation.sh
      # Bit-identity coincidence checking is RETIRED from production
      # (M4 PR 5, NAMING-DESIGN N6; DESIGN.md roadmap; Evan, #53): the
      # declared rung is GeomSource lookup, and the production-consumer
      # allowlist is EMPTY. The remaining rows are NON-consumers:
      #  - bit_identity.rs — the sanctioned seam itself;
      #  - interval.rs — Interval::repr_bits over its OWN storage:
      #    scalar plumbing (exact-representation access), never a
      #    coincidence comparison;
      #  - eval/memo.rs — HASHES exact bits into content keys (spec D4
      #    "values AS BITS"): scalar plumbing, never a comparison;
      #  - topo/source.rs — the cfg(debug_assertions)-gated
      #    "records agree with bits" assertion (N6's
      #    debug_assert!(same_source => eq_bits)); not in production
      #    builds.
      # The tripwire stays ARMED: any NEW file using the channel fails
      # here — a new production consumer is a design regression against
      # the ratified retirement (add nothing without a DESIGN.md
      # revision). Comment lines are excluded (docs may name the
      # channel; code may not use it unlisted).
      - name: bit-identity consumer tripwire (retirement landed, M4 PR 5)
        run: |
          if grep -rnE 'bit_identity::|repr_bits|eq_bits' crates/*/src \
            | grep -vE '^crates/geom-core/src/bit_identity\.rs:' \
            | grep -vE '^crates/geom-core/src/interval\.rs:' \
            | grep -vE '^crates/topo/src/source\.rs:' \
            | grep -vE '^crates/editor-core/src/eval/memo\.rs:' \
            | grep -vE ':[0-9]+:\s*//'; then
            echo "::error::bit-identity channel use above — the channel is RETIRED from production (M4 PR 5, N6); use GeomSource, or revise DESIGN.md before adding any consumer"
            exit 1
          fi
      # source.rs must stay debug-only: its bit-channel calls may only
      # appear inside cfg(debug_assertions) items (grep-level guard:
      # the file declares the gate above each use).
      - name: bit-identity debug-only guard (topo/source.rs)
        run: |
          uses=$(grep -cE 'bit_identity::|eq_bits' crates/topo/src/source.rs || true)
          gates=$(grep -c 'cfg(debug_assertions)' crates/topo/src/source.rs || true)
          if [ "$uses" -gt 0 ] && [ "$gates" -eq 0 ]; then
            echo "::error::topo/src/source.rs uses the bit channel without cfg(debug_assertions) gating — the retirement allows a debug assertion only"
            exit 1
          fi
      # Complementary punning tripwire (M3 PR 4; Evan #53/#57/#58): the
      # type-punning plumbing that lets generic code reach a scalar's
      # bits (Any downcasts / TypeId dispatch) is sanctioned in exactly
      # ONE seam — geom_core::bit_identity. Any other occurrence is a
      # second bit channel and fails here. Callers (including the
      # allowlisted consumers above) go through the door's public fns
      # (repr_bits/eq_bits), which need no punning at the call site.
      # Same M4 retirement schedule as above.
      - name: bit-identity punning tripwire
        run: |
          if grep -rnE 'downcast_ref|downcast_mut|TypeId|core::any|std::any' crates/*/src \
            | grep -vE '^crates/geom-core/src/bit_identity\.rs:' \
            | grep -vE ':[0-9]+:\s*//'; then
            echo "::error::bit-identity punning outside the sanctioned seam (geom-core/src/bit_identity.rs)"
            exit 1
          fi

      # RENDER PROVENANCE (#221 follow-up). Every committed per-scene
      # PNG under demos/renders{,-freecad}/ must carry FreeCAD's
      # signature tEXt chunks; demos/renders-wild/ (the wild-corpus
      # lane, FreeCAD-free by scope) runs inverted per-lane rules —
      # matplotlib-drawn cells carrying the wild lane's own Author
      # stamp; the matplotlib-COMPOSED montage
      # sheets are the only exemption, and are asserted to be exactly
      # that. A matplotlib fallback frame in a committed path fails
      # here, naming the file. Stdlib-only python3 — it rides this job
      # because this is the cheap-tripwire job (no toolchain, no
      # cargo), and because a render change is never tier `docs`
      # (demos/** is unscopable ⇒ tier `all`), so run_build gates it
      # exactly when it can matter. Mirror: ci-local's always-run
      # "render provenance (demos)" row. The --selftest pass shows the
      # guard actually fires (synthetic PNGs, no renderer needed).
      - name: render provenance (demos)
        run: |
          python3 demos/check_render_provenance.py --selftest
          python3 demos/check_render_provenance.py

      # The UV lane's composer: no provenance question (only the kernel
      # can have drawn an SVG cell), but its selection rule DROPS faces
      # from the sheet, and a silent drop is what that lane exists to
      # prevent. Same cheap-tripwire posture, stdlib only. Mirror:
      # ci-local's "uv composer selftest (demos)" row.
      - name: uv composer selftest (demos)
        run: python3 demos/compose_uv_montage.py --selftest

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_build == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_build == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No --all-features here: the `interval` feature is a different
      # build graph, and the `interval` job owns its clippy pass with its
      # own cache — building it here too would double this job's compile
      # time for no extra coverage, and mix two feature sets into one
      # cache entry.
      # Scoped by the filter: `--workspace` in tier `all`, an explicit
      # `-p <closure>` list in tier `closure`.
      - run: cargo clippy ${{ needs.filter.outputs.cargo_scope }} --all-targets -- -D warnings

  # BUILD job, default features (see the build-once header comment above
  # the `env:` block). Compiles the scoped test binaries exactly once and
  # publishes them as a nextest archive; the `test` matrix below only RUNS.
  build:
    name: build + archive (default)
    # BUILD_RUNNER (repo variable) — see the LINK/DEBUGINFO note above.
    # Unset today, so this is `ubuntu-latest` and nothing changes.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    needs: filter
    if: needs.filter.outputs.run_build == 'true'
    # Test-speed handling lives in Cargo.toml as per-package opt-level
    # overrides for the measured hot spot (spade + mesh) — blanket opt 2
    # via profile env here was measured net-slower on core-crate PRs
    # (#52/#53 timings) because every push recompiles the changed crate
    # graph at opt 2.
    #
    # JOB-LEVEL, not step-level, on purpose: Swatinem/rust-cache hashes
    # env vars prefixed CARGO_/RUST* into its cache key, and it runs
    # BEFORE the build step. Step-level knobs (like the CARGO_PROFILE_
    # TEST_STRIP this replaces) are invisible to it, so cargo's
    # fingerprint would disagree with the restored cache on every run and
    # rust-cache would never re-save. Job-level means exactly one cold
    # rebuild per knob change, then warm forever.
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_STRIP: debuginfo
    steps:
      - uses: actions/checkout@v4
      # mold: this job's cost is 261 static links of a ~40-rlib graph
      # (measured: 494 of the build step's 514 s is the 261 test
      # binaries). CI-ONLY — the flag rides RUSTFLAGS in this job's env,
      # never .cargo/config.toml, so local builds and scripts/ci-local.sh
      # keep the default linker and need no mirrored row.
      - name: install mold
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: runner + linker provenance (for perf attribution)
        run: nproc && free -g | head -2 && mold --version
      - name: install cargo-nextest (pinned, official prebuilt)
        run: curl -LsSf "https://get.nexte.st/$NEXTEST_VERSION/linux" | tar zxf - -C "$HOME/.cargo/bin"
      # Scoped by the filter (`--workspace` or `-p <closure>`), same as the
      # per-row `cargo test` this replaces: the archive CONTAINS exactly
      # the closure's test binaries, so the run rows need no re-scoping.
      - name: build test binaries + archive
        run: cargo nextest archive ${{ needs.filter.outputs.cargo_scope }} --archive-file nextest-default.tar.zst
      # Upload right after the archive (the run legs still wait on the
      # whole job via `needs`): if a later step fails, the archive is
      # already up, so the failure can be investigated / re-run without
      # rebuilding.
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-default
          path: nextest-default.tar.zst
          retention-days: 1
      # Doc-tests DO NOT run under nextest (upstream design): this step
      # keeps them gated. The workspace has real doctests, including
      # compile_fail blocks that only the doctest runner exercises.
      - name: doc-tests
        run: cargo test --doc ${{ needs.filter.outputs.cargo_scope }}

  test:
    name: test (eps = ${{ matrix.eps }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: [filter, build]
    if: needs.filter.outputs.run_build == 'true'
    strategy:
      fail-fast: false
      # THE BATTERY IS {default, 1e-6, 1e-12} (Evan's ruling, 2026-07-30):
      # the two env rows straddle the compiled default (DEFAULT_EPS =
      # 1e-9) three orders either side; the `default` row runs with the
      # variable genuinely UNSET (an empty CAD_TOLERANCE_EPS is a parse
      # error by design — tolerance.rs multi-ε contract — so the
      # assignment rides the run line as a shell prefix, not `env:`).
      # All rows execute the SAME archived binaries: eps is runtime env,
      # which is the whole point of building once.
      #
      # 2-way intra-row sharding (--partition count:*/2), adopted on
      # MEASURED numbers (#167 run 30838077811): unsharded, the
      # default-eps legs executed in ~5.9-6.1 min — over the ~5 min bar —
      # with a flat slow-test tail (worst single test 14 s of 1989), so a
      # count partition splits evenly. The two shards' union is exactly
      # the row (nextest partitions the run list deterministically); a
      # failure still names its eps row in the leg name.
      #
      # STILL TRUE after the #177 test-binary collapse, and worth stating
      # because the shape changed: nextest's count partition is applied
      # WITHIN each binary, so 263 mostly-tiny binaries became 24 larger
      # ones. The union is still exactly the row and the split is still
      # even — a 2044-test row splits more evenly across 24 binaries than
      # it did across 263, not less. Test IDs gained a module prefix
      # (`all m4_pr8_corpus::foo` where it was `m4_pr8_corpus foo`); the
      # eps rows never named a binary, so nothing here needed rewriting.
      # The rows that DID name one (persistence / corpus / rebuild-latency
      # / k-lint) now select by `--test all -- <module>::` or by a nextest
      # `test(/^<module>::/)` expression, verified to match the old
      # per-binary test counts exactly.
      matrix:
        eps: ["default", "1e-6", "1e-12"]
        shard: [1, 2]
    env:
      # Nothing compiles here: cargo only dispatches to cargo-nextest,
      # which runs prebuilt binaries out of the archive — keep the job
      # off the pinned-toolchain download (same trick as `filter`).
      RUSTUP_TOOLCHAIN: stable
    steps:
      # Checkout is still needed: tests read committed fixtures, and
      # --workspace-remap points nextest's per-test cwd at this tree.
      # Runner workspace paths are identical across jobs, so build-time
      # env!("CARGO_MANIFEST_DIR") paths resolve here too.
      - uses: actions/checkout@v4
      - name: install cargo-nextest (pinned, official prebuilt)
        run: curl -LsSf "https://get.nexte.st/$NEXTEST_VERSION/linux" | tar zxf - -C "$HOME/.cargo/bin"
      - uses: actions/download-artifact@v4
        with:
          name: nextest-default
      # The eps assignment is an inline shell prefix (empty for the
      # `default` leg — see the matrix comment on why not `env:`).
      - name: run archived tests
        run: ${{ matrix.eps != 'default' && format('CAD_TOLERANCE_EPS={0}', matrix.eps) || '' }} cargo nextest run --archive-file nextest-default.tar.zst --workspace-remap . --partition count:${{ matrix.shard }}/2

  # BUILD job, interval features — the ONE genuinely different build
  # graph in the matrix. Owns the interval clippy pass and the interval
  # doc-tests (both need this graph compiled anyway), then archives the
  # test binaries for the `test-interval` matrix below.
  build-interval:
    name: build + archive (interval)
    # Same BUILD_RUNNER variable as the default build job; unset today.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    needs: filter
    if: needs.filter.outputs.run_build == 'true'
    # Same link/debuginfo knobs, same job-level-not-step-level reasoning,
    # as the default build job — see the LINK/DEBUGINFO note at the top.
    # This job is the run's critical path (11.9 of the 17.6 min wall on
    # run 30884593286), so it is the one that most wants them.
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_STRIP: debuginfo
    steps:
      - uses: actions/checkout@v4
      # The `interval` feature's backend is the in-repo
      # `interval-transcendentals` crate — pure Rust over libm — so this
      # job needs no C toolchain. mold is the one system package, and it
      # is a linker for the 261 links, not a dependency of the graph.
      - name: install mold
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold
      - uses: dtolnay/rust-toolchain@stable
      # CACHE SEPARATION (verified against the action's source,
      # 2026-07-30): this job builds a DIFFERENT feature set from the
      # default-feature jobs, so it must never share their cache entry —
      # a shared entry would have the two graphs evicting each other on
      # every run. Two things guarantee the separation. (1) rust-cache@v2
      # composes its key as prefix + (shared-key OR key + job id) + os +
      # arch + env/lockfile hashes, and its `add-job-id-key` input
      # defaults to "true" — so with no `shared-key` anywhere in this
      # file, every JOB here already gets its own cache by construction
      # (matrix legs of one job share a key, which is what we want: same
      # feature set). (2) The explicit `key` below makes THIS job's
      # separation intentional rather than incidental, and survives a
      # rename. Do NOT add `shared-key` to any job here: it replaces the
      # job component outright and is exactly the thrash this prevents.
      - uses: Swatinem/rust-cache@v2
        with:
          key: interval
      - name: runner + linker provenance (for perf attribution)
        run: nproc && free -g | head -2 && mold --version
      - name: install cargo-nextest (pinned, official prebuilt)
        run: curl -LsSf "https://get.nexte.st/$NEXTEST_VERSION/linux" | tar zxf - -C "$HOME/.cargo/bin"
      # Archive first, upload immediately (the legs still wait on the
      # whole job via `needs`; the early upload means a clippy/doc-test
      # failure leaves the archive available for investigation). This job
      # is the run's critical path (measured on #167): keep it lean.
      - name: build test binaries + archive (interval)
        run: cargo nextest archive ${{ needs.filter.outputs.cargo_scope }} --features interval --archive-file nextest-interval.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-interval
          path: nextest-interval.tar.zst
          retention-days: 1
      # This job owns the interval feature's clippy pass (the default
      # clippy job deliberately skips --all-features).
      - run: cargo clippy ${{ needs.filter.outputs.cargo_scope }} --all-targets --features interval -- -D warnings
      - name: doc-tests (interval)
        run: cargo test --doc ${{ needs.filter.outputs.cargo_scope }} --features interval

  test-interval:
    name: test (interval, eps = ${{ matrix.eps }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: [filter, build-interval]
    if: needs.filter.outputs.run_build == 'true'
    strategy:
      fail-fast: false
      # One multi-ε row at interval type (D4 ¶1): the interval band test
      # re-derives every assertion from the run's ε, so the 1e-6 row
      # genuinely exercises a different band. Same archive both rows —
      # eps is runtime env. `default` = env unset, and 2-way sharding —
      # see the `test` matrix comments (the unsharded interval default
      # leg measured 6.1 min of execution, the run's slowest).
      matrix:
        eps: ["default", "1e-6"]
        shard: [1, 2]
    env:
      # Nothing compiles here (see the `test` job).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: install cargo-nextest (pinned, official prebuilt)
        run: curl -LsSf "https://get.nexte.st/$NEXTEST_VERSION/linux" | tar zxf - -C "$HOME/.cargo/bin"
      - uses: actions/download-artifact@v4
        with:
          name: nextest-interval
      - name: run archived tests (interval)
        run: ${{ matrix.eps != 'default' && format('CAD_TOLERANCE_EPS={0}', matrix.eps) || '' }} cargo nextest run --archive-file nextest-interval.tar.zst --workspace-remap . --partition count:${{ matrix.shard }}/2
      # M4 PR 6 D6.1, Interval member: the save/load/replay-identity row
      # at the certified interval scalar (already inside the full archive
      # run above; named here so the obligation is visible). One leg only
      # (default eps, shard 1), mirroring the pre-archive job, which ran
      # it once with no eps env.
      - name: persistence save/load/replay-identity (interval)
        if: matrix.eps == 'default' && matrix.shard == 1 && needs.filter.outputs.run_editor_core == 'true'
        run: "cargo nextest run --archive-file nextest-interval.tar.zst --workspace-remap . -E 'binary_id(editor-core::all) & test(/^m4_pr6_roundtrip_interval::/)'"
      # M4 PR 8a D1, Interval member: the Band 4 corpus evaluates green
      # at the certified interval scalar (also inside the archive run
      # above; named here so the obligation is visible).
      - name: band 4 corpus (interval)
        if: matrix.eps == 'default' && matrix.shard == 1 && needs.filter.outputs.run_editor_core == 'true'
        run: "cargo nextest run --archive-file nextest-interval.tar.zst --workspace-remap . -E 'binary_id(editor-core::all) & test(/^m4_pr8_corpus_interval::/)'"

  # The archives exist only to ferry binaries from the build jobs to the
  # run legs; on a fully green run they have no further use, and this
  # private repo's artifact quota is small (500 MB, and the Actions
  # budget has been exhausted before). retention-days: 1 already caps
  # stragglers; this deletes the happy-path bulk immediately. On a FAILED
  # run the artifacts are deliberately kept (retention window) so failed
  # legs can be re-run without rebuilding.
  cleanup-archives:
    name: delete nextest archives (green run)
    runs-on: ubuntu-latest
    needs: [test, test-interval]
    if: success()
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in nextest-default nextest-interval; do
            for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                          -q ".artifacts[] | select(.name==\"$name\") | .id"); do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            done
          done

  interval-backend:
    name: interval backend crate
    runs-on: ubuntu-latest
    needs: filter
    # Tier `closure` never reaches this: interval-transcendentals/ is its
    # own workspace, so ANY change under it is tier `all`.
    if: needs.filter.outputs.run_interval_backend == 'true'
    # The `interval` feature's backend lives in its own workspace
    # (interval-transcendentals/), so the kernel's workspace rows never
    # build its tests. Its pad tripwire therefore had no CI at all until
    # M5 PR 1's review asked for one — and that tripwire is what catches a
    # dropped outward round, which the kernel's own lane-agreement tests
    # provably cannot (both lanes share the round-to-nearest chain).
    #
    # This row is deliberately the crate's DEFAULT feature set: unit
    # tests, the edges sweep's oracle-free half, and review_fuzz_div's
    # exact-rational division fuzz, which needs no oracle at all because
    # it compares against u128 rational arithmetic. Without
    # `oracle-inari` there is no inari/gmp-mpfr-sys and no C toolchain in
    # the graph, so the row takes seconds. The full differential lane
    # (certify.rs, behind --features oracle-inari) stays a by-hand gate;
    # see the crate README's "Certification" section.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: interval-backend
          workspaces: interval-transcendentals
      - name: fmt + clippy
        working-directory: interval-transcendentals
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - name: tests (default features — the oracle stack must stay out)
        working-directory: interval-transcendentals
        run: cargo test
      # Tripwire on the tripwire: the dev-oracle stack (inari and its
      # gmp/MPFR C build) belongs to `--features oracle-inari` only. If
      # anything ever makes it reachable from the default feature set,
      # fail loudly here rather than silently reintroducing a C build.
      - name: assert the oracle stack stays out of the default graph
        working-directory: interval-transcendentals
        run: |
          if cargo tree | grep -iE 'inari|gmp-mpfr-sys|rug'; then
            echo "ERROR: the default feature set reaches the gmp stack"
            exit 1
          fi

  watertight:
    name: watertight (admesh)
    runs-on: ubuntu-latest
    needs: filter
    # Root package `stl`: the acceptance example lives there and its
    # (dev-)dependency graph is the whole profile -> sweep -> topo -> mesh
    # chain this job exercises, so `stl in closure` is exactly the
    # condition under which any of it can have moved.
    if: needs.filter.outputs.run_stl == 'true'
    steps:
      - uses: actions/checkout@v4
      # External STL verification (M2 PR 7): admesh 0.98.4 is
      # apt-packaged; the check script accepts NO repair as success.
      - name: install admesh
        run: sudo apt-get update && sudo apt-get install -y admesh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The example pre-flights our own validators (tier 1–3 incl. the
      # +V invariant, check_mesh, signed_volume > 0) before writing.
      - name: export acceptance STLs
        run: cargo run -p stl --example export_acceptance -- target/stl-acceptance
      - name: admesh check (watertight/manifold, no repair accepted)
        run: scripts/check_admesh.sh target/stl-acceptance

  step-import:
    name: step import (freecad)
    runs-on: ubuntu-latest
    needs: filter
    # Root package `step-export`: this job builds nothing — it runs FreeCAD
    # over the committed fixtures under crates/step-export/tests/fixtures,
    # which are byte-golden against that crate's writer.
    if: needs.filter.outputs.run_step_export == 'true'
    steps:
      - uses: actions/checkout@v4
      # External STEP import acceptance (M4 PR 7, the admesh pattern
      # STEP-shaped): FreeCAD/OCC imports the committed fixtures
      # (byte-golden against the writer via the cargo test suite) and
      # the script asserts validity + exact topology counts + volume.
      # No cargo build needed — the fixtures are committed.
      # apt has no freecad package on current ubuntu-latest (exit 100,
      # 2026-07-25); use the version-pinned AppImage instead — same
      # FreeCAD 1.1.2 as the local oracle, checksum-verified, cached.
      - name: cache freecad
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: ~/freecad-appimage
          key: freecad-1.1.2-appimage-extracted
      - name: install freecad (AppImage 1.1.2, checksum-verified)
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/freecad-appimage && cd ~/freecad-appimage
          curl -sLO https://github.com/FreeCAD/FreeCAD/releases/download/1.1.2/FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
          curl -sLO https://github.com/FreeCAD/FreeCAD/releases/download/1.1.2/FreeCAD_1.1.2-Linux-x86_64-py311.AppImage-SHA256.txt
          sha256sum -c FreeCAD_1.1.2-Linux-x86_64-py311.AppImage-SHA256.txt
          chmod +x FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
          ./FreeCAD_1.1.2-Linux-x86_64-py311.AppImage --appimage-extract > /dev/null
          rm FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
      - name: freecad import check (validity, counts, volume)
        run: REQUIRE_FREECAD=1 FREECADCMD="$HOME/freecad-appimage/squashfs-root/usr/bin/freecadcmd" scripts/check_step.sh

  # LIB PY-CI (residual register R4; U10 follow-up F4): the Python suite
  # as a hosted job. Builds the pncad wheel with maturin, installs it
  # into a venv, and runs the FULL crates/pncad-py unittest set by
  # DISCOVERY — the same invocation crates/pncad-py/run-python-tests.sh
  # uses — so new test modules (e.g. #318's test_guide.py /
  # test_north_star.py) are picked up the moment they merge, with no
  # edit here. DELIBERATELY OFF the Rust-only critical path: nothing
  # `needs` this job, and the Rust jobs stay green with no Python
  # present (the U9S gating property — pyo3 rides the non-default
  # `python` feature, which only maturin turns on). Its failure still
  # reds the PR — that is the point.
  #
  # Root package pncad-py (see JOB_ROOTS in scripts/ci-filter.py): the
  # wheel compiles pncad-py's whole dependency graph — the entire façade
  # stack — so `pncad-py in closure` is exactly the condition under
  # which anything this job runs can have moved; the .py tests and .pyi
  # stub live under the member directory and seed the same closure.
  # Budget: one job, one Python version, no matrix, debug-profile build
  # (release is not required to prove the suite; the D9 bit-exactness
  # pins hold at any opt level — opt never moves rounding, and the
  # suite asserting so IS this job's evidence).
  # Local mirror: ci-local.sh's "python suite (staged cdylib)" row —
  # same tests, same discovery; the install path degrades to the staged
  # cdylib (run-python-tests.sh) so the row works even on the most
  # degraded box U9S measured (no pip, no maturin).
  python-suite:
    name: python suite (wheel + guide + north-star)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_pncad_py == 'true'
    steps:
      - uses: actions/checkout@v4
      # Python pinned at 3.12 — the interpreter the suite was written
      # and validated on (U9S/DOORS/U10 all ran the local 3.12). The
      # wheel is abi3-py38, so this is a determinism pin, not a
      # compatibility ceiling. actions/setup-python@v5 (GA 2023-12)
      # clears the ~2-week age policy by years — the same
      # long-aged-major-tag class as the checkout@v4 / cache@v4 /
      # upload-artifact@v4 pins this workflow already rides.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      # Separate cache key: the `python` feature graph (pyo3 + 4 more
      # crates) differs from every other job's — same CACHE SEPARATION
      # reasoning as build-interval (job-id separation is automatic;
      # the explicit key makes it intentional and survives a rename).
      - uses: Swatinem/rust-cache@v2
        with:
          key: python
      - name: install maturin (pinned, official prebuilt)
        run: curl -LsSf "https://github.com/PyO3/maturin/releases/download/v$MATURIN_VERSION/maturin-x86_64-unknown-linux-musl.tar.gz" | tar zxf - -C "$HOME/.cargo/bin" maturin
      # Debug profile on purpose (no --release): fastest honest build.
      # pyproject.toml's [tool.maturin] supplies module name + the
      # `extension-module` feature; abi3 needs no Python.h.
      - name: build the pncad wheel (abi3, debug profile)
        run: maturin build -m crates/pncad-py/Cargo.toml -o target/wheels
      # The venv lives OUTSIDE target/ deliberately: rust-cache caches
      # target/, and a cached venv skeleton restores without its bin/
      # contents (the 2026-08-10 red-main incident — the PR run passed
      # on a cold cache, main restored a mangled venv). RUNNER_TEMP is
      # never cached; --clear guards against any reuse regardless.
      - name: install the wheel into a venv
        run: |
          python -m venv --clear "$RUNNER_TEMP/py-ci-venv"
          "$RUNNER_TEMP/py-ci-venv/bin/python" -m pip install target/wheels/pncad-*.whl
      # The STATIC half of the §L4 type story (LIB-PYG1): `ty` checks
      # the .pyi lattice's SIGNATURES, which the name-for-name stub
      # check deliberately does not look at. Pinned like maturin; this
      # step is where the row is MEASURED, so a fetch failure reds the
      # job rather than passing quietly. `tests/test_ty.py` skips —
      # loudly, naming the missing binary — only where no checker
      # exists at all (the degraded local box U9S recorded).
      - name: install ty (pinned, the static stub checker)
        run: |
          "$RUNNER_TEMP/py-ci-venv/bin/python" -m pip install "ty==$TY_VERSION"
      # Discovery from the repo checkout: guide tests read the docs/
      # Markdown relative to their own file, and the stub check is
      # layout-invariant (validated on the wheel-venv layout, #308).
      - name: run the Python suite (unittest discover)
        run: |
          "$RUNNER_TEMP/py-ci-venv/bin/python" -m unittest discover \
            --start-directory crates/pncad-py/tests \
            --top-level-directory crates/pncad-py/tests \
            --verbose
        env:
          PNCAD_TY: ${{ runner.temp }}/py-ci-venv/bin/ty

  # (The former standalone `multi-eps` job is FOLDED into the `test`
  # matrix above: its 1e-6/1e-12 rows and the old unparameterized `test`
  # job were three compilations of bit-identical binaries; they are now
  # three run-only legs over one archive. D4 ¶1's multi-ε obligation is
  # unchanged — same three eps bands, same scoped test set.)

  # M4 PR 6 spec D6: the three persistence obligations as NAMED gates
  # (they also run inside the workspace rows; naming them keeps the
  # contract visible and their failures attributable at a glance).
  # ε battery {1e-6, 1e-12} per the 2026-07-30 ruling — the default-ε
  # (1e-9) pass of these same test targets is inside the `test` job's
  # workspace run, so no band is lost.
  persistence:
    name: persistence (eps = ${{ matrix.eps }})
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_editor_core == 'true'
    strategy:
      fail-fast: false
      matrix:
        eps: ["1e-6", "1e-12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # D6.1 save/load/replay-identity + the D2 float property row +
      # the committed golden v1 fixture (byte-exact freeze tripwire).
      - name: save/load/replay-identity (D6.1) + float bits (D2) + golden v1
        run: "cargo test -p editor-core --test all -- m4_pr6_roundtrip:: m4_pr6_floats:: m4_pr6_golden::"
        env:
          CAD_TOLERANCE_EPS: ${{ matrix.eps }}
      # D6.2 ε-change diff (cross-process, goldened): the two probe
      # children pin their OWN ε values — the matrix ε only hosts the
      # orchestrating parent.
      - name: eps-change diff goldened (D6.2)
        run: "cargo test -p editor-core --test all -- m4_pr6_eps_diff::"
        env:
          CAD_TOLERANCE_EPS: ${{ matrix.eps }}
      # D6.3 schema-version / corrupt-file refusal + the adopted
      # adversarial probe suite (review pins) + token key-space pins.
      - name: schema + corruption refusal (D6.3) + review probes
        run: "cargo test -p editor-core --test all -- m4_pr6_refusal:: m4_pr6_review_probes:: profile_desc_key::"
        env:
          CAD_TOLERANCE_EPS: ${{ matrix.eps }}

  # M4 PR 8a spec D2 (M4-PLAN F8): rebuild-latency REPORTING. This job
  # prints a per-document table (full rebuild + incremental recompute,
  # median of 3) and diffs it against the committed baseline
  # crates/editor-core/tests/baseline/rebuild-latency.json. It is
  # DELIBERATELY NOT A GATE on any timing number — instrumentation, not
  # a contract; PERF-PLAN stays advisory. The only assertions inside are
  # the counted-reuse ones (cone complement), which are arithmetic, not
  # wall clock. The table lands in the job LOG (no artifact upload: the
  # numbers are advisory and the baseline JSON is the durable record).
  rebuild-latency:
    name: rebuild latency (reporting)
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_editor_core == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: per-document full-rebuild + incremental-recompute table
        run: "cargo test -p editor-core --test all -- --nocapture m4_pr8_latency::"

  # M4 PR 8a spec D1: the Band 4 corpus as a NAMED row (it also runs
  # inside the workspace rows; naming it keeps the milestone's
  # proof-of-vocabulary attributable at a glance).
  # ε battery {1e-6, 1e-12} per the 2026-07-30 ruling — the default-ε
  # (1e-9) pass of this corpus is inside the `test` job's workspace run.
  corpus:
    name: band 4 corpus (eps = ${{ matrix.eps }})
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.run_editor_core == 'true'
    strategy:
      fail-fast: false
      matrix:
        eps: ["1e-6", "1e-12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: evaluation, exact mass pins, counted reuse, vocabulary totality
        run: "cargo test -p editor-core --test all -- --nocapture m4_pr8_corpus::"
        env:
          CAD_TOLERANCE_EPS: ${{ matrix.eps }}

  # Spec D3: the large-K fragility lint. A GATE — a flagged margin
  # fails this row (the tool exits 2 and prints the interpretation
  # discipline; harness breakage exits 1 in its own voice). The row
  # also fails on a hygiene regression or the #99 litmus no longer
  # firing.
  #
  # READ THE FAILURE BEFORE TOUCHING GEOMETRY: a fired lint is evidence
  # that the margin DISTRIBUTION moved — possibly that a threshold or
  # the baseline is stale. Recourse is re-derivation (docs/K-REPORT.md,
  # "M7 addendum (2026-08-07): the large-K lint's floor refresh"), or a
  # recorded demotion to advisory; never a geometry nudge to get under
  # the threshold. The tool prints all of this on failure.
  #
  # The committed baseline + threshold provenance:
  # docs/k-report-data/m7-eps-*.csv.gz and tools/k-lint/src/lib.rs
  # (docs/K-REPORT.md M7 addendum has the histogram, the percentile
  # re-argument, and the ε-coupled ruling; the m4-/m5- baselines stay
  # committed as the durable record).
  k-lint:
    name: k-lint (gate)
    runs-on: ubuntu-latest
    needs: filter
    # No minimal root set, deliberately: this is the ONLY job that compiles
    # demos/tour (a path-dependent of nine members) and tools/k-lint, and
    # its probe sweep records margins from every kernel crate. So it runs
    # whenever anything builds at all.
    if: needs.filter.outputs.run_k_lint == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: k-lint
          workspaces: |
            .
            demos/tour
            demos/wild
            tools/k-lint
      # Hosted mirror of ci-local's "demos tour (fmt + clippy)" row:
      # the tour is workspace-excluded, so the fmt/clippy jobs above
      # never see it — and this is the job that builds it anyway (the
      # demo scenes are half the lint's subject matter). demos/wild
      # (the wild-corpus montage generator) rides the same row for the
      # same reason.
      - name: demos tour fmt + clippy
        run: cd demos/tour && cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - name: demos wild fmt + clippy
        run: cd demos/wild && cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - name: k-lint tool fmt + clippy + tests (incl. the #99 litmus)
        run: cd tools/k-lint && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
      # Drift gate for the committed UV sheet. The two PNG lanes cannot
      # be gated — they need FreeCAD, which this job does not have — so
      # this is the ONLY render lane CI can actually reproduce, and an
      # ungated committed artifact rots silently. Regenerate and diff:
      # the tour is ~3s once built (this job already builds it for the
      # k-probe sweep below) and the sheet is text, so the diff is
      # readable when it fires. A failure here is either a real change
      # the author forgot to commit, or a D9 determinism finding — both
      # worth stopping for. Mirror: ci-local's "uv sheet drift (demos)".
      #
      # The render entry points refuse to run without the explicit
      # `CAD_RENDER_LOCAL_OVERRIDE` sentence (demos/hosted-render-guard.sh)
      # and deliberately do NOT sniff for CI: the exemption is written
      # here, at the step that renders, where a reviewer sees it. This
      # row is a sanctioned automated render — renderer-free, and the
      # `git diff --exit-code` below is what makes drift a failure rather
      # than a commit.
      - name: uv sheet drift (demos)
        env:
          CAD_RENDER_LOCAL_OVERRIDE: i-accept-local-render-drift
        run: |
          (cd demos/tour && cargo run --release -- ../out)
          demos/render-uv.sh
          git diff --exit-code --stat HEAD -- demos/renders-uv/ || {
            echo "::error::demos/renders-uv/montage-uv.svg is stale — \
          re-run demos/tour then demos/render-uv.sh and commit the result"
            exit 1
          }
      - name: K-telemetry probe sweep (corpus + demo scenes, 3 eps rows)
        run: scripts/k_probe_sweep.sh target/k-fresh
      - name: large-K lint (gate — a flagged margin fails this row)
        run: |
          cd tools/k-lint && cargo run -- \
            ../../target/k-fresh/k-eps-1e-6.csv \
            ../../target/k-fresh/k-eps-1e-9.csv \
            ../../target/k-fresh/k-eps-1e-12.csv
