name: CI

on:
  pull_request:
  push:
    branches: [main]

# The toolchain (channel + rustfmt/clippy components) comes from
# rust-toolchain.toml. dtolnay/rust-toolchain honors that file, so we pin
# nothing here — the pinned compiler (D9 / L2) is the single source of truth.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  multi-eps:
    name: test (eps = ${{ matrix.eps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eps: ["1e-6", "1e-9", "1e-12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # D4 ¶1: run the suite at several ε values to smoke out
      # tolerance-sensitive algorithms. CAD_TOLERANCE_EPS gets wired to
      # Tolerance initialization in PR 2 (L3); for now it just parameterizes
      # the same test run so the matrix and the env var name land early.
      - run: cargo test --workspace
        env:
          CAD_TOLERANCE_EPS: ${{ matrix.eps }}
