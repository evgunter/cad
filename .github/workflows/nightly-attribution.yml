name: nightly attribution

# Names the merge that turned each newly red nightly test red, so nobody
# bisects a main red by hand. Called by nightly.yml's `attribution` job once
# a scheduled run's full-suite rows are in; dispatched with a past run's id,
# it attributes that night again. scripts/nightly-attribution.py holds the
# method and its bounds; the verdicts land in this job's step summary and in
# the `nightly-attribution` artifact.
#
# It cannot turn a nightly red: every step but the last continues on error,
# and the script reports a failure of its own as `attribution failed: <why>`
# in the summary and exits 0.

on:
  workflow_call:
    inputs:
      # Empty: the calling run.
      run_id:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      run_id:
        description: A nightly run id whose full-suite junit reports are uploaded.
        required: true
      dry_run:
        description: List the newly red tests and their ranges; build and run nothing.
        required: false
        default: 'false'

jobs:
  attribute:
    name: attribute newly red tests to merges
    runs-on: ubuntu-latest
    # The script's own clock is 60 minutes from its start, every build and
    # test call bounded by what is left of it; its step is cut at 70; setup,
    # downloads and the upload fit in the rest.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    # The PR gate's build env: rust-cache restores into ./target the
    # dependency graph cache-prime saved under build-default, the probes
    # build into that same directory (CARGO_TARGET_DIR below), and each
    # compiles only the workspace crates its test target needs, at opt-level
    # 1 (scripts/gates/build-default-env-agrees.sh holds the blocks equal).
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_LTO: "off"
      CARGO_PROFILE_TEST_LTO: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
        continue-on-error: true
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: build-default
          save-if: false
      - name: read the nextest pin from ci.yml
        id: nextest
        continue-on-error: true
        run: echo "version=$(scripts/ci-pin.py NEXTEST_VERSION)" >> "$GITHUB_OUTPUT"
      - name: install cargo-nextest (pinned, official prebuilt)
        continue-on-error: true
        uses: ./.github/actions/install-nextest
        with:
          version: ${{ steps.nextest.outputs.version }}
      - name: this run's junit reports
        if: inputs.run_id == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: full-suite-junit-*
          path: ${{ runner.temp }}/junit
      - name: this run's test archive (the retry at the bad sha runs its binaries)
        if: inputs.run_id == '' && inputs.dry_run != 'true'
        id: archive
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: full-suite-archive
          path: ${{ runner.temp }}/archive
      - name: the dispatched run's junit reports
        if: inputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: full-suite-junit-*
          path: ${{ runner.temp }}/junit
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: attribute each newly red test
        id: attribute
        timeout-minutes: 70
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          RUN: ${{ inputs.run_id || github.run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          ARCHIVE: ${{ steps.archive.outcome == 'success' && format('{0}/archive/full-suite.tar.zst', runner.temp) || '' }}
        run: |
          opts=()
          [ -n "$ARCHIVE" ] && opts+=(--archive "$ARCHIVE")
          [ "$DRY_RUN" = true ] && opts+=(--dry-run)
          python3 scripts/nightly-attribution.py --run "$RUN" --junit "$RUNNER_TEMP/junit" \
            --out "$RUNNER_TEMP/attribution" "${opts[@]}" \
            || echo "attribution failed: the script exited $?" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: say so when the attribution step itself died
        if: always() && steps.attribute.outcome != 'success'
        env:
          OUTCOME: ${{ steps.attribute.outcome }}
        run: |
          echo "attribution failed: its step ended $OUTCOME (cut at its time limit, or the runner)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: upload the verdicts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nightly-attribution
          path: ${{ runner.temp }}/attribution/attribution.*
          if-no-files-found: warn
