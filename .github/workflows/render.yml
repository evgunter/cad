# Hosted demo render lanes — ON DEMAND, ARTIFACT-ONLY.
#
# WHY THIS EXISTS. `demos/render.sh` is the heaviest thing the repo asks
# of a developer box: ~20 scenes per lane, one fresh `freecadcmd`
# process each, and on a loaded host a single scene has been measured at
# 106 s (render.sh's budget note). It is also what this host is worst at
# — `memories/freecad-render-lane.md` records freecadcmd stalling AFTER
# writing a frame, at a random scene, which is what wedges a pass. A
# runner is a cold, unloaded box that gets thrown away afterwards, so it
# is a good place to send this.
#
# ALL FOUR LANES, FANNED OUT. The tour is built ONCE and handed to the
# lanes that read it as an artifact; the two FreeCAD-drawn montages then
# run as parallel matrix legs (`fail-fast: false` — one lane wedging
# must not cancel the other's evidence), while the UV sheet (no renderer
# at all) and the wild-corpus montage (matplotlib, its own generator,
# no tour) land in minutes without waiting on either. What comes back is
# an artifact per lane:
#
#   gh run download <run-id> -n renders-kernel      # kernel tessellation
#   gh run download <run-id> -n renders-freecad     # OCC re-tessellation
#   gh run download <run-id> -n renders-uv          # UV trim-loop sheet
#   gh run download <run-id> -n renders-wild        # wild-corpus montage
#
# `scripts/render-hosted.sh` is the one-command front end for all of
# that (push check -> dispatch -> poll -> install the artifacts back
# into the working tree at their committed paths), and is the path the
# local entry points now point at: they refuse to run without an
# explicit override (demos/hosted-render-guard.sh), and every step here
# that renders sets that override in the file, because this workflow is
# the sanctioned renderer.
#
# THE KERNEL LANE'S FALLBACK HOLE IS PLUGGED HERE. That lane has a
# matplotlib fallback which EXITS 0 and writes the gitignored preview
# tree, so an unattended kernel run could "pass" having drawn nothing
# with FreeCAD at all — the one thing that makes this lane less
# trustworthy off-box than the `--freecad` lane, which has no fallback
# by design. So every leg asserts the fallback tree does not exist
# (`assert no matplotlib fallback`), which is a structural check on
# render.sh's own #221 routing invariant: on fallback it touches nothing
# under the committed lane and everything under renders-preview/.
#
# NOT A GATE, AND NOT THE COMMITTED LANES' PRODUCER. No job commits or
# pushes; each REPORTS its diff against the committed tree in the run
# summary and none fails over it. What that report means differs per
# lane, and the difference is why the two PNG lanes cannot be promoted
# the way the UV lane already has been:
#
#   * UV — pure stdlib Python over the tour's own SVGs, no renderer at
#     all, so it IS reproducible on a runner. ci.yml's `k-lint` job
#     already gates it (`uv sheet drift (demos)`); this job exists to
#     HAND YOU THE SHEET on demand, not to check it.
#   * wild — matplotlib's Agg rasterizer over the kernel's own
#     tessellation of committed STEP fixtures, with pinned numpy /
#     matplotlib and no GL anywhere in the path. Byte-reproducible
#     off-box like the UV lane, and unlike it, PNGs — which makes it the
#     lane render-hosted.sh round-trips to prove the artifact path
#     preserves the provenance stamp chunks byte for byte.
#   * kernel / FreeCAD — the committed cells were drawn against a
#     developer host's GL stack, these are drawn by llvmpipe under Xvfb,
#     and the runner image's mesa drifts month to month. Byte-identity
#     is not expected and is not asserted. Promoting either lane to the
#     canonical producer means pinning the whole GL stack in a container
#     image and re-baselining the committed cells in one commit — a
#     design call for Evan, not a side effect of this file.
name: render (demos)

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: "Which lanes to render"
        required: false
        type: choice
        default: all
        options: [all, kernel, freecad, uv, wild]
      scene_timeout:
        description: "FreeCAD per-scene wall-clock budget, seconds"
        required: false
        default: "300"
      render_jobs:
        description: "Scenes rendered concurrently per FreeCAD lane (1 = sequential)"
        required: false
        default: "1"
      tour_cache:
        description: "Tour output: reuse the cache when sources are unchanged, or force a rebuild"
        required: false
        type: choice
        default: use
        options: [use, refresh]
      ref:
        description: "Branch/tag/SHA to render (default: this workflow's ref)"
        required: false
        default: ""

concurrency:
  group: render-demos-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  # Every lane reads demos/out (scenes.json + per-body STL/STEP + the UV
  # SVGs), and building the tour is the slow half of a warm run — so it
  # is built ONCE here and handed on as an artifact rather than compiled
  # once per lane.
  tour:
    name: demo tour (scene inputs)
    runs-on: ubuntu-latest
    # The wild lane reads its own generator's output (demos/wild/out),
    # not the tour's — asking for it alone should not build the tour.
    if: ${{ inputs.lanes != 'wild' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # THE TOUR'S OUTPUT IS CACHED ON ITS SOURCES' HASH, not rebuilt
      # per dispatch. Measured on run 31426382563: the step is ~94 s of
      # `cargo` and ~8 s of geometry — because Swatinem/rust-cache
      # deliberately evicts WORKSPACE crates from what it restores, so
      # a "full match" cache hit still recompiles all seventeen of them
      # every run. Caching what they PRODUCE skips both halves, which
      # is why this sits above the toolchain rather than beside it.
      #
      # Exact key, no `restore-keys`: a near-miss must MISS. Everything
      # the tour reads is in the hash (the kernel crates, the tour
      # crate, the lockfiles, the pinned toolchain), so a hit means the
      # same bytes a rebuild would have produced — the tour is
      # deterministic, which is what ci.yml's `uv sheet drift (demos)`
      # gate asserts on every run. `tour_cache: refresh` forces the
      # rebuild anyway, for when you want that assertion re-earned
      # rather than assumed.
      - name: tour output cache
        id: tour-cache
        if: ${{ inputs.tour_cache != 'refresh' }}
        uses: actions/cache@v4
        with:
          path: demos/out
          key: tour-out-v1-${{ hashFiles('crates/**', 'demos/tour/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.tour-cache.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.tour-cache.outputs.cache-hit != 'true'
        with:
          key: render-demos
          workspaces: |
            .
            demos/tour
      - name: demo tour (STL + STEP + UV SVGs + scenes.json)
        if: steps.tour-cache.outputs.cache-hit != 'true'
        run: cd demos/tour && cargo run --release -- ../out
      - name: where the tour came from
        run: |
          echo "tour output: ${{ steps.tour-cache.outputs.cache-hit == 'true' && 'restored from cache' || 'built' }}" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tour-out
          path: demos/out
          retention-days: 1

  # Cheap and renderer-free: Python's standard library tiling the tour's
  # own per-face SVGs. Its own job so it lands without waiting on a
  # FreeCAD pass.
  uv:
    name: uv trim-loop sheet
    runs-on: ubuntu-latest
    needs: tour
    if: ${{ contains(fromJSON('["all","uv"]'), inputs.lanes) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: tour-out
          path: demos/out
      # The render entry points refuse to run without the explicit
      # `CAD_RENDER_LOCAL_OVERRIDE` sentence (demos/hosted-render-guard.sh)
      # and deliberately do NOT sniff for CI. THIS workflow is the
      # sanctioned renderer, so it says so in the file, at the step that
      # renders — and it is the most informed acceptor of what the
      # sentence names, since the "drift vs the committed lane" steps are
      # that drift, measured.
      - name: compose (demos/render-uv.sh)
        env:
          CAD_RENDER_LOCAL_OVERRIDE: i-accept-local-render-drift
        run: demos/render-uv.sh
      - uses: actions/upload-artifact@v4
        with:
          name: renders-uv
          path: demos/renders-uv/**
          retention-days: 14
      # This lane IS byte-reproducible off-box (no renderer, and the
      # sheet is text), so a diff here is a real finding rather than a
      # GL-stack difference — the same finding ci.yml's `uv sheet drift`
      # step already gates on. Reported, not re-gated: one gate per
      # obligation.
      - name: sheet drift vs the committed lane (informational)
        if: always()
        run: |
          {
            echo "### UV lane — hosted vs committed"
            echo
            echo "Renderer-free and byte-reproducible: an empty diff is the"
            echo "expected result. Already gated by ci.yml's \`uv sheet drift"
            echo "(demos)\` step — reported here, not re-gated."
            echo
            echo '```'
            git status --porcelain -- demos/renders-uv/ || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The two FreeCAD-drawn montages. ONE definition, two legs: the lanes
  # differ only in render.sh's flag and the directory it publishes to
  # (#159 — same scenes.json cameras/captions/grid, same pipeline, one
  # showing the kernel's own facets and one showing OCC's).
  montage:
    name: ${{ matrix.lane }} montage
    runs-on: ubuntu-latest
    needs: tour
    if: ${{ contains(fromJSON('["all","kernel","freecad"]'), inputs.lanes) }}
    # A wedged pass is bounded by render.sh's own per-scene budget (two
    # attempts x the budget, per scene); this is the outer stop so a
    # pathological run cannot bill an hour of nothing.
    timeout-minutes: 90
    strategy:
      # One lane wedging must not cancel the other: the whole point of
      # the pair is comparing them, and a half-run tells you less than
      # two independent results.
      fail-fast: false
      matrix:
        # `all` fans out to both; naming one lane runs only that one.
        lane: ${{ fromJSON(inputs.lanes == 'kernel' && '["kernel"]' || inputs.lanes == 'freecad' && '["freecad"]' || '["kernel","freecad"]') }}
    env:
      # The kernel lane is render.sh's default (no flag); `--freecad` is
      # the OCC reference lane. Directory names are render.sh's own.
      LANE_FLAG: ${{ matrix.lane == 'freecad' && '--freecad' || '' }}
      LANE_DIR: ${{ matrix.lane == 'freecad' && 'renders-freecad' || 'renders' }}
      FREECAD_SCENE_TIMEOUT: ${{ inputs.scene_timeout || '300' }}
      # Scenes rendered at once. 1 (render.sh's default) is sequential
      # and is what the committed cells were produced under; above that,
      # every scene's wall clock rises with contention — which is what
      # the per-scene budget above is spent on, so the two inputs are
      # read together, not separately.
      CAD_RENDER_JOBS: ${{ inputs.render_jobs || '1' }}
      # See the uv lane's note: the entry points refuse without this
      # sentence and do not sniff for CI. This workflow IS the sanctioned
      # renderer, and its "pixel drift vs the committed lane" step is the
      # measurement of the drift the sentence names.
      CAD_RENDER_LOCAL_OVERRIDE: i-accept-local-render-drift
      # No GPU on a hosted runner: force the software rasterizer rather
      # than letting Coin pick up whatever partial GL the image ships.
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: tour-out
          path: demos/out

      # AppImage 1.1.2, checksum-verified, cached extracted — byte for
      # byte the provisioning of ci.yml's `step-import` job, down to the
      # cache KEY and path, so those rows and these share one cache
      # entry: a hosted render on main normally restores what a
      # step-import run already populated and downloads nothing. It is
      # also the exact version of the local oracle
      # (memories/freecad-render-lane.md). Bumping the version means
      # bumping it in three places (there, here, and the local install)
      # — the key encodes it, so a stale entry cannot be silently
      # reused.
      - name: cache freecad
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: ~/freecad-appimage
          key: freecad-1.1.2-appimage-extracted
      - name: install freecad (AppImage 1.1.2, checksum-verified)
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/freecad-appimage && cd ~/freecad-appimage
          curl -sLO https://github.com/FreeCAD/FreeCAD/releases/download/1.1.2/FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
          curl -sLO https://github.com/FreeCAD/FreeCAD/releases/download/1.1.2/FreeCAD_1.1.2-Linux-x86_64-py311.AppImage-SHA256.txt
          sha256sum -c FreeCAD_1.1.2-Linux-x86_64-py311.AppImage-SHA256.txt
          chmod +x FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
          ./FreeCAD_1.1.2-Linux-x86_64-py311.AppImage --appimage-extract > /dev/null
          rm FreeCAD_1.1.2-Linux-x86_64-py311.AppImage

      # `step-import` needs none of this: it imports geometry and never
      # draws. Drawing is the difference — Coin's offscreen renderer
      # wants a GL context and a display, so these lanes add the
      # software GL stack and Xvfb. QT_QPA_PLATFORM=offscreen (set per
      # scene by render.sh) keeps Qt itself headless regardless; the
      # display is there for Coin, not for Qt.
      - name: renderer system deps (software GL + Xvfb + venv)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libglu1-mesa \
            libxrender1 libxcursor1 libxinerama1 libxft2 libfontconfig1 \
            python3-venv

      # render.sh builds its own pinned venv (numpy/matplotlib) on first
      # run, stages every scene, publishes only a whole pass, strips the
      # wall-clock chunks and runs the provenance guard before composing.
      # None of that is re-implemented here: this is the same command a
      # developer runs, which is the point — a hosted pass and a local
      # one differ in the box, not in the pipeline.
      - name: render (demos/render.sh ${{ env.LANE_FLAG }})
        run: |
          # The runner's width is the thing CAD_RENDER_JOBS has to be
          # read against, and it is not in the job log otherwise.
          echo "runner: $(nproc) cores, $(free -g | awk '/^Mem:/{print $2}') GB, CAD_RENDER_JOBS=$CAD_RENDER_JOBS"
          FREECADCMD="$HOME/freecad-appimage/squashfs-root/usr/bin/freecadcmd" \
            xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            demos/render.sh $LANE_FLAG

      # THE ONE CHECK THIS WORKFLOW ADDS. The kernel lane's matplotlib
      # fallback exits 0, so without this a hosted pass could be green
      # having drawn nothing with FreeCAD; the frames would be sitting
      # in the gitignored preview tree and the artifact would hold the
      # committed cells unchanged. `always()` so a lane that also failed
      # still says WHICH failure it was. (The `--freecad` lane has no
      # fallback at all, so this is vacuous there — asserted anyway,
      # because a vacuous check costs nothing and a missing one costs
      # #221 again.)
      - name: assert no matplotlib fallback
        if: always()
        run: |
          if [ -e demos/renders-preview ]; then
            find demos/renders-preview -type f | head -50
            echo "::error::render.sh fell back to matplotlib — demos/renders-preview/ exists, \
          so this pass drew NOTHING with FreeCAD and demos/$LANE_DIR/ is untouched. \
          The artifact is the committed cells, not this run's. See the render step's \
          stderr for the reason render.sh gave."
            exit 1
          fi

      - name: upload montage + cells
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ matrix.lane }}
          path: demos/${{ env.LANE_DIR }}/**
          retention-days: 14
      # Always: a wedged or failed pass leaves the committed tree
      # untouched (render.sh's staging contract), so the logs and the
      # untracked staging tree are the only evidence of what happened.
      - name: upload logs + staging tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freecad-logs-${{ matrix.lane }}
          path: |
            demos/out/freecad-logs/**
            demos/out/stage/**
            demos/renders-preview/**
          retention-days: 14
          if-no-files-found: ignore

      # Informational, never a gate — see the header. This is the
      # measurement that says whether a hosted pass could ever BE the
      # committed lane, so it is recorded on every run rather than
      # guessed at.
      - name: pixel drift vs the committed lane (informational)
        if: always()
        run: |
          {
            echo "### ${{ matrix.lane }} lane — hosted vs committed"
            echo
            echo "FreeCAD 1.1.2 (AppImage), llvmpipe under Xvfb on \`${{ runner.os }}\`."
            echo "Pixel differences against the locally-rendered committed cells are"
            echo "EXPECTED (different GL stack); this is a measurement, not a gate."
            echo
            echo '```'
            git diff --stat -- "demos/$LANE_DIR/" || true
            echo '```'
            echo
            echo "Changed cells:"
            echo '```'
            git status --porcelain -- "demos/$LANE_DIR/" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # THE WILD-CORPUS LANE. FreeCAD-free by ratified scope (its cells are
  # third-party STEP imported by `step-import` and tessellated by the
  # kernel, drawn by render.py — matplotlib is the PRIMARY renderer
  # here, not a fallback), so it needs no AppImage, no GL, no Xvfb, and
  # no tour: it runs its own generator over the committed fixtures under
  # crates/step-import/tests/fixtures/wild/.
  #
  # It is therefore the second lane that is genuinely BYTE-reproducible
  # off-box — Agg is a pure-CPU rasterizer with matplotlib's own bundled
  # fonts, and the venv's numpy/matplotlib are pinned by render-wild.sh
  # — which is what lets scripts/render-hosted.sh use it as the
  # round-trip proof that the artifact path preserves the provenance
  # stamp chunks byte for byte.
  wild:
    name: wild-corpus montage
    runs-on: ubuntu-latest
    if: ${{ contains(fromJSON('["all","wild"]'), inputs.lanes) }}
    timeout-minutes: 45
    env:
      # See the uv lane's note: the sanctioned renderer says so in the
      # file, at the step that renders.
      CAD_RENDER_LOCAL_OVERRIDE: i-accept-local-render-drift
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: render-demos-wild
          workspaces: |
            .
            demos/wild
      - name: venv deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-venv
      - name: wild generator (import + tessellate + STL + scenes.json)
        run: cd demos/wild && cargo run --release -- out
      - name: render (demos/render-wild.sh)
        run: demos/render-wild.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-wild
          path: demos/renders-wild/**
          retention-days: 14
      # Unlike the two FreeCAD lanes this one has no GL-stack excuse: a
      # diff here is a real pixel change (or a determinism finding),
      # which is exactly why it is worth reporting. Still informational —
      # this workflow gates nothing, by the header's rule.
      - name: pixel drift vs the committed lane (informational)
        if: always()
        run: |
          {
            echo "### wild lane — hosted vs committed"
            echo
            echo "Renderer-free of FreeCAD (matplotlib Agg, pinned): byte-identity"
            echo "IS expected here, so a non-empty diff is a real finding."
            echo
            echo '```'
            git status --porcelain -- demos/renders-wild/ || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
