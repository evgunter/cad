name: fast-set drift

# The per-PR gate fails a PR for the fast-set tests it adds or edits at
# 0.25 s run alone, and for any at 1 s. A test that drifts past 0.25 s on
# main without reaching 1 s is this check's: it reads the last 72 h of PR-run
# junit reports (ci.yml's test job uploads them), re-times alone on main's
# build every test whose median suggests 0.25 s, and fails on each that
# costs it, naming the slow-set line to add (scripts/fast-set-drift.py).
# Its own workflow, so its red is not one among the nightly's. Owner:
# GREEN's orchestrator, who reads this workflow's latest run at the start of
# each sitting.
#
# What it cannot see: a test is read only by the PR runs that reach its
# crate, and at most 350 reports per shard are read (a GITHUB_TOKEN rate
# budget), so a test read fewer than 3 times in the window is never a
# candidate, whatever it costs. Its build env and opt-level-0 wrapper are
# the test job's (scripts/gates/build-default-env-agrees.sh holds them so).

on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: "the window of PR runs read, in hours"
        default: "72"
      min_readings:
        description: "the fewest readings a test needs in the window to be a candidate"
        default: "3"

permissions:
  actions: read
  contents: read

env:
  NEXTEST_VERSION: "0.9.140"

jobs:
  drift:
    name: fast-set drift (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [kernel, app]
    # The test job's build env, so this restores the build-default cache and
    # times the binaries the gate runs.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_LTO: "off"
      CARGO_PROFILE_TEST_LTO: "off"
    steps:
      - uses: actions/checkout@v4
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - name: the window's PR-run readings
        env:
          GH_TOKEN: ${{ github.token }}
          HOURS: ${{ inputs.hours || '72' }}
        run: python3 scripts/fast-set-drift.py gather ${{ matrix.shard }} "$RUNNER_TEMP/drift" "$HOURS"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-default
          save-if: false
      - name: integration-test binaries build at opt-level 0
        run: |
          {
            echo "RUSTC_WORKSPACE_WRAPPER=$GITHUB_WORKSPACE/scripts/rustc-test-crates-opt0.sh"
            echo "CAD_OPT0_LOG=$RUNNER_TEMP/opt0.log"
          } >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/opt0-marker"
      - name: install cargo-nextest (pinned, official prebuilt)
        uses: ./.github/actions/install-nextest
        with:
          version: ${{ env.NEXTEST_VERSION }}
      - name: build (the gate's shard, everything in it)
        run: |
          scope="$(python3 scripts/fast-set-drift.py scope ${{ matrix.shard }})"
          echo "scope: $scope"
          # shellcheck disable=SC2086 # scope is a list of cargo flags
          cargo nextest run --no-run --profile ci $scope
      # The test job's check, so a wrapper that stops applying here is red
      # rather than a drift timing other binaries than the gate's.
      - name: every integration binary built went through the opt-level-0 wrapper
        run: |
          built=$(find target/debug/deps -maxdepth 1 -type f -name 'all-*' -perm -u+x \
            -newer "$RUNNER_TEMP/opt0-marker" | wc -l)
          touch "$CAD_OPT0_LOG"
          seen=$(wc -l < "$CAD_OPT0_LOG")
          bad=$(grep -Ev '^(rewrote \S+|kept \S+ [23sz])$' "$CAD_OPT0_LOG" || true)
          if [ -n "$bad" ]; then
            echo "::error::the opt-level-0 wrapper met an integration binary cargo built at neither opt 1 nor above it: $bad"
            exit 1
          fi
          if [ "$seen" -ne "$built" ]; then
            echo "::error::the build wrote $built integration binaries and the opt-level-0 wrapper logged $seen"
            exit 1
          fi
      - name: re-time alone every test whose median suggests 0.25 s
        env:
          MIN_READINGS: ${{ inputs.min_readings || '3' }}
        run: python3 scripts/fast-set-drift.py judge ${{ matrix.shard }} "$RUNNER_TEMP/drift" "$MIN_READINGS"
