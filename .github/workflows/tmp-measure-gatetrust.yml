name: tmp-measure-gatetrust
# TEMPORARY: measures the two new nightly jobs on this branch; removed before review.
on:
  push:
    branches: [green/nightly-selftests-allfeatures]
env:
  NEXTEST_VERSION: "0.9.140"
jobs:
  all-features:
    # The suite with every workspace feature on at once: the probe-gated
    # suites, the test-only meters and payload features, which no other
    # row executes together. Default eps, the ci profile's set (the slow
    # set is left to the rows above). Three things are held out, each
    # with the open row that owns it:
    # - viewer, whose `app` feature needs the GPU stack the viewer job
    #   installs and runs;
    # - topo's `per-op-postcondition` scalpel, under which mfkrh leaves
    #   an orphan surface across ~20 sweep rows
    #   (work/topo/mfkrh-leaves-an-orphan-surface-under-the-per-op-scalpel.md;
    #   the row that brings the scalpel back is
    #   work/ciw/no-ci-row-runs-topo-under-the-per-op-postcondition-scalpel.md);
    # - one probe row red on main, already gated by k-lint (dev-probe)
    #   (work/green/main-reds-editor-core-slow-set-and-the-k-probe-sweep.md).
    name: suite under --all-features (default eps)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      HELD_OUT_FEATURES: topo/per-op-postcondition
      HELD_OUT_TESTS: test(=ray_wall_margin_twins::the_wall_arms_margins_scale_linearly_with_the_model)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: prune local-only tooling (hosted CI may not depend on it)
        run: rm -rf local-scripts .claude
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-all-features
          # This row is expected to red while a held-out row's owner
          # works; a red must not cost the next night a cold build.
          cache-on-failure: true
      - name: read the nextest pin from ci.yml
        id: nextest
        run: echo "version=$(scripts/ci-pin.py NEXTEST_VERSION)" >> "$GITHUB_OUTPUT"
      - name: install cargo-nextest (pinned, official prebuilt)
        uses: ./.github/actions/install-nextest
        with:
          version: ${{ steps.nextest.outputs.version }}
      - name: every workspace feature but the held-out ones
        id: features
        run: |
          set -o pipefail
          features=$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, os, sys
          held = set(os.environ["HELD_OUT_FEATURES"].split())
          pkgs = {p["name"]: p["features"] for p in json.load(sys.stdin)["packages"]}
          def reaches(pkg, feat, seen):
              # Every pkg/feature this one turns on, through workspace forwards.
              if (pkg, feat) in seen or feat not in pkgs.get(pkg, {}):
                  return
              seen.add((pkg, feat))
              for e in pkgs[pkg][feat]:
                  if e.startswith("dep:"):
                      continue
                  dep, _, f = e.replace("?/", "/").partition("/")
                  if f:
                      reaches(dep, f, seen)
                  else:
                      reaches(pkg, dep, seen)
          missing = {h for h in held if h.partition("/")[2] not in pkgs.get(h.partition("/")[0], {})}
          if missing:
              sys.exit(f"held-out features that no member declares: {sorted(missing)}")
          out = []
          for pkg, feats in pkgs.items():
              if pkg == "viewer":
                  continue
              for f in sorted(feats):
                  seen = set()
                  reaches(pkg, f, seen)
                  if f != "default" and not {a + "/" + b for a, b in seen} & held:
                      out.append(pkg + "/" + f)
          print(",".join(out))
          ')
          echo "features: $features"
          echo "list=$features" >> "$GITHUB_OUTPUT"
      - name: build
        timeout-minutes: 60
        run: cargo nextest run --workspace --exclude viewer --features "${{ steps.features.outputs.list }}" --no-run
      - name: the suite, every feature on
        timeout-minutes: 30
        run: |
          r=0
          cargo nextest run --profile ci --workspace --exclude viewer \
            --features "${{ steps.features.outputs.list }}" \
            -E "not ($HELD_OUT_TESTS)" --no-fail-fast || r=$?
          scripts/nextest-failures.py "all-features" "$r"
          exit "$r"
      - name: failing tests (name, panic, seed)
        if: failure()
        run: cat "$RUNNER_TEMP/nextest-failures.txt" 2>/dev/null || echo "no nextest row failed; the red is in another step"
